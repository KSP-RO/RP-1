CONTRACT_TYPE
{
	name = MH_Agriculture
	title = Martian Agriculture
	group = MarsHabitation

	description = <b>Program: Mars Habitation<br>Type: <color=green>Required</color></b><br><br>Resupplies from Earth take a while to get to Mars - it would be much better to produce everything there, instead of having to ship it in. Add enough <b>hydroponic greenhouses</b> to our Martian Base, so that we have enough to feed all six crew. To demonstrate nominal operation, grow crops for 120 days before the first expedition arrives.

	synopsis = Grow food at the Martian Base

	completedMessage = The first Martian harvest is in, and there is enough of it for a full crew! Fresh food, grown 200 million kilometres from home - but tastes almost like it does back on Earth!

	sortKey = 2103

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mars


	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 1500
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = MarsHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = MH_BaseLanding
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = MartianAgriculture
		type = VesselParameterGroup
		title = Grow food at the Martian Base for 120 days
		vessel = MarsBase
		notes = You can work on other contracts while the Base is working. You are safe to return to Mission Control
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Mars
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = HasHydroponics
			type = HasResource
			resource = Resource("_Hydroponics") // Doesn't like a leading _
			minQuantity = 11.99
			title = Run enough Hydroponics to feed 6 crew
			hideChildren = true
		}
		PARAMETER
		{
			name = HasAmmonia
			type = HasResource
			resource = Ammonia
			minQuantity = 0.01
			title = Keep the crops supplied with Ammonia
			hideChildren = true
		}
		PARAMETER
		{
			name = Duration
			type = Duration
			duration = 120d
			preWaitText = Plant the first crops
			waitingText = Growing crops
			completionText = 120 days of Martian agriculture completed
		}
	}
}
