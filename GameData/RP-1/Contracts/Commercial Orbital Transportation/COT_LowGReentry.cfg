CONTRACT_TYPE
{
	name = COT_LowGReentry
	title = Low-G Reentry Demonstration
	group = ComOrbTrans
	agent = Federation Aeronautique Internationale
	
	description = <b>Program: Commercial Orbital Transport<br>Type: <color=blue>Optional</color></b><br><br> For fragile payloads, such as delicate medical or chemical experiments, or injured astronauts, the harsh g-forces endured by conventional capsules is unacceptable. If we can demonstrate a capability to perform re-entry without exceeding 4g, we can tap into this market.

	synopsis = Demonstrate a capability of returning payloads from LEO without exceeding 4g of acceleration.

	completedMessage = Success! The fragile test payload survived!

	sortKey = 2604

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 150
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ComOrbTrans
	}


	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Low G-Force Re-entry

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 0.001
				title = Craft must have Electric Charge after one day
				hideChildren = true
			}
			PARAMETER
			{
				name = HasResearchPayload
				type = HasResource
				resource = ResearchPayload
				minQuantity = 599.9
				title = Have a ResearchPayload of at least 600 units on the craft
				hideChildren = true
			}
			PARAMETER
			{
				name = Orbit
				type = Orbit
				maxEccentricity = 0.04
				minPeA = 300000
				disableOnStateChange = true
				title = Reach the correct orbit within the parameters.
			}
			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 1d
				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
			// Not is gated by the outer Sequence, so it can only complete after the orbit Duration.
			// It must not latch (Not defaults to disableOnStateChange = true), otherwise it locks to
			// Complete before re-entry and the g-limit is never enforced.
			// The inner Sequence latches once the g-limit is exceeded during re-entry. Its children can
			// only complete in order, so high g during ascent, chute deployment or touchdown is ignored.
			PARAMETER
			{
				name = StayUnder4G
				type = Not
				title = Do not exceed 4 g during re-entry
				disableOnStateChange = false
				hideChildren = true

				PARAMETER
				{
					name = ExceededGLimitSequence
					type = Sequence
					disableOnStateChange = true

					PARAMETER
					{
						name = ArmInOrbit
						type = ReachState
						situation = ORBITING
						disableOnStateChange = true
					}
					PARAMETER
					{
						name = ArmOnReentry
						type = ReachState
						maxAltitude = 140000
						disableOnStateChange = true
					}
					PARAMETER
					{
						name = ExceededGLimit
						type = ReachState
						minAltitude = 20000
						minAcceleration = 4
						disableOnStateChange = true
					}
				}
			}
			PARAMETER
			{
				name = ReturnHome
				type = RP1ReturnHome
				title = Return home safely
				hideChildren = true
				completeInSequence = true
			}
		}
	}
}
