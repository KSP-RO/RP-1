	description = <b>Program: Crewed Saturn Exploration<br>Type: <color=green>Required</color></b><br><br>Iapetus presents one of the most intriguing landing targets in the outer solar system, featuring dark carbonaceous terrain on one side, bright water ice on the other, and a towering equatorial ridge that spans hundreds of kilometers.<br><br>Design and execute an expedition to land at least four astronauts on the surface of Iapetus and bring the crew safely home to Earth. Once on the surface, the crew will analyze the rocks by X-ray fluorescence and set up a seismic station.
    synopsis = Land a crew of 4 on Iapetus, plant a flag and run X-ray fluorescence analysis and a seismic station.
    completedMessage = A monumental triumph! Human beings have set foot on the two-toned moon of Iapetus. Landing on its icy surface and returning home safely marks a giant leap for our space program!

