CONTRACT_TYPE
{
    name = 2000_Gate
    title = New Millennium Check
    group = Records
    synopsis = Serves as a date gate.
    completedMessage = Happy new year! Welcome to the new millennium!
    maxCompletions = 1
    maxSimultaneous = 1
    autoAccept = true

    REQUIREMENT // Date lock
    {
        name = Expression
        type = Expression
        title = Must be after the 31st of December, 1999
        expression = UniversalTime() >= 1546214400 // 1999-12-31T00:00:00, UT 0 = 1951-01-01
    }

    // Light and Heavy Satellites both require their first satellite contract as an objective,
    // so not having completed either contract means neither program has been completed
    REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract
        contractType = FirstSatellite
        invertRequirement = true
    }

    REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract
        contractType = FirstSatellite-Heavy
        invertRequirement = true
    }

    PARAMETER
    {
        name = Duration
        type = Duration
        duration = 1s
    }
}