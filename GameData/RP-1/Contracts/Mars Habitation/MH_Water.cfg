CONTRACT_TYPE
{
	name = MH_Water
	title = Martian Ice Mining
	group = MarsHabitation

	description = <b>Program: Mars Habitation<br>Type: <color=green>Required</color></b><br><br>The ice below the Martian surface is a critical resource we needd to unlock. The crew can drink it, the crops need it, we can split it into oxygen and air, as well as rocket propellant. Add a drill configured as a <b>Water Extractor</b> to our Martian Base and prove that it can keep six crew supplied: starting with nearly empty tanks, mine <b>2500 units</b> of Martian water, about a month's worth for a crew of six.<br><br>The polar caps are almost pure ice, and there are buried glaciers in Utopia Planitia, the northern Lowlands and the mid-latitude basins. Near the equator, the drill can only bake a few percent of water out of hydrated minerals and will take a very long time, so be sure to add multiple here.

	synopsis = Mine water ice at the Martian Base

	completedMessage = Our Martian Base is now drinking water dug out of Mars itself.

	sortKey = 2102

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mars


	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 1200
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = MarsHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = MH_BaseLanding
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = EmptyTanks
		type = VesselParameterGroup
		title = Start with nearly empty water tanks at the Martian Base
		vessel = MarsBase
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Mars
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = HasDrill
			type = Any
			title = Have a drill configured as Water Extractor on the Base
			hideChildren = true

			PARAMETER
			{
				name = HasSmallDrill
				type = PartValidation
				part = kerbalism-drill
				minCount = 1
				hideChildren = true
			}
			PARAMETER
			{
				name = HasLargeDrill
				type = PartValidation
				part = kerbalism-large-drill
				minCount = 1
				hideChildren = true
			}
		}
		PARAMETER
		{
			name = HasWaterTanks
			type = HasResourceCapacity
			resource = Water
			minQuantity = 2500
			title = Have tanks for at least 2500 units of Water
			hideChildren = true
		}
		PARAMETER
		{
			name = NearlyEmpty
			type = HasResource
			resource = Water
			minQuantity = 0
			maxQuantity = 100
			title = Have at most 100 units of Water on the Base
			hideChildren = true
		}
	}
	PARAMETER
	{
		name = MartianWater
		type = VesselParameterGroup
		title = Mine at least 2500 units of Water at the Martian Base
		vessel = MarsBase
		notes = You can work on other contracts while the Base is working. You are safe to return to Mission Control
		completeInSequence = true
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Mars
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = HasWater
			type = HasResource
			resource = Water
			minQuantity = 2500
			title = Have at least 2500 units of Water on the Base
			hideChildren = true
		}
	}
