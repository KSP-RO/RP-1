CONTRACT_TYPE
{
    name = firstVenusFlybyCrewed
    title = Flyby Venus (Crewed)
    group = CrewedVenusExp
    agent = Exploration

    description = <b>Program: Crewed Venus Exploration <br>Type: <color=green>Required</color></b><br><br> We have sent uncrewed missions to our neighboring planet, Venus, but now we want to send Humans to explore. Design, build and launch a mission that sends at least four humans on a flyby of Venus and returns them home safely to Earth. The crew must film their arrival at Venus by completing the Planetary Approach Crew Video experiment.
    synopsis = Send a crewed vessel on a flyby of Venus
    completedMessage = Congratulations! Humans have laid their own eyes on Venus for the first time!

    sortKey = 2504

    cancellable = true
    declinable = false
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0

    targetBody = Venus

    // ************ REWARDS ************
    prestige = Significant
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 450
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedVenusExp
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = FlybyCrew
        type = VesselParameterGroup
        title = Flyby Venus
        define = FlybyVenusCrew

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            title = Launch a New Vessel
            hideChildren = true
        }

        PARAMETER
        {
            name = Crewmembers
            type = HasCrew
            minCrew = 4
            title = Have at least 4 Crewmembers
            hideChildren = true
        }

        PARAMETER
        {
            name = FlybyPlanet
            targetBody = Venus
            type = ReachState
            maxAltitude = 800000
            disableOnStateChange = true
            title = Flyby Venus within 800 km
            hideChildren = true
        }

        PARAMETER
        {
            name = ReturnHome
            type = RP1ReturnHome
            title = Return Home Safely
            hideChildren = true
            completeInSequence = true
        }
    }

    PARAMETER
    {
        name = FlybyExperiment
        type = RP1CollectScience
        targetBody = Venus
        experiment = RP0PlanetaryApproachVideo
        recoveryMethod = RecoverOrTransmit
        title = Run experiment: Planetary Approach Crew Video
        hideChildren = true
    }
}