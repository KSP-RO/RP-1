CONTRACT_TYPE
{
	name = RSD_LunarCargo
	title = Heavy Lunar Cargo Delivery
	group = ReusableSpacecraftDev
	agent = Exploration

	description = <b>Program: Reusable Spacecraft Development<br>Type: <color=green>Required</color></b><br><br>A permanent presence on the Moon will need far more cargo than expendable stages can carry economically. Show that an efficient cargo stage can do the heavy lifting: fly a vessel carrying at least 1,500 units (1.5 tonnes) of ResearchPayload into lunar orbit, leave the payload there (release it with a docking port), then bring the same vessel back to low Earth orbit so it can be loaded and flown again.<br><br><b>Use the tug from the Reusable Orbital Tug contract:</b> a new vessel will not count.
	genericDescription = Deliver 1.5 t of ResearchPayload into lunar orbit and bring the cargo vessel back to low Earth orbit.
	synopsis = Deliver 1.5 t of ResearchPayload into lunar orbit and bring the cargo vessel back to low Earth orbit.

	completedMessage = The cargo ship is back in low Earth orbit, ready to be loaded for its next run. Efficient cargo stages can now supply operations on the Moon.

	sortKey = 2101

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 400
	failureReputation = 0

	// ************ REQUIREMENTS ************
	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ReusableSpacecraftDev
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = RSD_OrbitalTug
		title = Complete the Reusable Orbital Tug contract
	}

	// ************ PARAMETERS ************
	PARAMETER
	{
		name = CargoShip
		type = VesselParameterGroup
		title = Lunar cargo vessel
		vessel = RSDShip
		disableOnStateChange = true

		PARAMETER
		{
			name = CargoDelivery
			type = All
			title = Reach lunar orbit carrying at least 1,500 units (1.5 t) of ResearchPayload
			disableOnStateChange = true

			// 1,500 units (1.5 t, ResearchPayload is 1 kg per unit) is the most any Early Lunar Habitation contract asks a crew to
			// carry: MoonLandingCrew6Month and MoonLandingCrew1Year need 1,500 units of capacity, so one cargo run can stock the longest stays
			PARAMETER
			{
				name = HasCargo
				type = HasResource
				resource = ResearchPayload
				minQuantity = 1499.9
				title = Carry at least 1,500 units (1.5 t) of ResearchPayload
				hideChildren = true
			}
			PARAMETER
			{
				name = NoStaging
				type = NoStaging
				title = Do not stage
				failContract = false
			}
			PARAMETER
			{
				name = LunarOrbit
				type = ReachState
				targetBody = Moon
				situation = ORBITING
				title = Enter lunar orbit
				hideChildren = true
			}
		}
	}


	PARAMETER
	{
		name = ReturnVessel
		type = VesselParameterGroup
		title = Return the cargo vessel
		vessel = RSDShip
		completeInSequence = true

		PARAMETER
		{
			name = PayloadReleased
			type = All
			title = Leave the payload in lunar orbit
			disableOnStateChange = true

			PARAMETER
			{
				name = CargoEmpty
				type = HasResource
				resource = ResearchPayload
				maxQuantity = 0.1
				title = No ResearchPayload left on the vessel
				hideChildren = true
			}

			PARAMETER
			{
				name = ReleaseLunarOrbit
				type = ReachState
				targetBody = Moon
				situation = ORBITING
				title = Orbit the Moon
				hideChildren = true
			}
		}

		PARAMETER
		{
			name = LowOrbitReturn
			type = Orbit
			targetBody = HomeWorld()
			situation = ORBITING
			maxApA = 2000000
			completeInSequence = true
			title = Return to low Earth orbit (apogee below 2,000 km)
			hideChildren = true
		}
	}
}
