CONTRACT_TYPE
{
	name = FirstCrewedOberonLanding
	title =  First Crewed Oberon Landing
	group = CrewedUranusExp
	agent = Flag Planting

	description = <b>Program: Crewed Uranus Exploration<br>Type: <color=green>Required</color></b><br><br>Oberon, the outermost of Uranus's major moons, presents one of the most intriguing landing targets in the outer solar system. Its ancient, heavily cratered surface is scarred by countless impacts, with dark material pooled across several crater floors in stark contrast to the icy terrain around them, and it is scored by Mommur Chasma, a massive canyon system.<br><br>Design and execute an expedition to land at least four astronauts on the surface of Oberon and bring the crew safely home to Earth. Once on the surface, the crew will analyze the rocks by X-ray fluorescence and set up a seismic station.
    synopsis = Land a crew of 4 on Oberon, plant a flag and run X-ray fluorescence analysis and a seismic station.
    completedMessage = A monumental triumph! Human beings have set foot on Oberon, the outermost and most ancient of Uranus's major moons. Landing on its cratered, icy surface and returning home safely marks a giant leap for our space program!

	sortKey = 2803

