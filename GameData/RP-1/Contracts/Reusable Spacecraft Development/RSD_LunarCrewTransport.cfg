CONTRACT_TYPE
{
	name = RSD_LunarCrewTransport
	title = Reusable Lunar Crew Transport
	group = ReusableSpacecraftDev
	agent = Exploration

	description = <b>Program: Reusable Spacecraft Development<br>Type: <color=blue>Optional</color></b><br><br>Crews heading to the lunar surface still ride capsules that are thrown away after every flight. A reusable transport could ferry them between low Earth orbit and lunar orbit instead, then wait in low Earth orbit for the next rotation. Fly the shuttle from the Cislunar Shuttle contract, now carrying at least 3 crew, into lunar orbit without staging, then bring it back to low Earth orbit with the crew still aboard.<br><br><b>Use the vessel from the Cislunar Shuttle contract:</b> a new vessel will not count. A crew module docked to it counts as part of it.
	genericDescription = Fly a reusable transport with at least 3 crew to lunar orbit and back to low Earth orbit.
	synopsis = Fly a reusable transport with at least 3 crew to lunar orbit and back to low Earth orbit.

	completedMessage = The transport is back in low Earth orbit with its crew. Lunar crew rotations no longer need a new ship every time.

	sortKey = 2104

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 2
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon

	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 350
	failureReputation = 0

	// ************ REQUIREMENTS ************
	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ReusableSpacecraftDev
	}

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = EarlyLunarHabitation
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = RSD_LunarCargo
		title = Complete the Cislunar Shuttle contract
	}

	// ************ PARAMETERS ************
	PARAMETER
	{
		name = ReusableCrewShip
		type = VesselParameterGroup
		title = Fly the crew transport to lunar orbit
		vessel = RSDCargoShip
		disableOnStateChange = true

		PARAMETER
		{
			name = ReusableCrewShipDeparture
			type = All
			title = Reach lunar orbit with at least 3 crew, without staging
			disableOnStateChange = true

			PARAMETER
			{
				name = HasCrew
				type = HasCrew
				minCrew = 3
				crewOnly = true
				title = Have at least 3 crew members on board
				hideChildren = true
			}
			PARAMETER
			{
				name = NoStaging
				type = NoStaging
				title = Do not stage
				failContract = false
			}
			PARAMETER
			{
				name = DestinationOrbit
				type = ReachState
				targetBody = Moon
				situation = ORBITING
				title = Enter lunar orbit
				hideChildren = true
			}
		}
	}

	PARAMETER
	{
		name = Return
		type = VesselParameterGroup
		title = Bring the crew transport back
		vessel = RSDCargoShip
		completeInSequence = true

		PARAMETER
		{
			name = ReturnCrew
			type = HasCrew
			minCrew = 3
			crewOnly = true
			title = Have at least 3 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = LowOrbitReturn
			type = Orbit
			targetBody = HomeWorld()
			situation = ORBITING
			maxApA = 2000000
			title = Return to low Earth orbit with the crew (apogee below 2,000 km)
			hideChildren = true
		}
	}
}
