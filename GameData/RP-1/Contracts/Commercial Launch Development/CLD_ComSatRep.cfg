CONTRACT_TYPE
{
	name = CLD_ComSatRep
	title = Additional Customer Satellite Launch
	group = ComLaunchDev
	agent = Federation Aeronautique Internationale
	
	description = <b>Program: Commercial Launch Development<br>Type: <color=blue>Optional</color></b><br><br>Launching customer satellites is quickly becoming a routine operation for our company. More have lined up, with heavier payloads than what we have launched so far.<br><br>This is a series of @maxCompletions contracts, of which @CLDSatRepCount have been completed.<br><br>Once more than half of the expected days have elapsed, the reward of this contract will slowly increase over time, but will be reset to 0 after each completion.<br><b>Current reward is at @rewardFactorPercent % of its nominal value. Elapsed/Expected Days: @elapsedDays / 30</b>
	genericDescription = <b>Program: Commercial Launch Development<br>Type: <color=blue>Optional</color></b><br><br>Launching customer satellites is quickly becoming a routine operation for our company. More have lined up, with heavier payloads than what we have launched so far.<br><br>This is a repeatable series of contracts. Once more than half of the expected days have elapsed, the reward of this contract will slowly increase over time, resetting to 0 after each completion.
	synopsis = Launch a customer satellite into a sun-synchronous orbit

	completedMessage = Success! With each successful launch, our company attracts more attention, which means more investors and customers!

	sortKey = 2505

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 3
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = Round(30 * @rewardFactor, 1)
	failureReputation = 0

	// ************ DATA ************
	
	DATA
	{
		type = int
		CLDSatRepCount = $CLDSatRepCount + 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression

		CONTRACT_OFFERED
		{
			CLD_ComSat_Completion = ($CLD_ComSat_Completion + 0) == 0 ? (UniversalTime() - 30 * 86400) : ($CLD_ComSat_Completion + 0)
		}
		CONTRACT_COMPLETED_SUCCESS
		{
			CLDSatRepCount = $CLDSatRepCount + 1
			CLD_ComSat_Completion = UniversalTime()
		}
	}

	DATA
	{
		type = List<float>
		CLDMissionPayloadList = [ 400, 450, 500, 550, 600, 650, 700, 750, 800, 850 ]
	}

	DATA
	{
		type = float
		CLDMissionPayload = @CLDMissionPayloadList.ElementAt(@CLDSatRepCount)
	}

	DATA
	{
		type = int
		antiGrindCompletion = $CLD_ComSat_Completion == 0 ? (UniversalTime() - 30 * 86400) : $CLD_ComSat_Completion
	}

	DATA
	{
		type = float
		elapsedDays = Round((UniversalTime() - @antiGrindCompletion) / 86400.0)
		rewardFactor = Log(Max(@elapsedDays / 30 * 3 - 0.05, 1), 2) / 1.5607
		rewardFactorPercent = Round(@rewardFactor * 100, 1)
	}

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = Any
		type = Any

		REQUIREMENT
		{
			name = ProgramActive
			type = ProgramActive
			program = ComLaunchDev
		}

		REQUIREMENT
		{
			name = ProgramActive
			type = ProgramActive
			program = ComOrbTrans
		}
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = CLD_ComSat
		minCount = 2
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = SSO Customer Satellite
		define = SSOCusRep
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			title = Survive in orbit for a day

			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 0.001
				title = Craft must have Electric Charge after one day
				hideChildren = true
			}
				
			PARAMETER
			{
				name = HasComSatPayload
				type = HasResource
				resource = ComSatPayload
				minQuantity = @/CLDMissionPayload - 0.1
				title = Have a ComSatPayload of at least @/CLDMissionPayload units on the craft
				hideChildren = true
			}

			PARAMETER
			{
				name = Orbit
				type = Orbit
				minInclination = 95
				maxInclination = 99
				maxEccentricity = 0.04
				minPeA = 300000
				disableOnStateChange = true
				title = Reach the correct orbit within the parameters. Note: This orbit is slightly retrograde.
			}

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 2m
				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}
}
