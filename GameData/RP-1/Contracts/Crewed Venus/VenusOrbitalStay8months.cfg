CONTRACT_TYPE
{
    name = VenusOrbitalStay8months
    title = Venus 8 Month Orbital Stay
    group = CrewedVenusExp
    agent = Exploration

    description = <b>Program: Crewed Venus Exploration <br>Type: <color=blue>Optional</color></b><br><br> Maintain a continuous presence in Venus orbit for 8 months (240 days). The crew must endure deep-space radiation, strict life support limitations, and complex thermal management. Bring them home safe.
    synopsis = Sustain a crew in orbit of Venus for 8 months before returning them or replacing them.
    completedMessage = Incredible! Our crew has successfully endured an 8-month orbital stay around Venus. The data they have returned will revolutionize our understanding of planetary atmospheres and long-duration crewed spaceflight.

    sortKey = 2507

    cancellable = true
    declinable = false
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 2
    maxSimultaneous = 1
    deadline = 0

    targetBody = Venus

    // ************ REWARDS ************
    prestige = Trivial
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 400
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedVenusExp
    }

    REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract
        contractType = VenusOrbitalStay4months
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = orbitalStayGroup
        type = VesselParameterGroup
        title = Maintain a crew of at least 4 in Venus orbit for 8 months

        PARAMETER
        {
            name = Crewmembers
            type = HasCrew
            minCrew = 4
            title = Have at least 4 crewmembers on board
            hideChildren = true
        }

        PARAMETER
        {
            name = Orbit
            type = Orbit
            situation = ORBITING
            minPeA = 300000
            maxApA = 10000000
            disableOnStateChange = true
            title = Remain in a Stable Orbit
            targetBody = Venus
            hideChildren = true

            PARAMETER
            {
                name = Duration
                type = Duration
                duration = 240d
                preWaitText = Enter specified orbit around Venus with required crew.
                waitingText = Orbiting Venus...
                completionText = Stay completed, you may return home now.
            }
        }

        PARAMETER
        {
            name = ReturnHome
            type = RP1ReturnHome
            title = Return Home Safely
            hideChildren = true
            completeInSequence = true
        }
    }
