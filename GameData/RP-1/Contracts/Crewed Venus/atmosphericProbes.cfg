CONTRACT_TYPE
{
	name = atmosphericSampleReturnVenus
	title = Venus Atmospheric Sample Return
	group = CrewedVenusExp
	agent = Federation Aeronautique Internationale

	description = <b>Program: Venus Exploration<br>Type: <color=blue>Optional</color></b><br><br>Design and successfully launch a crewed carrier spacecraft to Venus, deploying an uncrewed atmospheric probe to sample the Venusian atmosphere and bring the sample back to Earth for study. This is a sample return mission so you cannot just transmit the data back, it needs to be physically returned.

	synopsis = Deploy an uncrewed probe from a crewed carrier spacecraft to sample the atmosphere of Venus and return the science to Earth.

	completedMessage = Congratulations! Our scientists can learn a lot more about the composition of Venus atmosphere by studying the physical samples that you have returned.

	sortKey = 2503

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 6
	maxSimultaneous = 1
	deadline = 0

	targetBody = Venus



	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 1000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0
	
	// ************ REQUIREMENTS ************
	REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedVenusExp
    }
	// ************ PARAMETERS ************

	PARAMETER
	{
		name = CarrierCraft
		type = VesselParameterGroup
		title = Carrier Spacecraft

		PARAMETER
		{
			name = CarrierHasCrew
			type = HasCrew
			minCrew = 1
			title = Carrier spacecraft must be crewed
		}
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Venus atmospheric sample return
		define = AtmosphericProbe

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Must be a newly released probe
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = ReachAtmosphere
			type = ReachState
			targetBody = Venus
			situation = FLYING
			minAltitude = 0
			maxAltitude = 70000
			disableOnStateChange = true
			title = Enter the Venusian atmosphere and gather a sample
			hideChildren = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return to Earth safely with the samples
			hideChildren = true
			completeInSequence = true
		}
	}
	PARAMETER
	{
		name = AtmosphericScience
		type = CollectScience
		targetBody = Venus
		situation = FlyingHigh
		recoveryMethod = Recover
		title = Gather science while in the Venusian atmosphere and <b><color=white>Return it home, DO NOT TRANSMIT</color></b>
		hideChildren = true
	}
}