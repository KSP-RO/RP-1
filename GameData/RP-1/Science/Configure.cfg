@PART[*]:HAS[#CrewCapacity[>0]]:FOR[zzzKerbalism]
{
	MODULE
	{
		name = Configure
		title = General Surface Science 
		slots = 4
		reconfigure = false

		SETUP
		{
			name = None
			desc = Empty slot for mass and cost savings, should you not require any experiments installed.
			desc = Empty slot.
		}

		SETUP
		{
			name = General Photography
			desc = A simple handheld camera kit for documenting the local terrain. Not much science comes out of it, but every mission report deserves a few good landscape shots for the Kerbal Space Program scrapbook.
			tech = scienceAdvCapsules
			mass = 0.02
			MODULE
			{
				type = Experiment
				id_field = experiment_id
				id_value = evaPhotoSurveyScan
				
			}
		}

		SETUP
		{
			name = Precision Gravimeter
			desc = A sensitive pendulum-and-laser rig that measures tiny local variations in gravity, revealing hidden density anomalies like buried ice deposits, ore veins, or voids beneath the surface.
			tech = surfaceScience
			mass = 0.03
			MODULE
			{
				type = Experiment
				id_field = experiment_id
				id_value = evaPrecisionGravimeterScan
		
			}
		}

		SETUP
		{
			name = Deep Thermal Probe
			desc = A drill-mounted thermocouple string that bores into the regolith to chart how temperature changes with depth, helping map subsurface heat flow and the body's internal thermal history.
			tech = deepSpaceScience
			mass = 0.08
			MODULE
			{
				type = Experiment
				id_field = experiment_id
				id_value = evaDeepThermalScan
			}
		}

		SETUP
		{
			name = Advanced Seismic Station
			desc = A high-sensitivity seismometer package that listens for tremors, impacts, and tidal flexing to build a picture of the crust and interior structure far below the landing site.
			tech = surfaceScience
			mass = 0.06
			MODULE
			{
				type = Experiment
				id_field = experiment_id
				id_value = evaAdvancedSeismicScan
			}
		}

		SETUP
		{
			name = Distributed Seismic Survey
			desc = A network of small deployable geophones spread across the surface, triangulating seismic waves to map subsurface layering with far more precision than a single station alone.
			tech = sampleReturnScience
			mass = 0.015
			MODULE
			{
				type = Experiment
				id_field = experiment_id
				id_value = evaSeismicArrayScan
			}
		}

		SETUP
		{
			name = X-Ray Fluorescence
			desc = Bombards a soil or rock sample with X-rays and reads the fluorescent glow that bounces back, identifying which elements are present and in what abundance.
			tech = deepSpaceScience
			mass = 0.025
			MODULE
			{
				type = Experiment
				id_field = experiment_id
				id_value = evaXRFScan
			}
		}

		SETUP
		{
			name = Raman Spectrometer
			desc = Fires a laser at a sample and analyzes the scattered light to identify minerals and molecular bonds, a favorite tool for spotting interesting chemistry without needing to bring anything home.
			tech = deepSpaceScience
			mass = 0.03
			MODULE
			{
				type = Experiment
				id_field = experiment_id
				id_value = evaRamanScan
			}
		}

		SETUP
		{
			name = Neutron Spectrometer
			desc = Detects neutrons leaking from the ground to sniff out hydrogen-rich material just below the surface, the go-to method for hunting buried water ice from a safe standing distance.
			tech = deepSpaceScience
			mass = 0.04
			MODULE
			{
				type = Experiment
				id_field = experiment_id
				id_value = evaNeutronScan
			}
		}

		SETUP
		{
			name = LIBS Spectrometer
			desc = A laser-induced breakdown spectrometer that zaps a rock into a tiny puff of glowing plasma from a distance, then reads the light to determine its elemental makeup with zero physical contact.
			tech = sampleReturnScience
			mass = 0.05
			MODULE
			{
				type = Experiment
				id_field = experiment_id
				id_value = evaLIBSScan
			
			}
		}

		SETUP
		{
			name = Portable Mass Spectrometer
			desc = A compact bench-top mass spectrometer for sorting molecules by weight, useful for pinning down the precise chemical and isotopic composition of soil, rock, or gas samples in the field.
			tech = deepSpaceScience
			mass = 0.08
			MODULE
			{
				type = Experiment
				id_field = experiment_id
				id_value = evaMassSpecScan
			}
		}

		SETUP
		{
			name = Advanced Field Geology
			desc = A rock hammer, hand lens, and trained eye — the classic geologist's toolkit for reading outcrops, identifying strata, and picking the most scientifically interesting samples to study or return.
			tech = deepSpaceScience
			mass = 0.012
			MODULE
			{
				type = Experiment
				id_field = experiment_id
				id_value = evaAdvancedFieldGeology
			}
		}

		SETUP
		{
			name = X-Ray Diffraction
			desc = Shines X-rays through a powdered sample and reads the diffraction pattern to determine its precise crystal structure, distinguishing minerals that look identical to every other instrument.
			tech = advancedSurfaceScience
			mass = 0.08
			MODULE
			{
				type = Experiment
				id_field = experiment_id
				id_value = evaXRDScan
			}
		}

		SETUP
		{
			name = Active Neutron Probe
			desc = Fires a pulse of neutrons into the ground and times the return signal, an active twist on neutron spectroscopy that digs deeper and reads subsurface hydrogen content with greater confidence.
			tech = advancedSurfaceScience
			mass = 0.07
			MODULE
			{
				type = Experiment
				id_field = experiment_id
				id_value = evaActiveNeutronScan
			}
		}
		
		SETUP
		{
			name = Volatile Analyzer
			desc = Heats a small soil sample and analyzes the gases that boil off, revealing trapped water, carbon dioxide, and other volatiles locked away beneath the surface.
			tech = scienceExploration
			mass = 0.06
			MODULE
			{
				type = Experiment
				id_field = experiment_id
				id_value = evaVolatileAnalysis
			}
		}

		SETUP
		{
			name = Organic Molecule Analyzer
			desc = A sensitive chemical lab tuned to detect complex carbon-based molecules in a sample, the kind of instrument that makes headlines if it finds the wrong (or right) thing.
			tech = sampleReturnScience
			mass = 0.05
			MODULE
			{
				type = Experiment
				id_field = experiment_id
