CONTRACT_TYPE
{
	name = CLD_FirstSat
	title = First Commercially Launched Satellites
	group = ComLaunchDev
	agent = Federation Aeronautique Internationale

	description = <b>Program: Commercial Launch Development (Light)<br>Type: <color=green>Required</color></b><br><br>While nations have placed satellites into orbit, no company can claim to have done so entirely on their own. We will show the world, but most importantly our customers and shareholders, that our company is capable of matching & exceeding nations!

	synopsis = Be the first commercial company to launch a satellite into orbit of Earth

	completedMessage = Congratulations on being the first company to place a satellite into Earth's orbit!

	sortKey = 2500

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 80
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ComLaunchDev
	}
	
	PARAMETER
	{
		name = FirstComSat
		type = VesselParameterGroup
		title = First Commercially-Launched Satellite
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}

		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			title = Survive in orbit for a day

			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 0.001
				title = Craft must have Electric Charge after one day
				hideChildren = true
			}
				
			PARAMETER
			{
				name = Satellite Mass
				type = VesselMass
				minMass = 0.100
				title = Satellite must be at least 100 kg
			}

			PARAMETER
			{
				name = Orbit
				type = Orbit
				minPeA = 200000
				disableOnStateChange = true
				title = Achieve orbit around @targetBody with a minimum periapsis of 200 km.
			}

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 1d
				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}
}
