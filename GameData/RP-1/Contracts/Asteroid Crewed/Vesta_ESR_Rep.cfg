CONTRACT_TYPE
{
	name = Vesta_ESR_Rep
	title = Vesta Expedition Sample Return (Repeatable)
	group = CrewedAsteroid
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Asteroid Exploration<br>Type: <color=blue>Optional</color></b><br><br>Even though we have analyzed some samples from Vesta's surface, there is a lot of value in sending more robotic probes. Send a robotic probe back down to any site in the catalogue, then return it to the crewed expedition vessel in orbit.&br;&br;Land within 5 km of any site in the catalogue, then dock with the expedition vessel.

	genericDescription = Land a robotic probe at any catalogued site on Vesta and return it to the crewed expedition vessel in orbit.

	synopsis = Land a robotic probe at any catalogued site on Vesta and dock it with the crewed expedition vessel

	completedMessage = The probe's sample is safely back aboard the expedition vessel, and the crew have started analysing it!

	sortKey = 2007

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 4
	maxSimultaneous = 1
	deadline = 0

	targetBody = Vesta

	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 450
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedAsteroid
	}

	REQUIREMENT
	{
		name = Any
		type = Any
		title = Land crew on Vesta or sample at least 4 sites in the Vesta catalogue

		REQUIREMENT
		{
			name = CompleteContract
			type = CompleteContract
			contractType = CrewedVestaLanding
			title = Complete the First Crewed Vesta Landing contract
		}

		REQUIREMENT
		{
			name = CompleteContractESR
			type = CompleteContract
			contractType = Vesta_ESR
			minCount = 4
			title = Sample at least 4 sites in the Vesta catalogue
		}
	}

	// ************ DATA ************

	// Coordinates are the points deepest inside each RSS biome.
	DATA
	{
		type = double
		latMarciaCrater = 7.82
		longMarciaCrater = -80.07
		latCalpurniaCrater = 16.79
		longCalpurniaCrater = -70.75
		latMinuciaCrater = 20.30
		longMinuciaCrater = -62.31
		latVestaliaTerra = -6.77
		longVestaliaTerra = -36.65
		latSaturnaliaFossae = 29.09
		longSaturnaliaFossae = -26.98
		latDivaliaFossae = -14.85
		longDivaliaFossae = 109.25
		latAlbanaCrater = 75.32
		longAlbanaCrater = 140.54
		latRheasilvia = -87.45
		longRheasilvia = 149.33
	}

	// ************ BEHAVIOURS ************

	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator

		WAYPOINT
		{
			name = Marcia Crater
			hidden = False
			targetBody = Vesta
			icon = marker
			altitude = 0.0
			latitude = @/latMarciaCrater
			longitude = @/longMarciaCrater
		}
		WAYPOINT
		{
			name = Calpurnia Crater
			hidden = False
			targetBody = Vesta
			icon = marker
			altitude = 0.0
			latitude = @/latCalpurniaCrater
			longitude = @/longCalpurniaCrater
		}
		WAYPOINT
		{
			name = Minucia Crater
			hidden = False
			targetBody = Vesta
			icon = marker
			altitude = 0.0
			latitude = @/latMinuciaCrater
			longitude = @/longMinuciaCrater
		}
		WAYPOINT
		{
			name = Vestalia Terra
			hidden = False
			targetBody = Vesta
			icon = marker
			altitude = 0.0
			latitude = @/latVestaliaTerra
			longitude = @/longVestaliaTerra
		}
		WAYPOINT
		{
			name = Saturnalia Fossae
			hidden = False
			targetBody = Vesta
			icon = marker
			altitude = 0.0
			latitude = @/latSaturnaliaFossae
			longitude = @/longSaturnaliaFossae
		}
		WAYPOINT
		{
			name = Divalia Fossae
			hidden = False
			targetBody = Vesta
			icon = marker
			altitude = 0.0
			latitude = @/latDivaliaFossae
			longitude = @/longDivaliaFossae
		}
		WAYPOINT
		{
			name = Albana Crater
			hidden = False
			targetBody = Vesta
			icon = marker
			altitude = 0.0
			latitude = @/latAlbanaCrater
			longitude = @/longAlbanaCrater
		}
		WAYPOINT
		{
			name = Rheasilvia
			hidden = False
			targetBody = Vesta
			icon = marker
			altitude = 0.0
			latitude = @/latRheasilvia
			longitude = @/longRheasilvia
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = ExpeditionVessel
		type = VesselParameterGroup
		title = Have a crewed expedition vessel with a laboratory in orbit of Vesta
		define = VestaExpeditionVessel
		disableOnStateChange = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = HasLaboratory
			type = PartValidation
			partModule = Laboratory
			minCount = 1
			title = Carry a laboratory
		}

		PARAMETER
		{
			name = EnterOrbit
			type = Orbit
			situation = ORBITING
			targetBody = Vesta
			maxPeA = @targetBody.Radius() * 2
			title = Orbit Vesta
		}
	}

	PARAMETER
	{
		name = Sampler
		type = VesselParameterGroup
		title = Robotic sampler

		PARAMETER
		{
			name = LandAtSite
			type = All
			title = Land the uncrewed sampler within 5 km of any catalogued site
			disableOnStateChange = true

			PARAMETER
			{
				name = Uncrewed
				type = HasCrew
				minCrew = 0
				maxCrew = 0
				title = Uncrewed
				hideChildren = true
			}

			PARAMETER
			{
				name = HasSurfaceSample
				type = RP1HasExperiment
				experiment = surfaceSample
				hideChildren = true
			}

			PARAMETER
			{
				name = Landed
				type = ReachState
				targetBody = Vesta
				situation = LANDED
				hideChildren = true
			}

			PARAMETER
			{
				name = AnySite
				type = Any
				title = Land within 5 km of any catalogued site

				PARAMETER
				{
					name = SiteMarciaCrater
					type = VisitWaypoint
					index = 0
					distance = 5000.0
					title = Marcia Crater (7.82° North, 80.07° West)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteCalpurniaCrater
					type = VisitWaypoint
					index = 1
					distance = 5000.0
					title = Calpurnia Crater (16.79° North, 70.75° West)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteMinuciaCrater
					type = VisitWaypoint
					index = 2
					distance = 5000.0
					title = Minucia Crater (20.30° North, 62.31° West)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteVestaliaTerra
					type = VisitWaypoint
					index = 3
					distance = 5000.0
					title = Vestalia Terra (6.77° South, 36.65° West)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteSaturnaliaFossae
					type = VisitWaypoint
					index = 4
					distance = 5000.0
					title = Saturnalia Fossae (29.09° North, 26.98° West)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteDivaliaFossae
					type = VisitWaypoint
					index = 5
					distance = 5000.0
					title = Divalia Fossae (14.85° South, 109.25° East)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteAlbanaCrater
					type = VisitWaypoint
					index = 6
					distance = 5000.0
					title = Albana Crater (75.32° North, 140.54° East)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteRheasilvia
					type = VisitWaypoint
					index = 7
					distance = 5000.0
					title = Rheasilvia (87.45° South, 149.33° East)
					showMessages = true
					hideChildren = true
				}
			}
		}

		PARAMETER
		{
			name = DeliverSamples
			type = VesselParameterGroup
			title = Dock with the expedition vessel to deliver the samples
			completeInSequence = true

			PARAMETER
			{
				name = Docking
				type = Docking
				title = Dock with another vessel
			}

			PARAMETER
			{
				name = DockedToLaboratory
				type = PartValidation
				partModule = Laboratory
				minCount = 1
				title = The docked vessel carries a laboratory
			}
		}
	}
}
