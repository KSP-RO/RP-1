CONTRACT_TYPE
{
	name = Europa_LandingCrewed
	title = First Crewed Europa Landing
	group = CrewedJupiterExp
	agent = Flag Planting

	description = <b>Program: Crewed Jupiter Exploration<br>Type: <color=blue>Optional</color></b><br><br>We want to put "Boots on the Ground" and explore the surface of Europa with humans. This mission will be the most ambitious, complex and expensive mission ever undertaken by our space agency.&br;&br;Design a mission that will successfully land at least two humans on Europa, stay for at least 30 days and return safely to Earth.

	synopsis = Send a crew of 2 to land on the surface of Europa and return home safely

	completedMessage = Congratulations! Human beings have set foot on a Moon of Jupiter! The monumental task that you have accomplished is something to be proud of!

	sortKey = 1909

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 3
	maxSimultaneous = 1
	deadline = 0

	targetBody = Europa

	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 4000 // Placeholder
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedJupiterExp
	}
	
	PARAMETER
	{
		name = vesselGroup
		type = VesselParameterGroup
		title = First Crewed Europa Landing

		PARAMETER
		{
			name = TwoCrew
			type = HasCrew
			minCrew = 2
			maxCrew = 99
			title = Have at least 2 crewmembers on board
			hideChildren = true
		}
		PARAMETER
		{
			name = LandCrewed
			type = All
			title = Land the crewed lander
			disableOnStateChange = true

			PARAMETER
			{
				name = TwoCrew
				type = HasCrew
				minCrew = 2
				maxCrew = 99
				title = Have at least 2 crewmembers on board
				hideChildren = true
			}
			PARAMETER
			{
				name = ReachState
				type = ReachState
				targetBody = Europa
				situation = LANDED
				PARAMETER
				{
					name = Duration
					type = Duration
					duration = 14d
					preWaitText = Land on Europa.
					waitingText = Exploring...
					completionText = Exploration completed, you may return to Earth when ready.
				}
			}
		}
		PARAMETER
		{
			name = PlantFlagOnEuropa
			type = PlantFlag
			targetBody = Europa
			title = Plant a flag on Europa! Don't forget the picture
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = ReturnToOrbit
			type = Orbit
			situation = ORBITING
			disableOnStateChange = true
			title = Return to orbit
			
			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 2m
				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}
}
