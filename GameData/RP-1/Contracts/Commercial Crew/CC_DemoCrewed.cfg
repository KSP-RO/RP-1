CONTRACT_TYPE
{
	name = CC_DemoCrewed
	title = Commercial Crew Crewed Test Flight
	group = ComCrew
	agent = Federation Aeronautique Internationale

	description = <b>Program: Commercial Crew<br>Type: <color=green>Required</color></b><br><br>Our system has been proven by the first test flight and it is time for humans to fly aboard our system. For this first test flight, launch at least two astronauts aboard our capsule.

	synopsis = Perform an crewed test flight

	completedMessage = Mission success! We have successfully placed humans into space, rendezvoused & docked to a station and returned home!

	sortKey = 2701

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 200
	failureReputation = 0

	BEHAVIOUR
	{
		name = SpawnStation
		type = SpawnVessel

		VESSEL
		{
			name = ISS
			craftURL = RP-1/Craft Files/ISS.craft
			vesselType = Station
			owned = false

			ORBIT
			{
				SMA = 6778000
				ECC = 0.0005
				INC = 51.6
				LAN = Random(0, 360)
				LPE = 90
				MNA = 0
				EPH = 0
				REF = 1
			}
		}
	}

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ComCrew
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = CC_DemoUncrewed
	}

	PARAMETER
	{
		name = UncrewedCommercialDemo
		type = VesselParameterGroup
		title = Crewed Test Flight

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}

		PARAMETER
		{
			name = HasNonReentryRatedParts
			type = PartValidation
			hideChildren = true
			title = Vessel has no parts with the tag "not rated for reentry"

			NONE
			{
				partModule = ModuleNonReentryRated
			}
		}
		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 0.001
				title = Craft must have Electric Charge after one day
				hideChildren = true
			}
			PARAMETER
			{
				name = OneCrew
				type = HasCrew
				minCrew = 2
				maxCrew = 2
				title = Have 2 crewmembers on board
				hideChildren = true
			}
			PARAMETER
			{
				name = DockingPort
				type = PartValidation
				partModule = ModuleDockingNode
				minCount = 1
				title = Have at least 1 docking port
				hideChildren = true
			}
			PARAMETER
			{
				name = Rendezvous
				type = Rendezvous
				vessel = ISS
				distance = 100
				disableOnStateChange = true
				title = Rendezvous with the station.
			}
			PARAMETER
			{
				name = Docking
				type = Docking
				vessel = ISS
				disableOnStateChange = true
				title = Dock with the station.
			}
			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 30d
				preWaitText = Awaiting docking...
				waitingText = Crew operating...
				completionText = Crew Rotation: successfull!
			}
			PARAMETER
			{
				name = ReturnHome
				type = RP1ReturnHome
				title = Return home safely
				hideChildren = true
				completeInSequence = true
			}
		}
	}

	BEHAVIOUR
	{
		name = RemoveStation
		type = DestroyVessel
		onSuccess = true
		onFailed = true
		vessel = ISS
	}
}
