CONTRACT_TYPE
{
	name = FirstCrewedSaturnOrbit
	title = First Crewed Saturn Orbit
	group = CrewedSaturnExp
	agent = Flag Planting

	description = <b>Program: Crewed Saturn Exploration<br>Type: <color=green>Required</color></b><br><br>The gas giant Saturn and its magnificent ring system represent one of the ultimate frontiers of human exploration. Crossing billions of kilometers of deep space to reach the ringed planet will push our life support, propulsion, and navigation systems to their absolute limits.<br><br>Design and launch a crewed deep-space vehicle capable of carrying at least four astronauts into orbit around Saturn for at least 21 days and return them home. On the way, the crew will carry out deep space navigation trials. At Saturn they will observe the planet with their own eyes and survey its moons.
	synopsis = Send a crew of at least 4 into orbit of Saturn for at least 21 days. Perform deep space navigation trials during the cruise, carry out orbital observations and survey the moons, then return home safely.
	completedMessage = A historic triumph! Human beings have entered orbit around Saturn, gazing directly upon its iconic rings. The successful execution of this voyage opens a brand-new chapter in deep-space exploration.
	sortKey = 2528

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0 
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Saturn

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 6000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedSaturnExp
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = First crewed orbit of Saturn

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			
			name = SaturnOrbit
            type = ReachState
            targetBody = Saturn
            situation = ORBITING
			title = Reach orbit of Saturn and hold it for at least 21 days

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 21d
				preWaitText = Reach specified orbit
				waitingText = Orbiting...
				completionText = Saturn orbit reached!
			}
		}

		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return Home Safely
			hideChildren = true
			completeInSequence = true
		}
	}

	PARAMETER
	{
		name = DeepSpaceNavigation
		type = RP1CollectScience
		targetBody = Sun
		experiment = RP0DeepSpaceNavigation
		recoveryMethod = RecoverOrTransmit
		title = Deep Space Navigation Trials during the interplanetary cruise
		hideChildren = true
	}

	PARAMETER
	{
		name = EyeObservation
		type = RP1CollectScience
		targetBody = Saturn
		experiment = RP0PlanetaryEyeObservation
		recoveryMethod = RecoverOrTransmit
		title = Human Eye Orbital Observation of Saturn
		hideChildren = true
	}

	PARAMETER
	{
		name = MoonsObservation
		type = RP1CollectScience
		targetBody = Saturn
		experiment = RP0PlanetaryMoonsObservation
		recoveryMethod = RecoverOrTransmit
		title = Planetary Moons Observation of Saturn (21 days)
		hideChildren = true
	}
}
