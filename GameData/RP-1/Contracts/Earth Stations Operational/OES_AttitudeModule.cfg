CONTRACT_TYPE
{
	name = OES_AttitudeModule
	title = Station Module: Attitude Control
	group = OperationalEarthStations
	agent = Stations

	description = <b>Program: Operational Earth Stations<br>Type: <color=green>Required</color></b><br><br>As our space station is designed to last for many years, we will need the means of controlling attitude without expending reaction control propellant. Launch a module carrying control moment gyroscopes (reaction wheels) and dock it to the station, so it can hold its attitude using electric power instead.<br><br>This contract is based on the Kvant-1 module, which also carried a suite of X-ray telescopes to Mir.

	synopsis = Dock a module with control moment gyroscopes to the station

	completedMessage = Congratulations! The station can now hold its attitude without spending propellant!

	sortKey = 1601

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 600
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalEarthStations
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OES_CoreModule
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = vesselGroupModule
		type = VesselParameterGroup
		title = Launch a gyrodyne module and dock it to the station
		notes = The module must include at least 1 reaction wheel and 1 docking port
		disableOnStateChange = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new module
			hideChildren = true
		}
		PARAMETER
		{
			name = Gyrodynes
			type = PartValidation
			partModule = ModuleReactionWheel
			minCount = 1
			title = Have at least 1 reaction wheel
			hideChildren = true
		}
		PARAMETER
		{
			name = DockingPort
			type = PartValidation
			partModule = ModuleDockingNode
			minCount = 1
			title = Have at least 1 docking port
			hideChildren = true
		}
		PARAMETER
		{
			name = Docking
			type = Docking
			vessel = OperationalStation
			completeInSequence = true
			title = Dock with the station
		}
	}
	PARAMETER
	{
		name = vesselGroupStation
		type = VesselParameterGroup
		title = Keep the station in orbit
		vessel = OperationalStation
		completeInSequence = true

		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 300000
			maxApA = 500000
			targetBody = HomeWorld()
			title = Keep the station in a stable orbit with a perigee greater than 300 km and an apogee less than 500 km
		}
	}
}
