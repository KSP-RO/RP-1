CONTRACT_TYPE
{
    name = FirstCrewedTitanLanding
    title = Crewed Titan Landing
    group = CrewedSaturnExp
    agent = Flag Planting

    description = <b>Program: Crewed Saturn System Exploration<br>Type: <color=green>Required</color></b><br><br>The pinnacle of outer system exploration is within reach. Beneath Titan's dense, orange haze lies a world of liquid methane seas, cryogenic weather, and complex organic chemistry. Landing humans here—and sustaining them—represents one of the greatest engineering feats in human history.<br><br>Design and execute a mission to land at least 4 astronauts on the surface of Titan, maintain a surface stay for 6 months (182 days) while gathering core samples, and bring the crew safely home to Earth.
    synopsis = Land a crew of at least 4 on Titan for a 6-month surface stay, collect surface samples.
    completedMessage = History has been made! Human footprints now mark the orange sands of Titan. The successful completion of a 6-month surface stay on Saturn's largest moon stands as a testament to the heights our space program can reach.

    sortKey = 2528

    cancellable = true
    declinable = false
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0

    targetBody = Titan


    // ************ REWARDS ************
    prestige = Significant      
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 10000
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************

    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedSaturnExp
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = vesselGroup
        type = VesselParameterGroup
        title = Crewed Titan Surface Mission
        define = CrewedTitanLanding

        PARAMETER
        {
            name = FourCrew
            type = HasCrew
            minCrew = 4
            maxCrew = 99
            title = Have at least 4 crew members on board
            hideChildren = true
        }

        PARAMETER
        {
            name = LandCrewed
            type = All
            title = Land the crewed vessel and conduct surface stay
            disableOnStateChange = true

            PARAMETER
            {
                name = FourCrew
                type = HasCrew
                minCrew = 4
                maxCrew = 99
                title = Maintain a crew of at least 4
                hideChildren = true
            }

            PARAMETER
            {
                name = ReachState
                type = ReachState
                targetBody = Titan
                situation = LANDED

                PARAMETER
                {
                    name = Duration
                    type = Duration
                    duration = 182d
                    preWaitText = Land on Titan.
                    waitingText = Executing 182-day surface research stay...
                    completionText = Surface stay complete! Clear to prepare for Earth return ascent.
                }
            }
        }

        PARAMETER
        {
            name = PlantFlagOnTitan
            type = PlantFlag
            targetBody = Titan
            title = Plant a flag on Titan (and take a photo for the history books!)
            hideChildren = true
            disableOnStateChange = true
        }

        PARAMETER
        {
            name = surfaceSample1
            type = CollectScience
            targetBody = Titan
            experiment = surfaceSample2
            recoveryMethod = RecoverOrTransmit
            title = Gather Titan Surface Samples and <b><color=white>recover them to Earth</color></b>
            hideChildren = true
        }

        PARAMETER
        {
            name = surfaceSample2
            type = CollectScience
            targetBody = Titan
            experiment = surfaceSample3
            recoveryMethod = RecoverOrTransmit
            title = Gather Titan Deep Surface Samples and <b><color=white>recover them to Earth</color></b>
            hideChildren = true
        }
    }
}