CONTRACT_TYPE
{
	name = OLH_RemoteOutpost
	title = Remote Lunar Outpost Expedition
	group = OperationalLunarHabitation

	description = <b>Program: Operational Lunar Habitation<br>Type: <color=blue>Optional</color></b><br><br>Back in the early days of our Lunar Habitation program, we sent two crew members to a two week stay on the surface. While this was intended only to demonstrate extended stays on the surface, it returned a healthy amount of science - and now our scientists would like to explore more! Send at least two crew to camp at <b>@/siteName</b> for 14 days, then bring them back to the Lunar Base or home to Earth.<br><br>@/siteBlurb&br;&br;<b>Number of Expeditions Completed: @/index / @/maxCompletions</b>

	genericDescription = Send a crew to camp at a remote site on the Moon, then return them to the Lunar Base or to Earth.

	synopsis = Camp at a remote site on the Moon for 14 days

	completedMessage = The outpost crew is back safely, with a lander full of samples from a corner of the Moon we had never visited.

	sortKey = 2016

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 3
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 900
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalLunarHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OLH_BaseExpansion
	}

	// ************ SITES ************
	// A random site per contract. Declining the contract rolls a new one.

	DATA
	{
		type = int
		siteIndex = [0, 1, 2, 3, 4].Random()
	}
	DATA
	{
		type = List<string>
		siteNames = [ "Shackleton Rim", "Aristarchus Plateau", "Marius Hills Skylight", "Tsiolkovskiy Crater", "Mare Moscoviense" ]
		siteBlurbs = [ "The rim of Shackleton crater at the south pole sits in almost constant sunlight next to some of the coldest ice traps on the Moon.", "The Aristarchus Plateau is one of the most volcanically varied regions of the Moon and is blanketed in ancient volcanic ash.", "A collapsed skylight in the Marius Hills may lead into a lava tube large enough to shelter an entire base.", "Tsiolkovskiy is a far-side crater with a dark lava-flooded floor and a towering central peak. You will need a relay to stay in contact with Earth.", "Mare Moscoviense is one of the few lava plains on the far side. You will need a relay to stay in contact with Earth." ]
		hidden = true
	}
	DATA
	{
		type = List<double>
		siteLats = [ -89.9, 26.0, 14.09, -20.4, 27.3 ]
		siteLongs = [ 0.0, -51.0, -56.69, 129.1, 147.9 ]
		hidden = true
	}
	DATA
	{
		type = string
		siteName = @/siteNames.ElementAt(@/siteIndex)
		siteBlurb = @/siteBlurbs.ElementAt(@/siteIndex)
	}
	DATA
	{
		type = double
		siteLat = @/siteLats.ElementAt(@/siteIndex)
		siteLong = @/siteLongs.ElementAt(@/siteIndex)
		hidden = true
	}

	DATA
	{
		type = int
		index = $OLH_RemoteOutpost_Count + 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression

		CONTRACT_COMPLETED_SUCCESS
		{
			OLH_RemoteOutpost_Count = $OLH_RemoteOutpost_Count + 1
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = Outpost
		type = VesselParameterGroup
		title = Set up a remote outpost at @/siteName
		disableOnStateChange = true

		PARAMETER
		{
			name = TwoCrew
			type = HasCrew
			minCrew = 2
			crewOnly = true
			title = Have at least 2 crew on board
			hideChildren = true
		}
		PARAMETER
		{
			name = Camp
			type = All
			title = Camp within 10 km of @/siteName for 14 days
			disableOnStateChange = true

			PARAMETER
			{
				name = Landed
				type = ReachState
				targetBody = Moon
				situation = LANDED
				hideChildren = true
			}
			PARAMETER
			{
				name = AtSite
				type = VisitWaypoint
				index = 0
				distance = 10000.0
				title = Land within 10 km of @/siteName
				showMessages = true
				hideChildren = true
			}
			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 14d
				preWaitText = Land at @/siteName
				waitingText = Exploring the site
				completionText = Exploration completed, you may head back when ready
			}
		}
		PARAMETER
		{
			name = Return
			type = Any
			title = Return to the Lunar Base or to Earth
			completeInSequence = true

			PARAMETER
			{
				name = BackAtBase
				type = VisitWaypoint
				index = 1
				distance = 1000.0
				title = Return to within 1 km of the Lunar Base
				showMessages = true
				hideChildren = true
			}
			PARAMETER
			{
				name = ReturnHome
				type = RP1ReturnHome
				title = Return home safely
				hideChildren = true
			}
		}
	}

	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator

		WAYPOINT
		{
			name = @/siteName
			hidden = False
			targetBody = Moon
			icon = marker
			altitude = 0.0
			latitude = @/siteLat
			longitude = @/siteLong
		}
		WAYPOINT
		{
			name = Lunar Base
			hidden = False
			targetBody = Moon
			icon = marker
			altitude = 0.0
			latitude = Vessel(MoonBase).Location().Latitude()
			longitude = Vessel(MoonBase).Location().Longitude()
		}
	}
}
