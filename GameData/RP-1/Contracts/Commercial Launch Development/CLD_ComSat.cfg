CONTRACT_TYPE
{
	name = CLD_ComSat
	title = Customer Satellite Launch
	group = ComLaunchDev
	agent = Federation Aeronautique Internationale
	
	description = <b>Program: Commercial Launch Development<br>Type: <color=red>CAPSTONE</color></b><br><br>After the success of our launch into Sun Synchronous Orbit, customers have lined up to launch as well! A mix of universities, small nations and some companies have expressed interest in launching on our launch vehicle!<br><br>This is a series of @maxCompletions contracts, of which @CLDSatCount have been completed.

	synopsis = Launch a customer satellite into a sun-synchronous orbit

	completedMessage = Success! With each successful launch, our company attracts more attention, which means more investors and customers!

	sortKey = 2502

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 2
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ************ REWARDS ************
	prestige = Exceptional
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 90
	failureReputation = 0

	DATA
	{
		type = int
		CLDSatCount = $CLDSatCount + 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression
		CONTRACT_COMPLETED_SUCCESS
		{
			CLDSatCount = $CLDSatCount + 1
		}
	}

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ComLaunchDev
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = CLD_SSO
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = SSO Customer Satellite
		define = SSOCusContract
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			title = Survive in orbit for a day

			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 0.001
				title = Craft must have Electric Charge after one day
				hideChildren = true
			}
				
			PARAMETER
			{
				name = HasComSatPayload
				type = HasResource
				resource = ComSatPayload
				minQuantity = 399.9
				title = Have a ComSatPayload of at least 400 units on the craft
				hideChildren = true
			}

			PARAMETER
			{
				name = Orbit
				type = Orbit
				minInclination = 95
				maxInclination = 99
				maxEccentricity = 0.04
				minPeA = 300000
				disableOnStateChange = true
				title = Reach the correct orbit within the parameters. Note: This orbit is slightly retrograde.
			}

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 2m
				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}
}
