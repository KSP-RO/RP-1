CONTRACT_TYPE
{
	name = Titan_MethaneISRU
	title = Titan Methane ISRU Demonstration
	group = CrewedSaturnExp
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Saturn Exploration<br>Type: <color=blue>Optional</color></b><br><br>Titan's air is a few percent methane, enough to fill a return vehicle's tanks without hauling propellant from Earth. Land a demonstrator with a Mini ISRU or ISRU configured as an <b>Atmospheric Methane Harvester</b> and liquefy 250 units of <b>LqdMethane</b> from the atmosphere.<br><br>The vessel must arrive with at most 1 unit of <b>LqdMethane</b> on board, so use a dedicated demonstrator rather than a lander with methane in its ascent tanks.

	synopsis = Land on Titan with empty LqdMethane tanks and produce 250 units of LqdMethane from the atmosphere.

	completedMessage = Propellant made from the air of another world! Future expeditions to Titan can count on filling their methane tanks on arrival.

	sortKey = 25222

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Titan

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 2000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedSaturnExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedSaturnOrbit
	}

	// ************ PARAMETERS ************
	// Kerbalism's Harvester has no hidden capacity resource to check, and the liquefier can outrun it and keep the gaseous
	// Methane buffer near zero, so a minimum on Methane would flicker. Fixed LqdMethane limits prove production instead,
	// as in OLH_LunarFueledAscent: arrive with at most 1 unit, then reach 250 units.

	PARAMETER
	{
		name = Arrival
		type = VesselParameterGroup
		title = Land on Titan with an ISRU plant and empty LqdMethane tanks
		define = TitanMethaneDemo
		disableOnStateChange = true

		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Titan
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = HasISRU
			type = Any
			title = Have a Mini ISRU or ISRU configured as an Atmospheric Methane Harvester
			hideChildren = true

			PARAMETER
			{
				name = HasMiniISRU
				type = PartValidation
				part = kerbalism-miniISRU
				minCount = 1
				hideChildren = true
			}
			PARAMETER
			{
				name = HasLargeISRU
				type = PartValidation
				part = kerbalism-ISRU
				minCount = 1
				hideChildren = true
			}
		}
		PARAMETER
		{
			name = HasTanks
			type = HasResourceCapacity
			resource = LqdMethane
			minQuantity = 250
			title = Have tanks for at least 250 units of LqdMethane
			hideChildren = true
		}
		PARAMETER
		{
			name = NearlyEmpty
			type = HasResource
			resource = LqdMethane
			minQuantity = 0
			maxQuantity = 1
			title = Have at most 1 unit of LqdMethane on board
			hideChildren = true
		}
	}

	PARAMETER
	{
		name = Production
		type = VesselParameterGroup
		title = Produce 250 units of LqdMethane from Titan's atmosphere
		vessel = TitanMethaneDemo
		notes = Production continues while you are away. Return to the vessel once its tanks are full.
		completeInSequence = true
		disableOnStateChange = true

		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Titan
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = HasLiquefier
			type = HasResource
			resource = Resource("_CH4Converter")
			minQuantity = 9.99 // a Mini ISRU's converter capacity
			title = Run a GCH4 to LCH4 Converter
			hideChildren = true
		}
		PARAMETER
		{
			name = Produced
			type = HasResource
			resource = LqdMethane
			minQuantity = 249.9 // slightly under 250 so that exactly 250 units of tankage can satisfy it
			title = Have at least 250 units of LqdMethane on board
			hideChildren = true
		}
	}
}
