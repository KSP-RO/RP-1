CONTRACT_TYPE
{
	name = Iapetus_MajorSurfaceOperations
	title = Iapetus Major Surface Operations
	group = CrewedSaturnExp
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Saturn Exploration<br>Type: <color=blue>Optional</color></b><br><br>Land a crewed expeditionary vehicle at two of the most remarkable landmarks on Iapetus: Turgis impact basin and the equatorial ridge. Run a different field science instrument at each site and remain at the last one for 24 hours.

	synopsis = Land a crewed expeditionary rover or a hop-capable lander within 1 km of each of the 2 landmarks on Iapetus, run a different field science instrument at each and remain at the last one for 24 hours.

	completedMessage = Congratulations! The surface survey of Iapetus has given our scientists the first ground-level look at its two-toned terrain and its enormous equatorial ridge.

	sortKey = 25211

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Iapetus

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 2000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedSaturnExp
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedIapetusLanding
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedSaturnOrbit
	}

	// ************ WAYPOINTS ************
	// Coordinates are converted from the IAU gazetteer (planetographic, +West)
	// to KSP convention (+East, -180 to 180).

	BEHAVIOUR
	{
		name = LandmarkWaypoints
		type = WaypointGenerator
		targetBody = Iapetus

		WAYPOINT
		{
			name = Turgis Basin
			icon = marker
			latitude = 16.9
			longitude = -28.4
			altitude = 0
			parameter = Site1
		}

		WAYPOINT
		{
			name = Equatorial Ridge (Tortelosa Montes)
			icon = marker
			latitude = 0.0
			longitude = -90.0
			altitude = 0
			parameter = Site2
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = SurfaceExpedition
		type = VesselParameterGroup
		title = Control a vessel with the required parameters
		notes = Use an expeditionary rover or a lander capable of hopping between sites. The same vessel must visit both landmarks.
		define = IapetusSurfaceExpeditionVessel
		disableOnStateChange = false

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 2
			crewOnly = true
			title = Have at least 2 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = Site1
			type = Sequence
			title = Landmark 1: Turgis Basin

			PARAMETER
			{
				name = LandedNear1
				type = VisitWaypoint
				index = 0
				horizontalDistance = 1000
				title = Land within 1 km of Turgis Basin
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed1
				type = ReachState
				targetBody = Iapetus
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Sample1
				type = RP1CollectScience
				targetBody = Iapetus
				experiment = evaAdvancedFieldGeology
				recoveryMethod = RecoverOrTransmit
				title = Run the Advanced Field Geology Suite in Turgis Basin
			}
		}

		PARAMETER
		{
			name = Site2
			type = Sequence
			title = Landmark 2: Equatorial Ridge (Tortelosa Montes)

			PARAMETER
			{
				name = LandedNear2
				type = VisitWaypoint
				index = 1
				horizontalDistance = 1000
				title = Be within 1 km of Equatorial Ridge (Tortelosa Montes)
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed2
				type = ReachState
				targetBody = Iapetus
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay2
				type = Duration
				duration = 24h
				preWaitText = Remain at Equatorial Ridge (Tortelosa Montes) for 24 hours
				waitingText = Surveying Equatorial Ridge (Tortelosa Montes)
				completionText = Survey of Equatorial Ridge (Tortelosa Montes) complete
			}
			PARAMETER
			{
				name = Sample2
				type = RP1CollectScience
				targetBody = Iapetus
				experiment = evaXRDScan
				recoveryMethod = RecoverOrTransmit
				title = Run X-Ray Diffraction on the Equatorial Ridge
			}
		}
	}
}
