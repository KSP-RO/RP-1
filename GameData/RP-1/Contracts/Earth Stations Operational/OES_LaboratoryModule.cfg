CONTRACT_TYPE
{
	name = OES_LaboratoryModule
	title = Station Module: Laboratory
	group = OperationalEarthStations
	agent = Stations

	description = <b>Program: Operational Earth Stations<br>Type: <color=green>Required</color></b><br><br>Having crew in orbit alone does not provide enough scientific data to justify their stay. Launch a pressurized laboratory module with room for a month of Research Payload and dock it to the station, so that the station can hold at least two months of Research Payload between cargo deliveries.<br><br>This contract is based on the Kristall module, which carried furnaces for materials processing and biological experiments to Mir.

	synopsis = Dock a laboratory module to the station

	completedMessage = Congratulations! The station's laboratory is open for business!

	sortKey = 1603

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 600
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalEarthStations
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OES_CoreModule
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = vesselGroupModule
		type = VesselParameterGroup
		title = Launch a laboratory module and dock it to the station
		notes = The module must be pressurized, and include room for 30 days of Research Payload and 1 docking port
		disableOnStateChange = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new module
			hideChildren = true
		}
		PARAMETER
		{
			name = HasCapacity
			type = HasCrewCapacity
			minCapacity = 1
			title = Space for at least 1 crew
			hideChildren = true
		}
		PARAMETER
		{
			name = researchPayloadCapacity //make sure the module can hold at least 30 days of research payload
			type = HasResourceCapacity
			resource = ResearchPayload
			minQuantity = 750
		}
		PARAMETER
		{
			name = DockingPort
			type = PartValidation
			partModule = ModuleDockingNode
			minCount = 1
			title = Have at least 1 docking port
			hideChildren = true
		}
		PARAMETER
		{
			name = Docking
			type = Docking
			vessel = OperationalStation
			completeInSequence = true
			title = Dock with the station
		}
	}
	PARAMETER
	{
		name = vesselGroupStation
		type = VesselParameterGroup
		title = Keep the station in orbit with room for two months of Research Payload
		vessel = OperationalStation
		completeInSequence = true

		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 300000
			maxApA = 500000
			targetBody = HomeWorld()
			title = Keep the station in a stable orbit with a perigee greater than 300 km and an apogee less than 500 km
		}
		PARAMETER
		{
			name = researchPayloadCapacity //make sure the station can hold at least 60 days of research payload
			type = HasResourceCapacity
			resource = ResearchPayload
			minQuantity = 1500
		}
	}
}
