CONTRACT_TYPE
{
	name = Uranus_LongNightExpedition
	title = Long Night Expedition
	group = CrewedUranusExp
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Uranus Exploration<br>Type: <color=blue>Optional</color></b><br><br>Uranus is tipped 98 degrees on its side and its moons orbit around its equator, so near the solstices one hemisphere of every moon sits in a night lasting about 21 years. Even near the equinoxes a night on Titania lasts about 4 days and on Oberon nearly a week. The ices that freeze out in this darkness are exactly what our scientists want to study, and only a crew working in the dark can collect them.<br><br>Land a crew of at least 2 on Titania or Oberon and stay for 14 days. During the night, a scientist must run the <b>Cryogenic Volatile Analyzer</b>, which only works in shadow, while a <b>Surface Radiation Assessment Detector</b> measures the environment a long-term outpost would face. Solar panels will not help here, so bring another power source.

	synopsis = Land a crew of at least 2 on Titania or Oberon for 14 days, run the Cryogenic Volatile Analyzer in darkness and a Surface Radiation Assessment Detector.

	completedMessage = Congratulations! Our crew has worked through the Uranian night and brought back the first samples of ices frozen out of the dark. Future outposts will know what the long night holds.

	sortKey = 2819

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 3000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedUranusExp
	}

	REQUIREMENT
	{
		name = Any
		type = Any

		REQUIREMENT
		{
			name = CompleteContract
			type = CompleteContract
			contractType = FirstCrewedTitaniaLanding
		}
		REQUIREMENT
		{
			name = CompleteContract
			type = CompleteContract
			contractType = FirstCrewedOberonLanding
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = vesselGroup
		type = VesselParameterGroup
		title = Crewed Long Night Expedition
		define = UranusLongNightVessel

		PARAMETER
		{
			name = TwoCrew
			type = HasCrew
			minCrew = 2
			maxCrew = 99
			title = Have at least 2 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = LandCrewed
			type = Any
			title = Land on Titania or Oberon and stay for 14 days
			disableOnStateChange = true

			PARAMETER
			{
				name = LandTitania
				type = ReachState
				targetBody = Titania
				situation = LANDED
				title = Land on Titania

				PARAMETER
				{
					name = Duration
					type = Duration
					duration = 14d
					preWaitText = Land on Titania.
					waitingText = Waiting out the night...
					completionText = Expedition complete.
				}
			}
			PARAMETER
			{
				name = LandOberon
				type = ReachState
				targetBody = Oberon
				situation = LANDED
				title = Land on Oberon

				PARAMETER
				{
					name = Duration
					type = Duration
					duration = 14d
					preWaitText = Land on Oberon.
					waitingText = Waiting out the night...
					completionText = Expedition complete.
				}
			}
		}
	}

	PARAMETER
	{
		name = CryoVolatiles
		type = Any
		title = Run the Cryogenic Volatile Analyzer in darkness on Titania or Oberon (requires a Scientist)
		hideChildren = true

		PARAMETER
		{
			name = CryoTitania
			type = RP1CollectScience
			targetBody = Titania
			experiment = evaCryogenicVolatileAnalysis
			situation = SrfLanded
			recoveryMethod = RecoverOrTransmit
		}
		PARAMETER
		{
			name = CryoOberon
			type = RP1CollectScience
			targetBody = Oberon
			experiment = evaCryogenicVolatileAnalysis
			situation = SrfLanded
			recoveryMethod = RecoverOrTransmit
		}
	}

	PARAMETER
	{
		name = SurfaceRadiation
		type = Any
		title = Run a Surface Radiation Assessment Detector on Titania or Oberon
		hideChildren = true

		PARAMETER
		{
			name = RadTitania
			type = RP1CollectScience
			targetBody = Titania
			experiment = evaSurfaceRadDetectorScan
			situation = SrfLanded
			recoveryMethod = RecoverOrTransmit
		}
		PARAMETER
		{
			name = RadOberon
			type = RP1CollectScience
			targetBody = Oberon
			experiment = evaSurfaceRadDetectorScan
			situation = SrfLanded
			recoveryMethod = RecoverOrTransmit
		}
	}
}
