CONTRACT_TYPE
{
    name = FirstCrewedTitaniaLanding
    title = Crewed Titania Landing
    group = CrewedUranusExp
    agent = Flag Planting

    description = <b>Program: Crewed Uranus System Exploration<br>Type: <color=green>Required</color></b><br><br>The pinnacle of outer system exploration is within reach. Titania, the largest moon of Uranus, is a frigid world of ancient ice, immense canyon systems like Messina Chasma, and evidence of past internal activity that may hint at a hidden subsurface ocean. Landing humans here—and sustaining them in such extreme cold and darkness—represents one of the greatest engineering feats in human history.<br><br>Design and execute a mission to land at least 4 astronauts on the surface of Titania, maintain a surface stay for 6 months (182 days) while gathering core samples, and bring the crew safely home to Earth.
    synopsis = Land a crew of at least 4 on Titania for a 6-month surface stay, collect surface samples.
    completedMessage = History has been made! Human footprints now mark the ancient ice of Titania. The successful completion of a 6-month surface stay on Uranus's largest moon stands as a testament to the heights our space program can reach.

    sortKey = 2805

    cancellable = true
    declinable = false
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0

    targetBody = Titania


    // ************ REWARDS ************
    prestige = Significant      
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 15000
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************

    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedUranusExp
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = vesselGroup
        type = VesselParameterGroup
        title = Crewed Titania Surface Mission
        define = CrewedTitaniaLanding

        PARAMETER
        {
            name = FourCrew
            type = HasCrew
            minCrew = 4
            maxCrew = 99
            title = Have at least 4 crew members on board
            hideChildren = true
        }

        PARAMETER
        {
            name = LandCrewed
            type = All
            title = Land the crewed vessel and conduct surface stay
            disableOnStateChange = true

            PARAMETER
            {
                name = FourCrew
                type = HasCrew
                minCrew = 4
                maxCrew = 99
                title = Maintain a crew of at least 4
                hideChildren = true
            }

            PARAMETER
            {
                name = ReachState
                type = ReachState
                targetBody = Titania
                situation = LANDED

                PARAMETER
                {
                    name = Duration
                    type = Duration
                    duration = 182d
                    preWaitText = Land on Titania.
                    waitingText = Executing 182-day surface research stay...
                    completionText = Surface stay complete! Clear to prepare for Earth return ascent.
                }
            }
        }

        PARAMETER
        {
            name = PlantFlagOnTitania
            type = PlantFlag
            targetBody = Titania
            title = Plant a flag on Titania (and take a photo for the history books!)
            hideChildren = true
            disableOnStateChange = true
        }

        PARAMETER
        {
            name = surfaceSample1
            type = CollectScience
            targetBody = Titania
            experiment = surfaceSample2
            recoveryMethod = RecoverOrTransmit
            title = Gather Titania Surface Samples and <b><color=white>recover them to Earth</color></b>
            hideChildren = true
        }

        PARAMETER
        {
            name = surfaceSample2
            type = CollectScience
            targetBody = Titania
            experiment = surfaceSample3
            recoveryMethod = RecoverOrTransmit
            title = Gather Titania Deep Surface Samples and <b><color=white>recover them to Earth</color></b>
            hideChildren = true
        }
    }
}