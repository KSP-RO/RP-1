CONTRACT_TYPE
{
	name = Reuse_ExpandedHop
	title = Expanded Flight Envelope Reusable Rocket Hop
	group = ReuseDev
	agent = Federation Aeronautique Internationale

	description = <b>Program: Reusable Rocket Development<br>Type: <color=blue>Optional</color></b><br><br>After the initial proving flights, we will now expand the envelope even further. You must fly for at least 90 seconds and reach ever-increasing heights.<br><br>This is a series of @maxCompletions contracts, of which @ExpandedHopIndex have been completed. <br><br>Historical example: DC-X and SpaceX Grasshopper flight test program
	genericDescription = Perform longer and higher hops.
	synopsis = Perform a short hop.

	completedMessage = Well Done! With each completed hop, we expand the flight envelope further.

	sortKey = 1000

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 6
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 100
	failureReputation = 0


	// ************ DATA *************
	DATA
	{
		type = List<float>
		TargetAltitude = [5000, 7500, 10000, 25000, 50000, 100000] // meters
	}
	DATA
	{
		type = int
		ExpandedHopIndex = $ExpandedHopIndex + 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression
		
		CONTRACT_COMPLETED_SUCCESS
		{
			ExpandedHopIndex = $ExpandedHopIndex + 1
		}
	}

	DATA
	{
		type = float
		AltTarget = @TargetAltitude.ElementAt(@ExpandedHopIndex)
		title = Altitude
	}

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ReuseDev
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = Reuse_Hop
		minCount = 6
	}
	
	PARAMETER
	{
		name = OrbitReturn
		type = VesselParameterGroup
		title = Suborbital return

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = BuiltAtVAB
			type = VesselBuiltAt
			builtAt = VAB
		}
		PARAMETER
		{
			name = HasNoCrew
			type = HasCrew
			maxCrew = 0
			minCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = ReachState
			type = ReachState
			situation = FLYING
			minRateOfClimb = 10
			title = Climb with at least 10 m/s
			disableOnStateChange = true
			hideChildren = true
		}
		PARAMETER
		{
			name = FlightDurationAtAlt
			type = Duration
			duration = 90s
			title = Hover at or above @/AltTarget m AGL for at least @/DurTarget
			completeInSequence = true

			PARAMETER
			{
				name = MaintainAlt
				type = ReachState
				minTerrainAltitude = @/AltTarget
				title = Maintain altitude above @/AltTarget m AGL
				hideChildren = true
			}
		}
		PARAMETER
		{
			name = NoStaging
			type = NoStaging
			title = Do not Stage
			failContract = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return home safely
			hideChildren = true
			completeInSequence = true
		}
	}
}