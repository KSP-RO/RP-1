CONTRACT_TYPE
{
    name = FirstCrewedTitanLanding
    title = First Crewed Titan Landing
    group = CrewedSaturnExp
    agent = Flag Planting

    description = <b>Program: Crewed Saturn System Exploration<br>Type: <color=green>Required</color></b><br><br>The pinnacle of outer system exploration is within reach. Beneath Titan's dense, orange haze lies a world of liquid methane seas, cryogenic weather, and complex organic chemistry. Landing humans here—and sustaining them—represents one of the greatest engineering feats in human history.<br><br>Design and execute a mission to land at least 4 astronauts on the surface of Titan and bring the crew safely home to Earth. Once on the surface, the crew will analyze the organic molecules in the soil and set up a seismic station.
    synopsis = Land a crew of at least 4 on Titan, plant a flag and run organic molecule analysis and a seismic station.
    completedMessage = History has been made! Human footprints now mark the orange sands of Titan. The successful landing on the largest moon of Saturn stands as a testament to the heights our space program can reach.

    sortKey = 2529

    cancellable = true
    declinable = false
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0

    targetBody = Titan


    // ************ REWARDS ************
    prestige = Significant      
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 5000
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************

    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedSaturnExp
    }
    REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedSaturnOrbit
	}

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = vesselGroup
        type = VesselParameterGroup
        title = Crewed Titan Surface Mission
        define = CrewedTitanLanding

        PARAMETER
        {
            name = FourCrew
            type = HasCrew
            minCrew = 4
            maxCrew = 99
            title = Have at least 4 crew members on board
            hideChildren = true
        }

        PARAMETER
        {
            name = LandCrewed
            type = All
            title = Land the crewed vessel
            disableOnStateChange = true

            PARAMETER
            {
                name = FourCrew
                type = HasCrew
                minCrew = 4
                maxCrew = 99
                title = Maintain a crew of at least 4
                hideChildren = true
            }

            PARAMETER
            {
                name = ReachState
                type = ReachState
                targetBody = Titan
                situation = LANDED

            }
        }

        PARAMETER
        {
            name = PlantFlagOnTitan
            type = PlantFlag
            targetBody = Titan
            title = Plant a flag on Titan (and make sure to leave no crew behind!)
            hideChildren = true
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = evaOrganicAnalysis
        type = RP1CollectScience
        targetBody = Titan
        experiment = evaOrganicAnalysis
        situation = SrfLanded
        recoveryMethod = RecoverOrTransmit
        title = Organic Molecule Analysis of the surface
        hideChildren = true
    }

    PARAMETER
    {
        name = evaAdvancedSeismicScan
        type = RP1CollectScience
        targetBody = Titan
        experiment = evaAdvancedSeismicScan
        situation = SrfLanded
        recoveryMethod = RecoverOrTransmit
        title = Set up an Advanced Seismic Station
        hideChildren = true
    }
}
