CONTRACT_TYPE
{
	name = CC_Circumlunar
	title = Commercial Circumlunar Crew Flight
	group = ComCrew
	agent = Federation Aeronautique Internationale

	description = <b>Program: Commercial Crew<br>Type: <color=blue>Optional</color></b><br><br>Only one nation has previously flown crew to and from the Moon, it is now time for us to match that capacity as well. It would be a massive publicity win! 

	synopsis = Fly crew past the Moon

	completedMessage = Mission success! We have successfully flown humans around the Moon and returned them safely!

	sortKey = 2705

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 500
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ComCrew
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = CC_DemoCrewed
	}

	PARAMETER
	{
		name = UncrewedCommercialDemo
		type = VesselParameterGroup
		title = Circumlunar Flight

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}

		PARAMETER
		{
			name = HasNonReentryRatedParts
			type = PartValidation
			hideChildren = true
			title = Vessel has no parts with the tag "not rated for reentry"

			NONE
			{
				partModule = ModuleNonReentryRated
			}
		}
		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 0.001
				title = Craft must have Electric Charge after one day
				hideChildren = true
			}
			PARAMETER
			{
				name = OneCrew
				type = HasCrew
				minCrew = 2
				maxCrew = 2
				title = Have 2 crewmembers on board
				hideChildren = true
			}
			PARAMETER
			{
				name = ReachMoon
				type = ReachState
				targetBody = Moon
				//Luna 1 barely fails at 6Mm
				maxAltitude = 5000000
				disableOnStateChange = true
				title = Flyby the Moon within 5000 km
				hideChildren = true
			}
			PARAMETER
			{
				name = ReturnHome
				type = RP1ReturnHome
				title = Return home safely
				hideChildren = true
				completeInSequence = true
			}
		}
	}
}
