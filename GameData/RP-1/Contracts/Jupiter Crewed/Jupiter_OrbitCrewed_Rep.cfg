CONTRACT_TYPE
{
	name = Jupiter_OrbitCrewed_Rep
	title = Crewed Jupiter Orbit
	group = CrewedJupiterExp
	agent = Flag Planting

	description = <b>Program: Crewed Jupiter Exploration<br>Type: <color=blue>Optional</color></b><br><br>Design and successfully launch a craft that can carry at least four crew into orbit around Jupiter and return them safely to Earth.<br><br><b>NOTE:</b> The vessel you complete this contract with must carry a Laboratory. The Expedition Sample Return contracts need a vessel like this in Jupiter orbit to analyze the samples your probes bring back.

	synopsis = Fly a crewed Jupiter Orbit mission and return home safely

	completedMessage = Congratulations on safely returning another crew from orbit around Jupiter!

	sortKey = 1911

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 2 // allows for three expeditions
	maxSimultaneous = 1
	deadline = 0

	targetBody = Jupiter

	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 1000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedJupiterExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = Jupiter_OrbitCrewed
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = JupiterMothershipVPG
		type = VesselParameterGroup
		title = Jupiter Expedition Vessel
		completeInSequence = true
		disableOnStateChange = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = HasScienceModule
			type = PartValidation
			partModule = Laboratory
			title = Carry a Science Lab Module
			minCount = 1
		}

		PARAMETER
		{
			name = JupiterOrbit
			title = Reach orbit of Jupiter with a maximum pe of 2,800,000 km and a maximum ap of 2,850,000 km and hold it for at least 7 days
			type = Orbit
			maxPeA = 2800000000  // 1.5x Callisto Periapsis at 1,869,000 km
			maxApA = 2850000000  // 1.5x Callisto Apoapsis at 1,897,000 km
			targetBody = Jupiter
			disableOnStateChange = true
			completeInSequence = true

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 7d
				preWaitText = Reach specified orbit
				waitingText = Orbiting...
				completionText = Orbits are complete, you may return to Earth when ready
			}
		}
	}

	PARAMETER
	{
		name = ReturnHome
		type = RP1ReturnHome
		title = Return Home Safely
		hideChildren = true
		completeInSequence = true
	}
}
