CONTRACT_TYPE
{
    name = venusStationExtended2
    title = Venus Station: Extended Research II (Stage 3)
    group = CrewedVenusExp
    agent = Exploration

    description = <b>Program: Crewed Venus Exploration <br>Type: <color=orange>Optional</color></b><br><br>Stage 3 of 3. Keep your Venus station in orbit for a third transfer window (584 more days) with at least 4 crew aboard throughout, and have the crew run at least 2 experiments: Gravity Field Survey and Plasma Environment Study. This completes the full 1,752 day research program. If the station leaves orbit or drops below 4 crew, the stay timer resets.
    synopsis = Keep the Venus station operating for a third transfer window
    completedMessage = Stage 3 complete! The Venus station has finished its full research program!

    sortKey = 2522

    cancellable = true
    declinable = true
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0

    targetBody = Venus

    // ************ REWARDS ************
    prestige = Significant
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 250
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedVenusExp    
    }

    REQUIREMENT
    {
        name = Stage2Done
        type = CompleteContract
        contractType = venusStationExtended1
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = VenusStation3
        type = VesselParameterGroup
        title = Venus Station: Extended Research II (Stage 3)
        vessel = VenusStationVessel
        dissassociateVesselsOnContractCompletion = false

        PARAMETER
        {
            name = StillInVenusOrbit
            type = ReachState
            targetBody = Venus
            situation = ORBITING
            disableOnStateChange = true
            title = Keep the station in orbit around Venus
            hideChildren = true
        }
        PARAMETER
        {
            name = Crew
            type = HasCrew
            minCrew = 4
            title = Have at least 4 Crewmembers aboard
            hideChildren = true
        }

        PARAMETER
        {
            name = Window3
            type = Duration
            duration = 584d
            preWaitText = Transfer window 3: keep the station in Venus orbit with at least 4 crew aboard for 584 days
            waitingText = Station is in orbit with crew aboard, window 3 in progress...
            completionText = Transfer window 3 complete
            hideChildren = true

            PARAMETER
            {
                name = InOrbitW3
                type = ReachState
                targetBody = Venus
                situation = ORBITING
                disableOnStateChange = true
                title = In orbit around Venus
            }

            PARAMETER
            {
                name = CrewAboardW3
                type = HasCrew
                minCrew = 4
                title = At least 4 Crewmembers aboard
            }
        }

        PARAMETER
        {
            name = StationExperiment1
            type = CollectScience
            targetBody = Venus
            experiment = RP0VenusGravityField
            recoveryMethod = RecoverOrTransmit
            title = Run experiment 1: Gravity Field Survey
            hideChildren = true
        }
 
        PARAMETER
        {
            name = StationExperiment2
            type = CollectScience
            targetBody = Venus
            experiment = RP0VenusPlasmaEnvironment
            recoveryMethod = RecoverOrTransmit
            title = Run experiment 2: Plasma Environment Study
            hideChildren = true
        }
    }
