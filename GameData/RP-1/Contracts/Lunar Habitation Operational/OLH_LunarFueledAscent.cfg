CONTRACT_TYPE
{
	name = OLH_LunarFueledAscent
	title = Lunar-Fueled Ascent
	group = OperationalLunarHabitation

	description = <b>Program: Operational Lunar Habitation<br>Type: <color=blue>Optional</color></b><br><br>Our Lunar Propellant Plant is in operation! Demonstrate its usage by flying a crewed lunar lander to the Base, refuel its Liquid Oxygen and then return to orbit. From there, either dock to a vessel in Lunar orbit or return the crew home. <br><br>The lander must land within 200 m of the Base with at most 100 units of <b>LqdOxygen</b>, then take on at least 500 units from the Base, docking with it or with a tanker rover. The refuel only counts once the lander has undocked, so that the Base's own tanks don't count. Mission planners trust that the oxygen was made on the Moon.

	synopsis = Fly a crewed lander to lunar orbit on oxygen made at the Lunar Base

	completedMessage = The first spacecraft to leave the Moon on lunar propellant! The rest of the Solar System just got a lot cheaper to reach.

	sortKey = 2014

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 1000
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalLunarHabitation
	}
	REQUIREMENT
	{
		name = Any
		type = Any

		REQUIREMENT
		{
			name = CompleteContract1
			type = CompleteContract
			contractType = OLH_LunarLOX
		}
		REQUIREMENT
		{
			name = CompleteContract2
			type = CompleteContract
			contractType = OLH_LunarHydrolox
		}
	}

	// ************ PARAMETERS ************
	// Contract Configurator works out parameter values when the contract is offered, so the lander's oxygen can't be
	// recorded on arrival and reused later. Fixed limits prove the refuel instead: arrive with at most 100 units, then
	// have at least 600 once undocked from the Base.

	PARAMETER
	{
		name = Arrival
		type = VesselParameterGroup
		title = Land at the Lunar Base with nearly empty oxygen tanks
		define = LunarFuelDemo
		disableOnStateChange = true

		PARAMETER
		{
			name = NotTheBase
			type = IsNotVessel
			vessel = MoonBase
			title = Use a lander, not the Lunar Base itself
			hideChildren = true
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = AtBase
			type = VisitWaypoint
			index = 0
			distance = 200.0
			title = Land within 200 m of the Lunar Base
			showMessages = true
			hideChildren = true
		}
		PARAMETER
		{
			name = NearlyEmpty
			type = HasResource
			resource = LqdOxygen
			minQuantity = 0
			maxQuantity = 100
			title = Have at most 100 units of LqdOxygen on board
			hideChildren = true
		}
	}
	PARAMETER
	{
		name = Refuel
		type = VesselParameterGroup
		title = Refuel the lander with at least 500 units of LqdOxygen from the Lunar Base
		vessel = LunarFuelDemo
		completeInSequence = true
		disableOnStateChange = true

		// While docked, the lander and the Base are one vessel and the Base's tanks would count
		PARAMETER
		{
			name = Undocked
			type = IsNotVessel
			vessel = MoonBase
			title = Undock from the Lunar Base
			hideChildren = true
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Moon
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = AtBase
			type = VisitWaypoint
			index = 0
			distance = 200.0
			title = Stay within 200 m of the Lunar Base
			showMessages = true
			hideChildren = true
		}
		PARAMETER
		{
			name = Refuelled
			type = HasResource
			resource = LqdOxygen
			minQuantity = 600
			title = Have at least 600 units of LqdOxygen on board
			hideChildren = true
		}
	}
	PARAMETER
	{
		name = Ascent
		type = VesselParameterGroup
		title = Fly the refuelled lander to lunar orbit
		vessel = LunarFuelDemo
		completeInSequence = true
		disableOnStateChange = true

		PARAMETER
		{
			name = OneCrew
			type = HasCrew
			minCrew = 1
			crewOnly = true
			title = Have at least 1 crew on board
			hideChildren = true
		}
		PARAMETER
		{
			name = LunarOrbit
			type = Orbit
			targetBody = Moon
			minPeA = 30000
			title = Reach lunar orbit with a minimum periapsis of 30 km
			disableOnStateChange = true
			hideChildren = true
		}
		PARAMETER
		{
			name = Finish
			type = Any
			title = Dock with a vessel in lunar orbit or return home safely
			completeInSequence = true

			PARAMETER
			{
				name = Docking
				type = Docking
				title = Dock with a vessel in lunar orbit
				hideChildren = true
			}
			PARAMETER
			{
				name = ReturnHome
				type = RP1ReturnHome
				title = Return home safely
				hideChildren = true
			}
		}
	}

	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator

		WAYPOINT
		{
			name = Lunar Base
			hidden = False
			targetBody = Moon
			icon = marker
			altitude = 0.0
			latitude = Vessel(MoonBase).Location().Latitude()
			longitude = Vessel(MoonBase).Location().Longitude()
		}
	}
}
