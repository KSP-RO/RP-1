CONTRACT_TYPE
{
	name = MercurySurfaceStay
	title = Crewed Mercury Surface Expedition (4 Months)
	group = CrewedMercuryExp
	agent = Flag Planting

	description = <b>Program: Crewed Mercury Exploration<br>Type: <color=blue>Optional</color></b><br><br>Having mastered the Moon and reached Mercury, our next giant leap is to live on its surface. Surviving there, with an extreme radiation environment and surface temperatures that swing between melting lead and deep cryogenic cold, will push our life support, power generation and thermal control systems to their absolute limits. Your mission is to land a crewed outpost on the surface of Mercury and maintain a continuous presence for a minimum of 4 months (120 days). The crew will act as their own test subjects for a long-term partial gravity health study, and run a long-term geophysics and environment campaign: a distributed seismic network, a micrometeorite impact plate, and monitors for the surface radiation and the electrically charged dust.

	synopsis = Land a crew of at least 4 on Mercury for 120 days, conduct at least 60% of a Partial Gravity Health Study, and run a distributed seismic survey, a micrometeorite impact plate, a surface radiation detector and an electrostatic dust monitor

	completedMessage = Congratulations! You have successfully completed a 4 month stay on Mercury, and the crew's medical data is invaluable for planning longer stays far from Earth.

	sortKey = 2035

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mercury

	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 3000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedMercuryExp
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = firstCrewedMercurylanding
	}

	// ************ PARAMETERS ************
	PARAMETER
	{
		name = vesselGroup
		type = VesselParameterGroup
		title = Crewed Mercury Outpost
		define = CrewedMercuryOutpost

		PARAMETER
		{
			name = FourCrew
			type = HasCrew
			minCrew = 4
			maxCrew = 99
			title = Have at least 4 crewmembers on board
			hideChildren = true
		}
		PARAMETER
		{
			name = LandCrewed
			type = All
			title = Land the crewed outpost
			disableOnStateChange = true

			PARAMETER
			{
				name = FourCrew
				type = HasCrew
				minCrew = 4
				maxCrew = 99
				title = Have at least 4 crewmembers on board
				hideChildren = true
			}
			PARAMETER
			{
				name = ReachState
				type = ReachState
				targetBody = Mercury
				situation = LANDED
				PARAMETER
				{
					name = Duration
					type = Duration
					duration = 120d
					preWaitText = Land on Mercury.
					waitingText = Exploring...
					completionText = Expedition completed, you may return to Earth when ready.
				}
			}
		}
		PARAMETER
		{
			name = PlantFlagOnMercury
			type = PlantFlag
			targetBody = Mercury
			title = Plant a flag on Mercury to signify your stay!
			hideChildren = true
			disableOnStateChange = true
		}
	}

	PARAMETER
	{
		name = PartialGravityHealth
		type = RP1CollectScience
		targetBody = Mercury
		experiment = RP0PartialGravityHealth
		recoveryMethod = RecoverOrTransmit
		fractionComplete = 0.6 // 108 of the study's 180 days, leaving ~12 days of margin inside the 120 day stay
		title = Partial Gravity Health Study on Mercury (at least 60%)
		hideChildren = true
	}

	PARAMETER
	{
		name = evaSeismicArrayScan
		type = RP1CollectScience
		targetBody = Mercury
		experiment = evaSeismicArrayScan
		recoveryMethod = RecoverOrTransmit
		title = Distributed Seismic Survey across the outpost's surroundings (14 days)
		hideChildren = true
	}

	PARAMETER
	{
		name = evaMicrometeoriteScan
		type = RP1CollectScience
		targetBody = Mercury
		experiment = evaMicrometeoriteScan
		recoveryMethod = RecoverOrTransmit
		title = Expose and retrieve a Micrometeorite Impact Plate (15 days)
		hideChildren = true
	}

	PARAMETER
	{
		name = evaSurfaceRadDetectorScan
		type = RP1CollectScience
		targetBody = Mercury
		experiment = evaSurfaceRadDetectorScan
		recoveryMethod = RecoverOrTransmit
		title = Surface Radiation Assessment Detector (3 days)
		hideChildren = true
	}

	PARAMETER
	{
		name = evaElectrostaticDustScan
		type = RP1CollectScience
		targetBody = Mercury
		experiment = evaElectrostaticDustScan
		recoveryMethod = RecoverOrTransmit
		title = Electrostatic Dust Monitor (3 days)
		hideChildren = true
	}
}
