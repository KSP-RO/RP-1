CONTRACT_TYPE
{
	name = CLD_SSO
	title = First Commercially Launched Sun-Synchronous Orbit Satellite
	group = ComLaunchDev
	agent = Federation Aeronautique Internationale
	
	description = <b>Program: Commercial Launch Development<br>Type: <color=green>Required</color></b><br><br>Having proven that we can launch something into orbit, it is now of importance to show that we can launch into precise orbits that are of interest to our customers as well. One such orbit is a sun-synchronous orbit. This is a geocentric orbit that combines altitude and inclination in such a way that the satellite passes over any given point of the planet's surface at the same local solar time. Such an orbit can place a satellite in constant sunlight and is useful for imaging, spy, and weather satellites.&br;&br;Place a satellite into a sun-synchronous orbit. Note that sun-synchronous orbits are often slightly retrograde, as is this orbit. You'll need to fly northwest from the launch pad and it will take more delta-v than a normal polar orbit.&br;&br;You can use an online orbit calculator to determine what kind of orbit will meet the eccentricity requirement, such as the one available from https://orbital-math.com/.

	synopsis = Launch a satellite into a sun-synchronous orbit

	completedMessage = Success! True sun-synchronous orbits are not possible in KSP due to the equatorial bulge not being present. However, this is similar to what these orbits are.

	sortKey = 2501

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 90
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ComLaunchDev
	}


	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Sun-synchronous satellite

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			title = Survive in orbit for a day

			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 0.001
				title = Craft must have Electric Charge after one day
				hideChildren = true
			}
				
			PARAMETER
			{
				name = Satellite Mass
				type = VesselMass
				minMass = 0.300
				title = Satellite must be at least 300 kg
			}

			PARAMETER
			{
				name = Orbit
				type = Orbit
				minInclination = 95
				maxInclination = 99
				maxEccentricity = 0.04
				minPeA = 300000
				disableOnStateChange = true
				title = Reach the correct orbit within the parameters. Note: This orbit is slightly retrograde.
			}

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 1d
				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}
}
