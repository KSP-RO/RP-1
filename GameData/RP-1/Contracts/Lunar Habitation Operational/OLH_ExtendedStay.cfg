CONTRACT_TYPE
{
	name = OLH_ExtendedStay
	title = Extended Lunar Expedition
	group = OperationalLunarHabitation

	description = <b>Program: Operational Lunar Habitation<br>Type: <color=blue>Optional</color></b><br><br>Our Lunar Base is permanently crewed, but every year of habitation teaches us more about living on the Moon. Keep at least <b>six</b> crew aboard the Base for another year of Operational Lunar Habitation.<br><br>The year does not have to be continuous, and crews can rotate as needed.&br;&br;<b>Number of Expeditions Completed: @/index / @/maxCompletions</b>

	synopsis = Keep a crew of six on the Lunar Base for another year

	completedMessage = Another year on the Moon! Our crews are writing the book on living off-world.

	sortKey = 2019

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 7 // One per entry in experimentList, completes the 3650 days of Operational Lunar Habitation
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 800
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalLunarHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OLH_ContinuousOccupation
	}

	// Each expedition takes Operational Lunar Habitation one year further, on top of the 1115 days of the required contracts.
	// The last one is 345 days, to finish at exactly 3650.
	DATA
	{
		type = List<float>
		experimentList = [0.40548, 0.50548, 0.60548, 0.70548, 0.80548, 0.90548, 1]
	}
	DATA
	{
		type = float
		experimentCompletion = @/experimentList.ElementAt(@/index)
		durationText = Round(3650 * @/experimentList.ElementAt(@/index), 1)
	}
	DATA
	{
		type = int
		index = $OLH_ExtendedStay_Count + 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression

		CONTRACT_COMPLETED_SUCCESS
		{
			OLH_ExtendedStay_Count = $OLH_ExtendedStay_Count + 1
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = StayOnBase
		type = VesselParameterGroup
		title = Keep at least 6 crew aboard the Lunar Base for another year
		vessel = MoonBase
		notes = You can work on other contracts while your crew are working. You are safe to return to Mission Control
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Moon
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = SixCrew
			type = HasCrew
			minCrew = 6
			crewOnly = true
			title = Have at least 6 crewmembers on board
			hideChildren = true
		}
		PARAMETER
		{
			name = OperationalLunarHabitation
			type = RP1CollectScience
			title = Complete at least @/durationText out of 3650 days of Operational Lunar Habitation
			notes = This experiment requires 6 crew including a Scientist, and consumes 750 units of Research Payload every 30 days
			targetBody = Moon
			situation = SrfLanded
			experiment = RP0LunarHabit3
			fractionComplete = @/experimentCompletion
		}
	}
}
