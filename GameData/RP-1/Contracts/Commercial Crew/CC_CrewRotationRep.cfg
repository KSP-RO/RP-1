CONTRACT_TYPE
{
	name = CC_CrewRotationRep
	title = Additional Commercial Crew Rotation Flight
	group = ComCrew
	agent = Federation Aeronautique Internationale

	description = <b>Program: Commercial Crew<br>Type: <color=blue>Optional</color></b><br><br>Send four astronauts to the station, keep them there for six months and return them safely to Earth.<br><br>This is a series of @maxCompletions contracts, of which @ComCrewRotRep have been completed.<br><br>Once more than half of the expected days have elapsed, the reward of this contract will slowly increase over time, but will be reset to 0 after each completion.<br><b>Current reward is at @rewardFactorPercent % of its nominal value. Elapsed/Expected Days: @elapsedDays / 180</b>
	genericDescription = <b>Program: Commercial Crew<br>Type: <color=blue>Optional</color></b><br><br>Send four astronauts to the station, keep them there for six months and return them safely to Earth.<br><br>This is a repeatable series of contracts. Once more than half of the expected days have elapsed, the reward of this contract will slowly increase over time, resetting to 0 after each completion.

	synopsis = Rotate a crew of four commercial astronauts to the station

	completedMessage = Mission success! Another crew has completed their stay aboard the station and returned home safely!

	sortKey = 2703

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 3
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = Round(100 * @rewardFactor, 1)
	failureReputation = 0

	DATA
	{
		type = int
		ComCrewRotRep = $ComCrewRotRep + 0
	}

	DATA
	{
		type = int
		antiGrindCompletion = $CC_CrewRotationRep_Completion == 0 ? (UniversalTime() - 180 * 86400) : $CC_CrewRotationRep_Completion
	}

	DATA
	{
		type = float
		elapsedDays = Round((UniversalTime() - @antiGrindCompletion) / 86400.0)
		rewardFactor = Log(Max(@elapsedDays / 180 * 3 - 0.05, 1), 2) / 1.5607
		rewardFactorPercent = Round(@rewardFactor * 100, 1)
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression

		CONTRACT_OFFERED
		{
			CC_CrewRotationRep_Completion = ($CC_CrewRotationRep_Completion + 0) == 0 ? (UniversalTime() - 180 * 86400) : ($CC_CrewRotationRep_Completion + 0)
		}
		CONTRACT_COMPLETED_SUCCESS
		{
			ComCrewRotRep = $ComCrewRotRep + 1
			CC_CrewRotationRep_Completion = UniversalTime()
		}
	}


	// ************ REQUIREMENTS ************

	// All station contracts spawn and destroy the same "ISS" vessel, so only one may be active at a time
	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = COT_Resupply
		invertRequirement = true
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = COT_ResupplyRep
		invertRequirement = true
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = CC_DemoUncrewed
		invertRequirement = true
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = CC_DemoCrewed
		invertRequirement = true
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = CC_CrewRotation
		invertRequirement = true
	}


	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ComCrew
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = CC_CrewRotation
		minCount = 2
	}

	BEHAVIOUR
	{
		name = SpawnStation
		type = SpawnVessel

		VESSEL
		{
			name = ISS
			craftURL = RP-1/Craft Files/ISS.craft
			vesselType = Station
			owned = false

			ORBIT
			{
				SMA = 6778000
				ECC = 0.0005
				INC = 51.6
				LAN = Random(0, 360)
				LPE = 90
				MNA = 0
				EPH = 0
				REF = 1
			}
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = CommercialCrewFlight
		type = VesselParameterGroup
		title = Commercial Crew Rotation

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}

		PARAMETER
		{
			name = FourCrewCapacity
			type = HasCrewCapacity
			minCapacity = 4
			title = Have space for at least 4 crewmembers on board
			hideChildren = true
			disableOnStateChange = false
		}

		PARAMETER
		{
			name = NoCrew
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed vessel
			hideChildren = true
		}

		PARAMETER
		{
			name = HasPassengers
			type = HasPassengers
			count = 4
			title = Commercial astronauts on board (use generated tourists)
			hideChildren = true
		}

		PARAMETER
		{
			name = HasNonReentryRatedParts
			type = PartValidation
			hideChildren = true
			title = Vessel has no parts with the tag "not rated for reentry"

			NONE
			{
				partModule = ModuleNonReentryRated
			}
		}
		
		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			
			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 0.001
				title = Craft must have Electric Charge after one day
				hideChildren = true
			}
			PARAMETER
			{
				name = DockingPort
				type = PartValidation
				partModule = ModuleDockingNode
				minCount = 1
				title = Have at least 1 docking port
				hideChildren = true
			}
			PARAMETER
			{
				name = Rendezvous
				type = Rendezvous
				vessel = ISS
				distance = 100
				title = Rendezvous with the station.
			}
			PARAMETER
			{
				name = Docking
				type = Docking
				vessel = ISS
				completeInSequence = true
				title = Dock with the station.
			}
			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 180d
				preWaitText = Awaiting docking...
				waitingText = Crew operating...
				completionText = Crew Rotation: successful!
			}
			PARAMETER
			{
				name = ReturnHome
				type = RP1ReturnHome
				title = Return home safely
				hideChildren = true
				completeInSequence = true
			}
		}
	}

	// ************ BEHAVIOURS ************

	BEHAVIOUR
	{
		name = RemoveStation
		type = DestroyVessel
		onSuccess = true
		onFailed = true
		vessel = ISS
	}

	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		title = Spawn Commercial Astronauts
		kerbal = Commercial Astronaut 1
		kerbal = Commercial Astronaut 2
		kerbal = Commercial Astronaut 3
		kerbal = Commercial Astronaut 4
	}
}