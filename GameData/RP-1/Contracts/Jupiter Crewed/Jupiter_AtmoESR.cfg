CONTRACT_TYPE
{
	name = probeJupiter
	title = Jupiter Atmospheric Expedition Sample Return
	group = JupiterSurfaceExp
	agent = Federation Aeronautique Internationale

	description = <b>Program: Jupiter Surface Exploration<br>Type: <color=blue>Optional</color></b><br><br>Send an uncrewed probe into the Jovian atmosphere where it will collect some data and then return it to the Jupiter Expedition Vessel for more analysis.

	synopsis = Send an uncrewed probe into the Jovian atmosphere and then return to dock to the Jupiter Expedition Vessel.

	completedMessage = Congratulations! Our scientists have learned valuable information about the make-up of the atmosphere.

	sortKey = 1908

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Jupiter


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 2500
	failureReputation = 0	

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedJupiterExp
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = vesselGroupLaunch
		type = VesselParameterGroup
		title = Control a Vessel with the required parameters
		notes = The station must include at least 1 Laboratory
		define = JupiterExpeditionMothership
		disableOnStateChange = true
		
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = HasScienceModule
			type = PartValidation
			partModule = Laboratory
			title = Carry a Science Lab Module
			minCount = 1
		}

		PARAMETER
		{
			name = JupiterOrbit
			title = Reach orbit of the Jupiter with a maximum pe of 2,800,000 km and a maximum ap of 2,850,000 km and hold it for at least 7 days
			type = Orbit
			maxPeA = 2800000000  // 1.5x Callisto Periapsis at 1,869,000 km 
			maxApA = 2850000000  // 1.5x Callisto Apoapsis at 1,897,000 km
			targetBody = Jupiter
			disableOnStateChange = true
			completeInSequence = true
		}
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Atmospheric probe Jupiter
	
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = EnterAtmo
			type = ReachState
			situation = FLYING
			disableOnStateChange = true
			maxAltitude = 1400000
			title = Enter Jupiter's atmosphere below 1,400 km
			hideChildren = true
		}
		PARAMETER
		{
			name = Rendezvous
			type = Rendezvous
			vessel = JupiterExpeditionMothership
			distance = 100
			title = Rendezvous with the Jupiter Expedition Vessel.
		}
		PARAMETER
		{
			name = Docking
			type = Docking
			vessel = JupiterExpeditionMothership
			completeInSequence = true
			title = Dock with the Jupiter Expedition Vessel.
		}
	}
}
