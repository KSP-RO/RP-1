CONTRACT_TYPE
{
	name = GOInfraredServicingRepeat
	title = Infrared Space Telescope Coolant Servicing
	// genericTitle = Infrared Space Telescope Coolant Servicing
	group = GreatObservatories
	agent = Federation Aeronautique Internationale

	description = <b>Program: Great Observatories<br>Type: <color=blue>Optional</color></b><br><br>The coolant on another one of our infrared space telescopes is getting rather low. If it drops to zero, the telescope will be forced to deactivate. Design, build, and launch another servicing craft to dock with the observatory and refill the coolant tanks and continue operations. Note: you may want to bring more coolant than you need to mitigate boiloff concerns.

	synopsis = Send a vessel to resupply the liquid helium coolant on the designated infrared space telescope

	completedMessage = Mission Success! The vessel has more than enough coolant for now. Be sure to monitor your telescopes to keep them functional.

	// sortKey = 1507

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 2
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	prestige = Trivial       // 1.0x
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 180
	rewardFunds = 0
	failureReputation = 0 // was @rewardReputation
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = GreatObservatories
	}

 	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
  		contractType = GOFirstInfraredSpaceTelescope
		title = Completed Infrared Space Observatory
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
  		contractType = GOInfraredServicing
		title = Completed Infrared Servicing Mission
	}
 
	// ************ PARAMETERS ************

	PARAMETER
	{
		name = vesselGroupTelescope
		type = VesselParameterGroup
		title = Control an infrared space telescope that is low on coolant
		notes = The telescope must have a docking port, an infrared space telescope experiment, and 50 units or less of liquid helium remaining
		define = ISTtargetVPG
		disableOnStateChange = true

		PARAMETER
		{
			name = DockingPort
			type = PartValidation
			partModule = ModuleDockingNode
			minCount = 1
			title = Have at least 1 docking port
			hideChildren = true
		}

		PARAMETER
		{
			name = HasExperiment
			type = RP1HasExperiment
			experiment = RP0InfraredSpaceTelescope1
		}

		PARAMETER
		{
			name = LowCoolant
			type = HasResource
			resource = LqdHelium
			maxQuantity = 50
			title = Have at most @maxQuantity units of liquid helium coolant remaining
			hideChildren = true
		}
	}

	PARAMETER
	{
		name = ISTServicingMissionRepeat
		type = VesselParameterGroup
		title = Launch a servicing craft to refill the coolant tanks on the target infrared space telescope
		disableOnStateChange = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}

		PARAMETER
		{
			name = AllResources
			type = All
			title = Dock with the target infrared space telescope and bring enough liquid helium coolant to refill it

			PARAMETER
			{
				name = CoolantResupply
				type = HasResource
				title = Bring at least 100 units of liquid helium coolant
				resource = LqdHelium
				minQuantity = 100
				hideChildren = true
			}

			PARAMETER
			{
				name = DockWithTelescope
				type = Docking
				vessel = ISTtargetVPG
				title = Dock the servicing craft with the target infrared space telescope
				hideChildren = true
				disableOnStateChange = true
			}
		}
	}
}
