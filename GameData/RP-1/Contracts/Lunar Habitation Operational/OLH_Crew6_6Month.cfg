CONTRACT_TYPE
{
	name = OLH_Crew6_6Month
	title = Six-month Crewed Lunar Expedition
	group = OperationalLunarHabitation

	description = <b>Program: Operational Lunar Habitation<br>Type: <color=green>Required</color></b><br><br>Send an expedition to our Lunar Base. Keep <b>six</b> crew aboard the Base for six months.<br><br>Each expedition adds 180 days of Operational Lunar Habitation research, which consumes 750 units of Research Payload every 30 days. The Base only needs to hold two months' worth, so plan a resupply mission. This contract does not require a new set of crew to complete.&br;&br;<b>Number of Expeditions Completed: @/index / @/maxCompletions</b>

	synopsis = Keep a crew of six on the Lunar Base for six months

	completedMessage = Congratulations! Another successful Lunar Expedition!

	sortKey = 2001 // Call it a space odyssey

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 4 // One per entry in experimentList
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon


	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 800	
	failureReputation = 0 

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalLunarHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OLH_BaseExpansion
	}

	// Each expedition takes Operational Lunar Habitation 180 days further, on top of the 30 days of OLH_BaseExpansion (3650 days in total)
	DATA
	{
		type = List<float>
		experimentList = [0.05753, 0.10685, 0.15616, 0.20548]
	}
	DATA
	{
		type = float
		experimentCompletion = @/experimentList.ElementAt(@/index)
		durationText = Round(3650 * @/experimentList.ElementAt(@/index), 1)
	}
	DATA
	{
		type = int
		index = $OLH_Crew6_6Month_Count + 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression

		CONTRACT_COMPLETED_SUCCESS
		{
			OLH_Crew6_6Month_Count = $OLH_Crew6_6Month_Count + 1
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = StayOnBase
		type = VesselParameterGroup
		title = Keep at least 6 crew aboard the Lunar Base for 180 days
		vessel = MoonBase
		notes = You can work on other contracts while your crew are working. You are safe to return to Mission Control
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Moon
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = SixCrew
			type = HasCrew
			minCrew = 6
			crewOnly = true
			title = Have at least 6 crewmembers on board
			hideChildren = true
		}
		PARAMETER
		{
			name = researchPayloadCapacity //make sure you can hold at least 60 days of research payload
			type = HasResourceCapacity
			resource = ResearchPayload
			minQuantity = 1500
		}
		PARAMETER
		{
			name = OperationalLunarHabitation
			type = RP1CollectScience
			title = Complete at least @/durationText out of 3650 days of Operational Lunar Habitation
			notes = This experiment requires 6 crew including a Scientist, and consumes 750 units of Research Payload every 30 days
			targetBody = Moon
			situation = SrfLanded
			experiment = RP0LunarHabit3
			fractionComplete = @/experimentCompletion
		}
	}
}
