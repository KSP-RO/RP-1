CONTRACT_TYPE
{
	name = PolarOrbitSunExtended
	title = Extended Polar Solar Mission
	group = SolarExploration
	agent = Federation Aeronautique Internationale

	description = <b>Program: Solar Exploration<br>Type: <color=blue>Optional</color></b><br><br>Now that we have a probe in a Solar Polar orbit, our scientists are asking for a mission extension to get even more data and study how the poles change over a Solar rcycle.<br><br>Real life example: Ulysses, which operated for over 18 years and made three passes over the Sun's poles<br><br>This is a series of @maxCompletions contracts, of which @index have been completed.

	synopsis = Maintain a polar solar orbit for 3 years

	completedMessage = Years of polar observations have given us a picture of how the Sun changes over its activity cycle.

	sortKey = 811

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 3
	maxSimultaneous = 1
	deadline = 0

	targetBody = Sun

	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 300
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = SolarExploration
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = PolarOrbitSun
	}

	DATA
	{
		type = int
		index = $PolarOrbitSunExtended_Count + 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression

		CONTRACT_COMPLETED_SUCCESS
		{
			PolarOrbitSunExtended_Count = $PolarOrbitSunExtended_Count + 1
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Extended Polar Solar Mission

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = ReachOrbit
			type = Orbit
			targetBody = Sun
			title = Maintain a polar orbit around the Sun for 3 years
			minInclination = 70
			maxInclination = 110
			maxEccentricity = 0.65
			disableOnStateChange = true

			PARAMETER
			{
				name = Duration
				type = Duration

				duration = 1095d

				preWaitText = Begin extended polar observations
				waitingText = Observing the solar poles
				completionText = Extended mission complete
			}
		}
		PARAMETER
		{
			name = GenerateEC
			title = Generate surplus Electric Charge
			type = ResourceConsumption
			resource = ElectricCharge
			minRate = -1000000
			maxRate = 0.00001
			completeInSequence = true
		}

		PARAMETER
		{
			name = HasPower
			type = HasResource
			resource = ElectricCharge
			minQuantity = 0.001
			title = Craft must have Electric Charge
			completeInSequence = true
		}
	}
}
