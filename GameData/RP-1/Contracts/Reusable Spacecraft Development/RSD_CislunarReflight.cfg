CONTRACT_TYPE
{
	name = RSD_CislunarReflight
	title = Cislunar Shuttle Reflight
	group = ReusableSpacecraftDev
	agent = Exploration

	description = <b>Program: Reusable Spacecraft Development<br>Type: <color=blue>Optional</color></b><br><br>A cargo ship that comes back is only worth something if it flies again. Prove the turnaround: fly a vessel from low Earth orbit into lunar orbit and back, dock it with a tanker or depot in low Earth orbit to refuel, then fly the same vessel to lunar orbit and back a second time.<br><br><b>Use the tug from the Reusable Orbital Tug contract:</b> a new vessel will not count.
	genericDescription = Fly the same vessel to lunar orbit and back twice, refuelling it in low Earth orbit between the trips.
	synopsis = Fly the same vessel to lunar orbit and back twice, refuelling it in low Earth orbit between the trips.

	completedMessage = The shuttle is back from its second lunar run. Cislunar space now has a ferry that is refuelled, not rebuilt.

	sortKey = 2103

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 350
	failureReputation = 0

	// ************ REQUIREMENTS ************
	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ReusableSpacecraftDev
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = RSD_LunarCargo
		title = Complete the Heavy Lunar Cargo Delivery contract
	}

	// ************ PARAMETERS ************
	// NoStaging only sits in the first leg: it locks on reaching lunar orbit, before the refuel undock.
	// Every group tracks the RSDShip vessel defined by RSD_OrbitalTug.
	PARAMETER
	{
		name = FirstTrip
		type = VesselParameterGroup
		title = First lunar round trip
		vessel = RSDShip
		disableOnStateChange = true

		PARAMETER
		{
			name = FirstOutbound
			type = All
			title = Reach lunar orbit
			disableOnStateChange = true

			PARAMETER
			{
				name = NoStaging
				type = NoStaging
				title = Do not stage
				failContract = false
			}
			PARAMETER
			{
				name = FirstLunarOrbit
				type = ReachState
				targetBody = Moon
				situation = ORBITING
				title = Enter lunar orbit
				hideChildren = true
			}
		}

		PARAMETER
		{
			name = FirstReturn
			type = Orbit
			targetBody = HomeWorld()
			situation = ORBITING
			maxApA = 2000000
			completeInSequence = true
			title = Return to low Earth orbit (apogee below 2,000 km)
			hideChildren = true
		}
	}

	PARAMETER
	{
		name = Refuel
		type = VesselParameterGroup
		title = Refuel in low Earth orbit
		vessel = RSDShip
		completeInSequence = true
		disableOnStateChange = true

		PARAMETER
		{
			name = RefuelOrbit
			type = Orbit
			targetBody = HomeWorld()
			situation = ORBITING
			maxApA = 2000000
			title = Stay in low Earth orbit (apogee below 2,000 km)
			hideChildren = true
		}
		PARAMETER
		{
			name = RefuelDocking
			type = Docking
			title = Dock with a tanker or depot
			hideChildren = true
		}
	}

	PARAMETER
	{
		name = SecondTrip
		type = VesselParameterGroup
		title = Second lunar round trip
		vessel = RSDShip
		completeInSequence = true

		PARAMETER
		{
			name = SecondLunarOrbit
			type = ReachState
			targetBody = Moon
			situation = ORBITING
			disableOnStateChange = true
			title = Enter lunar orbit again
			hideChildren = true
		}

		PARAMETER
		{
			name = SecondReturn
			type = Orbit
			targetBody = HomeWorld()
			situation = ORBITING
			maxApA = 2000000
			completeInSequence = true
			title = Return to low Earth orbit again (apogee below 2,000 km)
			hideChildren = true
		}
	}
}
