CONTRACT_TYPE
{
	name = MH_BaseLanding
	title = Martian Base Landing
	group = MarsHabitation

	description = <b>Program: Operational Mars Habitation<br>Type: <color=green>Required</color></b><br><br>When our astronauts first set foot on Mars, they only stayed for a short while. But now, it is time to change that! Like we have done on the Moon, we will expand our stays on Mars into proper long term habitation. Since Mars is not in our celestial backyard, you'll have to assemble the base ahead of the astronauts, so that they have a home away from home waiting for them. Our first crews only camped on Mars for a few weeks. To live there, they need a proper home waiting for them when they arrive. Land an <b>uncrewed</b> base on Mars with room for at least six crew and a year of Research Payload.<br><br>Every contract in this program will be related to this base, so be mindful of where you land it. Every later contract of this program uses this base, so choose the landing site carefully. 

	synopsis = Land an uncrewed base on Mars

	completedMessage = The base has touched down safely and is ready for its first crew. Mars has its first permanent building!

	sortKey = 2100

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mars

	// ************ REWARDS ************

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 1500
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalMarsHabitation
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = vesselGroupLaunch
		type = VesselParameterGroup
		title = Land an uncrewed Martian Base
		notes = The base must have room for at least 6 crew and 3000 units of Research Payload.
		define = MarsBase
		disableOnStateChange = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new Base
			hideChildren = true
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = HasCapacity
			type = HasCrewCapacity
			minCapacity = 6
			title = Space for at least 6 crew
			hideChildren = true
		}
		PARAMETER
		{
			name = researchPayloadCapacity
			type = HasResourceCapacity
			resource = ResearchPayload
			minQuantity = 4199.9
			title = Room for at least 4200 units of Research Payload
			hideChildren = true
		}
		PARAMETER
		{
			name = LandOnMars
			type = ReachState
			title = Land on Mars
			targetBody = Mars
			situation = LANDED
			hideChildren = true
		}
	}
}
