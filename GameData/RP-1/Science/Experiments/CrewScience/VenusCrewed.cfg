// ============================================================================
// Venus Orbital Photography
// ============================================================================
EXPERIMENT_DEFINITION
{
	id = RP0VenusOrbitalPhotography
	title = Venus Orbital Photography
	baseValue = 40
	scienceCap = 40
	dataScale = 200 
	requireAtmosphere = False
	situationMask = 48
	biomeMask = 0
	description = Crew photograph Venus from orbit with hand-held film and television cameras, documenting the planet's cloud tops, terminator and limb in visible and ultraviolet light.<b>This experiment can be completed once. NOTE: This experiment takes 2 days and can only be completed in orbit around Venus.</b>
	mass = 0.008
	techRequired = scienceLunar
	cost = 0
	tags = matureCapsule
	minCrew = 2
	celestialBodies = Venus

	situations = ORBITING
	RESULTS
	{
		default = The crew's photographs show Venus as a featureless, glowing disc, but ultraviolet frames reveal striking dark banding in the upper cloud deck.
	}
	KERBALISM_EXPERIMENT
	{
		SampleMass = 0
		BodyAllowed = Venus
		IncludeExperiment = 
	}
}
@PART[*]:HAS[#getsVenusOrbiterExperiments[True]]:FOR[RP-0-Kerbalism]
{
	MODULE
	{
		name = Experiment
		experiment_id = RP0VenusOrbitalPhotography
		ec_rate = 0.01
		data_rate = 200 
		@data_rate /= 172800 // 2 days
		requires = CrewMin:2,Sunlight
		resources =
		crew_operate = CrewOnly
		hide_when_unavailable = True
	}
}

