	description = <b>Program: Crewed Saturn Exploration<br>Type: <color=blue>Optional</color></b><br><br>Dione is a fascinating world of stark contrasts, featuring heavily cratered terrain on one hemisphere and dramatic, highly reflective ice cliffs towering hundreds of meters high on the other. Operating on its icy surface offers a vital window into the geologic activity and internal evolution of Saturn mid-sized moons.<br><br>Design and execute a mission to land at least two astronauts on the surface of Dione. Once down, the crew will study the terrain with a field geology suite and analyze the volatiles trapped in the ice.
    synopsis = Land a crew of at least 2 on the surface of Dione, plant a flag and run a field geology suite and volatile analysis.
    completedMessage = Outstanding achievement! Our astronauts have successfully landed on Dione, setting foot among its icy plains and towering chasmata. This mission expands our operational expertise across the Saturnian system.
