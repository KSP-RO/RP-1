CONTRACT_TYPE
{
	name = OLH_CargoDelivery
	title = Uncrewed Lunar Cargo Delivery
	group = OperationalLunarHabitation

	description = <b>Program: Operational Lunar Habitation<br>Type: <color=green>Required</color></b><br><br>Our Lunar astronauts have requested a shipment of supplies from Earth, consisting mostly of snacks or equipment required for conducting certain experiments. Land an <b>uncrewed</b> cargo lander within 1 km of the Lunar Base, carrying at least a month of Research Payload or a month of Food for six crew.

	synopsis = Land an uncrewed cargo lander next to the Lunar Base

	completedMessage = The cargo lander has touched down safely next to the Base. The astronauts eagerly await their snacks!

	sortKey = 2011

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 4
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon


	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 600
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalLunarHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OLH_BaseExpansion
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = CargoLanding
		type = VesselParameterGroup
		title = Land an uncrewed cargo lander next to the Lunar Base
		disableOnStateChange = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new cargo lander
			hideChildren = true
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = HasCargo
			type = Any
			title = Carry at least 750 units of Research Payload or 1050 units of Food

			PARAMETER
			{
				name = HasResearchPayload
				type = HasResource
				resource = ResearchPayload
				minQuantity = 750
				title = At least 750 units of Research Payload
				hideChildren = true
			}
			PARAMETER
			{
				name = HasFood
				type = HasResource
				resource = Food
				minQuantity = 1050
				title = At least 1050 units of Food
				hideChildren = true
			}
		}
		PARAMETER
		{
			name = LandOnMoon
			type = ReachState
			targetBody = Moon
			situation = LANDED
			title = Land on the Moon
			hideChildren = true
		}
		PARAMETER
		{
			name = NearBase
			type = VisitWaypoint
			index = 0
			distance = 1000.0
			title = Land within 1 km of the Lunar Base
			showMessages = true
			hideChildren = true
		}
	}

	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator

		WAYPOINT
		{
			name = Lunar Base
			hidden = False
			targetBody = Moon
			icon = marker
			altitude = 0.0
			latitude = Vessel(MoonBase).Location().Latitude()
			longitude = Vessel(MoonBase).Location().Longitude()
		}
	}
}
