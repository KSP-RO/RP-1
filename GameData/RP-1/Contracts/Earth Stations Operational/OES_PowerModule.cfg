CONTRACT_TYPE
{
	name = OES_PowerModule
	title = Station Module: Power
	group = OperationalEarthStations
	agent = Stations

	description = <b>Program: Operational Earth Stations<br>Type: <color=green>Required</color></b><br><br>The more we add to our space station, the more power it will consume. To avoid having to add solar panels to every module, launch a module that generates at least 4 kW on its own and dock it to the station.<br><br>This contract is based on the Spektr module, whose four large solar arrays boosted the power supply of the ageing Mir.

	synopsis = Dock a power module to the station

	completedMessage = Congratulations! The lights on the station are burning brighter than ever.

	sortKey = 1604

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 600
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalEarthStations
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OES_CoreModule
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = vesselGroupModule
		type = VesselParameterGroup
		title = Launch a power module and dock it to the station
		notes = The module must generate at least 4 kW in sunlight, and include 1 docking port
		disableOnStateChange = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new module
			hideChildren = true
		}
		PARAMETER
		{
			name = GenerateEC
			title = Generate at least 4 kW (4 Electric Charge per second)
			type = ResourceConsumption
			resource = ElectricCharge
			minRate = -1000000
			maxRate = -4 // Production counts as negative consumption
		}
		PARAMETER
		{
			name = DockingPort
			type = PartValidation
			partModule = ModuleDockingNode
			minCount = 1
			title = Have at least 1 docking port
			hideChildren = true
		}
		PARAMETER
		{
			name = Docking
			type = Docking
			vessel = OperationalStation
			completeInSequence = true
			title = Dock with the station
		}
	}
	PARAMETER
	{
		name = vesselGroupStation
		type = VesselParameterGroup
		title = Keep the station in orbit with a power surplus
		vessel = OperationalStation
		completeInSequence = true

		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 300000
			maxApA = 500000
			targetBody = HomeWorld()
			title = Keep the station in a stable orbit with a perigee greater than 300 km and an apogee less than 500 km
		}
		PARAMETER
		{
			name = GenerateEC
			title = Generate surplus Electric Charge
			type = ResourceConsumption
			resource = ElectricCharge
			minRate = -1000000
			maxRate = 0.00001
		}
	}
}
