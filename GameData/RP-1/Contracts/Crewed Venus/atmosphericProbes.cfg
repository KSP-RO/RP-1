CONTRACT_TYPE
{
    name = atmosphericProbes
    group = CrewedVenusExp
    agent = Exploration
    title = Deploy an Atmospheric Probe to Venus
    description = As part of the ongoing crewed Venus program, deploy an instrumented probe into the Venusian atmosphere to gather data on pressure, temperature, and composition at various altitudes.
    synopsis = Send a probe to sample Venus atmosphere.
    completedMessage = successful atmospheric probe deployment!!! Thos data will help us better understand Venus and its composition.
    
    cancellable = true
    declinable = true
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 6
    maxSimultaneous = 1
    targetBody = Venus

    // ************ REWARDS ************
    prestige = Significant
    advanceFunds = 0
    rewardScience = 0
    rewardFunds = 0
    failureFunds = 0
    rewardReputation = 200
    failureReputation = 0

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract
        contractType = crewedVenusFlyby
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = CarrierCraft
        type = VesselParameterGroup
        title = Carrier Spacecraft
        
        PARAMETER
        {
            name = CarrierHasCrew
            type = HasCrew
            minCrew = 1
            title = Carrier spacecraft must be crewed
        }
    }

    PARAMETER
    {
        name = ProbeDeployed
        type = VesselParameterGroup
        title = Deploy an uncrewed atmospheric probe
        define = AtmosphericProbe

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            title = Must be a newly released probe
        }

        PARAMETER
        {
            name = ProbeUncrewed
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Probe must be uncrewed
        }

        PARAMETER
        {
            name = ReachAtmosphere
            type = ReachState
            targetBody = Venus
            situation = ATMOSPHERE
            minAltitude = 0
            maxAltitude = 90000
            title = Enter the Venusian atmosphere with the probe
        }

        PARAMETER
        {
            name = HasPower
            type = HasResource
            resource = ElectricCharge
            minQuantity = 0.001
            title = Probe must have Electric Charge
            disableOnStateChange = false
        }

        PARAMETER
        {
            name = CollectScience
            type = CollectScience
            targetBody = Venus
            situation = FlyingHigh
            recoveryMethod = RecoverOrTransmit
            title = Collect science from around Venus and transmit it to the KSC
            hideChildren = true
        }
    }
}