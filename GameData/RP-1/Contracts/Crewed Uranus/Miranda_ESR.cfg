CONTRACT_TYPE
{
	name = Miranda_ESR
	title = Miranda Expedition Sample Return
	group = CrewedUranusExp
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Uranus Exploration<br>Type: <color=blue>Optional</color></b><br><br>Design and successfully launch an uncrewed probe to land on Miranda, gather surface samples from its jumbled, grooved coronae and process them in a laboratory before transmitting the data home to Earth.

	synopsis = Send an uncrewed craft to land on Miranda and collect and transmit the surface samples to Earth. This can be performed as a standalone mission, or built into the crewed architecture, utilizing a sample recovery in orbit. 

	completedMessage = Congratulations! Our scientists can learn a lot more about the violent history of Miranda by studying the physical samples that you have returned.

	sortKey = 2813

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Miranda

	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 3750
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedUranusExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedUranusOrbit
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = vesselGroupLaunch
		type = VesselParameterGroup
		title = Control a Vessel with the required parameters
		notes = The station must include at least 1 Laboratory
		define = UranusExpeditionMothership
		disableOnStateChange = true
		
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = HasScienceModule
			type = PartValidation
			partModule = Laboratory
			title = Carry a Science Lab Module
			minCount = 1
		}

		PARAMETER
		{
			name = UranusOrbit
			title = Reach orbit of Uranus with a maximum pe of 194,000 km and a maximum ap of 194,500 km
			type = Orbit
			maxPeA = 194000000  // 1.5x Miranda Periapsis at 129,220 km
			maxApA = 194500000  // 1.5x Miranda Apoapsis at 129,560 km
			targetBody = Uranus
			disableOnStateChange = true
			completeInSequence = true
		}
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Miranda Robotic Sample Return
	
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = LandOnMiranda
			type = ReachState
			targetBody = Miranda
			situation = LANDED
			disableOnStateChange = true
			title = Land on Miranda
			hideChildren = true
		}
		PARAMETER
		{
			name = HasSurfaceSample
			type = RP1HasExperiment
			experiment = surfaceSample
		}
		PARAMETER
		{
			name = Rendezvous
			type = Rendezvous
			vessel = UranusExpeditionMothership
			distance = 100
			title = Rendezvous with the Uranus Expedition Vessel.
		}
		PARAMETER
		{
			name = Docking
			type = Docking
			vessel = UranusExpeditionMothership
			completeInSequence = true
			title = Dock with the Uranus Expedition Vessel.
		}

		PARAMETER
		{
			name = surfaceSample
			type = CollectScience
			targetBody = Miranda
			experiment = surfaceSample
			recoveryMethod = Transmit
			title = Transmit the surface sample data to Earth
			hideChildren = true
		}
	}
}
