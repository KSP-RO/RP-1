CONTRACT_TYPE
{
	name = InclinedInnerOrbitSun
	title = Inclined Inner Solar Orbiter
	group = SolarExploration
	agent = Federation Aeronautique Internationale

	description = <b>Program: Solar Exploration<br>Type: <color=blue>Optional</color></b><br><br>In addition to our other Solar probes, it would be fruitful to have a probe fly past the Sun inclined relative to its equator, while being quite close. This would allow higher resolution images of the Solar Polar regions.<br><br>Real life example: Solar Orbiter // I couldn't resist

	synopsis = Enter an inclined solar orbit with a close perihelion

	completedMessage = Our orbiter is returning close-range images of the Sun's high latitudes!

	sortKey = 809

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Sun

	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 350
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = SolarExploration
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Inclined Inner Solar Orbit

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = ReachOrbit
			type = Orbit
			targetBody = Sun
			title = Orbit the Sun with a perihelion below 45 Gm and an inclination of at least 20°
			maxPeA = 45000000000
			minInclination = 20
			maxInclination = 160 // Solar Orbiter started at 24° inclined and then moved to 33° in its extended mission
			disableOnStateChange = true

			PARAMETER
			{
				name = Duration
				type = Duration

				duration = 2m

				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
		PARAMETER
		{
			name = GenerateEC
			title = Generate surplus Electric Charge
			type = ResourceConsumption
			resource = ElectricCharge
			minRate = -1000000
			maxRate = 0.00001
			completeInSequence = true
		}

		PARAMETER
		{
			name = HasPower
			type = HasResource
			resource = ElectricCharge
			minQuantity = 0.001
			title = Craft must have Electric Charge
			completeInSequence = true
		}
	}
}
