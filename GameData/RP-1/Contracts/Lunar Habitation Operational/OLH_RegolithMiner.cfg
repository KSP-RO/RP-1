CONTRACT_TYPE
{
	name = OLH_RegolithMiner
	title = Lunar Regolith Mining
	group = OperationalLunarHabitation

	description = <b>Program: Operational Lunar Habitation<br>Type: <color=green>Required</color></b><br><br>The first step towards permanent habitation on the Moon will be to make use of what's right in front of us - the Lunar Regolith! Add a <b>Regolith Harvester</b> to our Lunar Base and fill its hopper with regolith.<br><br>The drill must be part of the Base vessel (docked or built onto it), so that the regolith can be fed to processing equipment later.

	synopsis = Mine regolith at the Lunar Base

	completedMessage = Our Lunar Base is now mining regolith. Next, we need to put it to use.

	sortKey = 2004

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon


	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 600
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalLunarHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OLH_BaseExpansion
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = LunarBaseMiner
		type = VesselParameterGroup
		title = Mine regolith at the Lunar Base
		vessel = MoonBase
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Moon
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = HasDrill
			type = Any
			title = Have a Regolith Harvester on the Base
			hideChildren = true
			PARAMETER
			{
				name = HasSmallDrill
				type = PartValidation
				part = kerbalism-drill
				minCount = 1
				hideChildren = true
			}
			PARAMETER
			{
				name = HasLargeDrill
				type = PartValidation
				part = kerbalism-large-drill
				minCount = 1
				hideChildren = true
			}
		}
		PARAMETER
		{
			name = HasRegolith
			type = HasResource
			resource = Regolith
			minQuantity = 4.99 // a full kerbalism-drill hopper
			title = Have at least 5 units of Regolith on the Base
			hideChildren = true
		}
	}
}
