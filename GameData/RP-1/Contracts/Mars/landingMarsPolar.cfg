CONTRACT_TYPE
{
    name = landingMarsPolar
    title = First Polar Mars Landing (Uncrewed)
    group = AdvancedMartianSurfaceExploration

    description = <b>Program: Advanced Martian Surface Exploration<br>Type: <color=green>Required</color></b><br><br>Areologists have convinced us: we must send a lander to the Martian Poles and determine the composition there. Some of them have even suggested that covering the Polar Caps with black ash or out-right detonating a nuclear weapon might be beneficial for a terraforming process - so if future colonization efforts intend on terraforming, data from this lander will be incredibly important!

    genericDescription = Achieve a soft landing at a Martian pole and transmit science.

    synopsis = Achieve a soft landing at a Martian pole and transmit science

    completedMessage = Mission Success! You have safely landed at the Martian pole and returned valuable science data from the surface. We now have a better understanding of the polar caps.

    sortKey = 2102

    cancellable = true
    declinable = true
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 1
    maxSimultaneous = 1
    targetBody = Mars

    // ************ REWARDS ************

    prestige = Significant
    advanceFunds = 0
    rewardScience = 0
    rewardFunds = 0
    failureFunds = 0
    rewardReputation = 250
    failureReputation = 0

    // ************ REQUIREMENTS ************

    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = AdvMarsSurf
    }

    REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract
        contractType = landingMars
        title = Land a probe on Mars
    }


    // ************ PARAMETERS ************

    PARAMETER
    {
        name = VesselGroup
        type = VesselParameterGroup
        title = Polar Mars lander

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            title = Launch a new vessel
            hideChildren = true
        }
        PARAMETER
        {
            name = Crewmembers
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Uncrewed
            hideChildren = true
        }
        PARAMETER
        {
            name = Any
            type = Any
            title = Land within 10° of either Martian Pole
            
            PARAMETER
            {
                name = VisitWaypointNorth
                type = VisitWaypoint
                index = 0
                
                // Takes distance in km, restricts it to within 10° from the North pole
                horizontalDistance = @/targetBody.Radius() / 1000 * 3.1416 / 180 * 10
                showMessages = true
                disableOnStateChange = false
                title = North Pole
                hideChildren = true
            }
            PARAMETER
            {
                name = VisitWaypointSouth
                type = VisitWaypoint
                index = 1
                
                // Takes distance in km, restricts it to within 10° from the South pole
                horizontalDistance = @/targetBody.Radius() / 1000 * 3.1416 / 180 * 10
                showMessages = true
                disableOnStateChange = false
                title = South Pole
                hideChildren = true
            }
        }
        PARAMETER
        {
            name = LandOnMars
            type = ReachState
            targetBody = Mars
            situation = LANDED
            disableOnStateChange = true
            completeInSequence = true
            title = Land on Mars
            hideChildren = true
        }
        PARAMETER
        {
            name = CollectScience
            type = CollectScience
            targetBody = Mars
            situation = SrfLanded
            recoveryMethod = Transmit
            title = Transmit science from the surface of Mars
            hideChildren = true
        }
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator
        
        WAYPOINT
        {
            name = Mars North Pole
            icon = marker
            altitude = 0
            latitude = 90
            longitude = 0
        }
        WAYPOINT
        {
            name = Mars South Pole
            icon = marker
            altitude = 0
            latitude = -90
            longitude = 0
        }
    }
}