CONTRACT_TYPE
{
	name = CC_DemoUncrewed
	title = Commercial Crew Uncrewed Test Flight
	group = ComCrew
	agent = Federation Aeronautique Internationale

	description = <b>Program: Commercial Crew<br>Type: <color=green>Required</color></b><br><br>Only two nations have placed humans into orbit around Earth: the Soviet Union and the United States. It is time for us to match their capability as a private company, offering a better (and cheaper) service! First, we must perform this uncrewed test flight to demonstrate the readiness level of our system.

	synopsis = Perform an uncrewed test flight

	completedMessage = Mission success! Nothing stands in the way of a crewed test flight!

	sortKey = 2700

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 180
	failureReputation = 0


	BEHAVIOUR
	{
		name = SpawnStation
		type = SpawnVessel

		VESSEL
		{
			name = ISS
			craftURL = RP-1/Craft Files/ISS.craft
			vesselType = Station
			owned = false

			ORBIT
			{
				SMA = 6778000
				ECC = 0.0005
				INC = 51.6
				LAN = Random(0, 360)
				LPE = 90
				MNA = 0
				EPH = 0
				REF = 1
			}
		}
	}

	// ************ REQUIREMENTS ************

	// All station contracts spawn and destroy the same "ISS" vessel, so only one may be active at a time
	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = COT_Resupply
		invertRequirement = true
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = COT_ResupplyRep
		invertRequirement = true
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = CC_DemoCrewed
		invertRequirement = true
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = CC_CrewRotation
		invertRequirement = true
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = CC_CrewRotationRep
		invertRequirement = true
	}


	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ComCrew
	}

	PARAMETER
	{
		name = UncrewedCommercialDemo
		type = VesselParameterGroup
		title = Uncrewed Test Flight

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}

		PARAMETER
		{
			name = HasNonReentryRatedParts
			type = PartValidation
			hideChildren = true
			title = Vessel has no parts with the tag "not rated for reentry"

			NONE
			{
				partModule = ModuleNonReentryRated
			}
		}
		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 0.001
				title = Craft must have Electric Charge after one day
				hideChildren = true
			}
			PARAMETER
			{
				name = FourCrewCapacity
				type = HasCrewCapacity
				minCapacity = 4
				title = Have space for at least 4 crewmembers on board
				hideChildren = true
			}
			PARAMETER
			{
				name = DockingPort
				type = PartValidation
				partModule = ModuleDockingNode
				minCount = 1
				title = Have at least 1 docking port
				hideChildren = true
			}
			PARAMETER
			{
				name = Rendezvous
				type = Rendezvous
				vessel = ISS
				distance = 100
				disableOnStateChange = true
				title = Rendezvous with the station.
			}
			PARAMETER
			{
				name = Docking
				type = Docking
				vessel = ISS
				disableOnStateChange = true
				title = Dock with the station.
			}
			PARAMETER
			{
				name = ReturnHome
				type = RP1ReturnHome
				title = Return home safely
				hideChildren = true
				completeInSequence = true
			}
		}
	}

	BEHAVIOUR
	{
		name = RemoveStation
		type = DestroyVessel
		onSuccess = true
		onFailed = true
		vessel = ISS
	}
}
