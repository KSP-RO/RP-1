CONTRACT_TYPE
{
	name = OES_CoreModule
	title = Modular Station Core
	group = OperationalEarthStations
	agent = Stations

	description = <b>Program: Operational Earth Stations<br>Type: <color=green>Required</color></b><br><br>Our first stations were launched in one piece, but now we can build far more capable stations by launching them as multiple modules. Launch the core of a new modular space station into Earth orbit, with enough docking ports for new modules and visiting spacecraft to dock at the same time, then crew it for 30 days with at least three crew.<br><br><color=red>Author's Note: All other contracts in this program will make use of this station, so plan ahead!</color>

	synopsis = Launch the core module of a modular space station and crew it for 30 days

	completedMessage = Congratulations! The core of our new station is in orbit, and it is ready to grow.

	sortKey = 1600

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 800
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalEarthStations
	}
	REQUIREMENT
	{
		name = ModularStationsResearched
		type = TechResearched
		tech = modularSpaceStations
		title = Must have researched Modular Space Stations
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = vesselGroupLaunch
		type = VesselParameterGroup
		title = Put the core of your modular space station in orbit
		notes = The core must include at least 3 docking ports, room for 3 crew and 30 days of Research Payload and must generate its own power
		define = OperationalStation
		disableOnStateChange = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new station core
			hideChildren = true
		}
		PARAMETER
		{
			name = HasCapacity
			type = HasCrewCapacity
			minCapacity = 3
			title = Space for at least 3 crew
			hideChildren = true
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = DockingPorts
			type = PartValidation
			partModule = ModuleDockingNode
			minCount = 3
			title = Have at least 3 docking ports
			hideChildren = true
		}
		PARAMETER
		{
			name = researchPayloadCapacity //make sure you can hold at least 30 days of research payload
			type = HasResourceCapacity
			resource = ResearchPayload
			minQuantity = 750
		}
		PARAMETER
		{
			name = GenerateEC
			title = Generate surplus Electric Charge
			type = ResourceConsumption
			resource = ElectricCharge
			minRate = -1000000
			maxRate = 0.00001
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 300000
			maxApA = 500000
			targetBody = HomeWorld()
			title = Reach orbit with a perigee greater than 300 km and an apogee less than 500 km
			hideChildren = true
		}
	}
	PARAMETER
	{
		name = stayOnStation
		type = VesselParameterGroup
		title = Keep at least 3 crew aboard the station for 30 days
		vessel = OperationalStation
		notes = You can work on other contracts while your crew are working. You are safe to return to Mission Control
		completeInSequence = true
		disableOnStateChange = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 3
			crewOnly = true
			title = Have at least 3 crewmembers on board
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 300000
			maxApA = 500000
			targetBody = HomeWorld()
			disableOnStateChange = false
			title = Remain in a stable orbit
		}
		PARAMETER
		{
			name = PermanentSpaceHabitation
			type = RP1CollectScience
			title = Complete 30 out of 3650 days of Permanent Space Habitation
			notes = This experiment requires 3 crew and consumes 750 units of Research Payload every 30 days
			targetBody = HomeWorld()
			situation = InSpaceLow
			experiment = RP0longDurationHabit3
			fractionComplete = 0.00822 //30d of 3650d
		}
	}
}
