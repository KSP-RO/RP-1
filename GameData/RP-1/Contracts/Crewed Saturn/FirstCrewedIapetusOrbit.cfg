CONTRACT_TYPE
{
	name = FirstCrewedIapetusOrbit
	title = First Crewed Saturn Orbit
	group = CrewedMarsExp
	agent = Flag Planting

	description = <b>Program: Crewed Iapetus Exploration<br>Type: <color=green>Required</color></b><br><br>Design and successfully launch a craft that can carry at least four crew into orbit around Iapetus.

	synopsis = Fly the first Crewed Iapetus Orbit mission

	completedMessage = Congratulations on acheiving the first humans to orbit around Iapetus!

	sortKey = 2522

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Iapetus


	prestige = Significant      
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 6000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedSaturnExp
	}


	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = First crewed orbit of @targetBody

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = SaturnOrbit
			title = Reach orbit of Iapetus with a maximum pe of 400 km and a maximum ap of 600 km and hold it for at least 20 days
			type = Orbit
			maxPeA = 400000  // relatively circular
			maxApA = 600000  // relatively circular
			targetBody = Saturn
			disableOnStateChange = true
			completeInSequence = true

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 20d
				preWaitText = Reach specified orbit
				waitingText = Orbiting...
				completionText = Orbits are complete 
			}
		}
	}

}
