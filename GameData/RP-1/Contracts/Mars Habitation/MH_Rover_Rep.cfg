	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalMarsHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = MH_Rover0.13699
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = RoverExpedition
