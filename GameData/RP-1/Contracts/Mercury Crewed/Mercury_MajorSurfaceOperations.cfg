CONTRACT_TYPE
{
	name = Mercury_MajorSurfaceOperations
	title = Mercury Major Surface Operations
	group = CrewedMercuryExp
	agent = Flag Planting

	description = <b>Program: Crewed Mercury Exploration<br>Type: <color=blue>Optional</color></b><br><br>Land a crewed expeditionary vehicle at three major landmarks on Mercury: the young, brightly rayed crater Hokusai, the volcanic plains inside the Rachmaninoff peak-ring basin, and the explosive volcanic vents of Praxiteles crater. Remain on site for 2 days at each and collect a surface sample. A fourth, more demanding landmark offers a bonus reward for a 4 day stay and a deep surface sample: Prokofiev crater near the north pole, whose permanently shadowed floor hides water ice.

	synopsis = Land a crewed expeditionary rover or a hop-capable lander within 1 km of each of the 3 primary landmarks on Mercury, remain on site for 2 days and collect a surface sample at each. A fourth, harder bonus landmark (500 m tolerance, 4 day stay, deep surface sample) earns an additional reputation reward.

	completedMessage = Congratulations! The surface survey of Mercury has given our scientists a vastly better understanding of its impact history, its volcanic past and the ice hidden at its poles.

	sortKey = 2038

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mercury

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 2000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedMercuryExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = firstCrewedMercurylanding
	}

	// ************ WAYPOINTS ************
	// Coordinates are from the IAU gazetteer (via the Wikipedia crater infoboxes, given there as
	// 0-360 West) converted to KSP convention (+East, -180 to 180).

	BEHAVIOUR
	{
		name = LandmarkWaypoints
		type = WaypointGenerator
		targetBody = Mercury

		WAYPOINT
		{
			name = Hokusai Crater
			icon = marker
			latitude = 58.3
			longitude = 17.7
			altitude = 0
			parameter = Site1
		}

		WAYPOINT
		{
			name = Rachmaninoff Basin
			icon = marker
			latitude = 27.66
			longitude = 57.37
			altitude = 0
			parameter = Site2
		}

		WAYPOINT
		{
			name = Praxiteles Crater
			icon = marker
			latitude = 27.11
			longitude = -60.28
			altitude = 0
			parameter = Site3
		}

		WAYPOINT
		{
			name = Prokofiev Crater
			icon = marker
			latitude = 86.0
			longitude = 63.7
			altitude = 0
			parameter = Site4
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = SurfaceExpedition
		type = VesselParameterGroup
		title = Control a vessel with the required parameters
		notes = Use an expeditionary rover or a lander capable of hopping between sites. The same vessel must visit all three primary landmarks. The bonus landmark is optional.
		define = MercurySurfaceExpeditionVessel
		disableOnStateChange = false

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 2
			crewOnly = true
			title = Have at least 2 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = Site1
			type = Sequence
			title = Landmark 1: Hokusai Crater

			PARAMETER
			{
				name = LandedNear1
				type = VisitWaypoint
				index = 0
				horizontalDistance = 1000
				title = Be within 1 km of Hokusai Crater
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed1
				type = ReachState
				targetBody = Mercury
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay1
				type = Duration
				duration = 2d
				preWaitText = Remain at Hokusai Crater for 2 days
				waitingText = Surveying Hokusai Crater
				completionText = Survey of Hokusai Crater complete
			}
			PARAMETER
			{
				name = Sample1
				type = RP1HasExperiment
				experiment = surfaceSample2
				title = Collect a surface sample at Hokusai Crater
			}
		}

		PARAMETER
		{
			name = Site2
			type = Sequence
			title = Landmark 2: Rachmaninoff Basin

			PARAMETER
			{
				name = LandedNear2
				type = VisitWaypoint
				index = 1
				horizontalDistance = 1000
				title = Be within 1 km of Rachmaninoff Basin
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed2
				type = ReachState
				targetBody = Mercury
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay2
				type = Duration
				duration = 2d
				preWaitText = Remain at Rachmaninoff Basin for 2 days
				waitingText = Surveying Rachmaninoff Basin
				completionText = Survey of Rachmaninoff Basin complete
			}
			PARAMETER
			{
				name = Sample2
				type = RP1HasExperiment
				experiment = surfaceSample2
				title = Collect a surface sample at Rachmaninoff Basin
			}
		}

		PARAMETER
		{
			name = Site3
			type = Sequence
			title = Landmark 3: Praxiteles Crater

			PARAMETER
			{
				name = LandedNear3
				type = VisitWaypoint
				index = 2
				horizontalDistance = 1000
				title = Be within 1 km of Praxiteles Crater
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed3
				type = ReachState
				targetBody = Mercury
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay3
				type = Duration
				duration = 2d
				preWaitText = Remain at Praxiteles Crater for 2 days
				waitingText = Surveying Praxiteles Crater
				completionText = Survey of Praxiteles Crater complete
			}
			PARAMETER
			{
				name = Sample3
				type = RP1HasExperiment
				experiment = surfaceSample2
				title = Collect a surface sample at Praxiteles Crater
			}
		}

		PARAMETER
		{
			name = Site4
			type = Sequence
			optional = true
			rewardReputation = 1500
			title = Bonus Landmark 4: Prokofiev Crater (optional)

			PARAMETER
			{
				name = LandedNear4
				type = VisitWaypoint
				index = 3
				horizontalDistance = 500
				title = Land within 500 m of Prokofiev Crater
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed4
				type = ReachState
				targetBody = Mercury
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay4
				type = Duration
				duration = 4d
				preWaitText = Remain at Prokofiev Crater for 4 days
				waitingText = Surveying Prokofiev Crater
				completionText = Survey of Prokofiev Crater complete
			}
			PARAMETER
			{
				name = Sample4
				type = RP1HasExperiment
				experiment = surfaceSample3
				title = Collect a deep surface sample at Prokofiev Crater
			}
		}
	}
}
