CONTRACT_TYPE
{
	name = OLH_LunarLOX
	title = Lunar Liquid Oxygen
	group = OperationalLunarHabitation

	description = <b>Program: Operational Lunar Habitation<br>Type: <color=blue>Optional</color></b><br><br>The majority of the mass on LH2/LOX rockets is for the oxygen and our Base already produces oxygen. We can reduce the required mass that has to be launched from Earth if we can produce the LOX on the Moon!

	synopsis = Produce liquid oxygen at the Lunar Base

	completedMessage = The first liquid oxygen made on the Moon is in the tanks. Soon our landers could refuel at the Base!

	sortKey = 2012

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 600
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalLunarHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OLH_RegolithProcessor
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = LunarLOX
		type = VesselParameterGroup
		title = Liquefy oxygen from regolith at the Lunar Base for 30 days
		vessel = MoonBase
		notes = You can work on other contracts while the Base is working. You are safe to return to Mission Control
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Moon
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = HasMRP
			type = HasResource
			resource = Resource("_MRP")
			minQuantity = 0.99
			title = Run Molten Regolith Pyrolysis
			hideChildren = true
		}
		PARAMETER
		{
			name = HasRegolith
			type = HasResource
			resource = Regolith
			minQuantity = 0.01
			title = Keep the pyrolysis fed with Regolith
			hideChildren = true
		}
		PARAMETER
		{
			name = HasLiquefier
			type = HasResource
			resource = Resource("_OXConverter")
			minQuantity = 0.99
			title = Run a GOX to LOX Converter
			hideChildren = true
		}
		PARAMETER
		{
			name = HasLOXTanks
			type = HasResourceCapacity
			resource = LqdOxygen
			minQuantity = 150
			title = Have tanks for at least 150 units of LqdOxygen
			hideChildren = true
		}
		PARAMETER
		{
			name = Duration
			type = Duration
			duration = 30d
			preWaitText = Start up oxygen liquefaction
			waitingText = Liquefying lunar oxygen
			completionText = 30 days of liquid oxygen production completed
		}
	}
}
