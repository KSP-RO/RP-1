CONTRACT_TYPE
{
	name = FirstCrewedUranusOrbit
	title = First Crewed Uranus Orbit
	group = CrewedUranusExp
	agent = Flag Planting

	description = <b>Program: Crewed Uranus Exploration<br>Type: <color=green>Required</color></b><br><br>The ice giant Uranus, tipped almost fully on its side and shrouded in a frigid methane atmosphere, represents one of the most extreme destinations in the outer solar system. Reaching this distant, tilted world will demand a voyage of years through the outer solar system, testing our life support, propulsion, and navigation systems far beyond anything attempted before.<br><br>Design and launch a crewed deep-space vehicle capable of carrying at least four astronauts into orbit around Uranus for at least 21 days and return them home. On the way, the crew will carry out deep space navigation trials. At Uranus they will observe the planet with their own eyes and survey its moons.
	synopsis = Send a crew of at least 4 into orbit of Uranus for at least 21 days. Perform deep space navigation trials during the cruise, carry out orbital observations and survey the moons, then return home safely.
	completedMessage = A historic triumph! Human beings have entered orbit around Uranus, the sideways-spinning ice giant, gazing upon its pale blue-green atmosphere and delicate rings. The successful execution of this voyage opens a brand-new chapter in deep-space exploration.
	sortKey = 2807

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Uranus

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 9000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedUranusExp
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = First crewed orbit of Uranus

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = UranusOrbit
			type = ReachState
			targetBody = Uranus
			situation = ORBITING
			title = Reach orbit of Uranus and hold it for at least 21 days

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 21d
				preWaitText = Reach specified orbit
				waitingText = Orbiting...
				completionText = Uranus orbit reached!
			}
		}

		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return Home Safely
			hideChildren = true
			completeInSequence = true
		}
	}

	PARAMETER
	{
		name = DeepSpaceNavigation
		type = RP1CollectScience
		targetBody = Sun
		experiment = RP0DeepSpaceNavigation
		situation = InSpaceHigh
		recoveryMethod = RecoverOrTransmit
		title = Deep Space Navigation Trials during the interplanetary cruise
		hideChildren = true
	}

	PARAMETER
	{
		name = EyeObservation
		type = RP1CollectScience
		targetBody = Uranus
		experiment = RP0PlanetaryEyeObservation
		location = Space
		recoveryMethod = RecoverOrTransmit
		title = Human Eye Orbital Observation of Uranus
		hideChildren = true
	}

	PARAMETER
	{
		name = MoonsObservation
		type = RP1CollectScience
		targetBody = Uranus
		experiment = RP0PlanetaryMoonsObservation
		location = Space
		recoveryMethod = RecoverOrTransmit
		title = Planetary Moons Observation of Uranus (21 days)
		hideChildren = true
	}
}
