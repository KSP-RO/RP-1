CONTRACT_TYPE
{
    name = venusStation
    title = Venus Orbital Research Station 
    group = CrewedVenusExp
    agent = Exploration

    description = <b>Program: Crewed Venus Exploration  <br>Type: <color=blue>Optional</color></b><br><br>Launch a new crewed station into an orbit of Venus between 300 and 1,500 km and keep it there for an orbital stay of 584 days. The station must have:<br>- At least 4 crew aboard<br>- At least 2 docking ports<br>- A science lab<br>- A communications antenna<br>- Solar power generation<br><br>During the stay, the crew must run the Planetary Weather Monitoring and Planetary Atmospheric Spectroscopy experiments. If the station leaves orbit or drops below 4 crew, the stay timer resets.<br><br>Completing this contract unlocks Venus Station: Extended Research I, which continues research aboard the same station.
    synopsis = Build a station in Venus orbit and keep it crewed for a 584 day orbital stay.
    completedMessage = Congratulations! The Venus station has completed its first orbital stay.

    sortKey = 2503

    cancellable = true
    declinable = true
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0

    targetBody = Venus

    // ************ REWARDS ************
    prestige = Trivial 
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 100
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedVenusExp    
    }

    REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract
        contractType = FirstCrewedVenusOrbit
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = VenusStation
        type = VesselParameterGroup
        title = Venus Orbital Station 
        define = VenusStationVessel
        dissassociateVesselsOnContractCompletion = false   
        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            title = Launch a New Vessel
            hideChildren = true
        }
 
        PARAMETER
        {
            name = InVenusOrbit
            type = ReachState
            targetBody = Venus
            situation = ORBITING
            minAltitude = 300000
            maxAltitude = 1500000
            disableOnStateChange = true
            title = Orbit Venus (300 - 1,500 km)
            hideChildren = true
        }
 
        PARAMETER
        {
            name = Crew
            type = HasCrew
            minCrew = 4
            title = Have at least 4 Crewmembers aboard
            hideChildren = true
        }
 
        PARAMETER
        {
            name = DockingPorts
            type = PartValidation
            partModule = ModuleDockingNode
            minCount = 2
            title = Station has at least 2 docking ports
            hideChildren = true
        }
 
        PARAMETER
        {
            name = HasScienceModule
            type = PartValidation
            partModule = Laboratory
            title = Carry a Science Lab Module
            minCount = 1
        }
 
        PARAMETER
        {
            name = Antenna
            type = PartValidation
            partModule = ModuleDataTransmitter
            minCount = 1
            title = Station has a communications antenna
            hideChildren = true
        }
 
        PARAMETER
        {
            name = SolarPower
            type = PartValidation
            partModule = ModuleDeployableSolarPanel
            minCount = 1
            title = Station has solar power generation
            hideChildren = true
        }
 
        PARAMETER
        {
            name = OrbitalStay1
            type = Duration
            duration = 584d
            preWaitText = Keep the station in Venus orbit with at least 4 crew aboard for
            waitingText = Station is in orbit with crew aboard, orbital stay in progress...
            completionText = First Orbital Stay Complete
            hideChildren = true

            PARAMETER
            {
                name = InOrbitStay1
                type = ReachState
                targetBody = Venus
                situation = ORBITING
                disableOnStateChange = true
                title = In orbit around Venus
            }

            PARAMETER
            {
                name = CrewAboardStay1
                type = HasCrew
                minCrew = 4
                title = At least 4 Crewmembers aboard
            }
        }

        PARAMETER
        {
            name = StationExperiment1
            type =  RP1CollectScience
            targetBody = Venus
            experiment = RP0PlanetaryWeatherMonitoring
            recoveryMethod = RecoverOrTransmit
            title = Planetary Weather Monitoring
            hideChildren = true
        }
 
        PARAMETER
        {
            name = StationExperiment2
            type =  RP1CollectScience
            targetBody = Venus
            experiment = RP0PlanetaryAtmosphereSpectroscopy
            recoveryMethod = RecoverOrTransmit
            title = Planetary Atmospheric Spectroscopy
            hideChildren = true
        }
    }
}