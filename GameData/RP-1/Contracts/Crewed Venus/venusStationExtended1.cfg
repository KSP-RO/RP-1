CONTRACT_TYPE
{
    name = venusStationExtended1
    title = Venus Station: Extended Research I (Stage 2)
    group = CrewedVenusExp          
    agent = Exploration

    description = <b>Program: Crewed Venus Exploration <br>Type: <color=orange>Optional</color></b><br><br>Stage 2 of 3. Keep your Venus station in orbit for a second transfer window (584 more days) with at least 4 crew aboard throughout, and have the crew run at least 2 experiments: Surface Mapping and Volcanic Activity Survey. Each window is split into four 146 day checkpoints, so if the station leaves orbit only the checkpoint in progress is lost. Completing this unlocks Extended Research II.    
    synopsis = Keep the Venus station operating for a second transfer window
    completedMessage = Stage 2 complete! The Venus station has now operated for two transfer windows.

    sortKey = 2521

    cancellable = true
    declinable = true
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0

    targetBody = Venus

    // ************ REWARDS ************
    prestige = Significant
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 150
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedVenusExp
    }

    REQUIREMENT
    {
        name = Stage1Done
        type = CompleteContract
        contract = venusStationOptional
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = VenusStation2
        type = VesselParameterGroup
        title = Venus Station: Extended Research I (Stage 2)
        vessel = VenusStationVessel
        dissassociateVesselsOnContractCompletion = false

        PARAMETER
        {
            name = StillInVenusOrbit
            type = ReachState
            targetBody = Venus
            situation = ORBITING
            disableOnStateChange = true
            title = Keep the station in orbit around Venus
            hideChildren = true
        }

         PARAMETER
        {
            name = Crew
            type = HasCrew
            minCrew = 4
            title = Have at least 4 Crewmembers aboard
            hideChildren = true
        }
 
        PARAMETER
        {
            name = Window2
            type = Sequence
            title = Transfer window 2 (584 days, 4 checkpoints)
 
            PARAMETER
            {
                name = Window2Checkpoint1
                type = Duration
                duration = 146d
                title = Window 2, checkpoint 1 of 4: stay in Venus orbit for 146 days
                hideChildren = true
 
                PARAMETER
                {
                    name = InOrbit
                    type = ReachState
                    targetBody = Venus
                    situation = ORBITING
                    disableOnStateChange = true
                    title = In orbit around Venus
                }
 
                PARAMETER
                {
                    name = CrewAboard
                    type = HasCrew
                    minCrew = 4
                    title = At least 4 Crewmembers aboard
                }
            }
 
            PARAMETER
            {
                name = Window2Checkpoint2
                type = Duration
                duration = 146d
                title = Window 2, checkpoint 2 of 4: stay in Venus orbit for 146 days
                hideChildren = true
 
                PARAMETER
                {
                    name = InOrbit
                    type = ReachState
                    targetBody = Venus
                    situation = ORBITING
                    disableOnStateChange = true
                    title = In orbit around Venus
                }
 
                PARAMETER
                {
                    name = CrewAboar
                    type = HasCrew
                    minCrew = 4
                    title = At least 4 Crewmembers aboard
                }
            }
 
            PARAMETER
            {
                name = Window2Checkpoint3
                type = Duration
                duration = 146d
                title = Window 2, checkpoint 3 of 4: stay in Venus orbit for 146 days
                hideChildren = true
 
                PARAMETER
                {
                    name = InOrbit
                    type = ReachState
                    targetBody = Venus
                    situation = ORBITING
                    disableOnStateChange = true
                    title = In orbit around Venus
                }
 
                PARAMETER
                {
                    name = CrewAboard
                    type = HasCrew
                    minCrew = 4
                    title = At least 4 Crewmembers aboard
                }
            }
 
            PARAMETER
            {
                name = Window2Checkpoint4
                type = Duration
                duration = 146d
                title = Window 2, checkpoint 4 of 4: stay in Venus orbit for 146 days
                hideChildren = true
 
                PARAMETER
                {
                    name = InOrbit
                    type = ReachState
