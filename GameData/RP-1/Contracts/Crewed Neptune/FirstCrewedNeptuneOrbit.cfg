CONTRACT_TYPE
{
    name = FirstCrewedNeptuneOrbit
    title = First Crewed Neptune Orbit
    group = CrewedNeptuneExp
    agent = Flag Planting

    description = <b>Program: Crewed Neptune System Exploration<br>Type: <color=green>Required</color></b><br><br>Neptune, the outermost giant of our Solar System, has never been visited by a crewed spacecraft. Its ferocious winds and deep blue atmosphere have only ever been observed from afar. Reaching orbit here marks the farthest a crewed mission will have ever traveled from Earth.<br><br>Design, launch, and fly a mission capable of carrying at least four astronauts into a stable orbit around Neptune. Maintain orbital operations for a day to conduct atmospheric observation and system reconnaissance.
    synopsis = Fly at least four crew members to Neptune and establish an orbit.
    completedMessage = Congratulations! Humanity has achieved its first crewed orbit around Neptune! The data gathered from this historic mission will guide every expedition into the outer Solar System that follows.

    sortKey = 2903

    cancellable = true
    declinable = false
    autoAccept = false
    minExpiry = 0 
    maxExpiry = 0
    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0

    targetBody = Neptune

    // ************ REWARDS ************
    prestige = Significant      
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 4000
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedNeptuneExp
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = VesselGroup
        type = VesselParameterGroup
        title = First Crewed Orbit of Neptune
        define = CrewedNeptuneOrbit

        PARAMETER
        {
            name = HasCrew
            type = HasCrew
            minCrew = 4
            crewOnly = true
            title = Have at least 4 crew members on board
            hideChildren = true
        }

        PARAMETER
        {
            name = NeptuneOrbit
            type = ReachState
            targetBody = Neptune
            situation = ORBITING
			title = Reach orbit of Neptune and hold it for at least a day

            PARAMETER
            {
                name = Duration
                type = Duration
                duration = 1d
                preWaitText = Achieve designated orbit around Neptune.
                waitingText = Maintaining Neptune orbit...
                completionText = Orbital operations complete!
            }
        }
        PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return Home Safely
			hideChildren = true
			completeInSequence = true
		}
    }
}