CONTRACT_TYPE
{
    name = VenusAtmospheric30d
    title = Venus Airborne Exploration: 30-Day Stay
    group = CrewedVenusExp
    agent = Exploration

    description = <b>Program: Crewed Venus Exploration <br>Type: <color=blue>Optional</color></b><br><br> Demonstrate initial operational stability of a crewed floating habitat within Venus upper dense atmosphere for 30 consecutive days.
    synopsis = Maintain at least 1 crew member aboard a vessel between 30km and 65km altitude on Venus for 30 days.
    completedMessage = Congratulations! The crew has accomplished the 30-day atmospheric stay and provided scientists with valuable data.

    sortKey = 2509

    cancellable = true
    declinable = true
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 6
    maxSimultaneous = 1
    deadline = 0

    targetBody = Venus

    // ************ REWARDS ************
    prestige = Trivial
    advanceFunds = 0
    rewardFunds = 0
    rewardReputation = 600
    rewardScience = 0
    failureFunds = 0
    failureReputation = 0

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedVenusExp
    }

    REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract
        contractType = FirstCrewedVenusOrbit
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = VenusAtmospherehabitat
        type = VesselParameterGroup
        title = Maintain a crewed habitat in Venus upper atmosphere for 30 days

        PARAMETER
        {
            name = HasCrew
            type = HasCrew
            minCrew = 1
            title = Have at least 1 crew member on board
            hideChildren = true
        }

        PARAMETER
        {
            name = AtmosphericAltitude
            type = ReachState
            minAltitude = 30000
            maxAltitude = 65000
            disableOnStateChange = false
            title = Altitude: Between 30 km and 65 km
            hideChildren = true

            PARAMETER
            {
                name = AtmosphericStayDuration
                type = Duration
                duration = 30d
                preWaitText = Enter the target altitude band with required crew.
                waitingText = Working in the Venusian atmosphere...
                completionText = 30-day atmospheric stay achieved!
            }
        }
    }
}