    @SolarConfig:HAS[#level[10]]
    {
        %costPerM2 = #$@ROSOLAR_CONFIG/ROS_TECH[TL10]/costPerM2$
        %costMultHinged = #$@ROSOLAR_CONFIG/ROS_TECH[TL10]/costMultHinged$
        %costMultFolded = #$@ROSOLAR_CONFIG/ROS_TECH[TL10]/costMultFolded$
        %costMultTrack = #$@ROSOLAR_CONFIG/ROS_TECH[TL10]/costMultTrack$
    }

    @SolarConfig:HAS[#type[hinged]]
	{
		@costPerM2 *= #$costMultHinged$
	}
	@SolarConfig:HAS[#type[folded]]
	{
		@costPerM2 *= #$costMultFolded$
	}
	@SolarConfig:HAS[#type[tracking]]
	{
		@costPerM2 *= #$costMultTrack$
	}
}


@PART[*]:HAS[#solarUseMass[?rue],@SolarConfig]:AFTER[RealismOverhaul_SolarPanels]
{
    %solarCostOverride = #$SolarConfig/costPerM2$
    @solarCostOverride *= #$SolarConfig/area$
}

@PART[*]:HAS[#solarCostOverride]:AFTER[xxxRP0]
{
    @cost = #$solarCostOverride$
    !solarCostOverride = DEL
}