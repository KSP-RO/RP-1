CONTRACT_TYPE
{
    name = FirstCrewedVenusOrbit
    title = First Crewed Venus Orbit
    group = CrewedVenusExp
    agent = Flag Planting

    description = <b>Program: Crewed Venus Exploration <br>Type: <color=red>CAPSTONE</color></b><br><br> Design and successfully launch a craft that can carry at least Four crew into orbit around Venus for a month and return them safely to Earth. While in orbit, the crew must run at least 2 experiments: Venus Orbital Survey and Venus Landing Site Reconnaissance.    
    synopsis = Send a crewed vessel into orbit of Venus.
    completedMessage = Congratulations! The crew has returned safely and have provided our scientists with information to study.

    sortKey = 2505

    cancellable = true
    declinable = true
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0

    targetBody = Venus

    // ************ REWARDS ************
    prestige = Exceptional
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 800
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedVenusExp
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = VesselGroup
        type = VesselParameterGroup
        title = Orbit Venus
        define = CrewOrbitVenus
        
        PARAMETER
        {
            name = Crewmembers
            type = HasCrew
            minCrew = 4
            title = Have at least 4 Crewmembers
            hideChildren = true
        }

        PARAMETER
        {
            name = VenusOrbit
            type = ReachState
            targetBody = Venus
            situation = ORBITING
			title = Reach orbit of Venus and Stay in an orbit around Venus for at least 30 days

            PARAMETER
            {
                name = Duration
                type = Duration
                duration = 30d
                preWaitText = Reach specified orbit
                waitingText = Orbiting...
                completionText = Orbital stay complete, you may return to Earth when ready
            }
        }

        PARAMETER
        {
            name = ReturnHome
            type = RP1ReturnHome
            title = Return Home Safely
            hideChildren = true
            completeInSequence = true
        }
    }

    PARAMETER
    {
        name = OrbitExperiment1
        type = CollectScience
        targetBody = Venus
        experiment = RP0CrewedPlanetSurvey
        recoveryMethod = RecoverOrTransmit
        title = Run experiment 1: Venus Orbital Survey
        hideChildren = true
    }

    PARAMETER
    {
        name = OrbitExperiment2
        type = CollectScience
        targetBody = Venus
        experiment = RP0PlanetaryLandingSiteRecon
        recoveryMethod = RecoverOrTransmit
        title = Run experiment 2: Venus Landing Site Reconnaissance
        hideChildren = true
    }
}