CONTRACT_TYPE
{
	name = firstCrewedMercurylanding
	title = First Crewed Mercury Landing
	group = CrewedMercuryExp
	agent = Flag Planting

	description = <b>Program: Crewed Mercury Exploration<br>Type: <color=green>Required</color> (expeditionary path)</b><br><br>We want to land on Mercury and explore the surface of this scorched, airless world with humans. Before descending, the crew will spend three weeks in orbit reconnoitring their landing site. Once on the surface they will stay for at least 60 days, broadcast their first steps to the world and gather surface and deep core samples from more than one region of the planet. Mercury's day lasts 176 Earth days, so choose your landing time and site carefully: the dayside surface reaches 430 °C, while the nightside drops to -180 °C.

	synopsis = Reconnoitre a landing site from orbit, then land a crew of at least 4 on Mercury for 60 days, plant a flag, broadcast the landing, gather surface samples from at least 2 biomes and a deep surface sample, and return home safely

	completedMessage = Congratulations! Human beings have set foot on the innermost planet of our Solar System. The monumental task that you have accomplished is something to be proud of!

	sortKey = 2033

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mercury

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 5000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedMercuryExp
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedMercuryOrbit
	}

	// ************ PARAMETERS ************
	PARAMETER
	{
		name = vesselGroup
		type = VesselParameterGroup
		title = Crewed Mercury Landing
		define = CrewedMercuryLanding

		PARAMETER
		{
			name = FourCrew
			type = HasCrew
			minCrew = 4
			maxCrew = 99
			title = Have at least 4 crewmembers on board
			hideChildren = true
		}
		PARAMETER
		{
			name = LandCrewed
			type = All
			title = Land the crewed lander
			disableOnStateChange = true

			PARAMETER
			{
				name = FourCrew
				type = HasCrew
				minCrew = 4
				maxCrew = 99
				title = Have at least 4 crewmembers on board
				hideChildren = true
			}
			PARAMETER
			{
				name = ReachState
				type = ReachState
				targetBody = Mercury
				situation = LANDED
				PARAMETER
				{
					name = Duration
					type = Duration
					duration = 60d
					preWaitText = Land on Mercury.
					waitingText = Exploring...
					completionText = Exploration completed, you may return to Earth when ready.
				}
			}
		}
		PARAMETER
		{
			name = PlantFlagOnMercury
			type = PlantFlag
			targetBody = Mercury
			title = Plant a flag on Mercury! Don't forget the picture
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return home safely
			hideChildren = true
			completeInSequence = true
		}
	}

	PARAMETER
	{
		name = LandingSiteRecon
		type = RP1CollectScience
		targetBody = Mercury
		experiment = RP0PlanetaryLandingSiteRecon
		recoveryMethod = RecoverOrTransmit
		title = Landing Site Reconnaissance from Mercury orbit
		hideChildren = true
	}

	PARAMETER
	{
		name = LandingBroadcast
		type = RP1CollectScience
		targetBody = Mercury
		experiment = RP0PlanetaryLandingTelevisionBroadcast
		recoveryMethod = RecoverOrTransmit
		title = Broadcast the first steps on Mercury
		hideChildren = true
	}

	PARAMETER
	{
		name = surfaceSample2
		type = RP1CollectScience
		targetBody = Mercury
		experiment = surfaceSample2
		minSubjectsToComplete = 2
		recoveryMethod = RecoverOrTransmit
		title = Gather Mercury Surface Samples from at least 2 biomes and <b><color=white>Recover or Transmit them home</color></b>
		hideChildren = true
	}

	PARAMETER
	{
		name = surfaceSample3
		type = RP1CollectScience
		targetBody = Mercury
		experiment = surfaceSample3
		recoveryMethod = RecoverOrTransmit
		title = Gather a Mercury Deep Surface Sample and <b><color=white>Recover or Transmit it home</color></b>
		hideChildren = true
	}
}
