CONTRACT_TYPE
{
	name = MH_RemoteOutpost
	title = Remote Martian Field Camp
	group = MarsHabitation

	description = <b>Program: Mars Habitation<br>Type: <color=blue>Optional</color></b><br><br>Now that we have a home base to operate from, we can range out farther and explore more! Send at least two crew to camp at <b>@/siteName</b> for 14 days, then bring them back to the Martian Base or home to Earth.<br><br>@/siteBlurb&br;&br;<b>Number of Expeditions Completed: @/index / @/maxCompletions</b>

	genericDescription = Send a crew to camp at a remote site on Mars, then return them to the Martian Base or to Earth.

	synopsis = Camp at a remote site on Mars for 14 days

	completedMessage = The field camp crew is back safely, with a lander full of samples from a corner of Mars we had only seen through a robot's eyes.

	sortKey = 2116

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 3
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mars


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 1200
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = MarsHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = MH_BaseLanding
	}

	// ************ SITES ************

	DATA
	{
		type = int
		siteIndex = [0, 1, 2, 3, 4, 5].Random()
	}
	DATA
	{
		type = List<string>
		siteNames = [ "Jezero Crater", "Mount Sharp", "Candor Chasma", "Hellas Planitia", "Chasma Boreale", "Olympus Mons Caldera" ]
		siteBlurbs = [ "Jezero crater is an ancient dried-up Martian lake and river delta.", "Mount Sharp is a towering  peak inside Gale Crater, with a peak several kilometers above the crater floor.", "Candor Chasma is one of the largest and most complex canyons in the Valles Marineris system.", "The floor of the Hellas impact basin is the lowest place on Mars, and the air there is twice as thick as normal.", "Chasma Boreale is a massive flat-floored canyon that cuts deep into the north polar ice cap.", "Olympus Mons is the alrgest volcano and tallest planetary mountain in the Solar System." ]
		hidden = true
	}
	DATA
	{
		type = List<double>
		siteLats = [ 18.4, -5.1, -6.5, -42.4, 84.5, 18.4 ]
		siteLongs = [ 77.5, 137.8, -71.0, 70.5, -2.0, -133.9 ]
		hidden = true
	}
	DATA
	{
		type = string
		siteName = @/siteNames.ElementAt(@/siteIndex)
		siteBlurb = @/siteBlurbs.ElementAt(@/siteIndex)
	}
	DATA
	{
		type = double
		siteLat = @/siteLats.ElementAt(@/siteIndex)
		siteLong = @/siteLongs.ElementAt(@/siteIndex)
		hidden = true
	}

	DATA
	{
		type = int
		index = $MH_RemoteOutpost_Count + 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression

		CONTRACT_COMPLETED_SUCCESS
		{
			MH_RemoteOutpost_Count = $MH_RemoteOutpost_Count + 1
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = Outpost
		type = VesselParameterGroup
		title = Set up a field camp at @/siteName
		disableOnStateChange = true

		PARAMETER
		{
			name = TwoCrew
			type = HasCrew
			minCrew = 2
			crewOnly = true
			title = Have at least 2 crew on board
			hideChildren = true
		}
		PARAMETER
		{
			name = Camp
			type = All
			title = Camp within 10 km of @/siteName for 14 days
			disableOnStateChange = true

			PARAMETER
			{
				name = Landed
				type = ReachState
				targetBody = Mars
				situation = LANDED
				hideChildren = true
			}
			PARAMETER
			{
				name = AtSite
				type = VisitWaypoint
				index = 0
				distance = 10000.0
				title = Land within 10 km of @/siteName
				showMessages = true
				hideChildren = true
			}
			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 14d
				preWaitText = Land at @/siteName
				waitingText = Exploring the site
				completionText = Exploration completed, you may head back when ready
			}
		}
		PARAMETER
		{
			name = Return
			type = Any
			title = Return to the Martian Base or to Earth
			completeInSequence = true

			PARAMETER
			{
				name = BackAtBase
				type = VisitWaypoint
				index = 1
				distance = 1000.0
				title = Return to within 1 km of the Martian Base
				showMessages = true
				hideChildren = true
			}
			PARAMETER
			{
				name = ReturnHome
				type = RP1ReturnHome
				title = Return home safely
				hideChildren = true
			}
		}
	}

	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator

		WAYPOINT
		{
			name = @/siteName
			hidden = False
			targetBody = Mars
			icon = marker
			altitude = 0.0
			latitude = @/siteLat
			longitude = @/siteLong
		}
		WAYPOINT
		{
			name = Martian Base
			hidden = False
			targetBody = Mars
			icon = marker
			altitude = 0.0
			latitude = Vessel(MarsBase).Location().Latitude()
			longitude = Vessel(MarsBase).Location().Longitude()
		}
	}
}
