CONTRACT_TYPE
{
    name = 2000_Gate
    title = New Millenium Check
    group = Records 
    synopsis = Serves as a date gate.
    completedMessage = Happy new year! Welcome to the new millenium!
    maxCompletions = 1
    maxSimultaneous = 1
    autoAccept = true

    REQUIREMENT // Date lock
    {
        name = Expression
        type = Expression
        title = Must be after the 1st of January, 2000
        expression = UniversalTime() >= 1514764800
    }
    
    PARAMETER
    {
        name = Duration
        type = Duration
        duration = 1s
    }
}