// Carrier aircraft. Once unlocked, the player has access to them for the rest of their playthrough & can select them when prepping for airlaunch
// Cost & Time multiplier can be used to tweak how long/expensive a mount is. Larger modifier -> Longer/More expensive
// All sizes have additional 3, 2, 1 m added on top of the desired value to mitigate B9 reporting bigger sizes than actual

// Parameters:
// TechRequired - unlock
// Min/Max Alt - in metres
// Max distance - in metres
// Min/Max vel - m/s 
// Min/MaxDrop - flight path angle for drop with 0 being horizontal/level
// MaxMass - maximum allowed mass in kg
// max size - m * m * m
// cost multiplier - unitless
// time multiplier - unitless
