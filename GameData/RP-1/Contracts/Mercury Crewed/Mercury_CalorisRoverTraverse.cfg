CONTRACT_TYPE
{
	name = Mercury_CalorisRoverTraverse
	title = Caloris Basin Rover Traverse
	group = CrewedMercuryExp
	agent = Flag Planting

	description = <b>Program: Crewed Mercury Exploration<br>Type: <color=blue>Optional</color></b><br><br>The Caloris basin, 1,500 km across, is one of the largest impact structures in the Solar System. At its heart lies Apollodorus crater, the hub of Pantheon Fossae: hundreds of troughs radiating outward like the spokes of a wheel, cracks left as the basin floor stretched. Land a crewed pressurised rover near Apollodorus and collect a deep surface sample, then drive it about 50 km out along one of the troughs and collect another. Plan your power and thermal control for the long Mercurian day.

	synopsis = Drive a crewed rover with at least 2 crew about 50 km from Apollodorus crater out along the troughs of Pantheon Fossae, collecting a deep surface sample at each end

	completedMessage = Congratulations! The traverse across Pantheon Fossae has given our geologists a cross-section of the Caloris basin floor and a first look at how it cracked apart.

	sortKey = 2039

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mercury

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 1000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedMercuryExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = firstCrewedMercurylanding
	}

	// ************ WAYPOINTS ************
	// Coordinates are from the IAU gazetteer (via the Wikipedia crater infoboxes, given there as
	// 0-360 West) converted to KSP convention (+East, -180 to 180). The end point is a point 50 km due east of Apollodorus, out among the Pantheon Fossae troughs.

	BEHAVIOUR
	{
		name = TraverseWaypoints
		type = WaypointGenerator
		targetBody = Mercury

		WAYPOINT
		{
			name = Apollodorus Crater
			icon = marker
			latitude = 30.58
			longitude = 162.99
			altitude = 0
			parameter = Start
		}

		WAYPOINT
		{
			name = Pantheon Fossae Trough
			icon = marker
			latitude = 30.58
			longitude = 164.35
			altitude = 0
			parameter = End
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = Rover
		type = VesselParameterGroup
		title = Control a crewed rover with the required parameters
		notes = The same rover must reach both sites, driving across the basin floor.
		define = MercuryCalorisRover

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 2
			crewOnly = true
			title = Have at least 2 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = HasWheels
			type = PartValidation
			partModule = ModuleWheelBase
			minCount = 4
			title = Have at least 4 wheels
			hideChildren = true
		}

		PARAMETER
		{
			name = Start
			type = Sequence
			title = Start: Apollodorus Crater

			PARAMETER
			{
				name = AtStart
				type = VisitWaypoint
				index = 0
				horizontalDistance = 2000
				title = Be within 2 km of Apollodorus Crater
				hideChildren = true
			}
			PARAMETER
			{
				name = LandedStart
				type = ReachState
				targetBody = Mercury
				situation = LANDED
				title = Be landed
				hideChildren = true
			}
			PARAMETER
			{
				name = SampleStart
				type = RP1HasExperiment
				experiment = surfaceSample3
				title = Collect a deep surface sample at Apollodorus Crater
			}
		}

		PARAMETER
		{
			name = End
			type = Sequence
			title = End: Pantheon Fossae Trough
			completeInSequence = true

			PARAMETER
			{
				name = AtEnd
				type = VisitWaypoint
				index = 1
				horizontalDistance = 2000
				title = Drive to within 2 km of the Pantheon Fossae Trough waypoint (~50 km)
				hideChildren = true
			}
			PARAMETER
			{
				name = LandedEnd
				type = ReachState
				targetBody = Mercury
				situation = LANDED
				title = Be landed
				hideChildren = true
			}
			PARAMETER
			{
				name = SampleEnd
				type = RP1HasExperiment
				experiment = surfaceSample3
				title = Collect a deep surface sample at the trough
			}
		}
	}
}
