CONTRACT_TYPE
{
	name = OLH_RegolithShielding
	title = Regolith Radiation Shielding
	group = OperationalLunarHabitation

	description = <b>Program: Operational Lunar Habitation<br>Type: <color=green>Required</color></b><br><br>The Moon is a harsh mistress: due to a lack of an atmosphere or magnetic field, our crew is exposed to dangerous levels of radiation. Fortunately, there is plenty of shielding lying around. Use the <b>Regolith Compacter</b> of the Base's Regolith Harvester to pack regolith over the habitats, and run it for 30 days.

	synopsis = Shield the Lunar Base with regolith

	completedMessage = Our habitats are now covered in a thick layer of Lunar Regolith, shielding the crew!

	sortKey = 2010

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon


	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 800
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalLunarHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OLH_RegolithMiner
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = RegolithShielding
		type = VesselParameterGroup
		title = Compact regolith into shielding at the Lunar Base for 30 days
		vessel = MoonBase
		notes = You can work on other contracts while the Base is working. You are safe to return to Mission Control
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Moon
			situation = LANDED
			hideChildren = true
		}
		// Checks the process rather than the Shielding amount: Shielding can be filled in the VAB
		PARAMETER
		{
			name = HasCompacter
			type = HasResource
			resource = Resource("_RegolithCompacter")
			minQuantity = 0.99
			title = Run a Regolith Compacter on the Base
			hideChildren = true
		}
		PARAMETER
		{
			name = HasRegolith
			type = HasResource
			resource = Regolith
			minQuantity = 0.01
			title = Keep the compacter fed with Regolith
			hideChildren = true
		}
		PARAMETER
		{
			name = Duration
			type = Duration
			duration = 30d
			preWaitText = Start up the Regolith Compacter
			waitingText = Compacting regolith over the habitats
			completionText = 30 days of regolith compacting completed
		}
	}
}
