CONTRACT_TYPE
{
	name = Uranus_OrbitalScienceCampaign
	title = Uranus Orbital Science Campaign
	group = CrewedUranusExp
	agent = Exploration

	description = <b>Program: Crewed Uranus Exploration<br>Type: <color=blue>Optional</color></b><br><br>Uranus has the strangest magnetic field of any planet: tilted almost 60 degrees from its spin axis and offset by a third of the planet's radius from its centre, it tumbles around the planet every 17 hours. Beneath it lies a methane atmosphere that hides its storms behind a featureless blue haze.<br><br>Park a crewed orbital laboratory in the gap between the radiation belt and the magnetopause, between 16 and 19 Uranus radii from the planet's centre, and keep it there for 30 days. From there the crew will map the radiation environment and the planet's electrical activity, take spectra of the atmosphere and monitor its weather.<br><br><color=orange>WARNING: below about 15 Uranus radii the radiation belt reaches 4 rad/h, enough to kill a fully shielded crew within a month. Do not linger inside it.</color>

	synopsis = Keep a crew of at least 2 in orbit of Uranus between the radiation belt and the magnetopause for 30 days, studying the radiation environment, electrical activity, atmospheric composition and weather

	completedMessage = Congratulations! The orbital campaign has given our scientists the first complete picture of the tumbling magnetosphere of Uranus and of the weather beneath its haze.

	sortKey = 2820

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Uranus

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 3000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************
	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedUranusExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedUranusOrbit
	}

	// ************ PARAMETERS ************
	// Radiation geometry (KerbalismConfig/Support/RSS.cfg): Uranus uses the "saturn" model, which has no inner belt.
	// The outer belt is a torus with outer_dist = outer_radius = 7 RU, i.e. everything within 14 RU x cos(magnetic latitude),
	// stretched to ~14.7 RU on the night side (outer_extension = 0.95) and offset by 0.3 RU, so it never reaches past ~15 RU.
	// radiation_outer = 4 rad/h: even at the 93.3% max shielding a crew takes ~6 rad/day deep inside, against a fatal 150 rad.
	// The magnetopause (pause_radius = 20 RU, compressed to ~19.6 RU on the day side) cuts the background radiation inside it.
	// The band 16-19 RU (RU = 25,559 km) is clear of both: pe altitude >= 15 RU, ap altitude <= 18 RU.
	// No inclination is required: RSS cannot tilt Uranus's spin axis, so a KSP "polar" orbit would not be polar to the real
	// Uranus. The field (geomagnetic_pole_lat = 31.4) is tilted 58.6 deg and rotates past the ship whatever the orbit.
	PARAMETER
	{
		name = OrbitalLab
		type = VesselParameterGroup
		title = Crewed orbital laboratory around Uranus
		notes = The laboratory must remain between the radiation belt and the magnetopause with at least 2 crew aboard for the whole 30 days. Titania orbits inside this band, so watch for close encounters.

		PARAMETER
		{
			name = Crew
			type = HasCrew
			minCrew = 2
			title = Have at least 2 Crewmembers aboard
			hideChildren = true
		}

		PARAMETER
		{
			name = HasScienceModule
			type = PartValidation
			partModule = Laboratory
			title = Carry a Science Lab Module
			minCount = 1
		}

		PARAMETER
		{
			name = Antenna
			type = PartValidation
			partModule = ModuleDataTransmitter
			minCount = 1
			title = Carry a communications antenna
			hideChildren = true
		}

		PARAMETER
		{
			name = OrbitalStay
			type = Duration
			duration = 30d
			preWaitText = Keep the laboratory between the radiation belt and the magnetopause with at least 2 crew aboard for
			waitingText = Orbital science campaign in progress...
			completionText = Orbital science campaign complete, you may return to Earth when ready
			hideChildren = true

			PARAMETER
			{
				name = SafeBandOrbit
				type = Orbit
				targetBody = Uranus
				situation = ORBITING
				minPeA = 385000000 // 16 RU from the centre, clear of the radiation belt (~15 RU at most)
				maxApA = 460000000 // 19 RU from the centre, inside the magnetopause (~19.6 RU on the day side)
				title = Orbit Uranus with a periapsis above 385,000 km and an apoapsis below 460,000 km
			}

			PARAMETER
			{
				name = CrewAboard
				type = HasCrew
				minCrew = 2
				title = At least 2 Crewmembers aboard
			}
		}
	}

	PARAMETER
	{
		name = RadiationStudy
		type = RP1CollectScience
		targetBody = Uranus
		experiment = RP0PlanetaryRadiationStudy
		location = Space
		recoveryMethod = RecoverOrTransmit
		title = Planetary Radiation Environment Study of Uranus
		hideChildren = true
	}

	PARAMETER
	{
		name = ElectricalActivity
		type = RP1CollectScience
		targetBody = Uranus
		experiment = RP0PlanetaryElectricalActivity
		location = Space
		recoveryMethod = RecoverOrTransmit
		title = Atmospheric Electrical Activity Survey of Uranus
		hideChildren = true
	}

	PARAMETER
	{
		name = AtmosphereSpectroscopy
		type = RP1CollectScience
		targetBody = Uranus
		experiment = RP0PlanetaryAtmosphereSpectroscopy
		location = Space
		recoveryMethod = RecoverOrTransmit
		title = Planetary Atmospheric Spectroscopy of Uranus
		hideChildren = true
	}

	PARAMETER
	{
		name = WeatherMonitoring
		type = RP1CollectScience
		targetBody = Uranus
		experiment = RP0PlanetaryWeatherMonitoring
		location = Space
		recoveryMethod = RecoverOrTransmit
		title = Planetary Weather Monitoring of Uranus
		hideChildren = true
	}
}
