CONTRACT_TYPE
{
    name = FirstCrewedTitaniaLanding
    title = First Crewed Titania Landing
    group = CrewedUranusExp
    agent = Flag Planting

    description = <b>Program: Crewed Uranus Exploration<br>Type: <color=green>Required</color></b><br><br>The pinnacle of outer system exploration is within reach. Titania, the largest moon of Uranus, is a frigid world of ancient ice, immense canyon systems like Messina Chasmata, and evidence of past internal activity that may hint at a hidden subsurface ocean.<br><br>Design and execute a mission to land at least 4 astronauts on the surface of Titania and bring the crew safely home to Earth. Once on the surface, the crew will probe the ice beneath them with ground-penetrating radar and set up a seismic station.
    synopsis = Land a crew of at least 4 on Titania, plant a flag and run ground-penetrating radar and a seismic station.
    completedMessage = History has been made! Human footprints now mark the ancient ice of Titania. The successful landing on the largest moon of Uranus stands as a testament to the heights our space program can reach.

    sortKey = 2805

    cancellable = true
    declinable = false
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0

    targetBody = Titania


    // ************ REWARDS ************
    prestige = Significant
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 7500
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************

    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedUranusExp
    }
    REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract
        contractType = FirstCrewedUranusOrbit
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = vesselGroup
        type = VesselParameterGroup
        title = Crewed Titania Surface Mission
        define = CrewedTitaniaLanding

        PARAMETER
        {
            name = FourCrew
            type = HasCrew
            minCrew = 4
            maxCrew = 99
            title = Have at least 4 crew members on board
            hideChildren = true
        }

        PARAMETER
        {
            name = LandCrewed
            type = All
            title = Land the crewed vessel
            disableOnStateChange = true

            PARAMETER
            {
                name = FourCrew
                type = HasCrew
                minCrew = 4
                maxCrew = 99
                title = Maintain a crew of at least 4
                hideChildren = true
            }

            PARAMETER
            {
                name = ReachState
                type = ReachState
                targetBody = Titania
                situation = LANDED
            }
        }

        PARAMETER
        {
            name = PlantFlagOnTitania
            type = PlantFlag
            targetBody = Titania
            title = Plant a flag on Titania (and take a photo for the history books!)
            hideChildren = true
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = evaGPRScan
        type = RP1CollectScience
        targetBody = Titania
        experiment = evaGPRScan
        situation = SrfLanded
        recoveryMethod = RecoverOrTransmit
        title = Probe the ice crust with Ground-Penetrating Radar
        hideChildren = true
    }

    PARAMETER
    {
        name = evaAdvancedSeismicScan
        type = RP1CollectScience
        targetBody = Titania
        experiment = evaAdvancedSeismicScan
        situation = SrfLanded
        recoveryMethod = RecoverOrTransmit
        title = Set up an Advanced Seismic Station
        hideChildren = true
    }
}
