CONTRACT_TYPE
{
	name = MH_SelfSufficiency
	title = Life on Mars
	group = MarsHabitation

	description = <b>Program: Mars Habitation<br>Type: <color=red>CAPSTONE</color></b><br><br> Our Base is self-sufficient - or at least in theory. Prove that it can do so in practice! Keep six crew there without a break, for a full cycle of transfer windows. If you succeed, it will be historic!
	synopsis = Keep six crew alive on Martian food, water and air for a full cycle of transfer windows

	completedMessage = Success! Humanity now lives on Mars!

	sortKey = 2110

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mars


	// ************ REWARDS ************
	prestige = Exceptional
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 6500
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = MarsHabitation
	}
	REQUIREMENT
	{
		name = CompleteExpedition
		type = CompleteContract
		contractType = MH_Expedition
	}
	REQUIREMENT
	{
		name = NoActiveExtendedStay
		type = AcceptContract
		contractType = MH_ExtendedStay
		invertRequirement = true
	}

	// It's possible to complete MH_ExtendedStay optionals before this contract, which already advance Martian Habitation
	// past the required Expedition's 500 days. Account for that so this contract still demands its own 780 days on top.
	DATA
	{
		type = List<float>
		priorHabitationList = [0.13699, 0.48767, 0.62466, 0.76164, 0.89863, 1]
	}
	DATA
	{
		type = int
		extendedStayCount = $MH_ExtendedStay_Count + 0
	}
	DATA
	{
		type = float
		habitationFraction = Min(@/priorHabitationList.ElementAt(@/extendedStayCount) + (780 / 3650), 1)
		durationText = Round(3650 * @/habitationFraction, 1)
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = SelfSufficiency
		type = VesselParameterGroup
		title = Keep six crew on Martian food, water and air for 780 days without a break
		vessel = MarsBase
		notes = If the Base drops below six crew or any of these stop, the count starts over. You can work on other contracts while your crew are working. You are safe to return to Mission Control
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Mars
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = SixCrew
			type = HasCrew
			minCrew = 6
			crewOnly = true
			title = Have at least 6 crewmembers on board
			hideChildren = true
		}
		PARAMETER
		{
			name = HasHydroponics
			type = HasResource
			resource = Resource("_Hydroponics")
			minQuantity = 11.99
			title = Run enough Hydroponics to feed 6 crew
			hideChildren = true
		}
		PARAMETER
		{
			name = HasMOXIE
			type = HasResource
			resource = Resource("_MOXIE")
			minQuantity = 5.99
			title = Run MOXIE for at least 6 crew
			hideChildren = true
		}
		PARAMETER
		{
			name = HasHaberBosch
			type = HasResource
			resource = Resource("_HaberBosch")
			minQuantity = 0.99
			title = Make the crops' Ammonia with the Haber-Bosch Process
			hideChildren = true
		}
		PARAMETER
		{
			name = HasDrill
			type = Any
			title = Mine water with a drill configured as Water Extractor
			hideChildren = true

			PARAMETER
			{
				name = HasSmallDrill
				type = PartValidation
				part = kerbalism-drill
				minCount = 1
				hideChildren = true
			}
			PARAMETER
			{
				name = HasLargeDrill
				type = PartValidation
				part = kerbalism-large-drill
				minCount = 1
				hideChildren = true
			}
		}
		PARAMETER
		{
			name = HasWater
			type = HasResource
			resource = Water
			minQuantity = 0.01
			title = Keep the Base supplied with Water
			hideChildren = true
		}
		PARAMETER
		{
			name = HasCO2
			type = HasResource
			resource = CarbonDioxide
			minQuantity = 0.01
			title = Keep the greenhouses supplied with CarbonDioxide
			hideChildren = true
		}
		PARAMETER
		{
			name = Duration
			type = Duration
			duration = 780d
			preWaitText = Switch the Base over to Martian supplies
			waitingText = Living off Mars
			completionText = A full cycle of transfer windows on Martian food, water and air completed
		}
	}
	PARAMETER
	{
		name = MarsHabitation
		type = RP1CollectScience
		title = Complete at least @/durationText out of 3650 days of Martian Habitation
		notes = This experiment requires 6 crew including a Scientist, and consumes 250 units of Research Payload every 30 days
		targetBody = Mars
		situation = SrfLanded
		experiment = RP0MarsHabit
		fractionComplete = @/habitationFraction
	}
}
