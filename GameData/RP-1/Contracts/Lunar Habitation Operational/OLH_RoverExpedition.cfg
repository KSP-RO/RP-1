CONTRACT_TYPE
{
	name = OLH_RoverExpedition
	title = Crewed Lunar Rover Exploration
	group = OperationalLunarHabitation

	description = <b>Program: Operational Lunar Habitation<br>Type: <color=green>Required</color></b><br><br>Launch a crewed expedition using a rover from the Lunar Base. You will have to explore two waypoints and then return to the Lunar Base.
	genericDescription = Explore the Moon with a crewed rover.

	synopsis = Explore the Moon with a crewed rover and return to the Lunar Base.

	completedMessage = Mission Success! You explored different parts of the Moon and returned home to the Base safe and sound.

	sortKey = 2002

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 6
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon


	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 1200
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalLunarHabitation
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OLH_BaseExpansion
	}

	// ************ PARAMETERS ************
	PARAMETER
	{
		name = OneCrew
		type = HasCrew
		minCrew = 2
		crewOnly = true
		title = Have at least 2 crew on board
		hideChildren = true
	}
	PARAMETER
	{
		name = ExpeditionAlpha
		type = VisitWaypoint
		index = 0
		distance = 100.0
		title = Start your expedition within 100m of the Lunar Base
		showMessages = true
		disableOnStateChange = true
		hideChildren = true
	}
	PARAMETER
	{
		name = ExpeditionBeta
		type = VisitWaypoint
		index = 1
		distance = 100.0
		title = Visit expedition site Beta
		showMessages = true
		disableOnStateChange = true
		hideChildren = true
	}
	PARAMETER
	{
		name = ExpeditionCharlie
		type = VisitWaypoint
		index = 1
		distance = 100.0
		title = Visit expedition site Charlie
		showMessages = true
		disableOnStateChange = true
		hideChildren = true
	}
	PARAMETER
	{
		name = ExpeditionAlpha
		type = VisitWaypoint
		index = 0
		distance = 100.0
		title = End your expedition within 100m of the Lunar Base
		showMessages = true
		disableOnStateChange = true
		hideChildren = true
	}
	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator

		WAYPOINT
		{
			name = Lunar Base
			hidden = False
			targetBody = Moon
			icon = marker
			altitude = 0.0
			latitude = Vessel("MoonBase").Location().Latitude()
			longitude = Vessel("MoonBase").Location().Latitude()
		}

		RANDOM_WAYPOINT_NEAR
		{
			name = Site Beta
			parameter = MoonAlpha
			hidden = false
			targetBody = Moon
			count = 1
			icon = marker
			altitude = 0.0
			waterAllowed = false
			nearIndex = 0
			minDistance = 15000.0
			maxDistance = 20000.0
		}
		RANDOM_WAYPOINT_NEAR
		{
			name = Site Charlie
			parameter = MoonBeta
			hidden = false
			targetBody = Moon
			count = 1
			icon = marker
			altitude = 0.0
			waterAllowed = false
			nearIndex = 0
			minDistance = 15000.0
			maxDistance = 20000.0
		}
	}
}
