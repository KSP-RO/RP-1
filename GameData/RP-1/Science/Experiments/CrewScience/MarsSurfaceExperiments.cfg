// ============================================================================
// Martian Soil Plant Growth
// ============================================================================
EXPERIMENT_DEFINITION
{
	id = RP0marsSoilPlants
	title = Martian Soil Plant Growth
	baseValue = 120
	scienceCap = 120
	dataScale = 1
	requireAtmosphere = False
	situationMask = 1 // SrfLanded
	biomeMask = 0
	description = Our greenhouses grow their crops in water. To grow food on a large scale, we would rather use the Martian soil itself, once its perchlorates are washed out. Crops are grown in treated regolith and then compared with plants grown on Earth. <b>NOTE: Consumes 5 units of Regolith. This experiment takes 120 days and produces samples that must be returned to Earth.</b>
	mass = 0.1
	techRequired = sampleReturnScience
	cost = 0
	minCrew = 1
	celestialBodies = Mars
	situations = SrfLanded
	RESULTS
	{
		default = Once washed, the soil grows healthy plants, although they need nitrogen fertiliser that Martian soil lacks.
	}
	KERBALISM_EXPERIMENT
	{
		SampleMass = 0.02
		BodyAllowed = Mars
	}
}
@PART[*]:HAS[#getsMarsBaseExperiments[True]]:FOR[zzzKerbalism]
{
	MODULE
	{
		name = Experiment
		experiment_id = RP0marsSoilPlants
		sample_collecting = True
		ec_rate = 0.25 // Grow lights and climate control
		data_rate = 1
		@data_rate /= 10368000 // 120 Days
		requires = CrewMin:1
		resources = Regolith@0.00000048225 // 5 units over 120 days
		crew_operate = True
		hide_when_unavailable = True
	}
}

