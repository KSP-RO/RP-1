CONTRACT_TYPE
{
	name = TitanSampleReturn
	title = Titan Sample Return
	group = SaturnMoonLandings
	agent = Federation Aeronautique Internationale

	description = <b>Program: Saturnine Moon Landings<br>Type: <color=blue>Optional</color></b><br><br>Our research of Titan has been incredible! It is now time to take another step: instead of merely exploring its surface, we want to retrieve something from it. Design and successfully launch an uncrewed probe to land on Titan, gather science, and bring something back to Earth for study. This is a sample return missions so you cannot just transmit the data back, it needs to be physically returned.

	synopsis = Send an uncrewed craft to land on Titan and return the science to Earth.

	completedMessage = Congratulations! Our scientists can learn a lot more about the make-up of the planet by studying the physical samples that you have returned.

	sortKey = 3000

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Titan



	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 25000 // Since ascending from Titan requires > 7.6 km/s of delta-v, it is an incredible undertaking
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = SaturnMoonLandings
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = landingTitan
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Titan sample return

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = Landing
			type = ReachState
			situation = LANDED
			situation = SPLASHED
			disableOnStateChange = true
			title = Safely land on Titan
			hideChildren = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return to Earth safely with the samples
			hideChildren = true
			completeInSequence = true
		}
	}
	PARAMETER
	{
		name = SurfaceScience
		type = CollectScience
		situation = SrfLanded
		situation = SrfSplashed
		recoveryMethod = Recover
		title = Gather science while landed and <b><color=white>Return it home, DO NOT TRANSMIT</color></b>
		hideChildren = true
	}
}
