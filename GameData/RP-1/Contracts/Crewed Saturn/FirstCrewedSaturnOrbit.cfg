CONTRACT_TYPE
{
	name = FirstCrewedSaturnOrbit
	title = First Crewed Saturn Orbit
	group = CrewedSaturnExp
	agent = Flag Planting

	description = <b>Program: Crewed Saturn Exploration<br>Type: <color=green>Required</color></b><br><br>The gas giant Saturn and its magnificent ring system represent one of the ultimate frontiers of human exploration. Crossing billions of kilometers of deep space to reach the ringed planet will push our life support, propulsion, and navigation systems to their absolute limits.<br><br>Design and launch a crewed deep-space vehicle capable of carrying at least four astronauts into orbit around Saturn, conduct initial orbital operations, and return the crew safely to Earth.
    synopsis = Command the first crewed expedition to orbit Saturn with at least four astronauts and return home safely.
    completedMessage = A historic triumph! Human beings have entered orbit around Saturn, gazing directly upon its iconic rings. The successful execution of this voyage opens a brand-new chapter in deep-space exploration.
	sortKey = 2527

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Saturn

// ************ REWARDS ************
	prestige = Significant      
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 6000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedSaturnExp
	}


	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = First crewed orbit of @targetBody

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
       {
        name = SaturnOrbit
        title = Reach orbit of Saturn with a maximum pe of 1,500,000 km and a maximum ap of 2,500,000 km and hold it for at least 20 days
        type = Orbit
        maxPeA = 1500000000 
        maxApA = 2500000000  
        targetBody = Saturn
        disableOnStateChange = true
        completeInSequence = true
			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 20d
				preWaitText = Reach specified orbit
				waitingText = Orbiting...
				completionText = Orbits are complete
			}
			PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return Home Safely
			hideChildren = true
			completeInSequence = true
		}
		}
	}

}
