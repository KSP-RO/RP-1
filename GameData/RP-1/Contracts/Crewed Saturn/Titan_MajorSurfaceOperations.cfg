CONTRACT_TYPE
{
	name = Titan_MajorSurfaceOperations
	title = Titan Major Surface Operations
	group = CrewedSaturnExp
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Saturn Exploration<br>Type: <color=blue>Optional</color></b><br><br>Land a crewed expeditionary vehicle at two major landmarks on Titan: the historic Huygens landing site and the dune fields beside Selk crater. Run a different field science instrument at each site and remain at the last one for 24 hours.

	synopsis = Land a crewed expeditionary rover or a hop-capable lander within 1 km of each of the 2 landmarks on Titan, run a different field science instrument at each and remain at the last one for 24 hours.

	completedMessage = Congratulations! The surface survey of Titan has given our scientists a vastly better understanding of its dunes and its organic chemistry.

	sortKey = 25221

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Titan

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 2000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedSaturnExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedTitanLanding
	}

	// ************ WAYPOINTS ************
	// Coordinates are converted from the IAU gazetteer (planetographic, +West)
	// to KSP convention (+East, -180 to 180).

	BEHAVIOUR
	{
		name = LandmarkWaypoints
		type = WaypointGenerator
		targetBody = Titan

		WAYPOINT
		{
			name = Huygens Landing Site
			icon = marker
			latitude = -10.57
			longitude = 167.68
			altitude = 0
			parameter = Site1
		}

		WAYPOINT
		{
			name = Selk Crater
			icon = marker
			latitude = 7.0
			longitude = 161.0
			altitude = 0
			parameter = Site2
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = SurfaceExpedition
		type = VesselParameterGroup
		title = Control a vessel with the required parameters
		notes = Use an expeditionary rover or a lander capable of hopping between sites. The same vessel must visit both landmarks.
		define = TitanSurfaceExpeditionVessel
		disableOnStateChange = false

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 2
			crewOnly = true
			title = Have at least 2 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = Site1
			type = Sequence
			title = Landmark 1: Huygens Landing Site

			PARAMETER
			{
				name = LandedNear1
				type = VisitWaypoint
				index = 0
				horizontalDistance = 1000
				title = Be within 1 km of Huygens Landing Site
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed1
				type = ReachState
				targetBody = Titan
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Sample1
				type = RP1CollectScience
				targetBody = Titan
				experiment = evaAdvancedAtmoAnalysis
				situation = SrfLanded
				recoveryMethod = RecoverOrTransmit
				title = Run the Advanced Atmospheric Analyzer at the Huygens Landing Site
			}
		}

		PARAMETER
		{
			name = Site2
			type = Sequence
			title = Landmark 2: Selk Crater

			PARAMETER
			{
				name = LandedNear2
				type = VisitWaypoint
				index = 1
				horizontalDistance = 1000
				title = Be within 1 km of Selk Crater
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed2
				type = ReachState
				targetBody = Titan
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay2
				type = Duration
				duration = 24h
				preWaitText = Remain at Selk Crater for 24 hours
				waitingText = Surveying Selk Crater
				completionText = Survey of Selk Crater complete
			}
			PARAMETER
			{
				name = Sample2
				type = RP1CollectScience
				targetBody = Titan
				experiment = evaAdvancedFieldGeology
				situation = SrfLanded
				recoveryMethod = RecoverOrTransmit
				title = Run the Advanced Field Geology Suite on the dunes beside Selk Crater
			}
		}
	}
}
