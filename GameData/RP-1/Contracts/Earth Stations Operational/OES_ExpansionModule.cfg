CONTRACT_TYPE
{
	name = OES_ExpansionModule
	title = Station Module: Expansion
	group = OperationalEarthStations
	agent = Stations

	description = <b>Program: Operational Earth Stations<br>Type: <color=green>Required</color></b><br><br>While our core module is technically already a capable station, the crews that will spend half a year or more aboard the station need more room to live and work. Launch a module with additional living space for at least two crew and dock it to the station.<br><br>This contract is based on the Kvant-2 module, which added living space, a dedicated EVA airlock and extra life support equipment to Mir.

	synopsis = Dock a module with room for at least two more crew to the station

	completedMessage = Congratulations! Our crews have some more available space!

	sortKey = 1602

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 600
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalEarthStations
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OES_CoreModule
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = vesselGroupModule
		type = VesselParameterGroup
		title = Launch an expansion module and dock it to the station
		notes = The module must include room for at least 2 crew and 1 docking port
		disableOnStateChange = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new module
			hideChildren = true
		}
		PARAMETER
		{
			name = HasCapacity
			type = HasCrewCapacity
			minCapacity = 2
			title = Space for at least 2 crew
			hideChildren = true
		}
		PARAMETER
		{
			name = DockingPort
			type = PartValidation
			partModule = ModuleDockingNode
			minCount = 1
			title = Have at least 1 docking port
			hideChildren = true
		}
		PARAMETER
		{
			name = Docking
			type = Docking
			vessel = OperationalStation
			completeInSequence = true
			title = Dock with the station
		}
	}
	PARAMETER
	{
		name = vesselGroupStation
		type = VesselParameterGroup
		title = Keep the station in orbit
		vessel = OperationalStation
		completeInSequence = true

		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 300000
			maxApA = 500000
			targetBody = HomeWorld()
			title = Keep the station in a stable orbit with a perigee greater than 300 km and an apogee less than 500 km
		}
	}
}
