CONTRACT_TYPE
{
	name = Mercury_OrbitalScienceCampaign
	title = Mercury Orbital Science Campaign
	group = CrewedMercuryExp
	agent = Exploration

	description = <b>Program: Crewed Mercury Exploration<br>Type: <color=blue>Optional</color> (required for the sample return path)</b><br><br>Mercury hides some of the Solar System's strangest secrets: a giant iron core, a magnetic field it should not have, and water ice in permanently shadowed craters at its poles despite being the closest planet to the Sun. Establish a crewed orbital laboratory in a polar orbit around Mercury and keep it crewed for at least 60 days. From there the crew will map the radiation environment, the most intense of any rocky planet in the Solar System, and use synthetic aperture radar to map the polar ice deposits first spotted by Earth-based radar.

	synopsis = Keep a crew of at least 4 aboard an orbital laboratory in a polar orbit of Mercury for 60 days, conducting a radiation environment study and an orbital radar survey

	completedMessage = Congratulations! The orbital campaign has given our scientists a complete picture of Mercury's radiation environment, and radar maps of the ice hidden in its polar craters.

	sortKey = 2036

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mercury

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 2000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************
	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedMercuryExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedMercuryOrbit
	}

	// ************ PARAMETERS ************
	PARAMETER
	{
		name = OrbitalLab
		type = VesselParameterGroup
		title = Crewed orbital laboratory around Mercury
		notes = The laboratory must remain in a polar orbit with at least 4 crew aboard for the whole 60 days.

		PARAMETER
		{
			name = Crew
			type = HasCrew
			minCrew = 4
			title = Have at least 4 Crewmembers aboard
			hideChildren = true
		}

		PARAMETER
		{
			name = HasScienceModule
			type = PartValidation
			partModule = Laboratory
			title = Carry a Science Lab Module
			minCount = 1
		}

		PARAMETER
		{
			name = Antenna
			type = PartValidation
			partModule = ModuleDataTransmitter
			minCount = 1
			title = Carry a communications antenna
			hideChildren = true
		}

		PARAMETER
		{
			name = OrbitalStay
			type = Duration
			duration = 60d
			preWaitText = Keep the laboratory in a polar orbit of Mercury with at least 4 crew aboard for
			waitingText = Orbital science campaign in progress...
			completionText = Orbital science campaign complete, you may return to Earth when ready
			hideChildren = true

			PARAMETER
			{
				name = PolarOrbit
				type = Orbit
				targetBody = Mercury
				situation = ORBITING
				minInclination = 80
				maxInclination = 100
				title = Polar orbit of Mercury (inclination between 80 and 100 degrees)
			}

			PARAMETER
			{
				name = CrewAboard
				type = HasCrew
				minCrew = 4
				title = At least 4 Crewmembers aboard
			}
		}
	}

	PARAMETER
	{
		name = RadiationStudy
		type = RP1CollectScience
		targetBody = Mercury
		experiment = RP0PlanetaryRadiationStudy
		location = Space
		recoveryMethod = RecoverOrTransmit
		title = Planetary Radiation Environment Study of Mercury
		hideChildren = true
	}

	PARAMETER
	{
		name = RadarSurvey
		type = RP1CollectScience
		targetBody = Mercury
		experiment = RP0PlanetaryRadarSurvey
		location = Space
		recoveryMethod = RecoverOrTransmit
		title = Orbital Radar Survey of Mercury
		hideChildren = true
	}
}
