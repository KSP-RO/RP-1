	description = <b>Program: Crewed Saturn Exploration<br>Type: <color=blue>Optional</color></b><br><br>Tethys is a highly reflective, ice-dominated world dominated by the massive Odysseus impact crater and the enormous rift valley of Ithaca Chasma. Landing on its low-gravity surface provides a rare window into the tectonic history of Saturns icy moons.<br><br>Design and execute a mission to land at least two astronauts on the surface of Tethys. Once down, the crew will study the terrain with a field geology suite and analyze the volatiles trapped in the ice.
    synopsis = Land a crew of at least 2 on the surface of Tethys, plant a flag and run a field geology suite and volatile analysis.
    completedMessage = Outstanding execution! Astronauts have successfully touched down on Tethys. Conducting operations on this bright, icy world expands our operational footprint across the Saturnian moon system.
