CONTRACT_TYPE
{
    name = MimasLandingCrew
    title = Crewed Mimas Landing
    group = CrewedSaturnExp
    agent = Flag Planting

    description = <b>Program: Crewed Saturn System Exploration<br>Type: <color=blue>Optional</color></b><br><br>Deep inside Saturn's gravity well lies Mimas, the crater-scarred moon dominated by the massive Herschel Impact Basin. While small, operating near Mimas requires navigating intense radiation and Saturn's inner ring system.<br><br>Design and execute a mission to land at least two astronauts on the surface of Mimas.
    synopsis = Land a crew of at least 2 on Mimas and plant a flag.
    completedMessage = Outstanding work! Our astronauts have landed in the shadow of Saturn's rings and set foot on Mimas. The data collected from this inner moon expands our foothold across the Saturnian system.

    sortKey = 2531

    cancellable = true
    declinable = false
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 2
    maxSimultaneous = 1
    deadline = 0

    targetBody = Mimas

    // ************ REWARDS ************
    prestige = Trivial       
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 9000
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedSaturnExp
    }

    REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract
        contractType = FirstCrewedSaturnOrbit
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = vesselGroup
        type = VesselParameterGroup
        title = Crewed Mimas Landing Mission
        define = CrewedMimasLanding

        PARAMETER
        {
            name = TwoCrew
            type = HasCrew
            minCrew = 2
            maxCrew = 99
            title = Have at least 2 crew members on board
            hideChildren = true
        }

        PARAMETER
        {
            name = LandCrewed
            type = All
            title = Land the crewed lander and complete surface stay
            disableOnStateChange = true

            PARAMETER
            {
                name = TwoCrew
                type = HasCrew
                minCrew = 2
                maxCrew = 99
                title = Maintain a crew of at least 2
                hideChildren = true
            }

            PARAMETER
            {
                name = ReachState
                type = ReachState
                targetBody = Mimas
                situation = LANDED
            }
        }

        PARAMETER
        {
            name = PlantFlagOnMimas
            type = PlantFlag
