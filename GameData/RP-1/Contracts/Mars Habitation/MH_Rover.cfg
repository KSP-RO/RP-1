CONTRACT_TYPE
{
	name = MH_Rover
	title = Crewed Martian Rover Exploration
	group = MarsHabitation

	description = <b>Program: Operational Mars Habitation<br>Type: <color=green>Required</color></b><br><br>Our new Martian Base allows for long ranged rover expeditions to be based from there. Launch a crewed expedition using a rover from the Martian Base. You will have to explore two waypoints and then return to the Martian Base.

	genericDescription = Explore Mars with a crewed rover.

	synopsis = Explore Mars with a crewed rover and return to the Martian Base.

	completedMessage = Mission Success! The rover crew explored a new corner of Mars and returned to the Base safe and sound.

	sortKey = 2107

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mars


	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 1200
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalMarsHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = MH_BaseLanding
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = RoverExpedition
		type = VesselParameterGroup
		title = Complete the expedition with a crewed rover
		disableOnStateChange = true

		PARAMETER
		{
			name = TwoCrew
			type = HasCrew
			minCrew = 2
			crewOnly = true
			title = Have at least 2 crew on board
			hideChildren = true
		}
		PARAMETER
		{
			name = ExpeditionAlpha
			type = VisitWaypoint
			completeInSequence = true
			index = 0
			distance = 100.0
			title = Start your expedition within 100m of the Martian Base
			showMessages = true
			disableOnStateChange = true
			hideChildren = true
		}
		PARAMETER
		{
			name = ExpeditionBeta
			type = VisitWaypoint
			completeInSequence = true
			index = 1
			distance = 100.0
			title = Visit expedition site Beta
			showMessages = true
			disableOnStateChange = true
			hideChildren = true
		}
		PARAMETER
		{
			name = ExpeditionCharlie
			type = VisitWaypoint
			completeInSequence = true
			index = 2
			distance = 100.0
			title = Visit expedition site Charlie
			showMessages = true
			disableOnStateChange = true
			hideChildren = true
		}
		PARAMETER
		{
			name = ExpeditionReturn
			type = VisitWaypoint
			completeInSequence = true
			index = 0
			distance = 100.0
			title = End your expedition within 100m of the Martian Base
			showMessages = true
			disableOnStateChange = true
			hideChildren = true
		}
	}

	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator

		WAYPOINT
		{
			name = Martian Base
			hidden = False
			targetBody = Mars
			icon = marker
			altitude = 0.0
			latitude = Vessel(MarsBase).Location().Latitude()
			longitude = Vessel(MarsBase).Location().Longitude()
		}
		RANDOM_WAYPOINT_NEAR
		{
			name = Site Beta
			hidden = false
			targetBody = Mars
			count = 1
			icon = marker
			altitude = 0.0
			waterAllowed = false
			nearIndex = 0
			minDistance = 15000.0
			maxDistance = 25000.0
		}
		RANDOM_WAYPOINT_NEAR
		{
			name = Site Charlie
			hidden = false
			targetBody = Mars
			count = 1
			icon = marker
			altitude = 0.0
			waterAllowed = false
			nearIndex = 0
			minDistance = 15000.0
			maxDistance = 25000.0
		}
	}
}
