@PART[*]:HAS[#solarUseMass[?rue],@SolarConfig]:AFTER[RealismOverhaul_SolarPanels]
{
    @SolarConfig:HAS[#level[0]]
    {
        %costPerM2 = #$@ROSOLAR_CONFIG/ROS_TECH[TL0]/costPerM2$
        %costMultHinged = #$@ROSOLAR_CONFIG/ROS_TECH[TL0]/costMultHinged$
        %costMultFolded = #$@ROSOLAR_CONFIG/ROS_TECH[TL0]/costMultFolded$
        %costMultTrack = #$@ROSOLAR_CONFIG/ROS_TECH[TL0]/costMultTrack$
    }
