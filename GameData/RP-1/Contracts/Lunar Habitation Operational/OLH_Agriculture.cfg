CONTRACT_TYPE
{
	name = OLH_Agriculture
	title = Lunar Agriculture
	group = OperationalLunarHabitation

	description = <b>Program: Operational Lunar Habitation<br>Type: <color=green>Required</color></b><br><br>One crucial step towards permanent habitation on the Moon will be the local production of food. Due to the lack of an atmosphere, we will have to use hydroponics. Add two <b>hydroponic greenhouses</b> to our Lunar Base. This will be enough to feed one crew member! <br><br>Each greenhouse needs about 6 kW of power and a steady supply of <b>Ammonia</b> as the nitrogen nutrient for its crops, and holds only 30 days of it. Either add additional <b>Ammonia</b> tanks or fly a resupply mission.

	synopsis = Grow food at the Lunar Base

	completedMessage = The first lunar harvest is in! Our crew are eating food grown on the Moon, and they think it tastes great!

	sortKey = 2006

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon


	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 1000
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalLunarHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OLH_BaseExpansion
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = LunarAgriculture
		type = VesselParameterGroup
		title = Grow food at the Lunar Base for 60 days
		vessel = MoonBase
		notes = You can work on other contracts while the Base is working. You are safe to return to Mission Control
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Moon
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = HasHydroponics
			type = HasResource
			resource = Resource("_Hydroponics") // Doesn't like a leading _
			minQuantity = 1.99
			title = Run enough Hydroponics to feed 1 crew (2 Greenhouses)
			hideChildren = true
		}
		PARAMETER
		{
			name = HasAmmonia
			type = HasResource
			resource = Ammonia
			minQuantity = 0.01
			title = Keep the crops supplied with Ammonia
			hideChildren = true
		}
		PARAMETER
		{
			name = Duration
			type = Duration
			duration = 60d
			preWaitText = Plant the first crops
			waitingText = Growing crops
			completionText = 60 days of lunar agriculture completed
		}
	}
}
