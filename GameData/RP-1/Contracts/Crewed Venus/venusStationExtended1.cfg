CONTRACT_TYPE
{
    name = venusStationExtended1
    title = Venus Station: Extended Research I 
    group = CrewedVenusExp          
    agent = Exploration

    description = <b>Program: Crewed Venus Exploration <br>Type: <color=blue>Optional</color></b><br><br>Keep your Venus station in orbit for a second orbital stay of 584 days with at least 4 crew aboard throughout, and have the crew run the Planetary Radiation Environment Study and Atmospheric Electrical Activity Survey experiments. If the station leaves orbit or drops below 4 crew, the stay timer resets.<br><br>Completing this contract unlocks Venus Station: Extended Research II.
    synopsis = Keep the Venus station operating for a second orbital stay.
    completedMessage = Congratulations! The Venus station has now completed two orbital stays.

    sortKey = 2504

    cancellable = true
    declinable = true
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0

    targetBody = Venus

    // ************ REWARDS ************
    prestige = Trivial
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 150
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedVenusExp
    }

    REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract
        contractType = venusStation
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = VenusStation1
        type = VesselParameterGroup
        title = Venus Station: Extended Research I
        vessel = VenusStationVessel
        dissassociateVesselsOnContractCompletion = false

        PARAMETER
        {
            name = StillInVenusOrbit
            type = ReachState
            targetBody = Venus
            situation = ORBITING
            disableOnStateChange = true
            title = Keep the station in orbit around Venus
            hideChildren = true
        }

        PARAMETER
        {
            name = Crew
            type = HasCrew
            minCrew = 4
            title = Have at least 4 Crewmembers aboard
            hideChildren = true
        }
 
        PARAMETER
        {
            name = OrbitalStay2
            type = Duration
            duration = 584d
            preWaitText = Keep the station in Venus orbit with at least 4 crew aboard for
            waitingText = Station is in orbit with crew aboard, second orbital stay in progress...
            completionText = Orbital stay 2 complete
            hideChildren = true

            PARAMETER
            {
                name = InOrbitStay2
                type = ReachState
                targetBody = Venus
                situation = ORBITING
                disableOnStateChange = true
                title = In orbit around Venus
            }

            PARAMETER
            {
                name = CrewAboardStay2
                type = HasCrew
                minCrew = 4
                title = At least 4 Crewmembers aboard
            }
        }

        PARAMETER
        {
            name = StationExperiment1
            type =  RP1CollectScience
            targetBody = Venus
            experiment = RP0PlanetaryRadiationStudy
            recoveryMethod = RecoverOrTransmit
            title = Planetary Radiation Environment Study
            hideChildren = true
        }
 
        PARAMETER
        {
            name = StationExperiment2
            type =  RP1CollectScience
            targetBody = Venus
            experiment = RP0PlanetaryElectricalActivity
            recoveryMethod = RecoverOrTransmit
            title = Atmospheric Electrical Activity Survey
            hideChildren = true
        }
    }
}