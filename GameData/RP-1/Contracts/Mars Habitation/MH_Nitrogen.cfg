CONTRACT_TYPE
{
	name = MH_Nitrogen
	title = Martian Fertiliser
	group = MarsHabitation

	description = <b>Program: Operational Mars Habitation<br>Type: <color=green>Required</color></b><br><br>In order for our greenhouses to not depend on Ammonia shipments from Earth, we can instead source the Ammonia from the Martian air! Separate it with a <b>Buffer Gas Separator</b>, combine it with hydrogen from Martian water in the <b>Haber-Bosch Process</b>, and grow crops for all six crew on Martian fertiliser for 90 days.<br><br>A Mini ISRU or ISRU can host both the Buffer Gas Separator and the Haber-Bosch Process. The hydrogen can come from Water Electrolysis.

	synopsis = Make fertiliser from the Martian air at the Martian Base

	completedMessage = Our crops now grow on nitrogen pulled out of the Martian sky!

	sortKey = 2104

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mars


	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 1000
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalMarsHabitation
	}
	REQUIREMENT
	{
		name = CompleteAgriculture
		type = CompleteContract
		contractType = MH_Agriculture
	}
	REQUIREMENT
	{
		name = CompleteWater // Hydrogen from Martian water
		type = CompleteContract
		contractType = MH_Water
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = NitrogenFixation
		type = VesselParameterGroup
		title = Grow food for six crew on Martian Ammonia for 90 days
		vessel = MarsBase
		notes = You can work on other contracts while the Base is working. You are safe to return to Mission Control
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Mars
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = HasHaberBosch
			type = HasResource
			resource = Resource("_HaberBosch")
			minQuantity = 0.99
			title = Run the Haber-Bosch Process
			hideChildren = true
		}
		PARAMETER
		{
			name = HasNitrogen
			type = HasResource
			resource = Nitrogen
			minQuantity = 0.01
			title = Keep the Haber-Bosch Process supplied with Nitrogen
			hideChildren = true
		}
		PARAMETER
		{
			name = HasHydrogen
			type = HasResource
			resource = Hydrogen
			minQuantity = 0.01
			title = Keep the Haber-Bosch Process supplied with Hydrogen
			hideChildren = true
		}
		PARAMETER
		{
			name = HasHydroponics
			type = HasResource
			resource = Resource("_Hydroponics")
			minQuantity = 11.99
			title = Run enough Hydroponics to feed 6 crew
			hideChildren = true
		}
		PARAMETER
		{
			name = Duration
			type = Duration
			duration = 90d
			preWaitText = Start up the Haber-Bosch Process
			waitingText = Making fertiliser from the Martian air
			completionText = 90 days of Martian fertiliser production completed
		}
	}
}
