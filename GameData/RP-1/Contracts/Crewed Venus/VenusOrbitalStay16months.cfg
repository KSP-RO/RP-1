CONTRACT_TYPE
{
    name = VenusOrbitalStay16months
    title = Venus 16 Month Orbital Stay
    group = CrewedVenusExp
    agent = Exploration

    description = <b>Program: Crewed Venus Exploration <br>Type: <color=blue>Optional</color></b><br><br> Maintain a continuous presence in Venus orbit for 16 months (480 days). The crew must endure deep-space radiation, strict life support limitations, and complex thermal management. Bring them home safe.
    synopsis = Sustain a crew in orbit of Venus for 16 months before returning them or replacing them.
    completedMessage = Incredible! Our crew has successfully endured an 16-month orbital stay around Venus. The data they have returned will revolutionize our understanding of planetary atmospheres and long-duration crewed spaceflight.

    sortKey = 2508

    cancellable = true
    declinable = false
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 2
    maxSimultaneous = 1
    deadline = 0

    targetBody = Venus

    // ************ REWARDS ************
    prestige = Trivial
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 900
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedVenusExp
    }

    REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract
        contractType = FirstCrewedVenusOrbit
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = orbitalStayGroup
        type = VesselParameterGroup
        title = Maintain a crew of at least 4 in Venus orbit for 16 months

        PARAMETER
        {
            name = Crewmembers
            type = HasCrew
            minCrew = 3
            title = Have at least 3 crewmembers on board
            hideChildren = true
        }

        PARAMETER
        {
            name = VenusOrbit
            type = ReachState
            targetBody = Venus
            situation = ORBITING
			title = Reach orbit of Venus and Stay in an orbit around Venus for at least 480 days

            PARAMETER
            {
                name = Duration
                type = Duration
                duration = 480d
                preWaitText = Enter specified orbit around Venus with required crew.
                waitingText = Orbiting Venus...
                completionText = Stay completed, you may return home now.
            }
        }

        PARAMETER
        {
            name = ReturnHome
            type = RP1ReturnHome
            title = Return Home Safely
            hideChildren = true
            completeInSequence = true
        }
    }
}