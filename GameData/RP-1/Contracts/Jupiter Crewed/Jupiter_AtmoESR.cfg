CONTRACT_TYPE
{
	name = Jupiter_AtmoESR
	title = Jupiter Atmospheric Expedition Probe
	group = CrewedJupiterExp
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Jupiter Exploration<br>Type: <color=blue>Optional</color></b><br><br>While the Jupiter Expedition Vessel is in orbit, send an uncrewed probe into the Jovian atmosphere to study its make-up. Climbing back out of Jupiter's gravity well is not possible, so the probe is a one-way mission.

	synopsis = While the Jupiter Expedition Vessel is in orbit, send an uncrewed probe into the Jovian atmosphere.

	completedMessage = Congratulations! Our scientists have learned valuable information about the make-up of the atmosphere.

	sortKey = 1910

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Jupiter

	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 2500
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedJupiterExp
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = vesselGroupLaunch
		type = VesselParameterGroup
		title = Have the Jupiter Expedition Vessel in orbit of Jupiter
		notes = The vessel must include at least 1 Laboratory
		define = JupiterExpeditionMothership
		disableOnStateChange = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = HasScienceModule
			type = PartValidation
			partModule = Laboratory
			title = Carry a Science Lab Module
			minCount = 1
		}

		PARAMETER
		{
			name = JupiterOrbit
			title = Reach orbit of Jupiter with a maximum pe of 2,800,000 km and a maximum ap of 2,850,000 km
			type = Orbit
			maxPeA = 2800000000  // 1.5x Callisto Periapsis at 1,869,000 km
			maxApA = 2850000000  // 1.5x Callisto Apoapsis at 1,897,000 km
			targetBody = Jupiter
			disableOnStateChange = true
		}
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Jupiter atmospheric probe

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = EnterAtmo
			type = ReachState
			targetBody = Jupiter
			situation = FLYING
			disableOnStateChange = true
			maxAltitude = 1400000
			title = Enter Jupiter's atmosphere below 1,400 km
			hideChildren = true
		}
	}
}
