CONTRACT_TYPE
{
	name = DownrangeInSpaceIgnition
	group = SuborbRocketDev
	agent = Federation Aeronautique Internationale
	title = Demonstrate Engine Ignition In Space
	
	tag = exclude_SoundingDownrange
	
	description = <b>Program: Early Rocket Development<br>Type: <color=red>CAPSTONE</color></b><br><br>Design, build, and launch a rocket that will travel @/minimumDistance.Print() km or more fully guided over ground, perform attitude control excercises, and perform an in-space ignition with @/burndV.Print() m/s of ΔV. <b><color="white">Your rocket must be suborbital (over 140 km) for the contract to be completed. You must have a Near-Earth avionics unit with sufficient control tonnage on your rocket for the entire flight.</color></b> Perfecting this is part of launch vehicle development to tune your ascent profile and develop high-altitude staging methods. The current distance that your rocket has traveled can be seen in the contract parameters in the Contracts App display for this contract. It will update in real time. &br;&br;<b><color="green">@RP0:f3BadAdvice</color></b>
	
	synopsis = Travel @/minimumDistance.Print() km or more downrange with an uncrewed craft whilst holding various attitudes and performing a burn.
	
	completedMessage = Congratulations on a successful launch!
	
	sortKey = 104

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0
	
	targetBody = HomeWorld()
	
	// ************ REWARDS ************
	prestige = Exceptional
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 40
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = SuborbRocketDev
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = DownrangeInSpaceControl
	}
	
	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = exclude_SoundingRocket
		invertRequirement = true
	}
	
	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = exclude_SoundingDownrange
		invertRequirement = true
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = exclude_EarlySatellite
		invertRequirement = true
	}
	
	DATA
	{
		title = MinimumDistance
		type = int
		minimumDistance = 1000
	}
	
	DATA
	{
		title = BurndV
		type = int
		burndV = 2500 //m/s
	}
	
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		
		title = Demonstrate vacuum attitude control and reach @/minimumDistance.Print() km downrange.
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}

		PARAMETER
		{
			name = BuiltAtVAB
			type = VesselBuiltAt
			builtAt = VAB
		}

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
						
		PARAMETER
		{
			name = PerformBurn
			type = VesselParameterGroup
			title = Perform a @/burndV.Print() m/s burn whilst in space holding a specific attitude
			completeInSequence = true
			
			PARAMETER
			{
				name = ReachAlt
				type = ReachState
				minAltitude = 140000
				disableOnStateChange = true
				title = Reach an altitude of at least 140 km
				hideChildren = true
			}
			
			PARAMETER
			{
				name = Attitude4
				type = HoldAttitude
				targetPitch = 0
				targetHeading = 90
				ignoreRoll = true
			}
			
			PARAMETER
			{
				name = Accelerate
				type = dVExpended
				completeInSequence = true
				requiredDV = @/burndV
			}			
		}
		
		PARAMETER
		{
			name = ReachDistance
			type = DownrangeDistance
			distance = @/minimumDistance * 1000
			title = Reach a downrange distance of at least @/minimumDistance.Print() km
		}	
	}
}
