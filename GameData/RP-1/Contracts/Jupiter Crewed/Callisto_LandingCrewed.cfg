CONTRACT_TYPE
{
	name = Callisto_LandingCrewed
	title = First Crewed Callisto Landing
	group = CrewedCallistoExp
	agent = Flag Planting

	description = <b>Program: Crewed Jupiter Exploration<br>Type: <color=green>Required</color></b><br><br>We want to put "Boots on the Ground" and explore the surface of Callisto with humans. This mission will be the most ambitious, complex and expensive mission ever undertaken by our space agency.&br;&br;Design a mission that will successfully land at least two humans on Callisto, stay for at least 30 days and return safely to Earth.

	synopsis = Send a crew of 2 to land on the surface of Callisto and return home safely

	completedMessage = Congratulations! Human beings have set foot on a Moon of Jupiter! The monumental task that you have accomplished is something to be proud of!

	sortKey = 1901

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Callisto

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 4000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedJupiterExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = Callisto_ESR
		invertRequirement = true
	}
	
	PARAMETER
	{
		name = vesselGroup
		type = VesselParameterGroup
		title = First Crewed Callisto Landing

		PARAMETER
		{
			name = TwoCrew
			type = HasCrew
			minCrew = 2
			maxCrew = 99
			title = Have at least 2 crewmembers on board
			hideChildren = true
		}
		PARAMETER
		{
			name = LandCrewed
			type = All
			title = Land the crewed lander
			disableOnStateChange = true

			PARAMETER
			{
				name = TwoCrew
				type = HasCrew
				minCrew = 2
				maxCrew = 99
				title = Have at least 2 crewmembers on board
				hideChildren = true
			}
			PARAMETER
			{
				name = ReachState
				type = ReachState
				targetBody = Callisto
				situation = LANDED
				PARAMETER
				{
					name = Duration
					type = Duration
					duration = 14d
					preWaitText = Land on Callisto.
					waitingText = Exploring...
					completionText = Exploration completed, you may return to Earth when ready.
				}
			}
		}
		PARAMETER
		{
			name = PlantFlagOnCallisto
			type = PlantFlag
			targetBody = Callisto
			title = Plant a flag on Callisto! Don't forget the picture
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = ReturnToOrbit
			type = Orbit
			situation = ORBITING
			disableOnStateChange = true
			title = Return to orbit
			
			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 2m
				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}
}