CONTRACT_TYPE
{
	name = RSD_LunarCargo
	title = Heavy Lunar Cargo Delivery
	group = ReusableSpacecraftDev
	agent = Exploration

	description = <b>Program: Reusable Spacecraft Development<br>Type: <color=green>Required</color></b><br><br>A permanent presence on the Moon will need far more cargo than expendable stages can carry economically. Show that an efficient cargo stage can do the heavy lifting: fly a vessel carrying at least 15,000 units (15 tonnes) of ResearchPayload into lunar orbit, then bring the same vessel back to low Earth orbit so it can be loaded and flown again.
	genericDescription = Fly a vessel carrying 15 t of ResearchPayload into lunar orbit and back to low Earth orbit.
	synopsis = Fly a vessel carrying 15 t of ResearchPayload into lunar orbit and back to low Earth orbit.

	completedMessage = The cargo ship is back in low Earth orbit, ready to be loaded for its next run. Efficient cargo stages can now supply operations on the Moon.

	sortKey = 2101

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 3
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 400
	failureReputation = 0

	// ************ REQUIREMENTS ************
	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ReusableSpacecraftDev
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = RSD_OrbitalTug
		title = Complete the Reusable Orbital Tug contract
	}

	// ************ PARAMETERS ************
	PARAMETER
	{
		name = CargoShip
		type = VesselParameterGroup
		title = Lunar cargo vessel

		PARAMETER
		{
			name = Departure
			type = All
			title = Park in low Earth orbit as a single stage (NOTE: Decouplers and Radial Decouplers are not allowed)
			disableOnStateChange = true

			PARAMETER
			{
				name = ParkingOrbit
				type = Orbit
				targetBody = HomeWorld()
				situation = ORBITING
				maxApA = 2000000
				title = Low Earth orbit (apogee below 2,000 km)
				hideChildren = true
			}

			PARAMETER
			{
				name = NoSeparators
				type = PartValidation
				title = No decouplers remaining on the vessel
				hideChildren = true
				NONE
				{
					partModule = ModuleDecouple
				}
				NONE
				{
					partModule = ModuleAnchoredDecoupler
				}
			}
		}

		PARAMETER
		{
			name = CargoDelivery
			type = All
			title = Reach lunar orbit carrying at least 15,000 units (15 t) of ResearchPayload
			disableOnStateChange = true
			completeInSequence = true

			PARAMETER
			{
				name = HasCargo
				type = HasResource
				resource = ResearchPayload
				minQuantity = 14999.9
				title = Carry at least 15,000 units (15 t) of ResearchPayload
				hideChildren = true
			}

			PARAMETER
			{
				name = LunarOrbit
				type = ReachState
				targetBody = Moon
				situation = ORBITING
				title = Enter lunar orbit
				hideChildren = true
			}
		}

		PARAMETER
		{
			name = LowOrbitReturn
			type = Orbit
			targetBody = HomeWorld()
			situation = ORBITING
			maxApA = 2000000
			completeInSequence = true
			title = Return to low Earth orbit (apogee below 2,000 km)
			hideChildren = true
		}
	}
}
