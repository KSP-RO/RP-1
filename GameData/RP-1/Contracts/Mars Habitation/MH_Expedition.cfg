CONTRACT_TYPE
{
	name = MH_Expedition
	title = Martian Base Expedition
	group = MarsHabitation

	description = <b>Program: Mars Habitation<br>Type: <color=green>Required</color></b><br><br>Our Base is ready for its first crew! Send an expedition to the Base and then keep them there for at least 500 days.
	synopsis = Keep a crew of six on the Martian Base for 500 days

	completedMessage = Congratulations! Another crew has lived and worked on Mars for well over a year.

	sortKey = 2106

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mars


	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 1500
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = MarsHabitation
	}
	// The Base has to be fully operational before the crews move in
	REQUIREMENT
	{
		name = CompleteOxygen
		type = CompleteContract
		contractType = MH_Oxygen
	}
	REQUIREMENT
	{
		name = CompleteWater
		type = CompleteContract
		contractType = MH_Water
	}
	REQUIREMENT
	{
		name = CompleteAgriculture
		type = CompleteContract
		contractType = MH_Agriculture
	}
	REQUIREMENT
	{
		name = CompleteNitrogen
		type = CompleteContract
		contractType = MH_Nitrogen
	}
	REQUIREMENT
	{
		name = CompleteRegolith
		type = CompleteContract
		contractType = MH_Regolith
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = StayOnBase
		type = VesselParameterGroup
		title = Keep at least 6 crew aboard the Martian Base for 500 days
		vessel = MarsBase
		notes = You can work on other contracts while your crew are working. You are safe to return to Mission Control
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Mars
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = SixCrew
			type = HasCrew
			minCrew = 6
			crewOnly = true
			title = Have at least 6 crewmembers on board
			hideChildren = true
		}
		PARAMETER
		{
			name = researchPayloadCapacity
			type = HasResourceCapacity
			resource = ResearchPayload
			minQuantity = 4199
			title = Room for at least 4199 units of Research Payload
			hideChildren = true
		}
		PARAMETER
		{
			name = MarsHabitation
			type = RP1CollectScience
			title = Complete at least 500 out of 3650 days of Martian Habitation
			notes = This experiment requires 6 crew including a Scientist, and consumes 250 units of Research Payload every 30 days 
			targetBody = Mars
			situation = SrfLanded
			experiment = RP0MarsHabit
			fractionComplete = @/experimentCompletion
		}
	}
}
