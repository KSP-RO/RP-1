CONTRACT_TYPE
{
	name = RSD_InterplanetaryRoundTrip
	title = Interplanetary Round Trip
	group = ReusableSpacecraftDev
	agent = Exploration

	description = <b>Program: Reusable Spacecraft Development<br>Type: <color=green>Required</color></b><br><br>Reusable stages are meant to carry humanity beyond the Moon. Before crews ride one to another planet, a stage must prove it can make the trip and come back to be flown again. Send a vessel carrying at least 10,000 units (10 t) of ResearchPayload into orbit around Mars or Venus, then bring the same vessel back into Earth orbit.<br><br>Hydrogen will boil off over a flight lasting more than a year: heavy MLI (50+ layers) or storable propellants.
	genericDescription = Send a vessel carrying 10 t of ResearchPayload into orbit around Mars or Venus and bring it back to Earth orbit.
	synopsis = Send a vessel carrying 10 t of ResearchPayload into orbit around Mars or Venus and bring it back to Earth orbit.

	completedMessage = The stage is back from another planet and ready to fly again. The way to the planets is open.

	sortKey = 2102

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 600
	failureReputation = 0

	// ************ REQUIREMENTS ************
	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ReusableSpacecraftDev
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = RSD_LunarCargo
		title = Complete the Heavy Lunar Cargo Delivery contract
	}
	// ************ PARAMETERS ************
	PARAMETER
	{
		name = InterplanetaryReuseVessel
		type = VesselParameterGroup
		title = Interplanetary round-trip vessel

		PARAMETER
		{
			name = Departure
			type = All
			title = Park in low Earth orbit as a single stage (NOTE: Decouplers and Radial Decouplers are not allowed)
			disableOnStateChange = true

			PARAMETER
			{
				name = ParkingOrbit
				type = Orbit
				targetBody = HomeWorld()
				situation = ORBITING
				maxApA = 2000000
				title = Low Earth orbit (apogee below 2,000 km)
				hideChildren = true
			}

			PARAMETER
			{
				name = NoSeparators
				type = PartValidation
				title = No decouplers remaining on the vessel
				hideChildren = true
				NONE
				{
					partModule = ModuleDecouple
				}
				NONE
				{
					partModule = ModuleAnchoredDecoupler
				}
			}
		}

		PARAMETER
		{
			name = ReachPlanet
			type = All
			title = Enter orbit around Mars or Venus carrying at least 10,000 units (10 t) of ResearchPayload
			disableOnStateChange = true
			completeInSequence = true

			PARAMETER
			{
				name = HasCargo
				type = HasResource
				resource = ResearchPayload
				minQuantity = 9999.9
				title = Carry at least 10,000 units (10 t) of ResearchPayload
				hideChildren = true
			}

			PARAMETER
			{
				name = ReachAny
				type = Any
				title = Enter orbit around Mars or Venus

				PARAMETER
				{
					name = MarsOrbit
					type = ReachState
					targetBody = Mars
					situation = ORBITING
					title = Orbit Mars
					hideChildren = true
				}
				PARAMETER
				{
					name = VenusOrbit
					type = ReachState
					targetBody = Venus
					situation = ORBITING
					title = Orbit Venus
					hideChildren = true
				}
			}
		}

		PARAMETER
		{
			name = EarthOrbitReturn
			type = ReachState
			targetBody = HomeWorld()
			situation = ORBITING
			title = Return to Earth orbit
			completeInSequence = true
			hideChildren = true
		}
	}
}
