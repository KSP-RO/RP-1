CONTRACT_TYPE
{
	name = OES_Resupply_Rep
	title = Automated Station Resupply (Repeatable)
	group = OperationalEarthStations
	agent = Stations

	description = <b>Program: Operational Earth Stations<br>Type: <color=blue>Optional</color></b><br><br>Send an <b>uncrewed</b> cargo vehicle to our station. It should carry at least a month of Research Payload or two months of Food for three crew. Once the crew has unloaded it, undock the empty vehicle and deorbit it so that it burns up in the atmosphere.<br><br><b>Number of Cargo Deliveries Completed: @/index / @/maxCompletions</b>

	genericDescription = Launch a resupply mission and dock with your space station.

	synopsis = Send supplies to the station

	completedMessage = Resupply complete! The station crew has everything they need to continue their work.

	sortKey = 1612

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 30
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************

	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 150
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalEarthStations
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OES_Resupply
		minCount = 2
	}
	REQUIREMENT
	{
		name = Cooldown
		type = Expression
		expression = UniversalTime() - $OES_Resupply_LastTime > 5184000 // 60 days since the last delivery
		title = Must not have resupplied the station in the last 60 days
	}

	// ************ TRACKING ************

	DATA
	{
		type = int
		index = $OES_Resupply_Rep_Count + 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression

		CONTRACT_COMPLETED_SUCCESS
		{
			OES_Resupply_Rep_Count = $OES_Resupply_Rep_Count + 1
			OES_Resupply_LastTime = UniversalTime()
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = ResupplyVehicle
		type = VesselParameterGroup
		title = Launch a resupply mission and dock with the station
		disableOnStateChange = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new resupply vehicle
			hideChildren = true
		}
		PARAMETER
		{
			name = HasCargo
			type = Any
			title = Carry at least 750 units of Research Payload or 1050 units of Food

			PARAMETER
			{
				name = HasResearchPayload
				type = HasResource
				resource = ResearchPayload
				minQuantity = 750
				title = At least 750 units of Research Payload
				hideChildren = true
			}
			PARAMETER
			{
				name = HasFood
				type = HasResource
				resource = Food
				minQuantity = 1050
				title = At least 1050 units of Food
				hideChildren = true
			}
		}
		PARAMETER
		{
			name = Docking
			type = Docking
			vessel = OperationalStation
			completeInSequence = true
			title = Dock with the station
		}
	}
	PARAMETER
	{
		name = vesselGroupStation
		type = VesselParameterGroup
		title = Keep the station in orbit
		vessel = OperationalStation
		completeInSequence = true

		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 300000
			maxApA = 500000
			targetBody = HomeWorld()
			title = Keep the station in a stable orbit with a perigee greater than 300 km and an apogee less than 500 km
		}
	}
}
