CONTRACT_TYPE
{
	name = OLH_Crew6_6Month
	title = Six-month Crewed Lunar Expedition
	group = OperationalLunarHabitation

	description = <b>Program: Operational Lunar Habitation<br>Type: <color=green>Required</color></b><br><br>Send an expedition to our Lunar Base. Keep <b>six</b> crew aboard the Base for six months.<br><br>A resupply mission can be sent if your mission profile requires it, but take note of new Research Payload requirements. This contract does not require a new set of crew to complete.

	synopsis = Keep a crew of six on the Lunar Base for six months

	completedMessage = Congratulations! Another successful Lunar Expedition!

	sortKey = 2001 // Call it a space odyssey

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 0 // Not capped
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon


	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 800	
	failureReputation = 0 

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalLunarHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OLH_BaseExpansion
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = StayOnBase
		type = VesselParameterGroup
		title = Keep at least 6 crew aboard the Lunar Base for 180 days
		vessel = MoonBase
		notes = You can work on other contracts while your crew are working. You are safe to return to Mission Control
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Moon
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = SixCrew
			type = HasCrew
			minCrew = 6
			crewOnly = true
			title = Have at least 6 crewmembers on board
			hideChildren = true
		}
		PARAMETER
		{
			name = researchPayloadCapacity //make sure you can hold at least 90 days of research payload
			type = HasResourceCapacity
			resource = ResearchPayload
			minQuantity = 1500
		}
		// TODO: Replace with an RP1CollectScience of a new LunarHabit3
		PARAMETER
		{
			name = Duration
			type = Duration
			duration = 180d
			preWaitText = Keep 6 crew aboard the landed Base
			waitingText = Crew living aboard the Base
			completionText = The expedition has completed its six-month stay
		}
	}
