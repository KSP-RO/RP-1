CONTRACT_TYPE
{
	name = DownrangeInSpaceControl
	group = SuborbRocketDev
	agent = Federation Aeronautique Internationale
	title = Demonstrate Attitude Control In Space
	
	tag = exclude_SoundingDownrange
	
	description = <b>Program: Early Rocket Development<br>Type: <color=green>Required</color></b><br><br>Design, build, and launch a rocket that will travel @/minimumDistance.Print() km or more over ground while performing attitude control exercises. <b><color="white">Your rocket must be suborbital (over 140 km) for the contract to be completed.</color></b> Perfecting this is part of launch vehicle development to tune your ascent profile and develop high-altitude staging and control methods. Your vessel's attitude can be seen in Mechjeb's Surface Info window. The current distance that your rocket has traveled can be seen in the contract parameters in the Contracts App display for this contract. It will update in real time. &br;&br;<b><color="green">@RP0:f3BadAdvice</color></b>
	
	synopsis = Travel @/minimumDistance.Print() km or more downrange with an uncrewed craft whilst holding various attitudes.
	
	completedMessage = Congratulations on a successful launch!
	
	sortKey = 103

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0
	
	targetBody = HomeWorld()
	
	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 25
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = SuborbRocketDev
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = KarmanLine
	}
	
	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = exclude_SoundingRocket
		invertRequirement = true
	}
	
	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = exclude_SoundingDownrange
		invertRequirement = true
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = exclude_EarlySatellite
		invertRequirement = true
	}
	
	DATA
	{
		title = MinimumDistance
		type = int
		minimumDistance = 800 //km
	}
	
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		resetChildrenWhenVesselDestroyed = true
		title = Demonstrate vacuum attitude control and reach @/minimumDistance.Print() km downrange.
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}

		PARAMETER
		{
			name = BuiltAtVAB
			type = VesselBuiltAt
			builtAt = VAB
		}

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		
		PARAMETER
		{
			name = AvionicsCheck
			type = AvionicsCheck
			title = Have enough avionics control tonnage throughout the flight (do not lose control)
			continuousControlRequired = true
			hideChildren = true
		}

		PARAMETER
		{
			name = ReachAlt
			type = ReachState
			minAltitude = 140000
			disableOnStateChange = true
			title = Reach an altitude of at least 140 km
			hideChildren = true
		}
				
		PARAMETER
		{
			name = DoNotBurn
			type = Not
			title = Do not expend more than 10 m/s of ΔV whilst above 100km
			completeInSequence = true
			
			PARAMETER
			{
				name = ReachAlt2
				type = ReachState
				minAltitude = 100000
				title = Above 100km
				hideChildren = true
			}
			
			PARAMETER
			{
				name = DoNotAccelerate
				type = DeltaVExpended
				completeInSequence = true
				requiredDV = 10
			}
		}
				
		PARAMETER
		{
			name = HoldAttitude_1
			type = All
			title = Hold attitude 1
			disableOnStateChange = true
						
			PARAMETER
			{
				name = ReachAlt
				type = ReachState
				minAltitude = 140000
				title = Above 140km
				hideChildren = true
			}
			
			PARAMETER
			{
				name = Attitude1
				type = HoldAttitude
				targetPitch = 0
				targetHeading = 90
				targetRoll = 0
			}
			
			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 20s
				completeInSequence = true
				hideChildren = true
			}
		}
			
		PARAMETER
		{
			name = HoldAttitude_2
			type = All
			title = Hold attitude 2
			disableOnStateChange = true
			
			PARAMETER
			{
				name = ReachAlt
				type = ReachState
				minAltitude = 140000
				title = Above 140km
				hideChildren = true
			}
			
			PARAMETER
			{
				name = Attitude2
				type = HoldAttitude
				targetPitch = 0
				targetHeading = 0
				targetRoll = 0
			}
						
			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 20s
				completeInSequence = true
				hideChildren = true
			}			
		}
		
		PARAMETER
		{
			name = HoldAttitude_3
			type = All
			title = Hold attitude 3
			disableOnStateChange = true
			
			PARAMETER
			{
				name = ReachAlt
				type = ReachState
				minAltitude = 140000
				title = Above 140km
				hideChildren = true
			}
			
			PARAMETER
			{
				name = Attitude3
				type = HoldAttitude
				targetPitch = 45
				targetHeading = 180
				targetRoll = 0
			}
						
			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 20s
				completeInSequence = true
				hideChildren = true
			}			
		}
		
		PARAMETER
		{
			name = ReachDistance
			type = DownrangeDistance
			distance = @/minimumDistance * 1000
			title = Reach a downrange distance of at least @/minimumDistance.Print() km
		}	
	}
}
