CONTRACT_TYPE
{
	name = OES_ExtendedOccupation
	title = Extended Station Occupation
	group = OperationalEarthStations
	agent = Stations

	description = <b>Program: Operational Earth Stations<br>Type: <color=blue>Optional</color></b><br><br>Our station is permanently crewed, but every year of habitation teaches us more about living in space. Keep at least <b>three</b> crew aboard the station for another year of Permanent Space Habitation.<br><br>The year does not have to be continuous, and crews can rotate as needed.&br;&br;<b>Number of Years Completed: @/index / @/maxCompletions</b>

	synopsis = Keep a crew of three on the station for another year

	completedMessage = Another year in orbit! Our crews are writing the book on living in space.

	sortKey = 1620

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 8 // One per entry in experimentList, completes the 3650 days of Permanent Space Habitation
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************

	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 600
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalEarthStations
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OES_ContinuousOccupation
	}

	// Each year takes Permanent Space Habitation one year further, on top of the 755 days of the required contracts.
	DATA
	{
		type = List<float>
		experimentList = [0.30685, 0.40685, 0.50685, 0.60685, 0.70685, 0.80685, 0.90685, 1]
	}
	DATA
	{
		type = float
		experimentCompletion = @/experimentList.ElementAt(@/index)
		durationText = Round(3650 * @/experimentList.ElementAt(@/index), 1)
	}
	DATA
	{
		type = int
		index = $OES_ExtendedOccupation_Count + 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression

		CONTRACT_COMPLETED_SUCCESS
		{
			OES_ExtendedOccupation_Count = $OES_ExtendedOccupation_Count + 1
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = StayOnStation
		type = VesselParameterGroup
		title = Keep at least 3 crew aboard the station for another year
		vessel = OperationalStation
		notes = You can work on other contracts while your crew are working. You are safe to return to Mission Control
		disableOnStateChange = true

		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 300000
			maxApA = 500000
			targetBody = HomeWorld()
			title = Remain in a stable orbit
			hideChildren = true
		}
		PARAMETER
		{
			name = ThreeCrew
			type = HasCrew
			minCrew = 3
			crewOnly = true
			title = Have at least 3 crewmembers on board
			hideChildren = true
		}
		PARAMETER
		{
			name = PermanentSpaceHabitation
			type = RP1CollectScience
			title = Complete at least @/durationText out of 3650 days of Permanent Space Habitation
			notes = This experiment requires 3 crew and consumes 750 units of Research Payload every 30 days
			targetBody = HomeWorld()
			situation = InSpaceLow
			experiment = RP0longDurationHabit3
			fractionComplete = @/experimentCompletion
		}
	}
}
