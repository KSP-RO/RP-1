CONTRACT_TYPE
{
	name = RSD_MarsCrewTransport
	title = Reusable Mars Crew Transport
	group = ReusableSpacecraftDev
	agent = Exploration

	description = <b>Program: Reusable Spacecraft Development<br>Type: <color=blue>Optional</color></b><br><br>An expedition to Mars is far too expensive to repeat if the ship that carried the crew is discarded at the end. Show that a crew transport can make the voyage and come back to be used again: fly a vessel with at least 4 crew into Mars orbit without staging, then bring the same vessel back to low Earth orbit with the crew still aboard.
	genericDescription = Fly a reusable transport with at least 4 crew to Mars orbit and back to low Earth orbit.
	synopsis = Fly a reusable transport with at least 4 crew to Mars orbit and back to low Earth orbit.

	completedMessage = The Mars transport is back in low Earth orbit, ready to be refitted for the next expedition. Mars is now a route, not a one-off voyage.

	sortKey = 2105

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 2
	maxSimultaneous = 1
	deadline = 0


	targetBody = Mars

	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 500
	failureReputation = 0

	// ************ REQUIREMENTS ************
	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ReusableSpacecraftDev
	}

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedMarsExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = RSD_InterplanetaryRoundTrip
		title = Complete the Interplanetary Round Trip contract
	}

	// ************ PARAMETERS ************
	PARAMETER
	{
		name = ReusableCrewShip
		type = VesselParameterGroup
		title = Fly the crew transport to Mars orbit
		define = RSDMarsCrewShip
		disableOnStateChange = true

		PARAMETER
		{
			name = ReusableCrewShipDeparture
			type = All
			title = Reach Mars orbit with at least 4 crew, without staging
			disableOnStateChange = true

			PARAMETER
			{
				name = HasCrew
				type = HasCrew
				minCrew = 4
				crewOnly = true
				title = Have at least 4 crew members on board
				hideChildren = true
			}
			PARAMETER
			{
				name = NoStaging
				type = NoStaging
				title = Do not stage
				failContract = false
			}
			PARAMETER
			{
				name = DestinationOrbit
				type = ReachState
				targetBody = Mars
				situation = ORBITING
				title = Enter Mars orbit
				hideChildren = true
			}
		}
	}

	PARAMETER
	{
		name = Return
		type = VesselParameterGroup
		title = Bring the crew transport back
		vessel = RSDMarsCrewShip
		completeInSequence = true

		PARAMETER
		{
			name = ReturnCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = LowOrbitReturn
			type = Orbit
			targetBody = HomeWorld()
			situation = ORBITING
			maxApA = 2000000
			title = Return to low Earth orbit with the crew (apogee below 2,000 km)
			hideChildren = true
		}
	}
}
