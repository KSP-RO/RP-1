	failureFunds = 0
	rewardReputation = 800	
	failureReputation = 0 

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalLunarHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OLH_BaseExpansion
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = LunarScienceObjectives
		type = All
		title = Complete scientific mission objectives on the Moon
