// Purchase cost to unlock these carriers. You can use them in sims without unlocking them, but only if they are researched or being researched. 
// You can only use them for the real deal if you've unlocked them
@ENTRYCOSTMODS:FOR[RP-0]
{ // Syntax for a tech: Airlaunch- and name, like B29, etc.
	Airlaunch-B29 = 5000
	Airlaunch-B50 = 3000, Airlaunch-B29
	Airlaunch-NB52 = 15000
	Airlaunch-NB52B = 3000, Airlaunch-NB52
}

PARTUPGRADE
{
	name = Airlaunch-B29
	partIcon = SXTmk3Cockpit52
	techRequired = supersonicDev
