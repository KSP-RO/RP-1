CONTRACT_TYPE
{
	name = OLH_LunarHydrolox
	title = Lunar Propellant Depot
	group = OperationalLunarHabitation

	description = <b>Program: Operational Lunar Habitation<br>Type: <color=blue>Optional</color></b><br><br>We can get both LH2 and LOX from the Lunar ice, which would be an incredible boon for our lunar infrastructure. Set up a production of both LH2 and LOX at the Lunar Base. The Base needs tanks for at least 250 units each of <b>LqdHydrogen</b> and <b>LqdOxygen</b>.

	synopsis = Produce liquid hydrogen and oxygen at the Lunar Base

	completedMessage = Our Lunar Base is now a propellant depot and production facility! We can turn the Lunar ice into rocket fuel!

	sortKey = 2013

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 800
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalLunarHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OLH_LunarWater
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = LunarHydrolox
		type = VesselParameterGroup
		title = Make hydrolox propellant at the Lunar Base for 60 days
		vessel = MoonBase
		notes = You can work on other contracts while the Base is working. You are safe to return to Mission Control
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Moon
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = HasDrill
			type = Any
			title = Have a drill configured as Water Extractor on the Base

			PARAMETER
			{
				name = HasSmallDrill
				type = PartValidation
				part = kerbalism-drill
				minCount = 1
				hideChildren = true
			}
			PARAMETER
			{
				name = HasLargeDrill
				type = PartValidation
				part = kerbalism-large-drill
				minCount = 1
				hideChildren = true
			}
		}
		PARAMETER
		{
			name = HasElectrolysis
			type = HasResource
			resource = Resource("_WaterElectrolysis")
			minQuantity = 0.99
			title = Run Water Electrolysis
			hideChildren = true
		}
		PARAMETER
		{
			name = HasWater
			type = HasResource
			resource = Water
			minQuantity = 0.01
			title = Keep the electrolysis supplied with Water
			hideChildren = true
		}
		PARAMETER
		{
			name = HasHydrogenLiquefier
			type = HasResource
			resource = Resource("_H2Converter")
			minQuantity = 0.99
			title = Run a GH2 to LH2 Converter
			hideChildren = true
		}
		PARAMETER
		{
			name = HasOxygenLiquefier
			type = HasResource
			resource = Resource("_OXConverter")
			minQuantity = 0.99
			title = Run a GOX to LOX Converter
			hideChildren = true
		}
		PARAMETER
		{
			name = HasLH2Tanks
			type = HasResourceCapacity
			resource = LqdHydrogen
			minQuantity = 250
			title = Have tanks for at least 250 units of LH2
			hideChildren = true
		}
		PARAMETER
		{
			name = HasLOXTanks
			type = HasResourceCapacity
			resource = LqdOxygen
			minQuantity = 250
			title = Have tanks for at least 250 units of LOX
			hideChildren = true
		}
		PARAMETER
		{
			name = Duration
			type = Duration
			duration = 60d
			preWaitText = Start up propellant production
			waitingText = Making propellant from lunar ice
			completionText = 60 days of propellant production completed
		}
	}
}
