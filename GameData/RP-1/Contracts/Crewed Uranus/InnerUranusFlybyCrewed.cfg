CONTRACT_TYPE
{
	name = InnerUranusFlybyCrewed
	title = Inner Uranian Moon Flyby (Crewed)
	group = CrewedUranusExp
	agent = Flag Planting

    description = <b>Program: Crewed Uranus Exploration<br>Type: <color=blue>Optional</color></b><br><br>Before committing to surface landings on Uranus's inner moons, we need close-range reconnaissance data. Design and launch a crewed mission to perform close flybys of Miranda, Ariel and Umbriel. The crew will file a report from each moon as they pass.&br;&br;<color=green>NOTE: This contract will become unavailable once any crewed inner moon landing contract is accepted or completed.</color>
    synopsis = Perform a crewed flyby tour of Uranus's inner moons (Miranda, Ariel and Umbriel) and file a crew report at each moon
    completedMessage = Congratulations! Your crew has successfully completed close-range flybys of Uranus inner moon system, providing vital reconnaissance for future landing missions!
	sortKey = 2808

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0


	// ************ REWARDS ************

	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 3000
	failureReputation = 0


	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedUranusExp
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedUranusOrbit
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = ArielLandingCrew
		invertRequirement = true
	}
	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = ArielLandingCrew
		invertRequirement = true
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = MirandaLandingCrew
		invertRequirement = true
	}
	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = MirandaLandingCrew
		invertRequirement = true
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = UmbrielLandingCrew
		invertRequirement = true
	}
	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = UmbrielLandingCrew
		invertRequirement = true
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = InnerUranusMoonsFlybyCrew
		type = VesselParameterGroup
		title = Fly-by Miranda Ariel and Umbriel

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 2
			title = Have at least 2 Crewmembers
		}
		PARAMETER
		{
			name = FlybyMiranda
			type = ReachState
			targetBody = Miranda
			disableOnStateChange = true
			title = Flyby Miranda
		}
		PARAMETER
		{
			name = FlybyAriel
			type = ReachState
			targetBody = Ariel
			disableOnStateChange = true
			title = Flyby Ariel
		}
		PARAMETER
		{
			name = FlybyUmbriel
			type = ReachState
			targetBody = Umbriel
			disableOnStateChange = true
			title = Flyby Umbriel
		}
	}

	PARAMETER
	{
		name = CrewReportMiranda
		type = CollectScience
		targetBody = Miranda
		experiment = crewReport
		recoveryMethod = RecoverOrTransmit
		title = File a Crew Report while flying past Miranda
		hideChildren = true
	}

	PARAMETER
	{
		name = CrewReportAriel
		type = CollectScience
		targetBody = Ariel
		experiment = crewReport
		recoveryMethod = RecoverOrTransmit
		title = File a Crew Report while flying past Ariel
		hideChildren = true
	}

	PARAMETER
	{
		name = CrewReportUmbriel
		type = CollectScience
		targetBody = Umbriel
		experiment = crewReport
		recoveryMethod = RecoverOrTransmit
		title = File a Crew Report while flying past Umbriel
		hideChildren = true
	}
