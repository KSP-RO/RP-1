CONTRACT_TYPE
{
	name = CrewedMercury_InnerHeliosphereScience
	title = Inner Heliosphere Crewed Science
	group = CrewedMercuryExp
	agent = Exploration

	description = <b>Program: Crewed Mercury Exploration<br>Type: <color=green>Required</color></b><br><br>A voyage to Mercury takes a crew closer to the Sun than any human has ever been. Make the most of it: while in heliocentric orbit, dive inside 0.4 AU of the Sun and turn the crew into a solar observatory. They will run a coronagraph to study the corona and the origin of the solar wind, and undergo a long-term health study to measure how the human body copes with the intense radiation and thermal environment of the inner Solar System.

	synopsis = With a crewed vessel, reach a heliocentric orbit with a perihelion inside 0.4 AU, observe the solar corona and conduct at least half of an interplanetary crew health study. This can be completed during any of the program's Mercury missions.

	completedMessage = Congratulations! The crew's observations from deep inside the inner Solar System have given our heliophysicists data no Earth-based observatory could ever match.

	sortKey = 2032

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Sun

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 1200
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************
	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedMercuryExp
	}

	// ************ PARAMETERS ************
	PARAMETER
	{
		name = SunDiver
		type = VesselParameterGroup
		title = Dive deep into the inner Solar System

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 3
			title = Have at least 3 Crewmembers
			hideChildren = true
		}

		PARAMETER
		{
			name = InnerOrbit
			type = Orbit
			targetBody = Sun
			maxPeA = 59839000000 // 0.4 AU; Mercury's own perihelion is ~0.31 AU
			disableOnStateChange = true
			title = Reach a heliocentric orbit with a perihelion inside 0.4 AU (59,839,000 km)
			hideChildren = true
		}
	}

	PARAMETER
	{
		name = SolarCorona
		type = RP1CollectScience
		targetBody = Sun
		experiment = RP0SolarCoronaObservation
		recoveryMethod = RecoverOrTransmit
		title = Solar Corona Observation
		hideChildren = true
	}

	PARAMETER
	{
		name = CrewHealth
		type = RP1CollectScience
		targetBody = Sun
		experiment = RP0SolarCrewHealth
		recoveryMethod = RecoverOrTransmit
		fractionComplete = 0.5 // ~183 of the study's 365 days in heliocentric orbit, about one round trip
		title = Interplanetary Crew Health Study (at least 50%)
		hideChildren = true
	}
}
