CONTRACT_TYPE
{
	name = VenusFlybyCrewed
	title = Venus Gravity Assist to Mercury (Crewed)
	group = CrewedMercuryExp
	agent = Exploration

	description = <b>Program: Crewed Mercury Exploration<br>Type: <color=blue>Optional</color></b><br><br>Reaching Mercury means shedding an enormous amount of orbital energy as you fall towards the Sun. A gravity assist from Venus has been proposed to cut the delta-v needed to reach and capture at Mercury, just as the MESSENGER and BepiColombo probes did. Perform a crewed flyby of Venus on the outbound or inbound leg of a Mercury mission.

	synopsis = Fly by Venus with a crew of at least 4 during the outbound or inbound leg of a Mercury mission. This can be performed as part of any of the program's Mercury missions.

	completedMessage = Congratulations on leveraging the gravitational pull of Venus! You have demonstrated the use of a gravity assist to reduce the delta-v requirements of a crewed mission.

	sortKey = 2041

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Venus

	// ************ REWARDS ************

	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 700
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedMercuryExp
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VenusFlybyCrew
		type = VesselParameterGroup
		title = Fly by Venus on the way to or from Mercury

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 4
			title = Have at least 4 Crewmembers
			hideChildren = true
		}
		PARAMETER
		{
			name = FlybyVenus
			type = ReachState
			targetBody = Venus
			disableOnStateChange = true
			title = Flyby Venus
			hideChildren = true
		}
		PARAMETER
		{
			name = ReachMercury
			type = ReachState
			targetBody = Mercury
			disableOnStateChange = true
			title = Reach Mercury's sphere of influence on the same mission
			hideChildren = true
		}
	}
}
