CONTRACT_TYPE
{
	name = Mercury_CalorisRoverTraverse
	title = Caloris Basin Rover Traverse
	group = CrewedMercuryExp
	agent = Flag Planting

	description = <b>Program: Crewed Mercury Exploration<br>Type: <color=blue>Optional</color></b><br><br>The Caloris basin, 1,500 km across, is one of the largest impact structures in the Solar System. At its heart lies Apollodorus crater, surrounded by the radiating troughs of Pantheon Fossae; on its western edge lies Kertész crater, whose floor is riddled with hollows, bright pits thought to form as volatiles escape from the rock. Land a crewed pressurised rover near Apollodorus, collect a deep surface sample, then drive it over 600 km across the basin floor to Kertész and collect another. This is the longest crewed surface traverse ever attempted, so plan your power and thermal control for the long Mercurian day.

	synopsis = Drive a crewed rover with at least 2 crew from Apollodorus crater to Kertész crater (about 640 km) across the Caloris basin, staying 2 days and collecting a deep surface sample at each

	completedMessage = Congratulations! The Caloris traverse has given us a continuous geological cross-section of the largest basin on Mercury, from its volcanic heart to the volatile-rich hollows at its rim.

	sortKey = 2039

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mercury

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 2500
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedMercuryExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = firstCrewedMercurylanding
	}

	// ************ WAYPOINTS ************
	// Coordinates are from the IAU gazetteer (via the Wikipedia crater infoboxes, given there as
	// 0-360 West) converted to KSP convention (+East, -180 to 180). Great-circle distance ~640 km.

	BEHAVIOUR
	{
		name = TraverseWaypoints
		type = WaypointGenerator
		targetBody = Mercury

		WAYPOINT
		{
			name = Apollodorus Crater
			icon = marker
			latitude = 30.58
			longitude = 162.99
			altitude = 0
			parameter = Start
		}

		WAYPOINT
		{
			name = Kertész Crater
			icon = marker
			latitude = 27.36
			longitude = 146.11
			altitude = 0
			parameter = End
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = Rover
		type = VesselParameterGroup
		title = Control a crewed rover with the required parameters
		notes = The same rover must reach both sites, driving across the basin floor.
		define = MercuryCalorisRover

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 2
			crewOnly = true
			title = Have at least 2 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = HasWheels
			type = PartValidation
			partModule = ModuleWheelBase
			minCount = 4
			title = Have at least 4 wheels
			hideChildren = true
		}

		PARAMETER
		{
			name = Start
			type = Sequence
			title = Start: Apollodorus Crater

			PARAMETER
			{
				name = AtStart
				type = VisitWaypoint
				index = 0
				horizontalDistance = 2000
				title = Be within 2 km of Apollodorus Crater
				hideChildren = true
			}
			PARAMETER
			{
				name = LandedStart
				type = ReachState
				targetBody = Mercury
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = StayStart
				type = Duration
				duration = 2d
				preWaitText = Remain at Apollodorus Crater for 2 days
				waitingText = Surveying Pantheon Fossae
				completionText = Survey of Apollodorus Crater complete, begin your traverse
			}
			PARAMETER
			{
				name = SampleStart
				type = RP1HasExperiment
				experiment = surfaceSample3
				title = Collect a deep surface sample at Apollodorus Crater
			}
		}

		PARAMETER
		{
			name = End
			type = Sequence
			title = End: Kertész Crater
			completeInSequence = true

			PARAMETER
			{
				name = AtEnd
				type = VisitWaypoint
				index = 1
				horizontalDistance = 2000
				title = Drive to within 2 km of Kertész Crater
				hideChildren = true
			}
			PARAMETER
			{
				name = LandedEnd
				type = ReachState
				targetBody = Mercury
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = StayEnd
				type = Duration
				duration = 2d
				preWaitText = Remain at Kertész Crater for 2 days
				waitingText = Surveying the Kertész hollows
				completionText = Survey of Kertész Crater complete
			}
			PARAMETER
			{
				name = SampleEnd
				type = RP1HasExperiment
				experiment = surfaceSample3
				title = Collect a deep surface sample at Kertész Crater
			}
		}
	}
}
