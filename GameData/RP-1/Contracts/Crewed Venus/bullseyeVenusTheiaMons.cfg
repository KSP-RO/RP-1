CONTRACT_TYPE
{
    name = bullseyeVenusTheiaMons
    title = Bullseye Venus: Theia Mons (Beta Regio)
    group = CrewedVenusExp         
    agent = Exploration

    description = <b>Program: Crewed Venus Exploration <br>Type: <color=blue>Optional</color></b><br><br>Land a vessel on Venus as close as possible to a marked target.<br><br>Theia Mons in Beta Regio, a giant rifted volcanic rise. Target: 24.0 N, 80.0 W (280.0 E).<br><br><b>Rewards (cumulative, paid per ring reached):</b><br>Within 10 km: +15 Rep<br>Within 5 km: +35 Rep (50 total)<br>Within 1 km: +100 Rep (150 total)<br>Within 500 m: +350 Rep JACKPOT (500 total)<br><br>Land outside 10 km and nothing is awarded. The contract stays active, so launch another lander and try again. This is a series of @maxCompletions contracts, of which @index have been completed.
    synopsis = Land on Venus within 10 km of Theia Mons (Beta Regio)
    completedMessage = Bullseye contract complete. mision Control logs your touchdown and congratulates you on your precision landing.

    sortKey = 2513

    cancellable = true
    declinable = true
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 2
    maxSimultaneous = 1
    deadline = 0

    targetBody = Venus

    // ************ REWARDS ************
    prestige = Trivial
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 0
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedVenusExp    
    }
    REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract
        contractType = FirstCrewedVenusOrbit
    }
    // ************ COUNTER ************

	DATA
	{
		type = int
		index = $VenusESR_Count + 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression

		CONTRACT_COMPLETED_SUCCESS
		{
			VenusESR_Count = $VenusESR_Count + 1
		}
	}

    // ************ TARGET MARKER ************
    BEHAVIOUR
    {
        name = TargetWaypoint
        type = WaypointGenerator
        targetBody = Venus

        WAYPOINT
        {
            name = Bullseye: Theia Mons (Beta Regio)
            latitude = 24.0
            longitude = -80.0
            altitude = 0
        }
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = BullseyeLanding
        type = VesselParameterGroup
        title = Bullseye Landing: Theia Mons (Beta Regio)

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            title = Launch a New Vessel
            hideChildren = true
        }

        PARAMETER
        {
            name = Tier10km
            type = Duration
            duration = 5s
            title = Land within 10 km of the target
            optional = false
            rewardReputation = 15
            hideChildren = true

            PARAMETER
            {
                name = LandedTier10km
                type = ReachState
                targetBody = Venus
                situation = LANDED
                title = Landed on Venus
            }

            PARAMETER
            {
                name = WithinTier10km
                type = VisitWaypoint
                index = 0
                distance = 10000
                horizontalDistance = true
                hideOnCompletion = false
                title = Land within 10 km of the target
            }
        }

        PARAMETER
        {
            name = Tier5km
            type = Duration
            duration = 5s
            title = Bonus: land within 5 km of the target
            optional = true
            rewardReputation = 35
            hideChildren = true

            PARAMETER
            {
                name = LandedTier5km
                type = ReachState
                targetBody = Venus
                situation = LANDED
                title = Landed on Venus
            }

            PARAMETER
            {
                name = WithinTier5km
                type = VisitWaypoint
                index = 0
                distance = 5000
                horizontalDistance = true
                hideOnCompletion = false
                title = Bonus: land within 5 km of the target
            }
        }

        PARAMETER
        {
            name = Tier1km
            type = Duration
            duration = 5s
            title = Bonus: land within 1 km of the target
            optional = true
            rewardReputation = 100
            hideChildren = true

            PARAMETER
            {
                name = LandedTier1km
                type = ReachState
                targetBody = Venus
                situation = LANDED
                title = Landed on Venus
            }

            PARAMETER
            {
                name = WithinTier1km
                type = VisitWaypoint
                index = 0
                distance = 1000
                horizontalDistance = true
                hideOnCompletion = false
                title = Bonus: land within 1 km of the target
            }
        }

        PARAMETER
        {
            name = Jackpot
            type = Duration
            duration = 5s
            title = JACKPOT: land within 500 m of the target
            optional = true
            rewardReputation = 350
            hideChildren = true

            PARAMETER
            {
                name = LandedJackpot
                type = ReachState
                targetBody = Venus
                situation = LANDED
                title = Landed on Venus
            }

            PARAMETER
            {
                name = WithinJackpot
                type = VisitWaypoint
                index = 0
                distance = 500
                horizontalDistance = true
                hideOnCompletion = false
                title = JACKPOT: land within 500 m of the target
            }
        }
    }
    PARAMETER
    {
        name = SurfaceReport
        type = CollectScience
        targetBody = Venus
        situation = SrfLanded
        recoveryMethod = Transmit
        title = Transmit a surface science report from Venus
        hideChildren = true
    }
}

