	description = <b>Program: Operational Lunar Habitation<br>Type: <color=green>Required</color></b><br><br>Send an expedition to our Lunar Base. Land <b>six</b> crew on the surface for six months.<br><br>Previously landed infrastructure can be used, and a resupply mission can be sent if your mission profile requires it, but take note of new Research Payload requirements. This contract does not require a new set of crew to complete.

