CONTRACT_TYPE
{
	name = Ceres_ESR
	title = Ceres Expedition Sample Return
	group = CrewedAsteroid
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Asteroid Exploration<br>Type: <color=green>Required</color></b><br><br>With a crewed expedition vessel in orbit of Ceres, we can increase safety drastically by sending robotic explorers to the surface instead of humans. They will land, collect samples and return to the expedition vessel for further analysis. <br><br>Land within 5 km of any site in the catalogue that has not been sampled yet, then dock with the expedition vessel. Each site can only be sampled once.<br><br><b>Sites sampled: @index / 3</b>

	genericDescription = Land a robotic probe at a site on Ceres that has not been visited yet and return it to the crewed expedition vessel in orbit.

	synopsis = Land a robotic probe at an unsampled site on Ceres and dock it with the crewed expedition vessel

	completedMessage = The probe's sample is safely back aboard the expedition vessel, and the crew have started analysing it!

	sortKey = 2004

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 3
	maxSimultaneous = 1
	deadline = 0

	targetBody = Ceres

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 900
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedAsteroid
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = CrewedCeresLanding
		invertRequirement = true
		title = Don't have an active Crewed Ceres Landing contract.
	}

	// ************ DATA ************

	DATA
	{
		type = int
		index = $Ceres_ESR_Count + 0
	}

	DATA
	{
		type = double
		latOccatorCrater = 19.51
		longOccatorCrater = -34.98
		distOccatorCrater = 5000.0 - 4999.0 * ($Ceres_ESR_OccatorCrater + 0)
		latCerealiaFacula = 19.86
		longCerealiaFacula = -31.11
		distCerealiaFacula = 5000.0 - 4999.0 * ($Ceres_ESR_CerealiaFacula + 0)
		latKerwanPlain = -10.02
		longKerwanPlain = -146.43
		distKerwanPlain = 5000.0 - 4999.0 * ($Ceres_ESR_KerwanPlain + 0)
		latZadeniCrater = -68.73
		longZadeniCrater = 125.33
		distZadeniCrater = 5000.0 - 4999.0 * ($Ceres_ESR_ZadeniCrater + 0)
		latUrvaraCrater = -45.88
		longUrvaraCrater = -20.92
		distUrvaraCrater = 5000.0 - 4999.0 * ($Ceres_ESR_UrvaraCrater + 0)
		latYalodeCrater = -41.66
		longYalodeCrater = 20.21
		distYalodeCrater = 5000.0 - 4999.0 * ($Ceres_ESR_YalodeCrater + 0)
		latHaulaniCrater = 6.50
		longHaulaniCrater = 101.07
		distHaulaniCrater = 5000.0 - 4999.0 * ($Ceres_ESR_HaulaniCrater + 0)
	}

	DATA
	{
		type = bool
		doneOccatorCrater = ($Ceres_ESR_OccatorCrater + 0) == 1
		doneCerealiaFacula = ($Ceres_ESR_CerealiaFacula + 0) == 1
		doneKerwanPlain = ($Ceres_ESR_KerwanPlain + 0) == 1
		doneZadeniCrater = ($Ceres_ESR_ZadeniCrater + 0) == 1
		doneUrvaraCrater = ($Ceres_ESR_UrvaraCrater + 0) == 1
		doneYalodeCrater = ($Ceres_ESR_YalodeCrater + 0) == 1
		doneHaulaniCrater = ($Ceres_ESR_HaulaniCrater + 0) == 1
		hidden = true
	}

	// ************ BEHAVIOURS ************

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression

		CONTRACT_COMPLETED_SUCCESS
		{
			Ceres_ESR_Count = $Ceres_ESR_Count + 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledOccatorCrater
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteOccatorCrater
			Ceres_ESR_OccatorCrater = 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledCerealiaFacula
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteCerealiaFacula
			Ceres_ESR_CerealiaFacula = 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledKerwanPlain
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteKerwanPlain
			Ceres_ESR_KerwanPlain = 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledZadeniCrater
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteZadeniCrater
			Ceres_ESR_ZadeniCrater = 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledUrvaraCrater
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteUrvaraCrater
			Ceres_ESR_UrvaraCrater = 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledYalodeCrater
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteYalodeCrater
			Ceres_ESR_YalodeCrater = 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledHaulaniCrater
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteHaulaniCrater
			Ceres_ESR_HaulaniCrater = 1
		}
	}

	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator

		WAYPOINT
		{
			name = Occator Crater
			hidden = @/doneOccatorCrater
			targetBody = Ceres
			icon = marker
			altitude = 0.0
			latitude = @/latOccatorCrater
			longitude = @/longOccatorCrater
		}
		WAYPOINT
		{
			name = Cerealia Facula
			hidden = @/doneCerealiaFacula
			targetBody = Ceres
			icon = marker
			altitude = 0.0
			latitude = @/latCerealiaFacula
			longitude = @/longCerealiaFacula
		}
		WAYPOINT
		{
			name = Kerwan Plain
			hidden = @/doneKerwanPlain
			targetBody = Ceres
			icon = marker
			altitude = 0.0
			latitude = @/latKerwanPlain
			longitude = @/longKerwanPlain
		}
		WAYPOINT
		{
			name = Zadeni Crater
			hidden = @/doneZadeniCrater
			targetBody = Ceres
			icon = marker
			altitude = 0.0
			latitude = @/latZadeniCrater
			longitude = @/longZadeniCrater
		}
		WAYPOINT
		{
			name = Urvara Crater
			hidden = @/doneUrvaraCrater
			targetBody = Ceres
			icon = marker
			altitude = 0.0
			latitude = @/latUrvaraCrater
			longitude = @/longUrvaraCrater
		}
		WAYPOINT
		{
			name = Yalode Crater
			hidden = @/doneYalodeCrater
			targetBody = Ceres
			icon = marker
			altitude = 0.0
			latitude = @/latYalodeCrater
			longitude = @/longYalodeCrater
		}
		WAYPOINT
		{
			name = Haulani Crater
			hidden = @/doneHaulaniCrater
			targetBody = Ceres
			icon = marker
			altitude = 0.0
			latitude = @/latHaulaniCrater
			longitude = @/longHaulaniCrater
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = ExpeditionVessel
		type = VesselParameterGroup
		title = Have a crewed expedition vessel with a laboratory in orbit of Ceres
		define = CeresExpeditionVessel
		disableOnStateChange = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = HasLaboratory
			type = PartValidation
			partModule = Laboratory
			minCount = 1
			title = Carry a laboratory
		}

		PARAMETER
		{
			name = EnterOrbit
			type = Orbit
			situation = ORBITING
			targetBody = Ceres
			maxPeA = @targetBody.Radius() * 2
			title = Orbit Ceres
		}
	}

	PARAMETER
	{
		name = Sampler
		type = VesselParameterGroup
		title = Robotic sampler

		PARAMETER
		{
			name = LandAtSite
			type = All
			title = Land the uncrewed sampler within 5 km of an unsampled site
			disableOnStateChange = true

			PARAMETER
			{
				name = Uncrewed
				type = HasCrew
				minCrew = 0
				maxCrew = 0
				title = Uncrewed
				hideChildren = true
			}

			PARAMETER
			{
				name = HasSurfaceSample
				type = RP1HasExperiment
				experiment = surfaceSample
				hideChildren = true
			}

			PARAMETER
			{
				name = Landed
				type = ReachState
				targetBody = Ceres
				situation = LANDED
				hideChildren = true
			}

			PARAMETER
			{
				name = AnySite
				type = Any
				title = Land within 5 km of any unsampled site

				PARAMETER
				{
					name = SiteOccatorCrater
					type = VisitWaypoint
					index = 0
					distance = @/distOccatorCrater
					title = Occator Crater (19.51° North, 34.98° West)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteCerealiaFacula
					type = VisitWaypoint
					index = 1
					distance = @/distCerealiaFacula
					title = Cerealia Facula (19.86° North, 31.11° West)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteKerwanPlain
					type = VisitWaypoint
					index = 2
					distance = @/distKerwanPlain
					title = Kerwan Plain (10.02° South, 146.43° West)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteZadeniCrater
					type = VisitWaypoint
					index = 3
					distance = @/distZadeniCrater
					title = Zadeni Crater (68.73° South, 125.33° East)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteUrvaraCrater
					type = VisitWaypoint
					index = 4
					distance = @/distUrvaraCrater
					title = Urvara Crater (45.88° South, 20.92° West)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteYalodeCrater
					type = VisitWaypoint
					index = 5
					distance = @/distYalodeCrater
					title = Yalode Crater (41.66° South, 20.21° East)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteHaulaniCrater
					type = VisitWaypoint
					index = 6
					distance = @/distHaulaniCrater
					title = Haulani Crater (6.50° North, 101.07° East)
					showMessages = true
					hideChildren = true
				}
			}
		}

		PARAMETER
		{
			name = DeliverSamples
			type = VesselParameterGroup
			title = Dock with the expedition vessel to deliver the samples
			completeInSequence = true

			PARAMETER
			{
				name = Docking
				type = Docking
				title = Dock with another vessel
			}

			PARAMETER
			{
				name = DockedToLaboratory
				type = PartValidation
				partModule = Laboratory
				minCount = 1
				title = The docked vessel carries a laboratory
			}
		}
	}
}
