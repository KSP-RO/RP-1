CONTRACT_TYPE
{
	name = Mercury_MajorSurfaceOperations
	title = Mercury Major Surface Operations
	group = CrewedMercuryExp
	agent = Flag Planting

	description = <b>Program: Crewed Mercury Exploration<br>Type: <color=blue>Optional</color></b><br><br>Land a crewed expeditionary vehicle at three major landmarks on Mercury: the young, brightly rayed crater Hokusai, the volcanic plains inside the Rachmaninoff peak-ring basin, and the explosive volcanic vents of Praxiteles crater. Remain on site for 2 days at each and run the experiment suited to it: field geology of Hokusai's fresh ejecta, X-ray diffraction of Rachmaninoff's volcanic plains and a volatile analysis of the explosive vents of Praxiteles.

	synopsis = Land a crewed expeditionary rover or a hop-capable lander within 1 km of each of the 3 landmarks on Mercury, remain on site for 2 days and run the site's experiment at each.

	completedMessage = Congratulations! The surface survey of Mercury has given our scientists a vastly better understanding of its impact history and its volcanic past.

	sortKey = 2038

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mercury

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 2500
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedMercuryExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = firstCrewedMercurylanding
	}

	// ************ WAYPOINTS ************
	// Coordinates are from the IAU gazetteer (via the Wikipedia crater infoboxes, given there as
	// 0-360 West) converted to KSP convention (+East, -180 to 180).

	BEHAVIOUR
	{
		name = LandmarkWaypoints
		type = WaypointGenerator
		targetBody = Mercury

		WAYPOINT
		{
			name = Hokusai Crater
			icon = marker
			latitude = 58.3
			longitude = 17.7
			altitude = 0
			parameter = Site1
		}

		WAYPOINT
		{
			name = Rachmaninoff Basin
			icon = marker
			latitude = 27.66
			longitude = 57.37
			altitude = 0
			parameter = Site2
		}

		WAYPOINT
		{
			name = Praxiteles Crater
			icon = marker
			latitude = 27.11
			longitude = -60.28
			altitude = 0
			parameter = Site3
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = SurfaceExpedition
		type = VesselParameterGroup
		title = Control a vessel with the required parameters
		notes = Use an expeditionary rover or a lander capable of hopping between sites. The same vessel must visit all three landmarks.
		define = MercurySurfaceExpeditionVessel
		disableOnStateChange = false

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 2
			crewOnly = true
			title = Have at least 2 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = Site1
			type = Sequence
			title = Landmark 1: Hokusai Crater

			PARAMETER
			{
				name = LandedNear1
				type = VisitWaypoint
				index = 0
				horizontalDistance = 1000
				title = Be within 1 km of Hokusai Crater
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed1
				type = ReachState
				targetBody = Mercury
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay1
				type = Duration
				duration = 2d
				preWaitText = Remain at Hokusai Crater for 2 days
				waitingText = Surveying Hokusai Crater
				completionText = Survey of Hokusai Crater complete
			}
			PARAMETER
			{
				name = Sample1
				type = RP1CollectScience
				targetBody = Mercury
				experiment = evaAdvancedFieldGeology
				recoveryMethod = RecoverOrTransmit
				title = Run the Advanced Field Geology Suite on Hokusai's fresh ejecta
			}
		}

		PARAMETER
		{
			name = Site2
			type = Sequence
			title = Landmark 2: Rachmaninoff Basin

			PARAMETER
			{
				name = LandedNear2
				type = VisitWaypoint
				index = 1
				horizontalDistance = 1000
				title = Be within 1 km of Rachmaninoff Basin
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed2
				type = ReachState
				targetBody = Mercury
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay2
				type = Duration
				duration = 2d
				preWaitText = Remain at Rachmaninoff Basin for 2 days
				waitingText = Surveying Rachmaninoff Basin
				completionText = Survey of Rachmaninoff Basin complete
			}
			PARAMETER
			{
				name = Sample2
				type = RP1CollectScience
				targetBody = Mercury
				experiment = evaXRDScan
				recoveryMethod = RecoverOrTransmit
				title = X-Ray Diffraction of the volcanic plains in Rachmaninoff Basin
			}
		}

		PARAMETER
		{
			name = Site3
			type = Sequence
			title = Landmark 3: Praxiteles Crater

			PARAMETER
			{
				name = LandedNear3
				type = VisitWaypoint
				index = 2
				horizontalDistance = 1000
				title = Be within 1 km of Praxiteles Crater
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed3
				type = ReachState
				targetBody = Mercury
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay3
				type = Duration
				duration = 2d
				preWaitText = Remain at Praxiteles Crater for 2 days
				waitingText = Surveying Praxiteles Crater
				completionText = Survey of Praxiteles Crater complete
			}
			PARAMETER
			{
				name = Sample3
				type = RP1CollectScience
				targetBody = Mercury
				experiment = evaVolatileAnalysis
				recoveryMethod = RecoverOrTransmit
				title = Advanced Volatile Analysis of the explosive volcanic vents of Praxiteles
			}
		}
	}
}
