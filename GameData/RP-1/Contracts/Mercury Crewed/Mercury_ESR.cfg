CONTRACT_TYPE
{
	name = Mercury_ESR
	title = Mercury Expedition Sample Return
	group = CrewedMercuryExp
	agent = Exploration

	description = <b>Program: Crewed Mercury Exploration<br>Type: <color=blue>Optional</color> (required 3 times for the sample return path)</b><br><br>Landing humans on Mercury is not the only way to bring its surface to our laboratories. With a crewed expedition vessel in orbit of Mercury, we can send robotic explorers down to the scorching surface instead of humans. They will land, collect samples and return to the expedition vessel, where the crew will analyse them in their laboratory. <br><br>Land within 5 km of any site in the catalogue that has not been sampled yet, then dock with the expedition vessel. Each site can only be sampled once.<br><br><b>Sites sampled: @index / 3</b>

	genericDescription = Land a robotic probe at a site on Mercury that has not been visited yet and return it to the crewed expedition vessel in orbit.

	synopsis = Land a robotic probe at an unsampled site on Mercury and dock it with the crewed expedition vessel

	completedMessage = The probe's sample is safely back aboard the expedition vessel, and the crew have started analysing it!

	sortKey = 2037

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 3
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mercury

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 2000
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedMercuryExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedMercuryOrbit
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = firstCrewedMercurylanding
		invertRequirement = true
		title = Don't have an active First Crewed Mercury Landing contract.
	}

	// ************ DATA ************
	// Coordinates are from the IAU gazetteer (via the Wikipedia crater infoboxes and the list of
	// craters on Mercury) converted to KSP convention (+East, -180 to 180).

	DATA
	{
		type = int
		index = $Mercury_ESR_Count + 0
	}

	DATA
	{
		type = double
		latApollodorusCrater = 30.58
		longApollodorusCrater = 162.99
		distApollodorusCrater = 5000.0 - 4999.0 * ($Mercury_ESR_ApollodorusCrater + 0)
		latKerteszCrater = 27.36
		longKerteszCrater = 146.11
		distKerteszCrater = 5000.0 - 4999.0 * ($Mercury_ESR_KerteszCrater + 0)
		latHokusaiCrater = 58.3
		longHokusaiCrater = 17.7
		distHokusaiCrater = 5000.0 - 4999.0 * ($Mercury_ESR_HokusaiCrater + 0)
		latRaditladiBasin = 27.15
		longRaditladiBasin = 119.06
		distRaditladiBasin = 5000.0 - 4999.0 * ($Mercury_ESR_RaditladiBasin + 0)
		latKuiperCrater = -11.34
		longKuiperCrater = -31.32
		distKuiperCrater = 5000.0 - 4999.0 * ($Mercury_ESR_KuiperCrater + 0)
		latProkofievCrater = 86.0
		longProkofievCrater = 63.7
		distProkofievCrater = 5000.0 - 4999.0 * ($Mercury_ESR_ProkofievCrater + 0)
		latChaoMengFuCrater = -88.42
		longChaoMengFuCrater = -156.36
		distChaoMengFuCrater = 5000.0 - 4999.0 * ($Mercury_ESR_ChaoMengFuCrater + 0)
	}

	DATA
	{
		type = bool
		doneApollodorusCrater = ($Mercury_ESR_ApollodorusCrater + 0) == 1
		doneKerteszCrater = ($Mercury_ESR_KerteszCrater + 0) == 1
		doneHokusaiCrater = ($Mercury_ESR_HokusaiCrater + 0) == 1
		doneRaditladiBasin = ($Mercury_ESR_RaditladiBasin + 0) == 1
		doneKuiperCrater = ($Mercury_ESR_KuiperCrater + 0) == 1
		doneProkofievCrater = ($Mercury_ESR_ProkofievCrater + 0) == 1
		doneChaoMengFuCrater = ($Mercury_ESR_ChaoMengFuCrater + 0) == 1
		hidden = true
	}

	// ************ BEHAVIOURS ************

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression

		CONTRACT_COMPLETED_SUCCESS
		{
			Mercury_ESR_Count = $Mercury_ESR_Count + 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledApollodorusCrater
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteApollodorusCrater
			Mercury_ESR_ApollodorusCrater = 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledKerteszCrater
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteKerteszCrater
			Mercury_ESR_KerteszCrater = 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledHokusaiCrater
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteHokusaiCrater
			Mercury_ESR_HokusaiCrater = 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledRaditladiBasin
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteRaditladiBasin
			Mercury_ESR_RaditladiBasin = 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledKuiperCrater
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteKuiperCrater
			Mercury_ESR_KuiperCrater = 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledProkofievCrater
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteProkofievCrater
			Mercury_ESR_ProkofievCrater = 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledChaoMengFuCrater
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteChaoMengFuCrater
			Mercury_ESR_ChaoMengFuCrater = 1
		}
	}

	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator

		WAYPOINT
		{
			name = Apollodorus Crater
			hidden = @/doneApollodorusCrater
			targetBody = Mercury
			icon = marker
			altitude = 0.0
			latitude = @/latApollodorusCrater
			longitude = @/longApollodorusCrater
		}
		WAYPOINT
		{
			name = Kertesz Crater
			hidden = @/doneKerteszCrater
			targetBody = Mercury
			icon = marker
			altitude = 0.0
			latitude = @/latKerteszCrater
			longitude = @/longKerteszCrater
		}
		WAYPOINT
		{
			name = Hokusai Crater
			hidden = @/doneHokusaiCrater
			targetBody = Mercury
			icon = marker
			altitude = 0.0
			latitude = @/latHokusaiCrater
			longitude = @/longHokusaiCrater
		}
		WAYPOINT
		{
			name = Raditladi Basin
			hidden = @/doneRaditladiBasin
			targetBody = Mercury
			icon = marker
			altitude = 0.0
			latitude = @/latRaditladiBasin
			longitude = @/longRaditladiBasin
		}
		WAYPOINT
		{
			name = Kuiper Crater
			hidden = @/doneKuiperCrater
			targetBody = Mercury
			icon = marker
			altitude = 0.0
			latitude = @/latKuiperCrater
			longitude = @/longKuiperCrater
		}
		WAYPOINT
		{
			name = Prokofiev Crater
			hidden = @/doneProkofievCrater
			targetBody = Mercury
			icon = marker
			altitude = 0.0
			latitude = @/latProkofievCrater
			longitude = @/longProkofievCrater
		}
		WAYPOINT
		{
			name = Chao Meng-Fu Crater
			hidden = @/doneChaoMengFuCrater
			targetBody = Mercury
			icon = marker
			altitude = 0.0
			latitude = @/latChaoMengFuCrater
			longitude = @/longChaoMengFuCrater
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = ExpeditionVessel
		type = VesselParameterGroup
		title = Have a crewed expedition vessel with a laboratory in orbit of Mercury
		define = MercuryExpeditionVessel
		disableOnStateChange = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = HasLaboratory
			type = PartValidation
			partModule = Laboratory
			minCount = 1
			title = Carry a laboratory
		}

		PARAMETER
		{
			name = EnterOrbit
			type = Orbit
			situation = ORBITING
			targetBody = Mercury
			maxPeA = @targetBody.Radius() * 2
			title = Orbit Mercury
		}
	}

	PARAMETER
	{
		name = Sampler
		type = VesselParameterGroup
		title = Robotic sampler

		PARAMETER
		{
			name = LandAtSite
			type = All
			title = Land the uncrewed sampler within 5 km of an unsampled site
			disableOnStateChange = true

			PARAMETER
			{
				name = Uncrewed
				type = HasCrew
				minCrew = 0
				maxCrew = 0
				title = Uncrewed
				hideChildren = true
			}

			PARAMETER
			{
				name = HasSurfaceSample
				type = RP1HasExperiment
				experiment = surfaceSample
				hideChildren = true
			}

			PARAMETER
			{
				name = Landed
				type = ReachState
				targetBody = Mercury
				situation = LANDED
				hideChildren = true
			}

			PARAMETER
			{
				name = AnySite
				type = Any
				title = Land within 5 km of any unsampled site

				PARAMETER
				{
					name = SiteApollodorusCrater
					type = VisitWaypoint
					index = 0
					distance = @/distApollodorusCrater
					title = Apollodorus Crater, centre of the Caloris basin (30.58° North, 162.99° East)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteKerteszCrater
					type = VisitWaypoint
					index = 1
					distance = @/distKerteszCrater
					title = Kertesz Crater hollows (27.36° North, 146.11° East)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteHokusaiCrater
					type = VisitWaypoint
					index = 2
					distance = @/distHokusaiCrater
					title = Hokusai Crater (58.30° North, 17.70° East)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteRaditladiBasin
					type = VisitWaypoint
					index = 3
					distance = @/distRaditladiBasin
					title = Raditladi Basin (27.15° North, 119.06° East)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteKuiperCrater
					type = VisitWaypoint
					index = 4
					distance = @/distKuiperCrater
					title = Kuiper Crater (11.34° South, 31.32° West)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteProkofievCrater
					type = VisitWaypoint
					index = 5
					distance = @/distProkofievCrater
					title = Prokofiev Crater, north polar ice (86.00° North, 63.70° East)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteChaoMengFuCrater
					type = VisitWaypoint
					index = 6
					distance = @/distChaoMengFuCrater
					title = Chao Meng-Fu Crater, south polar ice (88.42° South, 156.36° West)
					showMessages = true
					hideChildren = true
				}
			}
		}

		PARAMETER
		{
			name = DeliverSamples
			type = VesselParameterGroup
			title = Dock with the expedition vessel to deliver the samples
			completeInSequence = true

			PARAMETER
			{
				name = Docking
				type = Docking
				title = Dock with another vessel
			}

			PARAMETER
			{
				name = DockedToLaboratory
				type = PartValidation
				partModule = Laboratory
				minCount = 1
				title = The docked vessel carries a laboratory
			}
		}
	}
}
