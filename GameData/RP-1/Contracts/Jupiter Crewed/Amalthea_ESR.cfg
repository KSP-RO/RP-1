CONTRACT_TYPE
{
	name = Amalthea_ESR
	title = Amalthea Expedition Sample Return
	group = CrewedJupiterExp
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Jupiter Exploration<br>Type: <color=blue>Optional</color></b><br><br>Design and successfully launch an uncrewed probe to land on Amalthea, gather surface samples and process them in a laboratory before transmitting the data home to Earth.

	synopsis = Send an uncrewed craft to land on Amalthea and return the surface samples to Earth. This can be performed as a standalone mission, or built into the crewed architecture, utilizing a sample recovery in orbit. 

	completedMessage = Congratulations! Our scientists can learn a lot more about the make-up of the Moon by studying the physical samples that you have returned.

	sortKey = 1906

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Amalthea



	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 2000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedJupiterExp
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Amalthea Robotic Sample Return
	
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = LandOnAmalthea
			type = ReachState
			targetBody = Amalthea
			situation = LANDED
			disableOnStateChange = true
			title = Land on Amalthea
			hideChildren = true
		}
		PARAMETER
		{
			name = HasSurfaceSample
			type = RP1HasExperiment
			experiment = surfaceSample
		}
		PARAMETER
		{
			name = Rendezvous
			type = Rendezvous
			vessel = JupiterExpeditionMothership
			distance = 100
			title = Rendezvous with the Jupiter Expedition Vessel.
		}
		PARAMETER
		{
			name = Docking
			type = Docking
			vessel = JupiterExpeditionMothership
			completeInSequence = true
			title = Dock with the Jupiter Expedition Vessel.
		}
	}
}
