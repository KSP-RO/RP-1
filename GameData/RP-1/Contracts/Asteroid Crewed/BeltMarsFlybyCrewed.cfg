CONTRACT_TYPE
{
	name = BeltMarsFlybyCrewed
	title = Mars Gravity Assist to the Asteroid Belt (Crewed)
	group = CrewedAsteroid
	agent = Flag Planting

	description = <b>Program: Crewed Asteroid Exploration<br>Type: <color=blue>Optional</color></b><br><br>Trajectory planners have determined that we can reduce the delta-V requirement for a Ceres or Vesta mission by flying past Mars first. <br><br> NOTE: The Dawn probe flew such a trajectory to get to Vesta.

	synopsis = Perform a Mars flyby on the outbound leg of a crewed mission to Ceres or Vesta.

	completedMessage = Congratulations on slingshotting past Mars and reducing mission delta-V requirements!

	sortKey = 1998

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	// ************ REWARDS ************

	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 1000 // 3000 conf, ish
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedAsteroid
	}

	PARAMETER
	{
		name = MarsFlybyCrew
		type = VesselParameterGroup
		title = Fly by Mars on the way to Ceres or Vesta

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
		}
		PARAMETER
		{
			name = FlybyMars
			type = ReachState
			targetBody = Mars
			maxAltitude = 20000000
			disableOnStateChange = true
			title = Fly by Mars within 20,000 km
		}
		PARAMETER
		{
			name = ReachBelt
			type = Any
			title = Then reach Ceres or Vesta
			disableOnStateChange = true
			completeInSequence = true

			PARAMETER
			{
				name = ReachCeres
				type = ReachState
				targetBody = Ceres
				title = Reach Ceres
			}
			PARAMETER
			{
				name = ReachVesta
				type = ReachState
				targetBody = Vesta
				title = Reach Vesta
			}
		}
	}
}
