CONTRACT_TYPE
{
	name = CLD_ReentryTest
	group = ComLaunchDev
	agent = Federation Aeronautique Internationale
	title = Commercial Hypersonic Testing
	
	description = <b>Program: Commercial Launch Development<br>Type: <color=blue>Optional</color></b><br><br>In addition to launching payloads into orbit, some companies and research institutes are interested in testing payloads exposed to the hypersonic flight regime, as well as general re-entry conditions. Design, build, and launch a rocket that will travel @/distanceKm km or more over ground while carrying @/missionPayload.Print() units of Research Payload.<br><br>This is a series of @maxCompletions contracts, of which @CLDReentryCount have been completed.</color>
	
	synopsis = Travel @/distanceKm km or more downrange with an uncrewed craft carrying @/missionPayload.Print() units of Research Payload.
	
	completedMessage = Congratulations on a successful launch!
	
	sortKey = 2503

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 3
	maxSimultaneous = 1
	deadline = 0
	
	targetBody = HomeWorld()

	// ************ DATA ************
	
	DATA
	{
		type = int
		CLDReentryCount = $CLDReentryCount + 0
	}
	
	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression
		CONTRACT_COMPLETED_SUCCESS
		{
			CLDReentryCount = $CLDReentryCount + 1
		}
	}

	DATA
	{
		type = List<float>
		distanceKmList = [ 6000, 7500, 10000 ] // 6, 7.5 & 10 Mm
	}


	DATA
	{
		type = float
		distanceKm = @distanceKmList.ElementAt(@CLDReentryCount)
	}


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 60
	failureReputation = 0

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ComLaunchDev
	}

	DATA
	{
		title = Payload
		type = int
		missionPayload = 200
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		
		title = Reach @/distanceKm km downrange.
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}

		PARAMETER
		{
			name = ReachAlt
			type = ReachState
			minAltitude = 140000
			disableOnStateChange = true
			title = Reach an altitude of at least 140 km
			hideChildren = true
		}
		PARAMETER
		{
			name = ReachDistance
			type = DownrangeDistance
			distance = @/distanceKm * 1000
			title = Reach a downrange distance of at least @/distanceKm km
		}
		PARAMETER
		{
			name = HasResearchPayload
			type = HasResource
			resource = ResearchPayload
			minQuantity = @/missionPayload - 0.1
			title = Have a ResearchPayload of at least @/missionPayload units on the craft
			hideChildren = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return home safely
			hideChildren = true
			completeInSequence = true
		}
	}
}
