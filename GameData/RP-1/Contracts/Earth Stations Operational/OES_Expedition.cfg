CONTRACT_TYPE
{
	name = OES_Expedition
	title = Station Expedition
	group = OperationalEarthStations
	agent = Stations

	description = <b>Program: Operational Earth Stations<br>Type: <color=green>Required</color></b><br><br>Unlike our first space station, this will be a permanent one. Keep at least <b>three</b> crew aboard the station for an extended expedition and continue the Permanent Space Habitation research.<br><br>Each expedition adds 180 days of Permanent Space Habitation research, which consumes 750 units of Research Payload every 30 days, so plan your cargo deliveries. You can use the crew already aboard the station, or rotate in a new one, as long as the station is never left without three crew.&br;&br;<b>Number of Expeditions Completed: @/index / @/maxCompletions</b>

	synopsis = Keep a crew of three on the station for another expedition

	completedMessage = Congratulations! Another expedition has been completed, and our station is still going strong.

	sortKey = 1610

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 2
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 800
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalEarthStations
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OES_CoreModule
	}

	// Each expedition takes Permanent Space Habitation 180 days further, on top of the 30 days of OES_CoreModule (3650 days in total)
	DATA
	{
		type = List<float>
		experimentList = [0.05753, 0.10685]
	}
	DATA
	{
		type = float
		experimentCompletion = @/experimentList.ElementAt(@/index)
		durationText = Round(3650 * @/experimentList.ElementAt(@/index), 1)
	}
	DATA
	{
		type = int
		index = $OES_Expedition_Count + 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression

		CONTRACT_COMPLETED_SUCCESS
		{
			OES_Expedition_Count = $OES_Expedition_Count + 1
		}
	}

	// ************ PARAMETERS ************
	PARAMETER
	{
		name = StayOnStation
		type = VesselParameterGroup
		title = Keep at least 3 crew aboard the station and continue Permanent Space Habitation
		vessel = OperationalStation
		notes = You can work on other contracts while your crew are working. You are safe to return to Mission Control
		completeInSequence = true
		disableOnStateChange = true

		PARAMETER
		{
			name = ThreeCrew
			type = HasCrew
			minCrew = 3
			crewOnly = true
			title = Have at least 3 crewmembers on board
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 300000
			maxApA = 500000
			targetBody = HomeWorld()
			disableOnStateChange = false
			title = Remain in a stable orbit
		}
		PARAMETER
		{
			name = PermanentSpaceHabitation
			type = RP1CollectScience
			title = Complete at least @/durationText out of 3650 days of Permanent Space Habitation
			notes = This experiment requires 3 crew and consumes 750 units of Research Payload every 30 days
			targetBody = HomeWorld()
			situation = InSpaceLow
			experiment = RP0longDurationHabit3
			fractionComplete = @/experimentCompletion
		}
	}
}
