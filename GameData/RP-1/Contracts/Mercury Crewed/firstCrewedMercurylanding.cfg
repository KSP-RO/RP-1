CONTRACT_TYPE
{
	name = firstCrewedMercurylanding
	title = First Crewed Mercury Landing
	group = CrewedMercuryExp
	agent = Flag Planting

	description = <b>Program: Crewed Mercury Exploration<br>Type: <color=green>Required</color> (expeditionary path)</b><br><br>We want to land on Mercury and explore the surface of this scorched, airless world with humans. Before descending, the crew will spend three weeks in orbit reconnoitring their landing site. Once on the surface they will stay for at least 60 days, broadcast their first steps to the world and set up a field geology station: a photographic survey of the site, X-ray fluorescence analysis of the rocks, a seismic station and a deep thermal probe to measure the heat escaping from Mercury's oversized iron core. Mercury's day lasts 176 Earth days, so choose your landing time and site carefully: the dayside surface reaches 430 °C, while the nightside drops to -180 °C.

	synopsis = Reconnoitre a landing site from orbit, then land a crew of at least 4 on Mercury for 60 days, plant a flag, broadcast the landing, run a photographic survey, X-ray fluorescence analysis, a seismic station and a deep thermal probe, and return home safely

	completedMessage = Congratulations! Human beings have set foot on the innermost planet of our Solar System. The monumental task that you have accomplished is something to be proud of!

	sortKey = 2033

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mercury

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 5000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedMercuryExp
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedMercuryOrbit
	}

	// ************ PARAMETERS ************
	PARAMETER
	{
		name = vesselGroup
		type = VesselParameterGroup
		title = Crewed Mercury Landing
		define = CrewedMercuryLanding

		PARAMETER
		{
			name = FourCrew
			type = HasCrew
			minCrew = 4
			maxCrew = 99
			title = Have at least 4 crewmembers on board
			hideChildren = true
		}
		PARAMETER
		{
			name = LandCrewed
			type = All
			title = Land the crewed lander
			disableOnStateChange = true

			PARAMETER
			{
				name = FourCrew
				type = HasCrew
				minCrew = 4
				maxCrew = 99
				title = Have at least 4 crewmembers on board
				hideChildren = true
			}
			PARAMETER
			{
				name = ReachState
				type = ReachState
				targetBody = Mercury
				situation = LANDED
				PARAMETER
				{
					name = Duration
					type = Duration
					duration = 60d
					preWaitText = Land on Mercury.
					waitingText = Exploring...
					completionText = Exploration completed, you may return to Earth when ready.
				}
			}
		}
		PARAMETER
		{
			name = PlantFlagOnMercury
			type = PlantFlag
			targetBody = Mercury
			title = Plant a flag on Mercury! Don't forget the picture
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return home safely
			hideChildren = true
			completeInSequence = true
		}
	}

	PARAMETER
	{
		name = LandingSiteRecon
		type = RP1CollectScience
		targetBody = Mercury
		experiment = RP0PlanetaryLandingSiteRecon
		recoveryMethod = RecoverOrTransmit
		title = Landing Site Reconnaissance from Mercury orbit
		hideChildren = true
	}

	PARAMETER
	{
		name = LandingBroadcast
		type = RP1CollectScience
		targetBody = Mercury
		experiment = RP0PlanetaryLandingTelevisionBroadcast
		recoveryMethod = RecoverOrTransmit
		title = Broadcast the first steps on Mercury
		hideChildren = true
	}

	PARAMETER
	{
		name = evaPhotoSurveyScan
		type = RP1CollectScience
		targetBody = Mercury
		experiment = evaPhotoSurveyScan
		recoveryMethod = RecoverOrTransmit
		title = General Photographic Survey of the landing site
		hideChildren = true
	}

	PARAMETER
	{
		name = evaXRFScan
		type = RP1CollectScience
		targetBody = Mercury
		experiment = evaXRFScan
		recoveryMethod = RecoverOrTransmit
		title = X-Ray Fluorescence analysis of the surface rocks
		hideChildren = true
	}

	PARAMETER
	{
		name = evaAdvancedSeismicScan
		type = RP1CollectScience
		targetBody = Mercury
		experiment = evaAdvancedSeismicScan
		recoveryMethod = RecoverOrTransmit
		title = Set up an Advanced Seismic Station (7 days)
		hideChildren = true
	}

	PARAMETER
	{
		name = evaDeepThermalScan
		type = RP1CollectScience
		targetBody = Mercury
		experiment = evaDeepThermalScan
		recoveryMethod = RecoverOrTransmit
		title = Deep Thermal Probe: measure the heat flowing out of Mercury's core (2 days)
		hideChildren = true
	}
