CONTRACT_TYPE
{
	name = CC_Polar
	title = Commercial Polar Crew Flight
	group = ComCrew
	agent = Federation Aeronautique Internationale

	description = <b>Program: Commercial Crew<br>Type: <color=blue>Optional</color></b><br><br>A flight over Earth's Poles is not terribly more difficult than a normal LEO flight, but has not been done by a crewed craft before: this will be a quick and easy publicity stunt!

	synopsis = Fly crew in a polar orbit around Earth

	completedMessage = Mission success! We have successfully flown humans in a polar orbit around Earth!

	sortKey = 2704

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 200
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ComCrew
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = CC_DemoCrewed
	}

	PARAMETER
	{
		name = UncrewedCommercialDemo
		type = VesselParameterGroup
		title = Circumlunar Flight

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}

		PARAMETER
		{
			name = HasNonReentryRatedParts
			type = PartValidation
			hideChildren = true
			title = Vessel has no parts with the tag "not rated for reentry"

			NONE
			{
				partModule = ModuleNonReentryRated
			}
		}
		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 0.001
				title = Craft must have Electric Charge after one day
				hideChildren = true
			}
			PARAMETER
			{
				name = OneCrew
				type = HasCrew
				minCrew = 2
				maxCrew = 2
				title = Have 2 crewmembers on board
				hideChildren = true
			}
			PARAMETER
			{
				name = Orbit
				type = Orbit
				minInclination = 85
				maxInclination = 95
				minPeA = 200000
				disableOnStateChange = true
				title = Achieve polar orbit with an inclination between 85 and 95 degrees and a minimum periapsis of 200 km

				PARAMETER
				{
					name = Duration
					type = Duration

					duration = 1d

					preWaitText = Check for stable orbit
					waitingText = Checking for stable orbit
					completionText = Stable orbit: Confirmed
				}
			}
			PARAMETER
			{
				name = ReturnHome
				type = RP1ReturnHome
				title = Return home safely
				hideChildren = true
				completeInSequence = true
			}
		}
	}
}
