CONTRACT_TYPE
{
    name = FirstCrewedTritonLanding
    title = Crewed Triton Landing
    group = CrewedNeptuneExp
    agent = Flag Planting

    description = <b>Program: Crewed Neptune System Exploration<br>Type: <color=green>Required</color></b><br><br>The pinnacle of outer system exploration is within reach. Orbiting Neptune in defiant retrograde motion, Triton is a frozen relic of the Kuiper Belt, its nitrogen-ice surface scarred by cryovolcanic plumes and painted with a faint pink tholin haze. Landing humans here—and sustaining them across the solar system's most remote and hostile frontier—represents one of the greatest engineering feats in human history.<br><br>Design and execute a mission to land at least 4 astronauts on the surface of Triton, maintain a surface stay for a year (365 days) while gathering core samples, and bring the crew safely home to Earth.
    synopsis = Land a crew of at least 4 on Triton for a year-long surface stay, collect surface samples.
    completedMessage = History has been made! Human footprints now mark the frozen nitrogen plains of Triton. The successful completion of a year-long surface stay on Neptune's largest moon stands as a testament to the heights our space program can reach.

    sortKey = 2904

    cancellable = true
    declinable = false
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0

    targetBody = Triton


    // ************ REWARDS ************
    prestige = Significant      
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 20000
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************

    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedNeptuneExp
    }

    REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract
        contractType = FirstCrewedTritonOrbit
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = vesselGroup
        type = VesselParameterGroup
        title = Crewed Triton Surface Mission
        define = CrewedTritonLanding

        PARAMETER
        {
            name = FourCrew
            type = HasCrew
            minCrew = 4
            maxCrew = 99
            title = Have at least 4 crew members on board
            hideChildren = true
        }

        PARAMETER
        {
            name = LandCrewed
            type = All
            title = Land the crewed vessel and conduct surface stay
            disableOnStateChange = true

            PARAMETER
            {
                name = FourCrew
                type = HasCrew
                minCrew = 4
                maxCrew = 99
                title = Maintain a crew of at least 4
                hideChildren = true
            }

            PARAMETER
            {
                name = ReachState
                type = ReachState
                targetBody = Triton
                situation = LANDED

                PARAMETER
                {
                    name = Duration
                    type = Duration
                    duration = 365d
                    preWaitText = Land on Triton.
                    waitingText = Executing a year long surface research stay...
                    completionText = Surface stay complete! Clear to prepare for Earth return ascent.
                }
            }
        }

        PARAMETER
        {
            name = PlantFlagOnTriton
            type = PlantFlag
            targetBody = Triton
            title = Plant a flag on Triton (and take a photo for the history books!)
            hideChildren = true
            disableOnStateChange = true
        }

        PARAMETER
        {
            name = surfaceSample1
            type = CollectScience
            targetBody = Triton
            experiment = surfaceSample2
            recoveryMethod = RecoverOrTransmit
            title = Gather Triton Surface Samples and <b><color=white>recover them to Earth</color></b>
            hideChildren = true
        }

        PARAMETER
        {
            name = surfaceSample2
            type = CollectScience
            targetBody = Triton
            experiment = surfaceSample3
            recoveryMethod = RecoverOrTransmit
            title = Gather Triton Deep Surface Samples and <b><color=white>recover them to Earth</color></b>
            hideChildren = true
        }
    }
}