CONTRACT_TYPE
{
    name = FirstCrewedTitanOrbit
    title = First Crewed Titan Orbit
    group = CrewedSaturnExp
    agent = Flag Planting

    description = <b>Program: Crewed Saturn System Exploration<br>Type: <color=green>Required</color></b><br><br>Titan is Saturn's largest moon and one of the most scientific intriguing worlds in the entire Solar System. Enshrouded in a dense organic haze, its thick atmosphere makes orbital navigation complex and unique.<br><br>Design, launch, and fly a mission capable of carrying at least four astronauts into a stable orbit around Titan. Maintain orbital operations for 20 days to conduct reconnaissance and mapping before returning the crew safely to Earth.
    synopsis = Fly four crew members to Titan, establish a 20-day orbit, and return safely home.
    completedMessage = Congratulations! Humanity has achieved its first crewed orbit around Titan! The orbital research and surface mapping conducted by our crew will pave the way for an eventual landing attempt.

    sortKey = 2529

    cancellable = true
    declinable = false
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0

    targetBody = Titan

    // ************ REWARDS ************
    prestige = Significant      
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 6000
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedSaturnExp
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = VesselGroup
        type = VesselParameterGroup
        title = First Crewed Orbit of Titan
        define = CrewedTitanOrbit

        PARAMETER
        {
            name = HasCrew
            type = HasCrew
            minCrew = 4
            crewOnly = true
            title = Have at least 4 crew members on board
            hideChildren = true
        }

        PARAMETER
        {
            name = TitanOrbit
            type = Orbit
            targetBody = Titan
            maxPeA = 400000  // 400 km Periapsis
            maxApA = 600000  // 600 km Apoapsis
            title = Reach orbit of Titan with a maximum periapsis  of 400 km and a maximum apoapsis of 600 km and hold it for at least 20 days
            disableOnStateChange = true
            completeInSequence = true

            PARAMETER
            {
                name = Duration
                type = Duration
                duration = 20d
                preWaitText = Achieve designated orbit around Titan.
                waitingText = Maintaining Titan orbit...
                completionText = Orbital operations complete!
            }
        }
    }