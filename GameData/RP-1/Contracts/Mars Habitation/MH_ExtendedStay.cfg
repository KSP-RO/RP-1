CONTRACT_TYPE
{
	name = MH_ExtendedStay
	title = Extended Martian Expedition
	group = MarsHabitation

	description = <b>Program: Operational Mars Habitation<br>Type: <color=blue>Optional</color></b><br><br>Every year on Mars teaches us more about living there. Keep at least <b>six</b> crew aboard the Base for another 500 days of Martian Habitation.<br><br>The 500 days do not have to be continuous, and crews can rotate as needed. This contract cannot be active at the same time as Living off Mars, since switching the Base over to full self-sufficiency conflicts with this Earth-resupplied habitation.&br;&br;<b>Number of Expeditions Completed: @/index / @/maxCompletions</b>

	synopsis = Keep a crew of six on the Martian Base for another 500 days

	completedMessage = Another expedition on Mars! Our crews are writing the book on living on another planet.

	sortKey = 2119

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 5 // One per entry in experimentList, completes the 3650 days of Martian Habitation
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mars


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 1200
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalMarsHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = MH_Expedition
	}
	REQUIREMENT
	{
		name = NoActiveSelfSufficiency
		type = AcceptContract
		contractType = MH_SelfSufficiency
		invertRequirement = true
	}

	// Each expedition takes Martian Habitation 500 days further, on top of the 500 days of the required expedition. The last one is 370 days, to finish at exactly 3650.
	DATA
	{
		type = List<float>
		experimentList = [0.48767, 0.62466, 0.76164, 0.89863, 1]
	}
	DATA
	{
		type = float
		experimentCompletion = @/experimentList.ElementAt(@/index)
		durationText = Round(3650 * @/experimentList.ElementAt(@/index), 1)
	}
	DATA
	{
		type = int
		index = $MH_ExtendedStay_Count + 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression

		CONTRACT_COMPLETED_SUCCESS
		{
			MH_ExtendedStay_Count = $MH_ExtendedStay_Count + 1
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = StayOnBase
		type = VesselParameterGroup
		title = Keep at least 6 crew aboard the Martian Base for another 500 days
		vessel = MarsBase
		notes = You can work on other contracts while your crew are working. You are safe to return to Mission Control
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Mars
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = SixCrew
			type = HasCrew
			minCrew = 6
			crewOnly = true
			title = Have at least 6 crewmembers on board
			hideChildren = true
		}
		PARAMETER
		{
			name = MarsHabitation
			type = RP1CollectScience
			title = Complete at least @/durationText out of 3650 days of Martian Habitation
			notes = This experiment requires 6 crew including a Scientist, and consumes 250 units of Research Payload every 30 days
			targetBody = Mars
			situation = SrfLanded
			experiment = RP0MarsHabit
			fractionComplete = @/experimentCompletion
		}
	}
}
