CONTRACT_TYPE
{
	name = Mercury_ESR
	title = Mercury Expedition Sample Return
	group = CrewedMercuryExp
	agent = Exploration

	description = <b>Program: Crewed Mercury Exploration<br>Type: <color=blue>Optional</color> (required for the sample return path)</b><br><br>Landing humans on Mercury is not the only way to bring its surface to our laboratories. Design and launch an uncrewed lander to gather surface samples from at least two regions of Mercury, then return them to a crewed expedition vessel waiting in orbit. The crew will analyse the samples in their laboratory before transmitting the results home to Earth.

	synopsis = Send an uncrewed craft to land on Mercury, collect surface samples from at least 2 biomes, and dock with a crewed expedition vessel carrying a laboratory in Mercury orbit. This can be performed as a standalone mission, or built into the crewed architecture.

	completedMessage = Congratulations! The samples analysed in Mercury orbit have given our planetary scientists their first close look at the surface of the innermost planet.

	sortKey = 2037

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mercury

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 2500
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedMercuryExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedMercuryOrbit
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = vesselGroupLaunch
		type = VesselParameterGroup
		title = Control a Vessel with the required parameters
		notes = The expedition vessel must include at least 1 Laboratory
		define = MercuryExpeditionMothership
		disableOnStateChange = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = HasScienceModule
			type = PartValidation
			partModule = Laboratory
			title = Carry a Science Lab Module
			minCount = 1
		}

		PARAMETER
		{
			name = MercuryOrbit
			type = ReachState
			targetBody = Mercury
			situation = ORBITING
			title = Reach orbit of Mercury
			disableOnStateChange = true
			completeInSequence = true
		}
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Mercury Robotic Sample Return

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = LandOnMercury
			type = ReachState
			targetBody = Mercury
			situation = LANDED
			disableOnStateChange = true
			title = Land on Mercury
			hideChildren = true
		}
		PARAMETER
		{
			name = HasSurfaceSample
			type = RP1HasExperiment
			experiment = surfaceSample
		}
		PARAMETER
		{
			name = Rendezvous
			type = Rendezvous
			vessel = MercuryExpeditionMothership
			distance = 100
			title = Rendezvous with the Mercury Expedition Vessel.
		}
		PARAMETER
		{
			name = Docking
			type = Docking
			vessel = MercuryExpeditionMothership
			completeInSequence = true
			title = Dock with the Mercury Expedition Vessel.
		}
	}

	PARAMETER
	{
		name = surfaceSample
		type = RP1CollectScience
		targetBody = Mercury
		experiment = surfaceSample
		minSubjectsToComplete = 2
		recoveryMethod = Transmit
		title = Transmit surface sample data from at least 2 biomes to Earth
		hideChildren = true
	}
}
