CONTRACT_TYPE
{
    name = venusStationExtended2
    title = Venus Station: Extended Research II (Stage 3)
    group = CrewedVenusExp
    agent = Exploration

    description = <b>Program: Crewed Venus Exploration <br>Type: <color=orange>Optional</color></b><br><br>Stage 3 of 3. Keep your Venus station in orbit for a third transfer window (584 more days) with at least 4 crew aboard throughout, and have the crew run at least 2 experiments: Gravity Field Survey and Plasma Environment Study. This completes the full 1,752 day research program. Each window is split into four 146 day checkpoints, so if the station leaves orbit only the checkpoint in progress is lost.
    synopsis = Keep the Venus station operating for a third transfer window
    completedMessage = Stage 3 complete! The Venus station has finished its full research program!

    sortKey = 2522

    cancellable = true
    declinable = true
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0

    targetBody = Venus

    // ************ REWARDS ************
    prestige = Significant
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 250
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedVenusExp    
    }

    REQUIREMENT
    {
        name = Stage2Done
        type = CompleteContract
        contractType = venusStationExtended1
    }

    // ************ PARAMETERS ************
    PARAMETER
