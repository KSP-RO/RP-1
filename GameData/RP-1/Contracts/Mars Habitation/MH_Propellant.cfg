CONTRACT_TYPE
{
	name = MH_Propellant
	title = Martian Propellant
	group = MarsHabitation

	description = <b>Program: Operational Mars Habitation<br>Type: <color=blue>Optional</color></b><br><br>Our Base pulls carbon dioxide from the air and hydrogen from the ice - which is enough to make some serious rocket propellant! And not just any: we can produce either hydrocarbon (methane) or hydrogen fuel, as well as the oxygen. Run an <b>SE-RWGS</b> or <b>Sabatier Process</b> unit on hydrogen from <b>Water Electrolysis</b> at the Martian Base for 60 days, and store the propellant.<br><br>A Mini ISRU or ISRU can host these processes. SE-RWGS makes both LqdMethane and LqdOxygen. The Sabatier Process only makes LqdMethane. The oxygen would then have to come from MOXIE or electrolysis and a GOX to LOX Converter.<br><br>Alternatively, skip the carbon chemistry entirely and run <b>Water Electrolysis</b> alone for 60 days to produce and store liquid hydrogen and oxygen directly.

	synopsis = Produce methane or liquid hydrogen propellant at the Martian Base

	completedMessage = The first rocket propellant made on Mars is in the tanks!

	sortKey = 2113

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mars


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 1000
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalMarsHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = MH_Water
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = MartianPropellant
		type = VesselParameterGroup
		title = Produce methane or liquid hydrogen propellant at the Martian Base for 60 days
		vessel = MarsBase
		notes = You can work on other contracts while the Base is working. You are safe to return to Mission Control
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Mars
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = ProducePropellant
			type = Any
			title = Produce methane or liquid hydrogen propellant

			PARAMETER
			{
				name = Methalox
				type = All
				title = Make methane and oxygen (Methalox)

				PARAMETER
				{
					name = HasMethanation
					type = Any
					title = Run an SE-RWGS or Sabatier Process unit
					hideChildren = true

					PARAMETER
					{
						name = HasRWGS
						type = HasResource
						resource = Resource("_RWGS")
						minQuantity = 0.99
						hideChildren = true
					}
					PARAMETER
					{
						name = HasSabatier
						type = HasResource
						resource = Resource("_Sabatier")
						minQuantity = 0.99
						hideChildren = true
					}
				}
				PARAMETER
				{
					name = HasElectrolysis
					type = HasResource
					resource = Resource("_WaterElectrolysis")
					minQuantity = 0.99
					title = Run Water Electrolysis for the hydrogen
					hideChildren = true
				}
				PARAMETER
				{
					name = HasCO2
					type = HasResource
					resource = CarbonDioxide
					minQuantity = 0.01
					title = Keep the plant fed with CarbonDioxide
					hideChildren = true
				}
				PARAMETER
				{
					name = HasCH4Tanks
					type = HasResourceCapacity
					resource = LqdMethane
					minQuantity = 999.9
					title = Have tanks for at least 1000 units of LqdMethane
					hideChildren = true
				}
				PARAMETER
				{
					name = HasLOXTanks
					type = HasResourceCapacity
					resource = LqdOxygen
					minQuantity = 999.9
					title = Have tanks for at least 1000 units of LqdOxygen
					hideChildren = true
				}
			}
			PARAMETER
			{
				name = LH2Lox
				type = All
				title = Make liquid hydrogen and oxygen (LH2/LOX)

				PARAMETER
				{
					name = HasElectrolysisLH2
					type = HasResource
					resource = Resource("_WaterElectrolysis")
					minQuantity = 0.99
					title = Run Water Electrolysis for the hydrogen and oxygen
					hideChildren = true
				}
				PARAMETER
				{
					name = HasLH2Tanks
					type = HasResourceCapacity
					resource = LqdHydrogen
					minQuantity = 999.9
					title = Have tanks for at least 1000 units of LqdHydrogen
					hideChildren = true
				}
				PARAMETER
				{
					name = HasLOXTanksLH2
					type = HasResourceCapacity
					resource = LqdOxygen
					minQuantity = 999.9
					title = Have tanks for at least 1000 units of LqdOxygen
					hideChildren = true
				}
			}
		}
		PARAMETER
		{
			name = Duration
			type = Duration
			duration = 60d
			preWaitText = Start up the propellant plant
			waitingText = Making Martian propellant
			completionText = 60 days of Martian propellant production completed
		}
	}
}
