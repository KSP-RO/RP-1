CONTRACT_TYPE
{
	name = Miranda_MajorSurfaceOperations
	title = Miranda Major Surface Operations
	group = CrewedUranusExp
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Uranus Exploration<br>Type: <color=blue>Optional</color></b><br><br>Land a crewed expeditionary vehicle at two of the strangest landmarks in the solar system: Verona Rupes, an ice cliff thought to be up to 20 km tall, and Inverness Corona, the grooved, chevron-marked terrain near Miranda's south pole. In Miranda's tiny gravity a fall from the top of Verona Rupes would last minutes, so land carefully. Run a different field science instrument at each site and remain at the last one for 24 hours.

	synopsis = Land a crewed expeditionary rover or a hop-capable lander within 1 km of each of the 2 landmarks on Miranda, run a different field science instrument at each and remain at the last one for 24 hours.

	completedMessage = Congratulations! The surface survey of Miranda has given our scientists their first ground truth on how this patchwork moon was torn apart and reassembled.

	sortKey = 2818

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Miranda

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 3000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedUranusExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = MirandaLandingCrew
	}

	// ************ WAYPOINTS ************
	// Coordinates are converted from the IAU gazetteer (planetocentric, +East, 0 to 360)
	// to KSP convention (+East, -180 to 180).

	BEHAVIOUR
	{
		name = LandmarkWaypoints
		type = WaypointGenerator
		targetBody = Miranda

		WAYPOINT
		{
			name = Verona Rupes
			icon = marker
			latitude = -18.3
			longitude = -12.2
			altitude = 0
			parameter = Site1
		}

		WAYPOINT
		{
			name = Inverness Corona
			icon = marker
			latitude = -66.9
			longitude = -34.3
			altitude = 0
			parameter = Site2
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = SurfaceExpedition
		type = VesselParameterGroup
		title = Control a vessel with the required parameters
		notes = Use an expeditionary rover or a lander capable of hopping between sites. The same vessel must visit both landmarks.
		define = MirandaSurfaceExpeditionVessel
		disableOnStateChange = false

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 2
			crewOnly = true
			title = Have at least 2 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = Site1
			type = Sequence
			title = Landmark 1: Verona Rupes

			PARAMETER
			{
				name = LandedNear1
				type = VisitWaypoint
				index = 0
				horizontalDistance = 1000
				title = Be within 1 km of Verona Rupes
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed1
				type = ReachState
				targetBody = Miranda
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Sample1
				type = RP1CollectScience
				targetBody = Miranda
				experiment = RP0PrecisionGravimeterScan
				situation = SrfLanded
				recoveryMethod = RecoverOrTransmit
				title = Run the Precision Gravimeter at Verona Rupes
			}
		}

		PARAMETER
		{
			name = Site2
			type = Sequence
			title = Landmark 2: Inverness Corona

			PARAMETER
			{
				name = LandedNear2
				type = VisitWaypoint
				index = 1
				horizontalDistance = 1000
				title = Be within 1 km of Inverness Corona
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed2
				type = ReachState
				targetBody = Miranda
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay2
				type = Duration
				duration = 24h
				preWaitText = Remain at Inverness Corona for 24 hours
				waitingText = Surveying Inverness Corona
				completionText = Survey of Inverness Corona complete
			}
			PARAMETER
			{
				name = Sample2
				type = RP1CollectScience
				targetBody = Miranda
				experiment = RP0SeismicArrayScan
				situation = SrfLanded
				recoveryMethod = RecoverOrTransmit
				title = Deploy a Distributed Seismic Survey across Inverness Corona
			}
		}
	}
}
