CONTRACT_TYPE
{
	name = Ceres_ESR_Rep
	title = Ceres Expedition Sample Return (Repeatable)
	group = CrewedAsteroid
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Asteroid Exploration<br>Type: <color=blue>Optional</color></b><br><br>Even though we have analyzed some samples from Ceres' surface, there is a lot of value in sending more robotic probes. Send a robotic probe back down to any site in the catalogue, then return it to the crewed expedition vessel in orbit.&br;&br;Land within 5 km of any site in the catalogue, then dock with the expedition vessel.

	genericDescription = Land a robotic probe at any catalogued site on Ceres and return it to the crewed expedition vessel in orbit.

	synopsis = Land a robotic probe at any catalogued site on Ceres and dock it with the crewed expedition vessel

	completedMessage = The probe's sample is safely back aboard the expedition vessel, and the crew have started analysing it!

	sortKey = 2006

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 4
	maxSimultaneous = 1
	deadline = 0

	targetBody = Ceres

	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 450
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedAsteroid
	}

	REQUIREMENT
	{
		name = Any
		type = Any
		title = Land crew on Ceres or sample at least 3 sites in the Ceres catalogue

		REQUIREMENT
		{
			name = CompleteContract
			type = CompleteContract
			contractType = CrewedCeresLanding
			title = Complete the First Crewed Ceres Landing contract
		}

		REQUIREMENT
		{
			name = CompleteContractESR
			type = CompleteContract
			contractType = Ceres_ESR
			minCount = 3
			title = Sample at least 3 sites in the Ceres catalogue
		}
	}

	// ************ DATA ************

	// Coordinates are the points deepest inside each RSS biome.
	DATA
	{
		type = double
		latOccatorCrater = 19.51
		longOccatorCrater = -34.98
		latCerealiaFacula = 19.86
		longCerealiaFacula = -31.11
		latKerwanPlain = -10.02
		longKerwanPlain = -146.43
		latZadeniCrater = -68.73
		longZadeniCrater = 125.33
		latUrvaraCrater = -45.88
		longUrvaraCrater = -20.92
		latYalodeCrater = -41.66
		longYalodeCrater = 20.21
		latHaulaniCrater = 6.50
		longHaulaniCrater = 101.07
	}

	// ************ BEHAVIOURS ************

	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator

		WAYPOINT
		{
			name = Occator Crater
			hidden = False
			targetBody = Ceres
			icon = marker
			altitude = 0.0
			latitude = @/latOccatorCrater
			longitude = @/longOccatorCrater
		}
		WAYPOINT
		{
			name = Cerealia Facula
			hidden = False
			targetBody = Ceres
			icon = marker
			altitude = 0.0
			latitude = @/latCerealiaFacula
			longitude = @/longCerealiaFacula
		}
		WAYPOINT
		{
			name = Kerwan Plain
			hidden = False
			targetBody = Ceres
			icon = marker
			altitude = 0.0
			latitude = @/latKerwanPlain
			longitude = @/longKerwanPlain
		}
		WAYPOINT
		{
			name = Zadeni Crater
			hidden = False
			targetBody = Ceres
			icon = marker
			altitude = 0.0
			latitude = @/latZadeniCrater
			longitude = @/longZadeniCrater
		}
		WAYPOINT
		{
			name = Urvara Crater
			hidden = False
			targetBody = Ceres
			icon = marker
			altitude = 0.0
			latitude = @/latUrvaraCrater
			longitude = @/longUrvaraCrater
		}
		WAYPOINT
		{
			name = Yalode Crater
			hidden = False
			targetBody = Ceres
			icon = marker
			altitude = 0.0
			latitude = @/latYalodeCrater
			longitude = @/longYalodeCrater
		}
		WAYPOINT
		{
			name = Haulani Crater
			hidden = False
			targetBody = Ceres
			icon = marker
			altitude = 0.0
			latitude = @/latHaulaniCrater
			longitude = @/longHaulaniCrater
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = ExpeditionVessel
		type = VesselParameterGroup
		title = Have a crewed expedition vessel with a laboratory in orbit of Ceres
		define = CeresExpeditionVessel
		disableOnStateChange = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = HasLaboratory
			type = PartValidation
			partModule = Laboratory
			minCount = 1
			title = Carry a laboratory
		}

		PARAMETER
		{
			name = EnterOrbit
			type = Orbit
			situation = ORBITING
			targetBody = Ceres
			maxPeA = @targetBody.Radius() * 2
			title = Orbit Ceres
		}
	}

	PARAMETER
	{
		name = Sampler
		type = VesselParameterGroup
		title = Robotic sampler

		PARAMETER
		{
			name = LandAtSite
			type = All
			title = Land the uncrewed sampler within 5 km of any catalogued site
			disableOnStateChange = true

			PARAMETER
			{
				name = Uncrewed
				type = HasCrew
				minCrew = 0
				maxCrew = 0
				title = Uncrewed
				hideChildren = true
			}

			PARAMETER
			{
				name = HasSurfaceSample
				type = RP1HasExperiment
				experiment = surfaceSample
				hideChildren = true
			}

			PARAMETER
			{
				name = Landed
				type = ReachState
				targetBody = Ceres
				situation = LANDED
				hideChildren = true
			}

			PARAMETER
			{
				name = AnySite
				type = Any
				title = Land within 5 km of any catalogued site

				PARAMETER
				{
					name = SiteOccatorCrater
					type = VisitWaypoint
					index = 0
					distance = 5000.0
					title = Occator Crater (19.51° North, 34.98° West)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteCerealiaFacula
					type = VisitWaypoint
					index = 1
					distance = 5000.0
					title = Cerealia Facula (19.86° North, 31.11° West)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteKerwanPlain
					type = VisitWaypoint
					index = 2
					distance = 5000.0
					title = Kerwan Plain (10.02° South, 146.43° West)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteZadeniCrater
					type = VisitWaypoint
					index = 3
					distance = 5000.0
					title = Zadeni Crater (68.73° South, 125.33° East)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteUrvaraCrater
					type = VisitWaypoint
					index = 4
					distance = 5000.0
					title = Urvara Crater (45.88° South, 20.92° West)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteYalodeCrater
					type = VisitWaypoint
					index = 5
					distance = 5000.0
					title = Yalode Crater (41.66° South, 20.21° East)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteHaulaniCrater
					type = VisitWaypoint
					index = 6
					distance = 5000.0
					title = Haulani Crater (6.50° North, 101.07° East)
					showMessages = true
					hideChildren = true
				}
			}
		}

		PARAMETER
		{
			name = DeliverSamples
			type = VesselParameterGroup
			title = Dock with the expedition vessel to deliver the samples
			completeInSequence = true

			PARAMETER
			{
				name = Docking
				type = Docking
				title = Dock with another vessel
			}

			PARAMETER
			{
				name = DockedToLaboratory
				type = PartValidation
				partModule = Laboratory
				minCount = 1
				title = The docked vessel carries a laboratory
			}
		}
	}
}
