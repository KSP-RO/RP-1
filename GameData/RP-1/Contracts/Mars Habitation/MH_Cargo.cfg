		{
			name = LandOnMars
			type = ReachState
			targetBody = Mars
			situation = LANDED
			title = Land on Mars
			hideChildren = true
		}
		PARAMETER
		{
			name = NearBase
			type = VisitWaypoint
			index = 0
			distance = 2000.0
			title = Land within 2 km of the Martian Base
			showMessages = true
			hideChildren = true
		}
	}

	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator

		WAYPOINT
		{
			name = Martian Base
			hidden = False
			targetBody = Mars
			icon = marker
			altitude = 0.0
