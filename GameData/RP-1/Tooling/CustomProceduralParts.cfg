//	===========================================================================
//	CUSTOMPROCEDURALPARTS' SPINE SHAPE
//	CustomProceduralParts adds the Spine to every ProceduralParts part (:AFTER[ProceduralParts]).
//	ModuleToolingPTank tools it as its widest and narrowest bounding cylinders.
//	===========================================================================

// Procedural avionics have no Spine: their tooling is one diameter x length
@PART:HAS[@MODULE[ModuleToolingProcAvionics],@MODULE[ProceduralShapeSpine]]:NEEDS[CustomProceduralParts]:AFTER[RP-0]
{
	!MODULE[ProceduralShapeSpine] {}
}
