@PART[FASA_Gemini_Lander_Pod|landerCabinSmall|ALCOR_LanderCapsule|bluedog_LEM_Ascent_Cockpit|FASALM_AscentStage|MEMLander|MEMLanderSXT|LEM_ASCENT_STAGE|ROC-LEMAscent|ROC-LEMAscentBDB|ROC-LEMAscentTaxiBDB|ROC-LEMShelterBDB|landerCabinMedium|mk2LanderCabin|mk2LanderCabin_v2|SXTLander|LK_Lander|rn_lk_lander|SSTU-LC2-POD|SSTU_LanderCore_LC3-POD|SSTU_LanderCore_LC5-POD]:HAS[#CrewCapacity[>0]]:BEFORE[zzzKerbalism]
{
	%capsuleTier = SurfaceLander
	%getsLunarLanderExperiments = True
	%getsGeneralSurfaceExperiments = True
}

// delete the tag
@PART[*]:HAS[#capsuleTier[SurfaceLander]]:LAST[zzzKerbalism]
{
	!capsuleTier = delete
}
