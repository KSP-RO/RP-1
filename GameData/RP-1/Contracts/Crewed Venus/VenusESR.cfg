CONTRACT_TYPE
{
	name = VenusESR
	title = Venus Expedition Sample Return 
	group = CrewedVenusExp
	agent = Federation Aeronautique Internationale

	description = <b>Program: Venus Surface Exploration<br>Type: <color=blue>Optional</color></b><br><br>Send an uncrewed probe into the Venusian atmosphere where it will collect some data and then return it to the Venus Expedition Vessel for more analysis this will help our scientists understand the make-up of the atmosphere and how it may have changed over time.

	synopsis = Send an uncrewed probe into the Venusian atmosphere and then return to dock to the Venus Expedition Vessel.

	completedMessage = Congratulations! Our scientists have learned valuable information about the make-up of the atmosphere.

	sortKey = 2503

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 2
	maxSimultaneous = 1
	deadline = 0

	targetBody = Venus


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 400
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedVenusExp
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = vesselGroupLaunch
		type = VesselParameterGroup
		title = Control a Vessel with the required parameters
		notes = The station must include at least 1 Laboratory
		define = VenusExpeditionMothership
		disableOnStateChange = true
		
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = HasScienceModule
			type = PartValidation
			partModule = Laboratory
			title = Carry a Science Lab Module
			minCount = 1
		}

		PARAMETER
        {
            name = VenusOrbit
            type = ReachState
            targetBody = Venus
            situation = ORBITING
			title = Reach orbit of Venus
        }
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Atmospheric probe Venus
	
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = EnterAtmo
			type = ReachState
			situation = FLYING
			disableOnStateChange = true
			maxAltitude = 70000
			title = Enter Venus atmosphere and reach  70 km of altitude or lower
			hideChildren = true
		}
		PARAMETER
		{
			name = Rendezvous
			type = Rendezvous
			vessel = VenusExpeditionMothership
			distance = 100
			title = Rendezvous with the Venus Expedition Vessel.
		}
		PARAMETER
		{
			name = Docking
			type = Docking
			vessel = VenusExpeditionMothership
			completeInSequence = true
			title = Dock with the Venus Expedition Vessel.
		}
	}
}

