CONTRACT_TYPE
{
	name = SolarWindSampleReturn
	title = Solar Wind Sample Return
	group = SolarExploration
	agent = Federation Aeronautique Internationale

	description = <b>Program: Solar Exploration<br>Type: <color=green>Required</color></b><br><br>While earlier probes have studied the Solar wind while en-route to other planets, our scientists want to get their hand on a proper sample and study it. Send a probe beyond Earth's sphere of influence to collect particles of the solar wind while in orbit around the Sun and then return them to Earth.<br><br>Historical example: Genesis

	synopsis = Collect solar wind samples in solar orbit and return them to Earth

	completedMessage = The sample capsule has been recovered. Our scientists can now study pristine material from the Sun itself.

	sortKey = 806

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Sun

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 350
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = SolarExploration
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Solar Wind Sample Return

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = SolarOrbit
			type = Orbit
			targetBody = Sun
			title = Orbit the Sun outside Earth's sphere of influence for 180 days
			disableOnStateChange = true

			PARAMETER
			{
				name = Duration
				type = Duration

				duration = 180d

				preWaitText = Begin solar wind collection
				waitingText = Collecting solar wind samples
				completionText = Sample collection complete
			}
		}
		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return to Earth safely with the samples
			hideChildren = true
			completeInSequence = true
		}
	}
