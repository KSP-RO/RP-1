CONTRACT_TYPE
{
	name = MH_FueledAscent
	title = Mars-Fueled Ascent
	group = MarsHabitation

	description = <b>Program: Operational Mars Habitation<br>Type: <color=blue>Optional</color></b><br><br>Our Martian propellant plant is in operation! Demonstrate it by flying a crewed ascent vehicle to Mars orbit on propellant made at Mars. Dock to a vessel in Mars orbit, or return home.<br><br>The vehicle must land within 200 m of the Base with at most 100 units of propellant, then take on at least 1000 units of <b>LqdMethane</b> or <b>LqdHydrogen</b> from the Base, docking with it or with a tanker rover.

	synopsis = Fly a crewed vehicle to Mars orbit on propellant made at the Martian Base

	completedMessage = The first spacecraft to leave Mars on Martian propellant!

	sortKey = 2114

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mars


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 1500
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalMarsHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = MH_Propellant
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = Arrival
		type = VesselParameterGroup
		title = Land at the Martian Base with nearly empty propellant tanks
		define = MarsFuelDemo
		disableOnStateChange = true

		PARAMETER
		{
			name = NotTheBase
			type = IsNotVessel
			vessel = MarsBase
			title = Use an ascent vehicle
			hideChildren = true
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Mars
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = AtBase
			type = VisitWaypoint
			index = 0
			distance = 200.0
			title = Land within 200 m of the Martian Base
			showMessages = true
			hideChildren = true
		}
		PARAMETER
		{
			name = NearlyEmpty
			type = All
			title = Have at most 100 units of propellant on board
			hideChildren = true

			PARAMETER
			{
				name = NearlyEmptyMethane
				type = HasResource
				resource = LqdMethane
				minQuantity = 0
				maxQuantity = 100
				hideChildren = true
			}
			PARAMETER
			{
				name = NearlyEmptyLH2
				type = HasResource
				resource = LqdHydrogen
				minQuantity = 0
				maxQuantity = 100
				hideChildren = true
			}
		}
	}
	PARAMETER
	{
		name = Refuel
		type = VesselParameterGroup
		title = Refuel the vehicle with at least 1000 units of propellant from the Martian Base
		vessel = MarsFuelDemo
		completeInSequence = true
		disableOnStateChange = true

		// While docked, the vehicle and the Base are one vessel and the Base's tanks would count
		PARAMETER
		{
			name = Undocked
			type = IsNotVessel
			vessel = MarsBase
			title = Undock from the Martian Base
			hideChildren = true
		}
		PARAMETER
		{
			name = Landed
			type = ReachState
			targetBody = Mars
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = AtBase
			type = VisitWaypoint
			index = 0
			distance = 200.0
			title = Stay within 200 m of the Martian Base
			showMessages = true
			hideChildren = true
		}
		PARAMETER
		{
			name = Refuelled
			type = Any
			title = Have at least 1000 units of propellant on board
			hideChildren = true

			PARAMETER
			{
				name = RefuelledMethane
				type = HasResource
				resource = LqdMethane
				minQuantity = 1000
				hideChildren = true
			}
			PARAMETER
			{
				name = RefuelledLH2
				type = HasResource
				resource = LqdHydrogen
				minQuantity = 1000
				hideChildren = true
			}
		}
	}
	PARAMETER
	{
		name = Ascent
		type = VesselParameterGroup
		title = Fly the refuelled vehicle to Mars orbit
		vessel = MarsFuelDemo
		completeInSequence = true
		disableOnStateChange = true

		PARAMETER
		{
			name = OneCrew
			type = HasCrew
			minCrew = 1
			crewOnly = true
			title = Have at least 1 crew on board
			hideChildren = true
		}
		PARAMETER
		{
			name = MarsOrbit
			type = Orbit
			targetBody = Mars
			minPeA = 150000
			title = Reach Mars orbit with a minimum periapsis of 150 km
			disableOnStateChange = true
			hideChildren = true
		}
		PARAMETER
		{
			name = Finish
			type = Any
			title = Dock with a vessel in Mars orbit or return home safely
			completeInSequence = true

			PARAMETER
			{
				name = Docking
				type = Docking
				title = Dock with a vessel in Mars orbit
				hideChildren = true
			}
			PARAMETER
			{
				name = ReturnHome
				type = RP1ReturnHome
				title = Return home safely
				hideChildren = true
			}
		}
	}

	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator

		WAYPOINT
		{
			name = Martian Base
			hidden = False
			targetBody = Mars
			icon = marker
			altitude = 0.0
			latitude = Vessel(MarsBase).Location().Latitude()
			longitude = Vessel(MarsBase).Location().Longitude()
		}
	}
}
