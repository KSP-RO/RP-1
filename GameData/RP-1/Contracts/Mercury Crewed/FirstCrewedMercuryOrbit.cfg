CONTRACT_TYPE
{
	name = FirstCrewedMercuryOrbit
	title = Orbit Mercury (Crewed)
	group = CrewedMercuryExp
	agent = Exploration

	description = <b>Program: Crewed Mercury Exploration<br>Type: <color=green>Required</color></b><br><br>Design and successfully launch a craft that can carry at least four crew into orbit around Mercury and return them safely to Earth. Our probes have mapped Mercury from orbit, but no human has ever ventured this deep into the Sun's gravity well, and braking into orbit here is one of the most demanding manoeuvres in the inner Solar System. On the way, the crew will test their ability to navigate interplanetary space on their own, as a loss of contact this close to the Sun is a real possibility, and film their approach to the innermost planet. Once there, they will spend at least 14 days observing the planet and surveying its surface from orbit, laying the groundwork for the landings to come.

	synopsis = Send a crew of at least 4 into orbit of Mercury for at least 14 days. Perform deep space navigation trials during the cruise, film the approach, carry out orbital observations and a surface survey, then return home safely

	completedMessage = Congratulations! Humans have laid their own eyes on Mercury for the first time, and the crew has returned safely with a wealth of observations for our scientists to study.

	sortKey = 2031

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mercury

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 1500
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************
	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedMercuryExp
	}

	// ************ PARAMETERS ************
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Orbit Mercury
		define = CrewOrbitMercury

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 4
			title = Have at least 4 Crewmembers
			hideChildren = true
		}

		PARAMETER
		{
			name = MercuryOrbit
			type = ReachState
			targetBody = Mercury
			situation = ORBITING
			title = Reach orbit of Mercury and hold it for at least 14 days

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 14d
				preWaitText = Reach orbit of Mercury
				waitingText = Orbiting...
				completionText = Orbital stay complete, you may return to Earth when ready
			}
		}

		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return home safely
			hideChildren = true
			completeInSequence = true
		}
	}

	PARAMETER
	{
		name = DeepSpaceNavigation
		type = RP1CollectScience
		targetBody = Sun
		experiment = RP0DeepSpaceNavigation
		recoveryMethod = RecoverOrTransmit
		title = Deep Space Navigation Trials during the interplanetary cruise
		hideChildren = true
	}

	PARAMETER
	{
		name = ApproachVideo
		type = RP1CollectScience
		targetBody = Mercury
		experiment = RP0PlanetaryApproachVideo
		recoveryMethod = RecoverOrTransmit
		title = Planetary Approach Crew Video of Mercury
		hideChildren = true
	}

	PARAMETER
	{
		name = EyeObservation
		type = RP1CollectScience
		targetBody = Mercury
		experiment = RP0PlanetaryEyeObservation
		recoveryMethod = RecoverOrTransmit
		title = Human Eye Orbital Observation of Mercury
		hideChildren = true
	}

	PARAMETER
	{
		name = OrbitalSurfaceSurvey
		type = RP1CollectScience
		targetBody = Mercury
		experiment = RP0CrewedPlanetSurvey
		recoveryMethod = RecoverOrTransmit
		title = Orbital Surface Survey of Mercury
		hideChildren = true
	}
}
