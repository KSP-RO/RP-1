CONTRACT_TYPE
{
	name = CLD_BioSat
	title = Commercially Launched Biological Satellite
	group = ComLaunchDev
	agent = Federation Aeronautique Internationale

	description = <b>Program: Commercial Launch Development<br>Type: <color=blue>Optional</color></b><br><br>Having proven that we can place a satellite into orbit, as well as hypersonic flight testing, our Public Relations department has proposed a publicity stunt: the world knows of Laika, the tragic story of the Soviet dog that died in orbit. Our PR department wants us to not only place a similarly sized animal into orbit, but also successfully retrieve it.

	synopsis = Launch a Bio Satellite into an eccentric orbit of Earth with an Advanced Biological Capsule.

	completedMessage = Congratulations! The satellite you sent into orbit has returned extremely valuable data.

	sortKey = 2504

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 80
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ComLaunchDev
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = CLD_FirstSat
	}
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = CLD_ReentryTest
	}

	PARAMETER
	{
		name = FirstSat
		type = VesselParameterGroup
		title = First Commercial Biological Satelite

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}

		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			title = Survive in orbit for a day

			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 0.001
				title = Craft must have Electric Charge after one day
				hideChildren = true
			}
				
			PARAMETER
			{
				name = Satellite Mass
				type = VesselMass
				minMass = 0.400
				title = Satellite must be at least 400 kg
			}

			PARAMETER
			{
				name = Advanced Biological Capsule
				type = PartValidation
				part = BioCapsule
				minCount = 1
				title = Have at least 1 Advanced Biological Capsule
				hideChildren = true
			}

			PARAMETER
			{
				name = Orbit
				type = Orbit
				minPeA = 200000
				disableOnStateChange = true
				title = Achieve orbit around @targetBody with a minimum periapsis of 200 km.
			}

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 1d
				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
			PARAMETER
			{
				name = ReturnHome
				type = RP1ReturnHome
				title = Return home safely
				hideChildren = true
				completeInSequence = true
			}
		}
	}
}
