CONTRACT_TYPE
{
	name = Vesta_ESR
	title = Vesta Expedition Sample Return
	group = CrewedAsteroid
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Asteroid Exploration<br>Type: <color=green>Required</color></b><br><br>With a crewed expedition vessel in orbit of Vesta, we can increase safety drastically by sending robotic explorers to the surface instead of humans. They will land, collect samples and return to the expedition vessel for further analysis. <br><br>Land within 5 km of any site in the catalogue that has not been sampled yet, then dock with the expedition vessel. Each site can only be sampled once.<br><br><b>Sites visited: @index / 4</b>

	genericDescription = Land a robotic probe at a site on Vesta that has not been visited yet and return it to the crewed expedition vessel in orbit.

	synopsis = Land a robotic probe at an unsampled site on Vesta and dock it with the crewed expedition vessel

	completedMessage = The probe's sample is safely back aboard the expedition vessel, and the crew have started analysing it!

	sortKey = 2005

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 4
	maxSimultaneous = 1
	deadline = 0

	targetBody = Vesta

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 900
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedAsteroid
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = CrewedVestaLanding
		invertRequirement = true
		title = Don't have an active Crewed Vesta Landing contract.
	}

	// ************ DATA ************

	DATA
	{
		type = int
		index = $Vesta_ESR_Count + 0
	}

	// Coordinates are the points deepest inside each RSS biome.
	// Sites that were already sampled get an unreachable landing radius, so every completion has to be a new site.
	DATA
	{
		type = double
		latMarciaCrater = 7.82
		longMarciaCrater = -80.07
		distMarciaCrater = 5000.0 - 4999.0 * ($Vesta_ESR_MarciaCrater + 0)
		latCalpurniaCrater = 16.79
		longCalpurniaCrater = -70.75
		distCalpurniaCrater = 5000.0 - 4999.0 * ($Vesta_ESR_CalpurniaCrater + 0)
		latMinuciaCrater = 20.30
		longMinuciaCrater = -62.31
		distMinuciaCrater = 5000.0 - 4999.0 * ($Vesta_ESR_MinuciaCrater + 0)
		latVestaliaTerra = -6.77
		longVestaliaTerra = -36.65
		distVestaliaTerra = 5000.0 - 4999.0 * ($Vesta_ESR_VestaliaTerra + 0)
		latSaturnaliaFossae = 29.09
		longSaturnaliaFossae = -26.98
		distSaturnaliaFossae = 5000.0 - 4999.0 * ($Vesta_ESR_SaturnaliaFossae + 0)
		latDivaliaFossae = -14.85
		longDivaliaFossae = 109.25
		distDivaliaFossae = 5000.0 - 4999.0 * ($Vesta_ESR_DivaliaFossae + 0)
		latAlbanaCrater = 75.32
		longAlbanaCrater = 140.54
		distAlbanaCrater = 5000.0 - 4999.0 * ($Vesta_ESR_AlbanaCrater + 0)
		latRheasilvia = -87.45
		longRheasilvia = 149.33
		distRheasilvia = 5000.0 - 4999.0 * ($Vesta_ESR_Rheasilvia + 0)
	}

	DATA
	{
		type = bool
		doneMarciaCrater = ($Vesta_ESR_MarciaCrater + 0) == 1
		doneCalpurniaCrater = ($Vesta_ESR_CalpurniaCrater + 0) == 1
		doneMinuciaCrater = ($Vesta_ESR_MinuciaCrater + 0) == 1
		doneVestaliaTerra = ($Vesta_ESR_VestaliaTerra + 0) == 1
		doneSaturnaliaFossae = ($Vesta_ESR_SaturnaliaFossae + 0) == 1
		doneDivaliaFossae = ($Vesta_ESR_DivaliaFossae + 0) == 1
		doneAlbanaCrater = ($Vesta_ESR_AlbanaCrater + 0) == 1
		doneRheasilvia = ($Vesta_ESR_Rheasilvia + 0) == 1
		hidden = true
	}

	// ************ BEHAVIOURS ************

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression

		CONTRACT_COMPLETED_SUCCESS
		{
			Vesta_ESR_Count = $Vesta_ESR_Count + 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledMarciaCrater
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteMarciaCrater
			Vesta_ESR_MarciaCrater = 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledCalpurniaCrater
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteCalpurniaCrater
			Vesta_ESR_CalpurniaCrater = 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledMinuciaCrater
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteMinuciaCrater
			Vesta_ESR_MinuciaCrater = 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledVestaliaTerra
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteVestaliaTerra
			Vesta_ESR_VestaliaTerra = 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledSaturnaliaFossae
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteSaturnaliaFossae
			Vesta_ESR_SaturnaliaFossae = 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledDivaliaFossae
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteDivaliaFossae
			Vesta_ESR_DivaliaFossae = 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledAlbanaCrater
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteAlbanaCrater
			Vesta_ESR_AlbanaCrater = 1
		}
	}

	BEHAVIOUR
	{
		name = MarkSampledRheasilvia
		type = Expression

		PARAMETER_COMPLETED
		{
			parameter = SiteRheasilvia
			Vesta_ESR_Rheasilvia = 1
		}
	}

	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator

		WAYPOINT
		{
			name = Marcia Crater
			hidden = @/doneMarciaCrater
			targetBody = Vesta
			icon = marker
			altitude = 0.0
			latitude = @/latMarciaCrater
			longitude = @/longMarciaCrater
		}
		WAYPOINT
		{
			name = Calpurnia Crater
			hidden = @/doneCalpurniaCrater
			targetBody = Vesta
			icon = marker
			altitude = 0.0
			latitude = @/latCalpurniaCrater
			longitude = @/longCalpurniaCrater
		}
		WAYPOINT
		{
			name = Minucia Crater
			hidden = @/doneMinuciaCrater
			targetBody = Vesta
			icon = marker
			altitude = 0.0
			latitude = @/latMinuciaCrater
			longitude = @/longMinuciaCrater
		}
		WAYPOINT
		{
			name = Vestalia Terra
			hidden = @/doneVestaliaTerra
			targetBody = Vesta
			icon = marker
			altitude = 0.0
			latitude = @/latVestaliaTerra
			longitude = @/longVestaliaTerra
		}
		WAYPOINT
		{
			name = Saturnalia Fossae
			hidden = @/doneSaturnaliaFossae
			targetBody = Vesta
			icon = marker
			altitude = 0.0
			latitude = @/latSaturnaliaFossae
			longitude = @/longSaturnaliaFossae
		}
		WAYPOINT
		{
			name = Divalia Fossae
			hidden = @/doneDivaliaFossae
			targetBody = Vesta
			icon = marker
			altitude = 0.0
			latitude = @/latDivaliaFossae
			longitude = @/longDivaliaFossae
		}
		WAYPOINT
		{
			name = Albana Crater
			hidden = @/doneAlbanaCrater
			targetBody = Vesta
			icon = marker
			altitude = 0.0
			latitude = @/latAlbanaCrater
			longitude = @/longAlbanaCrater
		}
		WAYPOINT
		{
			name = Rheasilvia
			hidden = @/doneRheasilvia
			targetBody = Vesta
			icon = marker
			altitude = 0.0
			latitude = @/latRheasilvia
			longitude = @/longRheasilvia
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = ExpeditionVessel
		type = VesselParameterGroup
		title = Have a crewed expedition vessel with a laboratory in orbit of Vesta
		define = VestaExpeditionVessel
		disableOnStateChange = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = HasLaboratory
			type = PartValidation
			partModule = Laboratory
			minCount = 1
			title = Carry a laboratory
		}

		PARAMETER
		{
			name = EnterOrbit
			type = Orbit
			situation = ORBITING
			targetBody = Vesta
			maxPeA = @targetBody.Radius() * 2
			title = Orbit Vesta
		}
	}

	PARAMETER
	{
		name = Sampler
		type = VesselParameterGroup
		title = Robotic sampler

		PARAMETER
		{
			name = LandAtSite
			type = All
			title = Land the uncrewed sampler within 5 km of an unsampled site
			disableOnStateChange = true

			PARAMETER
			{
				name = Uncrewed
				type = HasCrew
				minCrew = 0
				maxCrew = 0
				title = Uncrewed
				hideChildren = true
			}

			PARAMETER
			{
				name = HasSurfaceSample
				type = RP1HasExperiment
				experiment = surfaceSample
				hideChildren = true
			}

			PARAMETER
			{
				name = Landed
				type = ReachState
				targetBody = Vesta
				situation = LANDED
				hideChildren = true
			}

			PARAMETER
			{
				name = AnySite
				type = Any
				title = Land within 5 km of any unsampled site

				PARAMETER
				{
					name = SiteMarciaCrater
					type = VisitWaypoint
					index = 0
					distance = @/distMarciaCrater
					title = Marcia Crater (7.82° North, 80.07° West)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteCalpurniaCrater
					type = VisitWaypoint
					index = 1
					distance = @/distCalpurniaCrater
					title = Calpurnia Crater (16.79° North, 70.75° West)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteMinuciaCrater
					type = VisitWaypoint
					index = 2
					distance = @/distMinuciaCrater
					title = Minucia Crater (20.30° North, 62.31° West)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteVestaliaTerra
					type = VisitWaypoint
					index = 3
					distance = @/distVestaliaTerra
					title = Vestalia Terra (6.77° South, 36.65° West)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteSaturnaliaFossae
					type = VisitWaypoint
					index = 4
					distance = @/distSaturnaliaFossae
					title = Saturnalia Fossae (29.09° North, 26.98° West)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteDivaliaFossae
					type = VisitWaypoint
					index = 5
					distance = @/distDivaliaFossae
					title = Divalia Fossae (14.85° South, 109.25° East)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteAlbanaCrater
					type = VisitWaypoint
					index = 6
					distance = @/distAlbanaCrater
					title = Albana Crater (75.32° North, 140.54° East)
					showMessages = true
					hideChildren = true
				}
				PARAMETER
				{
					name = SiteRheasilvia
					type = VisitWaypoint
					index = 7
					distance = @/distRheasilvia
					title = Rheasilvia (87.45° South, 149.33° East)
					showMessages = true
					hideChildren = true
				}
			}
		}

		PARAMETER
		{
			name = DeliverSamples
			type = VesselParameterGroup
			title = Dock with the expedition vessel to deliver the samples
			completeInSequence = true

			PARAMETER
			{
				name = Docking
				type = Docking
				title = Dock with another vessel
			}

			PARAMETER
			{
				name = DockedToLaboratory
				type = PartValidation
				partModule = Laboratory
				minCount = 1
				title = The docked vessel carries a laboratory
			}
		}
	}
}
