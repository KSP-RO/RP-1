CONTRACT_TYPE
{
	name = Titan_ESR
	title = Titan Expedition Sample Return
	group = CrewedSaturnExp
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Saturn Exploration<br>Type: <color=blue>Optional</color></b><br><br>Design and successfully launch an uncrewed probe to land on Titan, gather surface samples from beneath its dense, hazy atmosphere and process them in a laboratory before transmitting the data home to Earth.

	synopsis = Send an uncrewed craft to land on Titan and collect and transmit the surface samples to Earth. This can be performed as a standalone mission, or built into the crewed architecture, utilizing a sample recovery in orbit. 

	completedMessage = Congratulations! Our scientists can learn a lot more about the organic chemistry of Titan by studying the physical samples that you have returned.

	sortKey = 25220

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Titan

	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 2500
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedSaturnExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedSaturnOrbit
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = vesselGroupLaunch
		type = VesselParameterGroup
		title = Control a Vessel with the required parameters
		notes = The station must include at least 1 Laboratory
		define = SaturnExpeditionMothership
		disableOnStateChange = true
		
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = HasScienceModule
			type = PartValidation
			partModule = Laboratory
			title = Carry a Science Lab Module
			minCount = 1
		}

		PARAMETER
		{
			name = SaturnOrbit
			title = Reach orbit of Saturn with a maximum pe of 1,780,000 km and a maximum ap of 1,886,000 km and hold it for at least 7 days
			type = Orbit
			maxPeA = 1780000000  // 1.5x Titan Periapsis at 1,186,700 km 
			maxApA = 1886000000  // 1.5x Titan Apoapsis at 1,257,000 km
			targetBody = Saturn
			disableOnStateChange = true
			completeInSequence = true
		}
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Titan Robotic Sample Return
	
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = LandOnTitan
			type = ReachState
			targetBody = Titan
			situation = LANDED
			disableOnStateChange = true
			title = Land on Titan
			hideChildren = true
		}
		PARAMETER
		{
			name = HasSurfaceSample
			type = RP1HasExperiment
			experiment = surfaceSample
		}
		PARAMETER
		{
			name = Rendezvous
			type = Rendezvous
			vessel = SaturnExpeditionMothership
			distance = 100
			title = Rendezvous with the Saturn Expedition Vessel.
		}
		PARAMETER
		{
			name = Docking
			type = Docking
			vessel = SaturnExpeditionMothership
			completeInSequence = true
			title = Dock with the Saturn Expedition Vessel.
		}
        
        PARAMETER
        {
            name = surfaceSample
            type = CollectScience
            targetBody = Titan
            experiment = surfaceSample
            recoveryMethod = Transmit
            title = Transmit the surface sample data to Earth
            hideChildren = true
        }
	}
}