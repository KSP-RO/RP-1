CONTRACT_TYPE
{
	name = FirstCrewedUranusOrbit
	title = First Crewed Uranus Orbit
	group = CrewedUranusExp
	agent = Flag Planting

	description = <b>Program: Crewed Uranus Exploration<br>Type: <color=green>Required</color></b><br><br>The ice giant Uranus, tipped almost fully on its side and shrouded in a frigid methane atmosphere, represents one of the most extreme destinations in the outer solar system. Reaching this distant, tilted world will demand a voyage of over a decade through the outer solar system, testing our life support, propulsion, and navigation systems far beyond anything attempted before.<br><br>Design and launch a crewed deep-space vehicle capable of carrying at least four astronauts into orbit around Uranus, conduct initial orbital operations amid its faint ring system and tumbling moons.
	synopsis = Command the first crewed expedition to orbit Uranus with at least four astronauts.
	completedMessage = A historic triumph! Human beings have entered orbit around Uranus, the sideways-spinning ice giant, gazing upon its pale blue-green atmosphere and delicate rings. The successful execution of this voyage opens a brand-new chapter in deep-space exploration.
	sortKey = 2807

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Uranus

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 8000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedUranusExp
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = First crewed orbit of Uranus

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = UranusOrbit
            type = ReachState
            targetBody = Uranus
            situation = ORBITING
			title = Reach orbit of Uranus and hold it for at least a day

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 1d
				preWaitText = Reach specified orbit
				waitingText = Orbiting...
				completionText = Uranus orbit reached!
			}
		}

		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return Home Safely
			hideChildren = true
			completeInSequence = true
		}
	}
}