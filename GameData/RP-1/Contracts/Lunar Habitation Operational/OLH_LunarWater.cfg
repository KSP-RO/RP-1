CONTRACT_TYPE
{
	name = OLH_LunarWater
	title = Lunar Water Extraction
	group = OperationalLunarHabitation

	description = <b>Program: Operational Lunar Habitation<br>Type: <color=blue>Optional</color></b><br><br>Thanks to our new Regolith miner, we can potentially also access the Water ice in the lunar soil. This could be used to supply our base with water, but mission planners are even more interested in the second potential application: the production of hydrogen and oxygen - rocket fuel made on the Moon! Add a drill configured as a <b>Water Extractor</b> and <b>Water Electrolysis</b> equipment to our Lunar Base and run them for 30 days.<br><br>Ice is most plentiful near the poles. A Chemical Plant configured for Water Electrolysis is enough. Larger ISRU units also count.

	synopsis = Extract and split water at the Lunar Base

	completedMessage = Our Lunar Base is now producing hydrogen and oxygen from lunar water, the first step towards making propellant on the Moon.

	sortKey = 2007

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon


	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 600
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalLunarHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OLH_RegolithMiner
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = LunarWater
		type = VesselParameterGroup
		title = Extract and split water at the Lunar Base for 30 days
		vessel = MoonBase
		notes = You can work on other contracts while the Base is working. You are safe to return to Mission Control
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Moon
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = HasDrill
			type = Any
			title = Have a drill configured as Water Extractor on the Base

			PARAMETER
			{
				name = HasSmallDrill
				type = PartValidation
				part = kerbalism-drill
				minCount = 1
				hideChildren = true
			}
			PARAMETER
			{
				name = HasLargeDrill
				type = PartValidation
				part = kerbalism-large-drill
				minCount = 1
				hideChildren = true
			}
		}
		PARAMETER
		{
			name = HasElectrolysis
			type = HasResource
			resource = Resource("_WaterElectrolysis")
			minQuantity = 2.99
			title = Run Water Electrolysis (one Chemical Plant)
			hideChildren = true
		}
		PARAMETER
		{
			name = HasWater
			type = HasResource
			resource = Water
			minQuantity = 0.01
			title = Keep the electrolysis supplied with Water
			hideChildren = true
		}
		PARAMETER
		{
			name = Duration
			type = Duration
			duration = 30d
			preWaitText = Start up water extraction
			waitingText = Extracting and splitting water
			completionText = 30 days of lunar water processing completed
		}
	}
}
