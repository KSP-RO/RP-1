		// Leader text
		#rp0_Leaders_Desc_leaderVonBraun = 沃纳·冯·布劳恩曾为纳粹德国设计 V-2 火箭，后来通过“回形针行动”移居美国，并进入美国陆军弹道导弹局（ABMA）工作。先锋 1 号发射失败后，ABMA 使用由红石导弹衍生而来的朱诺一号火箭，成功发射了探索者 1 号卫星。此后，ABMA 并入 NASA，成为马歇尔太空飞行中心，冯·布劳恩则在土星一号与土星五号的设计中发挥了重要作用。他曾因过于谨慎以及可能犯下反人类罪而受到批评，但从未因此受审。
		#rp0_Leaders_Desc_leaderRosen = 米尔顿·罗森曾领导美国海军研究实验室的维京与先锋计划。先锋计划相关部门后来并入 NASA，并成为戈达德太空飞行中心的核心。先锋计划结束后，罗森出任 NASA 运载火箭与推进部门主任，参与奠定土星一号和土星五号运载火箭的基础，并发起了将先锋火箭的简易上面级与雷神助推器结合的计划，即后来的雷神-德尔塔火箭。

