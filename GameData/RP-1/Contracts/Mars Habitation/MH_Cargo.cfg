CONTRACT_TYPE
{
	name = MH_Cargo
	title = Uncrewed Martian Cargo Delivery
	group = MarsHabitation

	description = <b>Program: Operational Mars Habitation<br>Type: <color=blue>Optional</color></b><br><br>While our base produces almost everything on-site, there are some things it cannot source locally, such as electronics. Land an <b>uncrewed</b> cargo lander within 2 km of the Martian Base, carrying at least a year of Research Payload.

	synopsis = Land an uncrewed cargo lander next to the Martian Base

	completedMessage = The cargo lander has touched down safely next to the Base. The crew are already unpacking!

	sortKey = 2108

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 4
	maxSimultaneous = 1
	deadline = 0

	targetBody = Mars


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 1000
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalMarsHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = MH_BaseLanding
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = CargoLanding
		type = VesselParameterGroup
		title = Land an uncrewed cargo lander next to the Martian Base
		disableOnStateChange = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new cargo lander
			hideChildren = true
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = HasResearchPayload
			type = HasResource
			resource = ResearchPayload
			minQuantity = 3000
			title = At least 3000 units of Research Payload
			hideChildren = true
		}
