CONTRACT_TYPE
{
    name = venusStationExtended1
    title = Venus Station: Extended Research I (Stage 2)
    group = CrewedVenusExp          
    agent = Exploration

    description = <b>Program: Crewed Venus Exploration <br>Type: <color=orange>Optional</color></b><br><br>Stage 2 of 3. Keep your Venus station in orbit for a second transfer window (584 more days) with at least 4 crew aboard throughout, and have the crew run at least 2 experiments: Surface Mapping and Volcanic Activity Survey. If the station leaves orbit or drops below 4 crew, the stay timer resets. Completing this unlocks Extended Research II.    
    synopsis = Keep the Venus station operating for a second transfer window
    completedMessage = Stage 2 complete! The Venus station has now operated for two transfer windows.

    sortKey = 2521

    cancellable = true
    declinable = true
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0

    targetBody = Venus

    // ************ REWARDS ************
    prestige = Significant
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 150
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedVenusExp
    }

    REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract
        contractType = venusStation
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = VenusStation2
        type = VesselParameterGroup
        title = Venus Station: Extended Research I (Stage 2)
        vessel = VenusStationVessel
        dissassociateVesselsOnContractCompletion = false

        PARAMETER
        {
            name = StillInVenusOrbit
            type = ReachState
            targetBody = Venus
            situation = ORBITING
            disableOnStateChange = true
            title = Keep the station in orbit around Venus
            hideChildren = true
        }

         PARAMETER
        {
            name = Crew
            type = HasCrew
            minCrew = 4
            title = Have at least 4 Crewmembers aboard
            hideChildren = true
        }
 
        PARAMETER
        {
            name = Window2
            type = Duration
            duration = 584d
            preWaitText = Transfer window 2: keep the station in Venus orbit with at least 4 crew aboard for 584 days
            waitingText = Station is in orbit with crew aboard, window 2 in progress...
            completionText = Transfer window 2 complete
            hideChildren = true

            PARAMETER
            {
                name = InOrbitW2
                type = ReachState
                targetBody = Venus
                situation = ORBITING
                disableOnStateChange = true
                title = In orbit around Venus
            }

            PARAMETER
            {
                name = CrewAboardW2
                type = HasCrew
                minCrew = 4
                title = At least 4 Crewmembers aboard
            }
        }

        PARAMETER
        {
            name = StationExperiment1
            type = CollectScience
            targetBody = Venus
            experiment = RP0VenusSurfaceMapping
            recoveryMethod = RecoverOrTransmit
            title = Run experiment 1: Surface Mapping
            hideChildren = true
        }
 
        PARAMETER
        {
            name = StationExperiment2
            type = CollectScience
            targetBody = Venus
            experiment = RP0VenusVolcanicSurvey
            recoveryMethod = RecoverOrTransmit
            title = Run experiment 2: Volcanic Activity Survey
            hideChildren = true
        }
    }
}