CONTRACT_TYPE
{
	name = Europa_ESR
	title = Europa Expedition Sample Return
	group = CrewedJupiterExp
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Jupiter Exploration<br>Type: <color=blue>Optional</color></b><br><br>Design and successfully launch an uncrewed probe that lands on Europa, gathers a surface sample and docks with the Jupiter Expedition Vessel. Analyze the sample in the vessel's laboratory and transmit the results home to Earth.&br;&br;This contract cannot be taken if you land crew on Europa.

	synopsis = Send an uncrewed craft to land on Europa and bring a surface sample back to the Jupiter Expedition Vessel for laboratory analysis.

	completedMessage = Congratulations! Our scientists can learn a lot more about the make-up of the Moon by studying the physical samples that you have returned.

	sortKey = 1905

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Europa

	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 2000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedJupiterExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = Europa_LandingCrewed
		invertRequirement = true
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = Europa_LandingCrewed
		invertRequirement = true
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = vesselGroupLaunch
		type = VesselParameterGroup
		title = Have the Jupiter Expedition Vessel in orbit of Jupiter
		notes = The vessel must include at least 1 Laboratory
		define = JupiterExpeditionMothership
		disableOnStateChange = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = HasScienceModule
			type = PartValidation
			partModule = Laboratory
			title = Carry a Science Lab Module
			minCount = 1
		}

		PARAMETER
		{
			name = JupiterOrbit
			title = Reach orbit of Jupiter with a maximum pe of 2,800,000 km and a maximum ap of 2,850,000 km
			type = Orbit
			maxPeA = 2800000000  // 1.5x Callisto Periapsis at 1,869,000 km
			maxApA = 2850000000  // 1.5x Callisto Apoapsis at 1,897,000 km
			targetBody = Jupiter
			disableOnStateChange = true
		}
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Europa Robotic Sample Return

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
			disableOnStateChange = true  // the probe becomes part of the crewed vessel once docked
		}
		PARAMETER
		{
			name = LandOnEuropa
			type = ReachState
			targetBody = Europa
			situation = LANDED
			disableOnStateChange = true
			title = Land on Europa
			hideChildren = true
		}
		PARAMETER
		{
			name = Docking
			type = Docking
			vessel = JupiterExpeditionMothership
			completeInSequence = true
			title = Dock with the Jupiter Expedition Vessel
		}
	}

	PARAMETER
	{
		name = surfaceSample
		type = CollectScience
		targetBody = Europa
		experiment = surfaceSample
		recoveryMethod = Transmit
		completeInSequence = true
		title = Analyze the Europa surface sample in the Laboratory and <b><color=white>transmit the results home</color></b>
		hideChildren = true
	}
}
