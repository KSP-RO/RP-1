CONTRACT_TYPE
{
	name = OES_Resupply
	title = Automated Station Resupply
	group = OperationalEarthStations
	agent = Stations

	description = <b>Program: Operational Earth Stations<br>Type: <color=green>Required</color></b><br><br>Demonstrate the capability of sending an <b>uncrewed</b> cargo vehicle to our station. It should carry at least a month of Research Payload or two months of Food for three crew. Once the crew has unloaded it, undock the empty vehicle and deorbit it so that it burns up in the atmosphere.<br><br><b>Number of Cargo Deliveries Completed: @/index / @/maxCompletions</b>

	synopsis = Dock an uncrewed cargo vehicle to the station, unload it and deorbit it

	completedMessage = The cargo vehicle has burned up on reentry, taking the station's rubbish with it.

	sortKey = 1611

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 2
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 500
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalEarthStations
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OES_CoreModule
	}

	// ************ TRACKING ************

	DATA
	{
		type = int
		index = $OES_Resupply_Count + 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression

		CONTRACT_COMPLETED_SUCCESS
		{
			OES_Resupply_Count = $OES_Resupply_Count + 1
			OES_Resupply_LastTime = UniversalTime() // needed for rep contract
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = CargoVehicle
		type = VesselParameterGroup
		title = Launch an uncrewed cargo vehicle and dock with the station
		define = OES_CargoVehicle
		disableOnStateChange = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new cargo vehicle
			hideChildren = true
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = HasCargo
			type = Any
			title = Carry at least 750 units of Research Payload or 1050 units of Food

			PARAMETER
			{
				name = HasResearchPayload
				type = HasResource
				resource = ResearchPayload
				minQuantity = 750
				title = At least 750 units of Research Payload
				hideChildren = true
			}
			PARAMETER
			{
				name = HasFood
				type = HasResource
				resource = Food
				minQuantity = 1050
				title = At least 1050 units of Food
				hideChildren = true
			}
		}
		PARAMETER
		{
			name = Docking
			type = Docking
			vessel = OperationalStation
			completeInSequence = true
			title = Dock with the station
		}
	}
	PARAMETER
	{
		name = Disposal
		type = VesselParameterGroup
		title = Unload the cargo vehicle, undock it and deorbit it
		vessel = OES_CargoVehicle
		completeInSequence = true
		disableOnStateChange = true

		PARAMETER
		{
			name = IsNotStation
			type = IsNotVessel
			vessel = OperationalStation
			title = Undock from the station
			hideChildren = true
		}
		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = Unloaded
			type = All
			title = Unload the cargo

			PARAMETER
			{
				name = NoResearchPayload
				type = HasResource
				resource = ResearchPayload
				minQuantity = 0
				maxQuantity = 1
				title = Have at most 1 unit of Research Payload on board
				hideChildren = true
			}
			PARAMETER
			{
				name = NoFood
				type = HasResource
				resource = Food
				minQuantity = 0
				maxQuantity = 1
				title = Have at most 1 unit of Food on board
				hideChildren = true
			}
		}
		PARAMETER
		{
			name = Deorbit
			type = ReachState
			targetBody = HomeWorld()
			maxAltitude = 120000
			title = Deorbit the cargo vehicle
			completeInSequence = true
			hideChildren = true
		}
	}
}
