CONTRACT_TYPE
{
	name = Iapetus_MajorSurfaceOperations
	title = Iapetus Major Surface Operations
	group = CrewedSaturnExp
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Saturn Exploration<br>Type: <color=blue>Optional</color></b><br><br>Land a crewed expeditionary vehicle at three of Iapetus' most remarkable landmarks: the colossal Turgis impact basin, the towering equatorial ridge that girdles the moon, and the Engelier basin on the bright trailing hemisphere. Remain on site for 24 hours at each and collect a surface sample. A fourth, more demanding landmark offers a bonus reward for a 48 hour stay: the dark-terrain Falsaron crater.

	synopsis = Land a crewed expeditionary rover or a hop-capable lander within 1 km of each of the 3 primary landmarks on Iapetus, remain on site for 24 hours and collect a surface sample at each. A fourth, harder bonus landmark (500 m tolerance, 48 hour stay) earns an additional reputation reward.

	completedMessage = Congratulations! The surface survey of Iapetus has given our scientists the first ground-level look at its two-toned terrain and its enormous equatorial ridge.

	sortKey = 25211

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Iapetus

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 2000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedSaturnExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedSaturnOrbit
	}

	// ************ WAYPOINTS ************
	// Coordinates are converted from the IAU gazetteer (planetographic, +West)
	// to KSP convention (+East, -180 to 180).

	BEHAVIOUR
	{
		name = LandmarkWaypoints
		type = WaypointGenerator
		targetBody = Iapetus

		WAYPOINT
		{
			name = Turgis Basin
			icon = marker
			latitude = 16.9
			longitude = -28.4
			altitude = 0
			parameter = Site1
		}

		WAYPOINT
		{
			name = Equatorial Ridge (Tortelosa Montes)
			icon = marker
			latitude = 0.0
			longitude = -90.0
			altitude = 0
			parameter = Site2
		}

		WAYPOINT
		{
			name = Engelier Basin
			icon = marker
			latitude = -40.5
			longitude = 95.3
			altitude = 0
			parameter = Site3
		}

		WAYPOINT
		{
			name = Falsaron Crater
			icon = marker
			latitude = 33.8
			longitude = -82.6
			altitude = 0
			parameter = Site4
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = SurfaceExpedition
		type = VesselParameterGroup
		title = Control a vessel with the required parameters
		notes = Use an expeditionary rover or a lander capable of hopping between sites. The same vessel must visit all three primary landmarks. The bonus landmark is optional.
		define = IapetusSurfaceExpeditionVessel
		disableOnStateChange = false

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 2
			crewOnly = true
			title = Have at least 2 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = Site1
			type = Sequence
			title = Landmark 1: Turgis Basin

			PARAMETER
			{
				name = LandedNear1
				type = VisitWaypoint
				index = 0
				horizontalDistance = 1000
				title = Land within 1 km of Turgis Basin
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed1
				type = ReachState
				targetBody = Iapetus
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay1
				type = Duration
				duration = 24h
				preWaitText = Remain at Turgis Basin for 24 hours
				waitingText = Surveying Turgis Basin
				completionText = Survey of Turgis Basin complete
			}
			PARAMETER
			{
				name = Sample1
				type = RP1HasExperiment
				experiment = surfaceSample
				title = Collect a surface sample at Turgis Basin
			}
		}

		PARAMETER
		{
			name = Site2
			type = Sequence
			title = Landmark 2: Equatorial Ridge (Tortelosa Montes)

			PARAMETER
			{
				name = LandedNear2
				type = VisitWaypoint
				index = 1
				horizontalDistance = 1000
				title = Be within 1 km of Equatorial Ridge (Tortelosa Montes)
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed2
				type = ReachState
				targetBody = Iapetus
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay2
				type = Duration
				duration = 24h
				preWaitText = Remain at Equatorial Ridge (Tortelosa Montes) for 24 hours
				waitingText = Surveying Equatorial Ridge (Tortelosa Montes)
				completionText = Survey of Equatorial Ridge (Tortelosa Montes) complete
			}
			PARAMETER
			{
				name = Sample2
				type = RP1HasExperiment
				experiment = surfaceSample
				title = Collect a surface sample at Equatorial Ridge (Tortelosa Montes)
			}
		}

		PARAMETER
		{
			name = Site3
			type = Sequence
			title = Landmark 3: Engelier Basin

			PARAMETER
			{
				name = LandedNear3
				type = VisitWaypoint
				index = 2
				horizontalDistance = 1000
				title = Be within 1 km of Engelier Basin
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed3
				type = ReachState
				targetBody = Iapetus
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay3
				type = Duration
				duration = 24h
				preWaitText = Remain at Engelier Basin for 24 hours
				waitingText = Surveying Engelier Basin
				completionText = Survey of Engelier Basin complete
			}
			PARAMETER
			{
				name = Sample3
				type = RP1HasExperiment
				experiment = surfaceSample
				title = Collect a surface sample at Engelier Basin
			}
		}

		PARAMETER
		{
			name = Site4
			type = Sequence
			optional = true
			rewardReputation = 1500
			title = Bonus Landmark 4: Falsaron Crater (optional)

			PARAMETER
			{
				name = LandedNear4
				type = VisitWaypoint
				index = 3
				horizontalDistance = 500
				title = Be within 500 m of Falsaron Crater
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed4
				type = ReachState
				targetBody = Iapetus
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay4
				type = Duration
				duration = 48h
				preWaitText = Remain at Falsaron Crater for 48 hours
				waitingText = Surveying Falsaron Crater
				completionText = Survey of Falsaron Crater complete
			}
			PARAMETER
			{
				name = Sample4
				type = RP1HasExperiment
				experiment = surfaceSample
				title = Collect a surface sample at Falsaron Crater
			}
		}
	}
}
