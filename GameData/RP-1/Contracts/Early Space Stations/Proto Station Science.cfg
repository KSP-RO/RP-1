CONTRACT_TYPE
{
	name = CollectProtoStationScience
	title = Collect Prototype Crewed Station Science
	group = EarlyEarthSpaceStation

	description = <b>Program: Early Earth Space Stations<br>Type: <color=green>Required</color></b><br><br>Humans staying in space for longer durations allows for different types of experiments from what we can do with unmanned probes. Utilize your stations to complete these experiments.  NOTE: You may have already collected some or all of this science. If you have, you won't need to collect it again.

	synopsis = Collect prototype station science

	completedMessage = This is loads of data! Scientists are extremely happy with the results of your efforts.

	sortKey = 603

	cancellable = false
	declinable = false
	autoAccept = true
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	DATA
	{
		type = int
		optionalRep = 100 // Reputation for additional science.
		index = $RepeatProtoSpaceStation_Count + 0
	}

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 500  // between 500 and 1200 depending on optionals.  Likely minimum of 800
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = EarlyEarthSpaceStation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = first_spaceStation
	}

	PARAMETER
	{
		name = OceanSurveillance
		type = RP1CollectScience
		optional = true
		rewardReputation = @/optionalRep
		targetBody = HomeWorld()
		situation = InSpaceLow
		experiment = RP0oceanSurveillance
		fractionComplete = 1
	}
