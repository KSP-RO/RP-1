// ============================================================================
// Martian Habitation
// ============================================================================
EXPERIMENT_DEFINITION
{
	id = RP0MarsHabit
	title = Martian Habitation
	baseValue = 1500
	scienceCap = 1500
	dataScale = 640
	requireAtmosphere = False
	situationMask = 1
	biomeMask = 0
	description = Extensive scientific monitoring equipment, as well as regular psychological interviews, will study the crew's physical and psychological health as they live on Mars, months from home and in a third of Earth's gravity. <b>NOTE: Requires 6 crew, with at least one Scientist. This experiment takes 3650 days and consumes 250L of Research Payload every 30 days.</b>
	mass = 0
	techRequired = modularSpaceStations
	cost = 0
	tags = modularSpaceStations
	minCrew = 6
	celestialBodies = Mars
	situations = LANDED
	RESULTS
	{
		default = Ten years of expeditions have shown what it takes to keep a crew of six healthy, productive and sane on another planet.
	}
	KERBALISM_EXPERIMENT
	{
		// sample mass in tons. if undefined or 0, the experiment produce a file
		SampleMass = 0
		BodyAllowed = Mars
		IncludeExperiment =
	}
}
@PART[*]:HAS[#getsMarsBaseExperiments[True]]:FOR[zzzKerbalism]
{
	MODULE
	{
		name = Experiment
		experiment_id = RP0MarsHabit
		ec_rate = 0.75
		data_rate = 640 // Same as dataScale
		@data_rate /= 315360000 //3650 Days
		requires = CrewMin:6
		resources = ResearchPayload@0.00009645 //Consumes 0.25T of payload every 30 days
		crew_operate = Scientist
		hide_when_unavailable = True
	}
}

