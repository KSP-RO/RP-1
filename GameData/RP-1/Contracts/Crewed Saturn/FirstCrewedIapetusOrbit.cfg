CONTRACT_TYPE
{
	name = FirstCrewedIapetusOrbit
	title = First Crewed Saturn Orbit
	group = CrewedSaturnExp
	agent = Flag Planting

	description = <b>Program: Crewed Saturn Exploration<br>Type: <color=green>Required</color></b><br><br>Iapetus is one of the most mysterious bodies in the outer Solar System, famous for its stark two-toned surface and towering equatorial ridge. Orbiting far beyond Saturn's main ring plane, reaching this distant moon requires precise deep-space navigation and extended orbital operations.<br><br>Design and launch a crewed vessel to carry at least four astronauts into orbit around Iapetus, establishing a stable orbital position to study its terrain from above.
    synopsis = Fly four crew members to achieve the first crewed orbit around Iapetus.
    completedMessage = Mission accomplished! Human beings have entered orbit around Iapetus. Surveying its dark and light hemispheres from close range marks a monumental milestone for our outer system exploration program.

	sortKey = 2526

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Iapetus

// ************ REWARDS ************
	prestige = Significant      
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 6000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedSaturnExp
	}


	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = First crewed orbit of @targetBody

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = SaturnOrbit
			title = Reach orbit of Iapetus with a maximum periapsis  of 400 km and a maximum apoapsis of 600 km and hold it for at least 20 days
			type = Orbit
			maxPeA = 400000 
			maxApA = 600000 
			targetBody = Saturn
			disableOnStateChange = true
			completeInSequence = true

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 20d
				preWaitText = Reach specified orbit
				waitingText = Orbiting...
				completionText = Orbits are complete 
			}
		}
	}

