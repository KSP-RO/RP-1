CONTRACT_TYPE
{
	name = Dione_ESR
	title = Dione Expedition Sample Return
	group = CrewedSaturnExp
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Saturn Exploration<br>Type: <color=blue>Optional</color></b><br><br>Design and successfully launch an uncrewed probe to land on Dione, gather surface samples from its ice-and-rock crust and process them in a laboratory before transmitting the data home to Earth.

	synopsis = Send an uncrewed craft to land on Dione and collect and transmit the surface samples to Earth. This can be performed as a standalone mission, or built into the crewed architecture, utilizing a sample recovery in orbit. 

	completedMessage = Congratulations! Our scientists can learn a lot more about the history of Dione by studying the physical samples that you have returned.

	sortKey = 2523

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Dione

	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 2500
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedSaturnExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedSaturnOrbit
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = vesselGroupLaunch
		type = VesselParameterGroup
		title = Control a Vessel with the required parameters
		notes = The station must include at least 1 Laboratory
		define = SaturnExpeditionMothership
		disableOnStateChange = true
		
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = HasScienceModule
			type = PartValidation
			partModule = Laboratory
			title = Carry a Science Lab Module
			minCount = 1
		}

		PARAMETER
		{
			name = SaturnOrbit
			title = Reach orbit of Saturn with a maximum pe of 565,000 km and a maximum ap of 567,500 km and hold it for at least 7 days
			type = Orbit
			maxPeA = 565000000  // 1.5x Dione Periapsis at 376,600 km 
			maxApA = 567500000  // 1.5x Dione Apoapsis at 378,250 km
			targetBody = Saturn
			disableOnStateChange = true
			completeInSequence = true
		}
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Dione Robotic Sample Return
	
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = LandOnDione
			type = ReachState
			targetBody = Dione
			situation = LANDED
			disableOnStateChange = true
			title = Land on Dione
			hideChildren = true
		}
		PARAMETER
		{
			name = HasSurfaceSample
			type = RP1HasExperiment
			experiment = surfaceSample
		}
		PARAMETER
		{
			name = Rendezvous
			type = Rendezvous
			vessel = SaturnExpeditionMothership
			distance = 100
			title = Rendezvous with the Saturn Expedition Vessel.
		}
		PARAMETER
		{
			name = Docking
			type = Docking
			vessel = SaturnExpeditionMothership
			completeInSequence = true
			title = Dock with the Saturn Expedition Vessel.
		}
        PARAMETER
        {
            name = surfaceSample
            type = CollectScience
            targetBody = Dione
            experiment = surfaceSample
            recoveryMethod = Transmit
            title = Transmit the surface sample data to Earth
            hideChildren = true
        }
	}
}