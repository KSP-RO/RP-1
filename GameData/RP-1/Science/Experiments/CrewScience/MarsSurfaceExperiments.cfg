// ============================================================================
// Deep Drilling for Life
// ============================================================================
EXPERIMENT_DEFINITION
{
	id = RP0marsDeepDrill
	title = Deep Drilling for Life
	baseValue = 150
	scienceCap = 150
	dataScale = 1
	requireAtmosphere = False
	situationMask = 1 // SrfLanded
	biomeMask = 1 // Biome specific
	description = The surface of Mars is sterilised by radiation and perchlorates, but tens of metres down, where liquid brines may once have flowed, organic molecules - or even life - could have survived. Our crew will drill down and bring up cores for analysis on Earth. <b>NOTE: Requires 2 crew. This experiment takes 14 days and produces samples that must be returned to Earth.</b>
	mass = 0.2
	techRequired = advancedSurfaceScience
	cost = 0
	minCrew = 2
	celestialBodies = Mars
	situations = SrfLanded
	RESULTS
	{
		default = The deep cores hold well-preserved organic molecules, shielded from the radiation at the surface. Whether anything made them is the question of the century.
	}
	KERBALISM_EXPERIMENT
	{
		SampleMass = 0.03
		BodyAllowed = Mars
	}
}
@PART[*]:HAS[#getsMarsBaseExperiments[True]]:FOR[zzzKerbalism]
