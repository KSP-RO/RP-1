// Radial decouplers can only toggle crossfeed after the tech is researched.
// Runs after RO, which adds ModuleToggleCrossfeed to all decouplers.
// Parts that crossfeed by default (e.g. stage-and-a-half boosters) are left alone.
// Hardpoints and pylons use ModuleDecouple and stay ungated so planes can use drop tanks.
@PART:HAS[@MODULE[ModuleAnchoredDecoupler],@MODULE[ModuleToggleCrossfeed]:HAS[~crossfeedStatus[?rue]]]:AFTER[zzzRealismOverhaul]
{
    @MODULE[ModuleToggleCrossfeed]
    {
        %techRequired = materialsScienceSpaceplanes
    }
}
