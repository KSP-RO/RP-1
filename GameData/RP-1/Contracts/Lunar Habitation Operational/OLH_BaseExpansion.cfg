CONTRACT_TYPE
{
	name = OLH_BaseExpansion
	title = Second Generation Lunar Base
	group = EarlyLunarHabitation

	description = <b>Program: Operational Lunar Habitation<br>Type: <color=green>Required</color></b><br><br> After the success of our Lunar Base program, it is time to launch a newer & better base. You can either dock this to the previous base or establish a new one. Whereas Early Lunar Habitation allowed you to complete it with multiple smaller bases, this one will need to be a single base.

	synopsis = Launch a new Lunar Base.

	completedMessage = Congratulations! You have established a new home away from home for our future Lunar expeditions!

	sortKey = 2000

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon

	// ************ REWARDS ************
	
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 1000
	rewardFunds =  0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalLunarHabitation
	}

	// ************ PARAMETERS ************
	
	PARAMETER
	{
		name = vesselGroupLaunch
		type = VesselParameterGroup
		title = Expand your Lunar Base or launch a new generation.
		notes = The station must include room for 1 month of research payload and room for at least 6 Crew.
		define = MoonBase
		disableOnStateChange = true
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a New Base Module
			hideChildren = true
		}
		PARAMETER
		{
			name = HasCapacity
			type = HasCrewCapacity
			minCapacity = 6
			title = Space for at least 6 crew
			hideChildren = true
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = researchPayloadCapacity //make sure you can hold 1 month of research payload
			type = HasResourceCapacity
			resource = ResearchPayload
			minQuantity = 750
		}
		PARAMETER
		{
			name = LandOnMoon
			type = ReachState
			title = Land on the Moon
			targetBody = Moon
			situation = LANDED
			disableOnStateChange = true
			hideChildren = true
		}
	}
	PARAMETER
	{
		name = stayOnStation
		type = VesselParameterGroup
		title = Keep at least 6 crew aboard the Base and conduct SUCCESSOR EXPERIMENT // TODO: Swap to LunarHabit3
		vessel = MoonBase
		notes = You can work on other contracts while your crew are working. You are safe to return to Mission Control
		completeInSequence = true
		disableOnStateChange = true
		
		PARAMETER
		{
			name = HasCrew
			type  = HasCrew
			minCrew = 6
			title = Has at least 6 crew members on the station.
			hideChildren = true
		}
		PARAMETER //TODO: Exchange below.
		{
			name = Long Duration Lunar Orbit Habitation
			type = RP1CollectScience
			title = Conduct Long Duration Lunar Orbit Habitation of your astronauts for 1 Month
			notes = This contract requires 750L units of Research Payload every 30 days //Placeholder value.
			targetBody = Moon
			situation = InSpaceLow
			experiment = RP0LunarOrbitHabit
			fractionComplete = 0.0416
		}
	}
}
