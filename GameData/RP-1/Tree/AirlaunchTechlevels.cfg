	cost = 0
	title = Airlaunch Carrier: B-29 Superfortress
	manufacturer = Generic
	description = Adds the B-29 as an airlaunch carrier. Payload up to 7.5 t and 12 x 6 x 13 m (width x height x length), released at up to 7500 m and 150 m/s. Choose the carrier when prepping a vessel for airlaunch. NOTE: This is not a part you can use, it just symbolizes the new capabilities you can unlock.
}

