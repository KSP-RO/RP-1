    deadline = 0

    targetBody = Venus

    // ************ REWARDS ************
    prestige = Exceptional
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 800
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedVenusExp
    }

    REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract
        contractType = firstVenusFlybyCrewed
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = VesselGroup
        type = VesselParameterGroup
        title = Orbit Venus
        define = CrewOrbitVenus
        
        PARAMETER
        {
            name = Crewmembers
            type = HasCrew
            minCrew = 3
            title = Have at least 3 Crewmembers
