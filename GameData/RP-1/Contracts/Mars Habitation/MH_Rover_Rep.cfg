CONTRACT_TYPE
{
	name = MH_Rover_Rep
	title = Extended Martian Rover Exploration
	group = MarsHabitation

	description = <b>Program: Operational Mars Habitation<br>Type: <color=blue>Optional</color></b><br><br>After the success of our initial rover expedition, we can now explore more of the Red Planet! Geologists back home and our new arologists are more than eager to get ou there!

	genericDescription = Explore more of Mars with a crewed rover.

	synopsis = Explore more of Mars with a crewed rover and return to the Martian Base.

	completedMessage = Mission Success! The rover crew explored another corner of Mars and returned to the Base safe and sound.

	sortKey = 2111

	cancellable = true
