CONTRACT_TYPE
{
	name = Reuse_Hop
	title = Initial Flight Envelope Reusable Rocket Hop
	group = ReuseDev
	agent = Federation Aeronautique Internationale

	description = <b>Program: Reusable Rocket Development<br>Type: <color=green>Required</color></b><br><br>Thanks to new technologies, it is now possible for us to reuse our rocket stages. These hops will continuously expand the flight envelope to make sure we get sufficient data to design reusable orbital launch vehicles.<br><br>This is a series of @maxCompletions contracts, of which @HopIndex have been completed. <br><br>Historical example: DC-X and SpaceX Grasshopper flight test program
	genericDescription = Perform a short hop.
	synopsis = Perform a short hop.

	completedMessage = Well Done! With each completed hop, we expand the flight envelope further.

	sortKey = 999

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 6
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 150
	failureReputation = 0


	// ************ DATA *************
	DATA
	{
		type = List<float>
		TargetAltitude = [50, 100, 500, 1000, 2500, 3000] // meters
	}
	DATA
	{
		type = List<Duration>
		TargetDuration = [30s, 30s, 60s, 80s, 80s, 80s] // seconds
	}

	DATA
	{
		type = int
		HopIndex = $HopIndex + 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression
		
		CONTRACT_COMPLETED_SUCCESS
		{
			HopIndex = $HopIndex + 1
		}
	}

	DATA
	{
		type = float
		AltTarget = @TargetAltitude.ElementAt(@HopIndex)
		title = Altitude
	}
	DATA
	{
		type = Duration
		DurTarget = @TargetDuration.ElementAt(@HopIndex)
		title = Duration
	}

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ReuseDev
	}
	
	PARAMETER
	{
		name = OrbitReturn
		type = VesselParameterGroup
		title = Suborbital return

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = BuiltAtVAB
			type = VesselBuiltAt
			builtAt = VAB
		}
		PARAMETER
		{
			name = HasNoCrew
			type = HasCrew
			maxCrew = 0
			minCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = ReachState
			type = ReachState
			situation = FLYING
			minRateOfClimb = 10
			title = Climb with at least 10 m/s
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = FlightDurationAtAlt
			type = Duration
			duration = @/DurTarget
			title = Hover at or above @/AltTarget m AGL for at least @/DurTarget
			completeInSequence = true

			PARAMETER
			{
				name = MaintainAlt
				type = ReachState
				minTerrainAltitude = @/AltTarget
				title = Maintain altitude >= @/AltTarget m AGL
				hideChildren = true
			}
		}
		PARAMETER
		{
			name = NoStaging
			type = NoStaging
			title = Do not Stage
			failContract = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return home safely
			hideChildren = true
			completeInSequence = true
		}
	}
}