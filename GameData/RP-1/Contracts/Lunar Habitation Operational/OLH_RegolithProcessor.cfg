CONTRACT_TYPE
{
	name = OLH_RegolithProcessor
	title = Lunar Oxygen Production
	group = OperationalLunarHabitation

	description = <b>Program: Operational Lunar Habitation<br>Type: <color=green>Required</color></b><br><br>There is a lot of oxygen in the Lunar regolith - and we can further reduce the Base's reliance on Earth by unlocking it! Add <b>Molten Regolith Pyrolysis</b> equipment to our Lunar Base, enough to supply the oxygen of three crew, and keep it fed with regolith from the Base's drill for 30 days.<br><br>A Chemical Plant configured for Molten Regolith Pyrolysis is enough. Larger ISRU units also count.

	synopsis = Produce oxygen from lunar regolith at the Lunar Base

	completedMessage = Our Lunar Base now breathes oxygen made from the Moon itself!

	sortKey = 2005

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon


	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 800
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalLunarHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OLH_RegolithMiner
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = LunarOxygen
		type = VesselParameterGroup
		title = Produce oxygen from regolith at the Lunar Base for 30 days
		vessel = MoonBase
		notes = You can work on other contracts while the Base is working. You are safe to return to Mission Control
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Moon
			situation = LANDED
