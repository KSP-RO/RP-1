CONTRACT_TYPE
{
	name = FirstCrewedOberonOrbit
	title = First Crewed Oberon Orbit
	group = CrewedUranusExp
	agent = Flag Planting

	description = <b>Program: Crewed Uranus Exploration<br>Type: <color=green>Required</color></b><br><br>Oberon is one of the most mysterious bodies in the outer Solar System, famous for its ancient, heavily cratered surface and the deep canyon of Mommur Chasma. Orbiting as the outermost of Uranus's major moons, reaching this distant world requires precise deep-space navigation and extended orbital operations.<br><br>Design and launch a crewed vessel to carry at least four astronauts into orbit around Oberon, establishing a stable orbital position to study its cratered terrain from above.
    synopsis = Fly atleast four crew members to achieve the first crewed orbit around Oberon.
    completedMessage = Mission accomplished! Human beings have entered orbit around Oberon. Surveying its ancient, crater-scarred surface from close range marks a monumental milestone for our outer system exploration program.

	sortKey = 2804

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Oberon

// ************ REWARDS ************
	prestige = Significant      
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 80000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedUranusExp
	}


	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = First crewed orbit of @targetBody

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = OberonOrbit
            type = ReachState
            targetBody = Oberon
            situation = ORBITING
			title = Reach orbit of Oberon and hold it for at least 5 days

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 5d
				preWaitText = Reach specified orbit
				waitingText = Orbiting...
				completionText = Orbits are complete 
			}
		}
	}
