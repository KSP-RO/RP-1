CONTRACT_TYPE
{
	name = COT_Resupply
	title = Additional Commercial Resupply Mission
	group = ComOrbTrans
	agent = Federation Aeronautique Internationale
	
	description = <b>Program: Commercial Orbital Transport<br>Type: <color=blue>Optional</color></b><br><br> Our demonstration was successful and we have been tasked with rendezvousing and docking.<br><br>This is a series of @maxCompletions contracts, of which @CRS_Rep_Count have been completed.<br><br>Once more than half of the expected days have elapsed, the reward of this contract will slowly increase over time, but will be reset to 0 after each completion.<br><b>Current reward is at @rewardFactorPercent % of its nominal value. Elapsed/Expected Days: @elapsedDays / 180</b>
	genericDescription = <b>Program: Commercial Orbital Transport<br>Type: <color=blue>Optional</color></b><br><br> Our demonstration was successful and we have been tasked with rendezvousing and docking.<br><br>This is a repeatable series of contracts. Once more than half of the expected days have elapsed, the reward of this contract will slowly increase over time, resetting to 0 after each completion.
	synopsis = Resupply a station in LEO

	completedMessage = Success! Our resupply mission achieved all objectives!

	sortKey = 2603

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 4
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = Round(80 * @rewardFactor, 1)
	failureReputation = 0

	DATA
	{
		type = int
		CRS_Rep_Count = $CRS_Rep_Count + 0
	}

	DATA
	{
		type = int
		antiGrindCompletion = $COT_Resupply_Completion == 0 ? (UniversalTime() - 180 * 86400) : $COT_Resupply_Completion
	}

	DATA
	{
		type = float
		elapsedDays = Round((UniversalTime() - @antiGrindCompletion) / 86400.0)
		rewardFactor = Log(Max(@elapsedDays / 180 * 3 - 0.05, 1), 2) / 1.5607
		rewardFactorPercent = Round(@rewardFactor * 100, 1)
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression

		CONTRACT_OFFERED
		{
			COT_Resupply_Completion = ($COT_Resupply_Completion + 0) == 0 ? (UniversalTime() - 180 * 86400) : ($COT_Resupply_Completion + 0)
		}
		CONTRACT_COMPLETED_SUCCESS
		{
			CRS_Rep_Count = $CRS_Rep_Count + 1
			COT_Resupply_Completion = UniversalTime()
		}
	}
	
	BEHAVIOUR
	{
		name = SpawnStation
		type = SpawnVessel

		VESSEL
		{
			name = ISS
			craftURL = RP-1/Craft Files/ISS.craft
			vesselType = Station
			owned = false

			ORBIT
			{
				SMA = 6778000
				ECC = 0.0005
				INC = 51.6
				LAN = Random(0, 360)
				LPE = 90
				MNA = 0
				EPH = 0
				REF = 1
			}
		}
	}

	// ************ REQUIREMENTS ************

	
	REQUIREMENT
	{
		name = Any
		type = Any

		REQUIREMENT
		{
			name = ProgramActive
			type = ProgramActive
			program = ComCrew
		}

		REQUIREMENT
		{
			name = ProgramActive
			type = ProgramActive
			program = ComOrbTrans
		}
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = COT_Resupply
		minCount = 2
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Commercial Resupply

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			PARAMETER
			{
				name = HasResearchPayload
				type = HasResource
				resource = ResearchPayload
				minQuantity = 4999.9
				title = Have a ResearchPayload of at least 5000 units on the craft
				hideChildren = true
			}
			PARAMETER
			{
				name = DockingPort
				type = PartValidation
				partModule = ModuleDockingNode
				minCount = 1
				title = Have at least 1 docking port
				hideChildren = true
			}
			PARAMETER
			{
				name = Rendezvous
				type = Rendezvous
				vessel = ISS
				distance = 100
				disableOnStateChange = true
				title = Rendezvous with the station.
			}
			PARAMETER
			{
				name = Docking
				type = Docking
				vessel = ISS
				disableOnStateChange = true
				title = Dock with the station.
			}
			PARAMETER
			{
				name = ReturnHome
				type = RP1ReturnHome
				title = Return home safely
				hideChildren = true
				completeInSequence = true
			}
		}
	}

	BEHAVIOUR
	{
		name = RemoveStation
		type = DestroyVessel
		onSuccess = true
		onFailed = true
		vessel = ISS
	}
}