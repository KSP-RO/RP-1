CONTRACT_TYPE
{
	name = RSD_OrbitalTug
	title = Reusable Orbital Tug
	group = ReusableSpacecraftDev
	agent = Exploration

	description = <b>Program: Reusable Spacecraft Development<br>Type: <color=green>Required</color></b><br><br>A stage that can fly back down after delivering its payload could serve as a reusable space tug, carrying satellites from low Earth orbit to geostationary altitude and returning for the next load. Prove it with an uncrewed vessel: raise its perigee above 30,000 km and bring it back to low Earth orbit, then fly the same tug out again, this time raising its perigee above 60,000 km, and back a second time. How you refuel it between the flights is up to you.
	genericDescription = Fly the same uncrewed tug from low Earth orbit to high Earth orbit and back twice, the second time to a perigee above 60,000 km.
	synopsis = Fly the same uncrewed tug from low Earth orbit to high Earth orbit and back twice, the second time to a perigee above 60,000 km.

	completedMessage = The tug is back from its second flight, ready for its next delivery. High orbits are now within cheap reach.

	sortKey = 2100

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 300
	failureReputation = 0

	// ************ REQUIREMENTS ************
	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ReusableSpacecraftDev
	}

	// ************ PARAMETERS ************
	PARAMETER
	{
		name = OrbitalTug
		type = VesselParameterGroup
		title = First high orbit round trip
		define = RSDTug
		disableOnStateChange = true

		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}

		PARAMETER
		{
			name = NoStaging
			type = NoStaging
			title = Do not stage
			failContract = false
		}

		PARAMETER
		{
			name = HighOrbit
			type = Orbit
			targetBody = HomeWorld()
			situation = ORBITING
			minPeA = 30000000
			disableOnStateChange = true
			title = Raise the perigee above 30,000 km
			hideChildren = true
		}

		PARAMETER
		{
			name = LowOrbitReturn
			type = Orbit
			targetBody = HomeWorld()
			situation = ORBITING
			maxApA = 2000000
			completeInSequence = true
			title = Return to low Earth orbit (apogee below 2,000 km)
			hideChildren = true
		}
	}

	PARAMETER
	{
		name = SecondFlight
		type = VesselParameterGroup
		title = Second high orbit round trip
		vessel = RSDTug
		completeInSequence = true

		PARAMETER
		{
			name = SecondUncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}

		PARAMETER
		{
			name = SecondOutbound
			type = All
			title = Raise the perigee above 60,000 km without staging
			disableOnStateChange = true

			PARAMETER
			{
				name = SecondNoStaging
				type = NoStaging
				title = Do not stage
				failContract = false
			}
			PARAMETER
			{
				name = SecondHighOrbit
				type = Orbit
				targetBody = HomeWorld()
				situation = ORBITING
				minPeA = 60000000
				title = Raise the perigee above 60,000 km
				hideChildren = true
			}
		}

		PARAMETER
		{
			name = SecondLowOrbitReturn
			type = Orbit
			targetBody = HomeWorld()
			situation = ORBITING
			maxApA = 2000000
			completeInSequence = true
			title = Return to low Earth orbit again (apogee below 2,000 km)
			hideChildren = true
		}
	}
}
