	description = <b>Program: Operational Lunar Habitation<br>Type: <color=red>CAPSTONE</color></b><br><br>We have successfully shown that our Lunar base can sustain crews for months at a time. Now we need to prove that the Base can be lived in permanently! Keep at least <b>six</b> crew aboard the Lunar Base for a full year without a break.

	synopsis = Keep at least six crew on the Lunar Base for a year without a break

	completedMessage = A full year without the lights going out! Our Lunar Base is now permanently crewed.

	sortKey = 2009

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon


	// ************ REWARDS ************
	prestige = Exceptional
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 2500
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalLunarHabitation
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OLH_Crew6_6Month
		minCount = 4
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = ContinuousOccupation
		type = VesselParameterGroup
		title = Keep at least 6 crew aboard the Lunar Base for 365 days without a break
		vessel = MoonBase
		notes = If the Base drops below six crew, the count starts over. You can work on other contracts while your crew are working. You are safe to return to Mission Control
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Moon
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = SixCrew
			type = HasCrew
			minCrew = 6
			crewOnly = true
			title = Have at least 6 crewmembers on board
			hideChildren = true
		}
		PARAMETER
		{
			name = Duration
			type = Duration
			duration = 365d
			preWaitText = Keep 6 crew aboard the landed Base
			waitingText = Crew living aboard the Base
			completionText = The Base has been crewed for a full year
		}
	}
	// Outside the group above: Duration would wait for this to complete before starting its year
	PARAMETER
	{
		name = OperationalLunarHabitation
		type = RP1CollectScience
		title = Complete at least 1115 out of 3650 days of Operational Lunar Habitation
