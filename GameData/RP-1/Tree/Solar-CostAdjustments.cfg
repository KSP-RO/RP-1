    {
        %costPerM2 = #$@ROSOLAR_CONFIG/ROS_TECH[TL1]/costPerM2$
        %costMultHinged = #$@ROSOLAR_CONFIG/ROS_TECH[TL1]/costMultHinged$
        %costMultFolded = #$@ROSOLAR_CONFIG/ROS_TECH[TL1]/costMultFolded$
        %costMultTrack = #$@ROSOLAR_CONFIG/ROS_TECH[TL1]/costMultTrack$
    }
    @SolarConfig:HAS[#level[2]]
    {
        %costPerM2 = #$@ROSOLAR_CONFIG/ROS_TECH[TL2]/costPerM2$
        %costMultHinged = #$@ROSOLAR_CONFIG/ROS_TECH[TL2]/costMultHinged$
        %costMultFolded = #$@ROSOLAR_CONFIG/ROS_TECH[TL2]/costMultFolded$
        %costMultTrack = #$@ROSOLAR_CONFIG/ROS_TECH[TL2]/costMultTrack$
    }
    @SolarConfig:HAS[#level[3]]
    {
        %costPerM2 = #$@ROSOLAR_CONFIG/ROS_TECH[TL3]/costPerM2$
        %costMultHinged = #$@ROSOLAR_CONFIG/ROS_TECH[TL3]/costMultHinged$
        %costMultFolded = #$@ROSOLAR_CONFIG/ROS_TECH[TL3]/costMultFolded$
        %costMultTrack = #$@ROSOLAR_CONFIG/ROS_TECH[TL3]/costMultTrack$
    }
    @SolarConfig:HAS[#level[4]]
    {
        %costPerM2 = #$@ROSOLAR_CONFIG/ROS_TECH[TL4]/costPerM2$
        %costMultHinged = #$@ROSOLAR_CONFIG/ROS_TECH[TL4]/costMultHinged$
        %costMultFolded = #$@ROSOLAR_CONFIG/ROS_TECH[TL4]/costMultFolded$
        %costMultTrack = #$@ROSOLAR_CONFIG/ROS_TECH[TL4]/costMultTrack$
    }
    @SolarConfig:HAS[#level[5]]
    {
        %costPerM2 = #$@ROSOLAR_CONFIG/ROS_TECH[TL5]/costPerM2$
        %costMultHinged = #$@ROSOLAR_CONFIG/ROS_TECH[TL5]/costMultHinged$
        %costMultFolded = #$@ROSOLAR_CONFIG/ROS_TECH[TL5]/costMultFolded$
        %costMultTrack = #$@ROSOLAR_CONFIG/ROS_TECH[TL5]/costMultTrack$
    }
    @SolarConfig:HAS[#level[6]]
    {
        %costPerM2 = #$@ROSOLAR_CONFIG/ROS_TECH[TL6]/costPerM2$
        %costMultHinged = #$@ROSOLAR_CONFIG/ROS_TECH[TL6]/costMultHinged$
        %costMultFolded = #$@ROSOLAR_CONFIG/ROS_TECH[TL6]/costMultFolded$
        %costMultTrack = #$@ROSOLAR_CONFIG/ROS_TECH[TL6]/costMultTrack$
    }
    @SolarConfig:HAS[#level[7]]
    {
        %costPerM2 = #$@ROSOLAR_CONFIG/ROS_TECH[TL7]/costPerM2$
        %costMultHinged = #$@ROSOLAR_CONFIG/ROS_TECH[TL7]/costMultHinged$
        %costMultFolded = #$@ROSOLAR_CONFIG/ROS_TECH[TL7]/costMultFolded$
        %costMultTrack = #$@ROSOLAR_CONFIG/ROS_TECH[TL7]/costMultTrack$
    }
    @SolarConfig:HAS[#level[8]]
    {
        %costPerM2 = #$@ROSOLAR_CONFIG/ROS_TECH[TL8]/costPerM2$
        %costMultHinged = #$@ROSOLAR_CONFIG/ROS_TECH[TL8]/costMultHinged$
        %costMultFolded = #$@ROSOLAR_CONFIG/ROS_TECH[TL8]/costMultFolded$
        %costMultTrack = #$@ROSOLAR_CONFIG/ROS_TECH[TL8]/costMultTrack$
    }
    @SolarConfig:HAS[#level[9]]
    {
        %costPerM2 = #$@ROSOLAR_CONFIG/ROS_TECH[TL9]/costPerM2$
        %costMultHinged = #$@ROSOLAR_CONFIG/ROS_TECH[TL9]/costMultHinged$
        %costMultFolded = #$@ROSOLAR_CONFIG/ROS_TECH[TL9]/costMultFolded$
        %costMultTrack = #$@ROSOLAR_CONFIG/ROS_TECH[TL9]/costMultTrack$
