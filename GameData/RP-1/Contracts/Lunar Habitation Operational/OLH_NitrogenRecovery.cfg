CONTRACT_TYPE
{
	name = OLH_NitrogenRecovery
	title = Closing the Nitrogen Loop
	group = OperationalLunarHabitation

	description = <b>Program: Operational Lunar Habitation<br>Type: <color=blue>Optional</color></b><br><br>Our greenhouses depend on <b>Ammonia</b> shipped from Earth. The crew's urine contains the same nitrogen the crops need. Add <b>Nitrogen Recovery</b> to a Greenhouse at our Lunar Base and grow crops on recovered nitrogen for 90 days.<br><br>The process only recovers some Nitrogen, so a smaller stream of Ammonia will still have to come from Earth. <b>Nitrogen Recovery</b> cannot be added in flight, so the Greenhouse must be configured with it before launch.

	synopsis = Recover nitrogen for the crops at the Lunar Base

	completedMessage = Our Lunar Base now recycles the crew's nitrogen into the crops that feed them.

	sortKey = 2008

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Moon


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 600
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalLunarHabitation
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OLH_Agriculture
	}

	// ************ PARAMETERS ************
	PARAMETER
	{
		name = NitrogenRecovery
		type = VesselParameterGroup
		title = Grow crops on recovered nitrogen at the Lunar Base for 90 days
		vessel = MoonBase
		notes = You can work on other contracts while the Base is working. You are safe to return to Mission Control
		disableOnStateChange = true

		PARAMETER
		{
			name = ReachState
			type = ReachState
			targetBody = Moon
			situation = LANDED
			hideChildren = true
		}
		PARAMETER
		{
			name = HasNitrogenRecovery
			type = HasResource
			resource = Resource("_NitrogenRecovery")
			minQuantity = 1.49
			title = Run Nitrogen Recovery (one Greenhouse)
			hideChildren = true
		}
		PARAMETER
		{
			name = HasHydroponics
			type = HasResource
			resource = Resource("_Hydroponics")
			minQuantity = 0.99
			title = Run Hydroponics (one Greenhouse)
			hideChildren = true
		}
		PARAMETER
		{
			name = HasAmmonia
			type = HasResource
			resource = Ammonia
			minQuantity = 0.01
			title = Keep the crops supplied with Ammonia
			hideChildren = true
		}
		PARAMETER
		{
			name = Duration
			type = Duration
			duration = 90d
			preWaitText = Start up nitrogen recovery
			waitingText = Recovering nitrogen for the crops
			completionText = 90 days of nitrogen recovery completed
		}
	}
}
