CONTRACT_TYPE
{
	name = AXP_Supercruise
	group = AdvXPlanes
	title = Uncrewed Long Duration Supersonic Flight

	description = <b>Program: Advanced X-Plane Research<br>Type: <color=green>Required</color></b><br><br>Design, build, and fly an uncrewed supersonic jet-powered craft carrying a sounding payload, sustaining supersonic flight for an hour or more, then return home safely.
	
	synopsis = Travel 1hr or more with an uncrewed supersonic jet-powered craft carrying @/missionPayload.Print() units of Sounding Payload.
	
	completedMessage = Congratulations on a successful flight!
	
	sortKey = 4501

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0
	
	targetBody = HomeWorld()
	
	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 75
	failureReputation = 0 // was @rewardReputation

	// ************ REQUIREMENTS ************t

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = AdvXPlanes
	}
	
	DATA
	{
		title = Payload
		type = int
		missionPayload = 50
	}


	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Maintain between @HoldSituation/minSpeed m/s and @HoldSituation/maxSpeed m/s in level flight with an uncrewed jet aircraft.
		define = supersonicCraft
		dissassociateVesselsOnContractCompletion = true
		resetChildrenWhenVesselDestroyed = true
		
		PARAMETER
		{
			name = BuiltAtSPH
			type = VesselBuiltAt
			builtAt = SPH
		}

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}

		PARAMETER
		{
			name = NoRocket
			type = PartValidation
			title = Vessel is a jet (no rocket engines allowed)
			hideChildren = true
			NONE
			{
				partModule = ModuleEnginesRF
				partModule = ModuleEnginesAJEPropeller
			}
		}
		
		PARAMETER
		{
			name = HasSoundingPayload
			type = HasResource
			resource = SoundingPayload
			minQuantity = @/missionPayload - 0.1
			title = Have a SoundingPayload of at least @/missionPayload.Print() units on the craft
			hideChildren = true
		}
		
		PARAMETER
		{
			name = HoldSituation
			type = ReachState
			minSpeed = 650 // ~M2.0
			maxSpeed = 815 // ~M2.5
			minRateOfClimb = -50 // set a looser set of parameters, that way time warp can be used at higher settings and the length of the flight won't become monotonous.
			maxRateOfClimb = 50 // see above :)
			situation = FLYING
			
			title = Hold between @minSpeed m/s to @maxSpeed m/s in level flight.
			
			disableOnStateChange = true
			
		}

		PARAMETER
		{
			name = SustainedCruise
			type = SustainedCruise
			requiredRange = 2340000 // duration * lower speed band; range = speed * fuel / burnRate
			minSpeed = 650
			maxSpeed = 815
			minVerticalSpeed = -50
			maxVerticalSpeed = 50
			disableOnStateChange = false // toggle state so the Duration sibling resets when cruise breaks
		}

		PARAMETER
		{
			name = Hold
			type = Duration
			duration = 5m
			preWaitText = Reach cruise conditions
			waitingText = Maintaining cruise
			completionText = Sustained cruise achieved
		}
	}
}