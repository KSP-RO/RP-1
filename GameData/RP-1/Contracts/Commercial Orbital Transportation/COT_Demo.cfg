CONTRACT_TYPE
{
	name = COT_Demo
	title = Commercial Transport Demonstration
	group = ComOrbTrans
	agent = Federation Aeronautique Internationale
	
	description = <b>Program: Commercial Orbital Transport<br>Type: <color=green>Required</color></b><br><br> It is time to demonstrate our new system, capable of placing at least 5 tons into LEO and returning with at least 1 ton. For this first demonstration, we can rendezvous with any object in orbit.

	synopsis = Demonstrate a capability of returning payloads from LEO without exceeding 4g of acceleration.

	completedMessage = Success! The fragile test payload survived!

	sortKey = 2600

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 150
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ComOrbTrans
	}


	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Commercial Transport Demonstration

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 0.001
				title = Craft must have Electric Charge after one day
				hideChildren = true
			}
			PARAMETER
			{
				name = HasResearchPayload
				type = HasResource
				resource = ResearchPayload
				minQuantity = 4999.9
				title = Have a ResearchPayload of at least 5000 units on the craft
				hideChildren = true
			}
			PARAMETER
			{
				name = Orbit
				type = Orbit
				maxEccentricity = 0.04
				minPeA = 300000
				disableOnStateChange = true
				title = Reach the correct orbit within the parameters.
			}
			PARAMETER
			{
				name = DockingPort
				type = PartValidation
				partModule = ModuleDockingNode
				minCount = 1
				title = Have at least 1 docking port
				hideChildren = true
			}
			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 1d
				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
			PARAMETER
			{
				name = ReturnHome
				type = RP1ReturnHome
				title = Return home safely
				hideChildren = true
			}
			PARAMETER
			{
				name = HasResearchPayload
				type = HasResource
				resource = ResearchPayload
				minQuantity = 999.9
				title = Return with a ResearchPayload of at least 1000 units on the craft
				hideChildren = true
				completeInSequence = true // I hope this works? Should ensure the player returns with at least this much
			}
		}
