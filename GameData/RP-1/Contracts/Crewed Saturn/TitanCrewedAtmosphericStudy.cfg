    completedMessage = Incredible achievement! Our crew successfully plunged into the hazy skies of Titan, gathered priceless atmospheric data!!
    
    sortKey = 2534

    cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Titan
// ************ REWARDS ************
    prestige = Trivial       
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 8000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

    // ************ REQUIREMENTS ************
   REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedSaturnExp
	}
    REQUIREMENT
    {
        name = CompleteIapetusLanding
        type = CompleteContract
        contract = FirstCrewedTitanLanding 
    }

    // ************ PARAMETERS ************

    PARAMETER
    {
        name = TitanAtmosphereGroup
