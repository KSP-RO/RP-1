CONTRACT_TYPE
{
	name = OES_AgricultureModule
	title = Station Module: Agriculture
	group = OperationalEarthStations
	agent = Stations

	description = <b>Program: Operational Earth Stations<br>Type: <color=blue>Optional</color></b><br><br>If we want to send humans to the outer planets or spend extende durations anywhere other than Earth, it will be of interest to be able to grow at least some of their own food. Launch a module with a <b>Greenhouse</b>, dock it to the station, and grow crops aboard for 90 days.<br><br>This contract is based on the Svet greenhouse, in which cosmonauts grew wheat and other crops aboard Mir.

	synopsis = Dock a greenhouse module to the station and grow crops for 90 days

	completedMessage = Congratulations! Our crews have harvested the first crops grown aboard the station!

	sortKey = 1605

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************

	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 500
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalEarthStations
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OES_CoreModule
	}
	REQUIREMENT
	{
		name = HydroponicsResearched
		type = TechResearched
		tech = longTermLifeSupport
		title = Must have researched Long-Term Life Support and ISRU
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = vesselGroupModule
		type = VesselParameterGroup
		title = Launch a greenhouse module and dock it to the station
		notes = The module must include at least 1 hydroponic greenhouse and 1 docking port
		disableOnStateChange = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new module
			hideChildren = true
		}
		PARAMETER
		{
			name = HasHydroponics
			type = HasResource
			resource = Resource("_Hydroponics") // Doesn't like a leading _
			minQuantity = 0.99
			title = Have at least 1 running hydroponic greenhouse
			hideChildren = true
		}
		PARAMETER
		{
			name = DockingPort
			type = PartValidation
			partModule = ModuleDockingNode
			minCount = 1
			title = Have at least 1 docking port
			hideChildren = true
		}
		PARAMETER
		{
			name = Docking
			type = Docking
			vessel = OperationalStation
			completeInSequence = true
			title = Dock with the station
		}
	}
	PARAMETER
	{
		name = StationAgriculture
		type = VesselParameterGroup
		title = Grow crops aboard the station for 90 days
		vessel = OperationalStation
		notes = You can work on other contracts while the crops are growing. You are safe to return to Mission Control
		completeInSequence = true
		disableOnStateChange = true

		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 300000
			maxApA = 500000
			targetBody = HomeWorld()
			title = Remain in a stable orbit
			hideChildren = true
		}
		PARAMETER
		{
			name = HasHydroponics
			type = HasResource
			resource = Resource("_Hydroponics") // Doesn't like a leading _
			minQuantity = 0.99
			title = Keep at least 1 hydroponic greenhouse running
			hideChildren = true
		}
		PARAMETER
		{
			name = HasAmmonia
			type = HasResource
			resource = Ammonia
			minQuantity = 0.01
			title = Keep the crops supplied with Ammonia
			hideChildren = true
		}
		PARAMETER
		{
			name = Duration
			type = Duration
			duration = 90d
			preWaitText = Plant the first crops
			waitingText = Growing crops
			completionText = 90 days of orbital agriculture completed
		}
	}
}
