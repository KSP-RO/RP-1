// Advanced propulsion fuels (Fusion, Antimatter and Fission tank types, Far Future Technologies engines).
// 1965$ thousands per unit. Other years converted with the US CPI-U annual average
// (1964 31.0, 1965 31.5, 1972 41.8, 1998 163.0, 2006 201.6, 2008 215.3, 2020 258.8).
@RESOURCE_DEFINITION[LqdDeuterium]:FOR[RP-0]
{
  // AEC heavy water price $28/lb through the 1960s:
  // https://www.iaea.org/sites/default/files/publications/magazines/bulletin/bull0-0/00005882021.pdf
  // 1 L of liquid D2 (162.4 g) needs 807.4 g = 1.780 lb of D2O -> $49.84
  @unitCost = 0.04984
}
@RESOURCE_DEFINITION[Deuterium]:FOR[RP-0]
{
  @unitCost = 0.00005515 // gas at STP (0.1797 g/L), same basis as LqdDeuterium: 0.8935 g of D2O per L
}
@RESOURCE_DEFINITION[LqdHe3]:FOR[RP-0]
{
  // $40-85 per L of gas (STP) over 2003-2009, GAO-11-472: https://www.gao.gov/assets/gao-11-472.pdf
  // $62.5/L 2006$ -> $9.77/L 1965$; 1 L of liquid (59 g) is 438.3 L of gas (0.1346 g/L) -> $4,281
  @unitCost = 4.281
}
@RESOURCE_DEFINITION[He3]:FOR[RP-0]
{
  @unitCost = 0.009766 // gas at STP, same basis as LqdHe3: $9.77/L 1965$
}
@RESOURCE_DEFINITION[LqdTritium]:FOR[RP-0]
{
  // ~$30,000/g (2020$), "U.S. Tritium Production for the Nuclear Weapons Stockpile":
  // https://lynceans.org/wp-content/uploads/2020/05/US-tritium-production-for-the-nuclear-weapons-stockpile-%E2%80%93-not-like-the-old-days.pdf
  // -> $3,652/g 1965$ x 320 g/L (CRP density)
  @unitCost = 1168.5
}
@RESOURCE_DEFINITION[FusionPellets]:FOR[RP-0]
{
  // Fuel content: 0.195 L LqdDeuterium + 0.805 L LqdHe3 per L (40/60 D:He-3 by mass).
  // Target fabrication not included (~$0.16-0.17 per target at IFE production scale, Goodin, General Atomics:
  // https://aries.pppl.gov/LIB/MEETINGS/0302-GA-IFE/presentations/goodin%20long%20version.pdf)
  @unitCost = 3.456
}
@RESOURCE_DEFINITION[Antimatter]:FOR[RP-0]
{
  // 1 unit = 1 mg. Dedicated antiproton factory estimate ~$10M/mg (Forward; RAND 1998), today's collider
  // production ~$1e12/mg. NASA MSFC, "Antimatter Propulsion" (LaPointe):
  // https://ntrs.nasa.gov/api/citations/20200001904/downloads/20200001904.pdf
  // $10M/mg 1998$ -> $1.93M 1965$
  @unitCost = 1932.5
}
@RESOURCE_DEFINITION[FissionParticles]:FOR[RP-0]
{
  // Americium-241 ~$1500/g (2008$): https://en.wikipedia.org/wiki/Americium
  // -> $219.5/g 1965$ x 1440 g/L
  @unitCost = 316
}
@RESOURCE_DEFINITION[FissionPellets]:FOR[RP-0]
{
  // Curium-244 projected at $1000/g (ORNL catalogue, Feb 1962 prices), BNWL-25 (March 1965):
  // https://www.osti.gov/servlets/purl/4618921
  // 2 kg pulse unit with 42.8 g of curium at 1.0 kg/L -> 21.4 g/L
  @unitCost = 21.4
}
@RESOURCE_DEFINITION[NuclearSaltWater]:FOR[RP-0]
{
  // AEC base price for plutonium with 6-12% Pu-240, $43/g (~1972), Minerals Yearbook:
  // https://search.library.wisc.edu/digital/AMNS3JOQHHHFEG9C/text/AKE3SCNXHWDIS685
  // -> $32.4/g 1965$; ~2% fissiles at 1.05 kg/L -> 21 g/L
  @unitCost = 0.6805
}
@RESOURCE_DEFINITION[FissionPulses]:FOR[RP-0]
{
  // Orion pulse unit (79 kg): 1964 estimate of $40,000 or less each in mass production:
  // https://en.wikipedia.org/wiki/Project_Orion_(nuclear_propulsion)
  @unitCost = 40.6
}
@RESOURCE_DEFINITION[Lithium]:FOR[RP-0]
{
  // Lithium metal $9-11/lb throughout 1964 and 1967, Bureau of Mines Minerals Yearbook:
  // https://search.library.wisc.edu/digital/AIRU5C6ME66MHM8X/text/AXOFOYELBJLCTM8X
  // https://search.library.wisc.edu/digital/AGFCCUKXF4SS2G8F/text/AWITSY6HJ26NXF8P
  // $10/lb = $22.05/kg x 0.534 kg/L
  @unitCost = 0.01177
}
