CONTRACT_TYPE
{
	name = RSD_OrbitalTug
	title = Reusable Orbital Tug
	group = ReusableSpacecraftDev
	agent = Exploration

	description = <b>Program: Reusable Spacecraft Development<br>Type: <color=green>Required</color></b><br><br>A stage that can fly back down after delivering its payload could serve as a reusable space tug, carrying satellites from low Earth orbit to geostationary altitude and returning for the next load. Prove it with an uncrewed vessel: raise its perigee above 30,000 km, then bring it back to low Earth orbit.<br><br>The tug must do all its own flying: once parked in low Earth orbit it may carry no decouplers, so no stage can be dropped along the way.<br><br>Historical example: NASA Space Tug and nuclear orbit transfer vehicle studies (early 1970s).
	genericDescription = Fly an uncrewed tug to high Earth orbit and back to low Earth orbit.
	synopsis = Fly an uncrewed tug to high Earth orbit and back to low Earth orbit.

	completedMessage = The tug is back in low Earth orbit, ready for its next delivery. High orbits are now within cheap reach.

	sortKey = 2100

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 300
	failureReputation = 0

	// ************ REQUIREMENTS ************
	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ReusableSpacecraftDev
	}

	// ************ PARAMETERS ************
	PARAMETER
	{
		name = OrbitalTug
		type = VesselParameterGroup
		title = Reusable orbital tug

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}

		PARAMETER
		{
			name = Uncrewed
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}

		PARAMETER
		{
			name = Departure
			type = All
			title = Park in low Earth orbit as a single stage (NOTE: Decouplers and Radial Decouplers are not allowed)
			disableOnStateChange = true

			PARAMETER
			{
				name = ParkingOrbit
				type = Orbit
				targetBody = HomeWorld()
				situation = ORBITING
				maxApA = 2000000
				title = Low Earth orbit (apogee below 2,000 km)
				hideChildren = true
			}

			PARAMETER
			{
				name = NoSeparators
				type = PartValidation
				title = No decouplers remaining on the vessel
				hideChildren = true
				NONE
				{
					partModule = ModuleDecouple
				}
				NONE
				{
					partModule = ModuleAnchoredDecoupler
				}
			}
		}

		PARAMETER
		{
			name = HighOrbit
			type = Orbit
			targetBody = HomeWorld()
			situation = ORBITING
			minPeA = 30000000
			disableOnStateChange = true
			completeInSequence = true
			title = Raise the perigee above 30,000 km
			hideChildren = true
		}

		PARAMETER
		{
			name = LowOrbitReturn
			type = Orbit
			targetBody = HomeWorld()
			situation = ORBITING
			maxApA = 2000000
			completeInSequence = true
			title = Return to low Earth orbit (apogee below 2,000 km)
			hideChildren = true
		}
	}
}
