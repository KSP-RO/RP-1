CONTRACT_TYPE
{
	name = FirstCrewedBeltOrbit
	title = First Crewed Asteroid Belt Orbit
	group = CrewedAsteroid
	agent = Flag Planting

	description = <b>Program: Crewed Asteroid Exploration<br>Type: <color=green>Required</color></b><br><br>The large dwarf planets in the Asteroid belt, Ceres and Vesta, are of immense interest to us if we want to venture farther out into the Solar System. Ceres is rich in ice, whereas Vesta would be very useful for in-space manufacturing. Before we can dream of such lofty goals, though, we must first visit them and explore them in detail! <br><br>Design and successfully launch a craft that can carry at least four crew into orbit around either Ceres or Vesta and return them safely to Earth. 

	synopsis = Fly the first crewed mission to orbit Ceres or Vesta

	completedMessage = Congratulations on safely returning the first humans to visit the asteroid belt!

	sortKey = 1999

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 1000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedAsteroid
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = First crewed orbit of Ceres or Vesta

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 4
			crewOnly = true
			title = Have at least 4 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = BeltOrbit
			type = All
			title = Orbit Ceres or Vesta and hold the orbit for at least 7 days
			disableOnStateChange = true
			completeInSequence = true

			PARAMETER
			{
				name = AnyBody
				type = Any
				title = Reach orbit of Ceres or Vesta

				PARAMETER
				{
					name = CeresOrbit
					type = Orbit
					situation = ORBITING
					targetBody = Ceres
					maxPeA = 500000
					title = Orbit Ceres with a maximum periapsis of 500 km
				}
				PARAMETER
				{
					name = VestaOrbit
					type = Orbit
					situation = ORBITING
					targetBody = Vesta
					maxPeA = 300000
					title = Orbit Vesta with a maximum periapsis of 300 km
				}
			}
			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 7d
				preWaitText = Reach specified orbit
				waitingText = Orbiting...
				completionText = Orbits are complete, you may return to Earth when ready
			}
		}
		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return Home Safely
			hideChildren = true
			completeInSequence = true
		}
	}
}
