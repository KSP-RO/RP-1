CONTRACT_TYPE
{
	name = Oberon_MajorSurfaceOperations
	title = Oberon Major Surface Operations
	group = CrewedUranusExp
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Uranus Exploration<br>Type: <color=blue>Optional</color></b><br><br>Land a crewed expeditionary vehicle at two major landmarks on Oberon: Hamlet crater, whose floor is covered in the moon's mysterious dark material, and Mommur Chasma, its great canyon. Run a different field science instrument at each site and remain at the last one for 24 hours.

	synopsis = Land a crewed expeditionary rover or a hop-capable lander within 1 km of each of the 2 landmarks on Oberon, run a different field science instrument at each and remain at the last one for 24 hours.

	completedMessage = Congratulations! The surface survey of Oberon has given our scientists the first ground-level look at its dark crater floors and its ancient canyon.

	sortKey = 2817

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Oberon

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 3000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedUranusExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedOberonLanding
	}

	// ************ WAYPOINTS ************
	// Coordinates are converted from the IAU gazetteer (planetocentric, +East, 0 to 360)
	// to KSP convention (+East, -180 to 180).

	BEHAVIOUR
	{
		name = LandmarkWaypoints
		type = WaypointGenerator
		targetBody = Oberon

		WAYPOINT
		{
			name = Hamlet Crater
			icon = marker
			latitude = -46.1
			longitude = 44.4
			altitude = 0
			parameter = Site1
		}

		WAYPOINT
		{
			name = Mommur Chasma
			icon = marker
			latitude = -16.3
			longitude = -36.5
			altitude = 0
			parameter = Site2
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = SurfaceExpedition
		type = VesselParameterGroup
		title = Control a vessel with the required parameters
		notes = Use an expeditionary rover or a lander capable of hopping between sites. The same vessel must visit both landmarks.
		define = OberonSurfaceExpeditionVessel
		disableOnStateChange = false

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 2
			crewOnly = true
			title = Have at least 2 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = Site1
			type = Sequence
			title = Landmark 1: Hamlet Crater

			PARAMETER
			{
				name = LandedNear1
				type = VisitWaypoint
				index = 0
				horizontalDistance = 1000
				title = Be within 1 km of Hamlet Crater
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed1
				type = ReachState
				targetBody = Oberon
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Sample1
				type = RP1CollectScience
				targetBody = Oberon
				experiment = RP0RamanScan
				situation = SrfLanded
				recoveryMethod = RecoverOrTransmit
				title = Run the Raman Spectrometer on the dark floor of Hamlet Crater
			}
		}

		PARAMETER
		{
			name = Site2
			type = Sequence
			title = Landmark 2: Mommur Chasma

			PARAMETER
			{
				name = LandedNear2
				type = VisitWaypoint
				index = 1
				horizontalDistance = 1000
				title = Be within 1 km of Mommur Chasma
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed2
				type = ReachState
				targetBody = Oberon
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay2
				type = Duration
				duration = 24h
				preWaitText = Remain at Mommur Chasma for 24 hours
				waitingText = Surveying Mommur Chasma
				completionText = Survey of Mommur Chasma complete
			}
			PARAMETER
			{
				name = Sample2
				type = RP1CollectScience
				targetBody = Oberon
				experiment = RP0AdvancedFieldGeology
				situation = SrfLanded
				recoveryMethod = RecoverOrTransmit
				title = Run the Advanced Field Geology Suite in Mommur Chasma
			}
		}
	}
}
