CONTRACT_TYPE
{
	name = OES_ContinuousOccupation
	title = Permanently Crewed Space Station
	group = OperationalEarthStations
	agent = Stations

	description = <b>Program: Operational Earth Stations<br>Type: <color=red>CAPSTONE</color></b><br><br>The past two expeditions to our space station have proven that it is more than capable of being a home away from home for our astronauts.Now we need to prove that it can be lived in permanently! Keep at least <b>three</b> crew aboard the fully assembled station for a full year without a break. Crews can be rotated during the year, but only if the next crew arrives before the previous one leaves.<br><br>This contract is based on Mir, which was continuously crewed for almost ten years, from 1989 to 1999.

	synopsis = Keep at least three crew on the assembled station for a year without a break

	completedMessage = A full year without the lights going out! Our station is now permanently crewed.

	sortKey = 1619

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************

	prestige = Exceptional
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 2500
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalEarthStations
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OES_Expedition
		minCount = 2
	}

	REQUIREMENT
	{
		name = CompleteAttitude
		type = CompleteContract
		contractType = OES_AttitudeModule
	}
	REQUIREMENT
	{
		name = CompleteExpansion
		type = CompleteContract
		contractType = OES_ExpansionModule
	}
	REQUIREMENT
	{
		name = CompleteLaboratory
		type = CompleteContract
		contractType = OES_LaboratoryModule
	}
	REQUIREMENT
	{
		name = CompletePower
		type = CompleteContract
		contractType = OES_PowerModule
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = ContinuousOccupation
		type = VesselParameterGroup
		title = Keep at least 3 crew aboard the station for 365 days without a break
		vessel = OperationalStation
		disableOnStateChange = true

		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 300000
			maxApA = 500000
			targetBody = HomeWorld()
			title = Remain in a stable orbit with a perigee greater than 300 km and an apogee less than 500 km
			hideChildren = true
		}
		PARAMETER
		{
			name = ThreeCrew
			type = HasCrew
			minCrew = 3
			crewOnly = true
			title = Have at least 3 crewmembers on board
			hideChildren = true
		}
		PARAMETER
		{
			name = Duration
			type = Duration
			duration = 365d
			preWaitText = Keep 3 crew aboard the station
			waitingText = Crew living aboard the station
			completionText = The station has been crewed for a full year
		}
	}
	// Outside the group above: Duration would wait for this to complete before starting its year
	PARAMETER
	{
		name = PermanentSpaceHabitation
		type = RP1CollectScience
		title = Complete at least 755 out of 3650 days of Permanent Space Habitation
		notes = This experiment requires 3 crew and consumes 750 units of Research Payload every 30 days
		targetBody = HomeWorld()
		situation = InSpaceLow
		experiment = RP0longDurationHabit3
		fractionComplete = 0.20685 //755d of 3650d: core shakedown, two expeditions and this year
	}
}
