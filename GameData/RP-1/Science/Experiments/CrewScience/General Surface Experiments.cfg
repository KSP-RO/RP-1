// CATEGORY: GENERAL SURVEY
EXPERIMENT_DEFINITION
{
	id = evaPhotoSurveyScan
	title = General Photographic Survey
	description = A systematic photographic documentation pass of the landing site - terrain, geology, and equipment status - more thorough than a standard crew report but simple enough for any crew member to carry out.
	baseValue = 20
	scienceCap = 20
	dataScale = 1
	requireAtmosphere = False
	situationMask = 1
	biomeMask = 0

	RESULTS
	{
		default = The photo survey gives us a systematic visual record of the site - terrain features, equipment condition, and points of interest worth a closer look later.
	}

	KERBALISM_EXPERIMENT
	{
		Situation = Surface
		BodyNotAllowed = Earth
	}
}

