CONTRACT_TYPE
{
    name = venusStation
    title = Venus Orbital Research Station (Stage 1)
    group = CrewedVenusExp
    agent = Exploration

    description = <b>Program: Crewed Venus Exploration  <br>Type: <color=orange>Optional</color></b><br><br>Build a crewed station in orbit around Venus and keep it operating there for one Earth-Venus transfer window (about 584 days). The station must carry:<br>- Crew capacity for at least 4<br>- At least 2 docking ports<br>- A science lab<br>- A communications antenna<br>- Solar power generation<br><br>The crew must run at least 2 experiments, Atmospheric Spectroscopy and Solar Occultation, during the stay, with at least 4 crew aboard throughout. Each window is split into four 146 day checkpoints, so if the station leaves orbit only the checkpoint in progress is lost.<br><br>This is Stage 1 of 3. Completing it unlocks Extended Research I, then II, which keep the same station in orbit for further windows.
    synopsis = Build a station at Venus and keep it in orbit for one transfer window
    completedMessage = Stage 1 complete! The Venus station is operating.

    sortKey = 2520

    cancellable = true
    declinable = true
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0

    targetBody = Venus

    // ************ REWARDS ************
    prestige = Significant
    advanceFunds = 0
    rewardScience = 0
    rewardReputation = 100
    rewardFunds = 0
    failureReputation = 0
    failureFunds = 0

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = CrewedVenusExp    
    }
    	REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract
        contractType = FirstCrewedVenusOrbit
    }

    // ************ PARAMETERS ************
    PARAMETER
    {
        name = VenusStation1
        type = VesselParameterGroup
        title = Venus Orbital Station (Stage 1)
        define = VenusStationVessel
        dissassociateVesselsOnContractCompletion = false   
        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            title = Launch a New Vessel
            hideChildren = true
        }
 
        PARAMETER
        {
            name = InVenusOrbit
            type = ReachState
            targetBody = Venus
            situation = ORBITING
            minAltitude = 300000
            maxAltitude = 1500000
            disableOnStateChange = true
            title = Orbit Venus (300 - 1,500 km)
            hideChildren = true
        }
 
        PARAMETER
        {
            name = Crew
            type = HasCrew
            minCrew = 4
            title = Have at least 4 Crewmembers aboard
            hideChildren = true
        }
 
        PARAMETER
        {
            name = DockingPorts
            type = PartValidation
            partModule = ModuleDockingNode
            minCount = 2
            title = Station has at least 2 docking ports
            hideChildren = true
        }
 
        PARAMETER
        {
            name = ScienceLab
            type = PartValidation
            partModule = ModuleScienceLab
            minCount = 1
            title = Station has a science lab
            hideChildren = true
        }
 
        PARAMETER
        {
            name = Antenna
            type = PartValidation
            partModule = ModuleDataTransmitter
            minCount = 1
            title = Station has a communications antenna
            hideChildren = true
        }
 
        PARAMETER
        {
            name = SolarPower
            type = PartValidation
            partModule = ModuleDeployableSolarPanel
            minCount = 1
            title = Station has solar power generation
            hideChildren = true
        }
 
        PARAMETER
        {
            name = Window1
            type = Sequence
            title = Transfer window 1 (584 days, 4 checkpoints)
 
            PARAMETER
            {
                name = Window1Checkpoint1
                type = Duration
                duration = 146d
                title = Window 1, checkpoint 1 of 4: stay in Venus orbit for 146 days
                hideChildren = true
 
                PARAMETER
                {
                    name = InOrbitW1C1
                    type = ReachState
                    targetBody = Venus
                    situation = ORBITING
                    disableOnStateChange = true
                    title = In orbit around Venus
                }
 
                PARAMETER
                {
                    name = CrewAboardW1C1
                    type = HasCrew
                    minCrew = 4
                    title = At least 4 Crewmembers aboard
                }
            }
 
            PARAMETER
            {
                name = Window1Checkpoint2
                type = Duration
                duration = 146d
                title = Window 1, checkpoint 2 of 4: stay in Venus orbit for 146 days
                hideChildren = true
 
                PARAMETER
                {
                    name = InOrbitW1C2
                    type = ReachState
                    targetBody = Venus
                    situation = ORBITING
                    disableOnStateChange = true
                    title = In orbit around Venus
                }
 
                PARAMETER
                {
                    name = CrewAboardW1C2
                    type = HasCrew
                    minCrew = 4
                    title = At least 4 Crewmembers aboard
                }
            }
 
            PARAMETER
            {
                name = Window1Checkpoint3
                type = Duration
                duration = 146d
                title = Window 1, checkpoint 3 of 4: stay in Venus orbit for 146 days
                hideChildren = true
 
                PARAMETER
                {
                    name = InOrbitW1C3
                    type = ReachState
                    targetBody = Venus
                    situation = ORBITING
                    disableOnStateChange = true
                    title = In orbit around Venus
                }
 
                PARAMETER
                {
                    name = CrewAboardW1C3
                    type = HasCrew
                    minCrew = 4
                    title = At least 4 Crewmembers aboard
                }
            }
 
            PARAMETER
            {
                name = Window1Checkpoint4
                type = Duration
                duration = 146d
                title = Window 1, checkpoint 4 of 4: stay in Venus orbit for 146 days
                hideChildren = true
 
                PARAMETER
                {
                    name = InOrbitW1C4
                    type = ReachState
                    targetBody = Venus
                    situation = ORBITING
                    disableOnStateChange = true
                    title = In orbit around Venus
                }
 
                PARAMETER
                {
                    name = CrewAboardW1C4
                    type = HasCrew
                    minCrew = 4
                    title = At least 4 Crewmembers aboard
                }
            }
        }

        PARAMETER
        {
            name = StationExperiment1
            type = CollectScience
            targetBody = Venus
            experiment = RP0VenusAtmosphericSpectroscopy
            recoveryMethod = RecoverOrTransmit
            title = Run experiment 1: Atmospheric Spectroscopy
            hideChildren = true
        }
 
        PARAMETER
        {
            name = StationExperiment2
            type = CollectScience
            targetBody = Venus
            experiment = RP0VenusSolarOccultation
            recoveryMethod = RecoverOrTransmit
            title = Run experiment 2: Solar Occultation
            hideChildren = true
        }
    }
}
