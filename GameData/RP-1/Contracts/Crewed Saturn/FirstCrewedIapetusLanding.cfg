	description = <b>Program: Crewed Saturn Exploration<br>Type: <color=green>Required</color></b><br><br>Iapetus presents one of the most intriguing landing targets in the outer solar system, featuring dark carbonaceous terrain on one side, bright water ice on the other, and a towering equatorial ridge that spans hundreds of kilometers.<br><br>Design and execute an expedition to land at least four astronauts on the surface of Iapetus, execute an extended 3-month (90-day) surface stay and bring the crew safely home to Earth.
