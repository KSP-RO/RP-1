CONTRACT_TYPE
{
	name = Titan_Crewed_AtmosphericFlightOperations
	title = Titan Crewed Atmospheric Flight Operations
	group = CrewedSaturnExp
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Saturn Exploration<br>Type: <color=blue>Optional</color></b><br><br>Titan's thick nitrogen atmosphere and low gravity make it the only place beyond Earth where a crewed vehicle could realistically fly like an aircraft. Fly a crewed vehicle with atleasr 2 crew through the skies of Titan for a sustained 30 minutes, and collect atmospheric science data while flying low over the surface. Two bonus objectives reward a low-altitude survey flight and a flyover of Selk crater, the region of Titan's dune fields.

	synopsis = Fly a crewed aircraft, rotorcraft or other atmospheric vehicle with at least 2 crew through the atmosphere of Titan for 30 minutes and collect science while flying low. Optional bonuses: 10 minutes of low-altitude flight and a low flyover of Selk crater.

	completedMessage = Congratulations! Our engineers can learn a lot from the data gathered during your flight through the skies of Titan, and the footage is truly spectacular.

	sortKey = 25219

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Titan

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 1500
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedSaturnExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedSaturnOrbit
	}

	// ************ WAYPOINTS ************
	// Coordinates are converted from the IAU gazetteer (planetographic, +West)
	// to KSP convention (+East, -180 to 180).

	BEHAVIOUR
	{
		name = FlyoverWaypoint
		type = WaypointGenerator
		targetBody = Titan

		WAYPOINT
		{
			name = Selk Crater Flyover
			icon = marker
			latitude = 7.0
			longitude = 161.0
			altitude = 0
			parameter = Flyover
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = AtmosphericFlight
		type = VesselParameterGroup
		title = Control a vessel with the required parameters
		notes = The vessel must remain airborne in Titan's atmosphere for the whole 30 minutes. If it lands or leaves the atmosphere the timer resets. Titan's atmosphere contains no oxygen, so air-breathing jet engines will not work: use electric propellers or rotors, or rocket power.
		define = TitanAtmosphericFlightVessel
		disableOnStateChange = false

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 2
			crewOnly = true
			title = Have at least 2 crew members on board
			hideChildren = true
		}

		// ---------- Required: sustained flight ----------

		PARAMETER
		{
			name = FlightSequence
			type = Sequence
			title = Fly through the atmosphere of Titan

			PARAMETER
			{
				name = Airborne
				type = ReachState
				targetBody = Titan
				situation = FLYING
				maxAltitude = 50000
				minRateOfClimb = -3
				title = Be flying in the atmosphere of Titan below 50 km
				hideChildren = true
			}
			PARAMETER
			{
				name = FlightTime
				type = Duration
				duration = 30m
				preWaitText = Remain airborne for 30 minutes
				waitingText = Flying over Titan
				completionText = Flight time achieved
			}
		}

		// ---------- Required: atmospheric science ----------

		PARAMETER
		{
			name = ScienceFlyingLow
			type = CollectScience
			title = Collect science while flying low over Titan
			targetBody = Titan
			situation = FlyingLow
			Experiment = FlyingLow
		}

		// ---------- Bonus 1: low-altitude survey flight ----------

		PARAMETER
		{
			name = LowAltitudeFlight
			type = Sequence
			optional = true
			rewardReputation = 500
			title = Bonus: Low-altitude survey flight

			PARAMETER
			{
				name = LowFlying
				type = ReachState
				targetBody = Titan
				situation = FLYING
				maxAltitude = 5000
				title = Fly below 5 km above Titan
				hideChildren = true
			}
			PARAMETER
			{
				name = LowFlightTime
				type = Duration
				duration = 10m
				preWaitText = Remain below 5 km for 10 minutes
				waitingText = Surveying at low altitude
				completionText = Low-altitude survey complete
			}
		}

		// ---------- Bonus 2: Selk crater flyover ----------

		PARAMETER
		{
			name = Flyover
			type = Sequence
			optional = true
			rewardReputation = 500
			title = Bonus: Fly over Selk Crater

			PARAMETER
			{
				name = FlyoverLowFlying
				type = ReachState
				targetBody = Titan
				situation = FLYING
				maxAltitude = 5000
				title = Be flying below 5 km
				hideChildren = true
			}
			PARAMETER
			{
				name = OverSelk
				type = VisitWaypoint
				index = 0
				horizontalDistance = 2000
				title = Pass within 2 km of Selk Crater
				hideChildren = true
			}
		}
	}
}