CONTRACT_TYPE
{
	name = Titania_MajorSurfaceOperations
	title = Titania Major Surface Operations
	group = CrewedUranusExp
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Uranus Exploration<br>Type: <color=blue>Optional</color></b><br><br>Land a crewed expeditionary vehicle at two major landmarks on Titania: the giant impact crater Gertrude and the floor of Messina Chasmata, the canyon system that runs from the equator nearly to the south pole. Run a different field science instrument at each site and remain at the last one for 24 hours.

	synopsis = Land a crewed expeditionary rover or a hop-capable lander within 1 km of each of the 2 landmarks on Titania, run a different field science instrument at each and remain at the last one for 24 hours.

	completedMessage = Congratulations! The surface survey of Titania has shown our scientists how its crust was torn apart as the moon's interior froze.

	sortKey = 2816

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Titania

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 3000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedUranusExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedTitaniaLanding
	}

	// ************ WAYPOINTS ************
	// Coordinates are converted from the IAU gazetteer (planetocentric, +East, 0 to 360)
	// to KSP convention (+East, -180 to 180).

	BEHAVIOUR
	{
		name = LandmarkWaypoints
		type = WaypointGenerator
		targetBody = Titania

		WAYPOINT
		{
			name = Gertrude Crater
			icon = marker
			latitude = -15.8
			longitude = -72.9
			altitude = 0
			parameter = Site1
		}

		WAYPOINT
		{
			name = Messina Chasmata
			icon = marker
			latitude = -33.3
			longitude = -25.0
			altitude = 0
			parameter = Site2
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = SurfaceExpedition
		type = VesselParameterGroup
		title = Control a vessel with the required parameters
		notes = Use an expeditionary rover or a lander capable of hopping between sites. The same vessel must visit both landmarks.
		define = TitaniaSurfaceExpeditionVessel
		disableOnStateChange = false

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 2
			crewOnly = true
			title = Have at least 2 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = Site1
			type = Sequence
			title = Landmark 1: Gertrude Crater

			PARAMETER
			{
				name = LandedNear1
				type = VisitWaypoint
				index = 0
				horizontalDistance = 1000
				title = Be within 1 km of Gertrude Crater
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed1
				type = ReachState
				targetBody = Titania
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Sample1
				type = RP1CollectScience
				targetBody = Titania
				experiment = RP0AdvancedFieldGeology
				situation = SrfLanded
				recoveryMethod = RecoverOrTransmit
				title = Run the Advanced Field Geology Suite in Gertrude Crater
			}
		}

		PARAMETER
		{
			name = Site2
			type = Sequence
			title = Landmark 2: Messina Chasmata

			PARAMETER
			{
				name = LandedNear2
				type = VisitWaypoint
				index = 1
				horizontalDistance = 1000
				title = Be within 1 km of Messina Chasmata
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed2
				type = ReachState
				targetBody = Titania
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay2
				type = Duration
				duration = 24h
				preWaitText = Remain at Messina Chasmata for 24 hours
				waitingText = Surveying Messina Chasmata
				completionText = Survey of Messina Chasmata complete
			}
			PARAMETER
			{
				name = Sample2
				type = RP1CollectScience
				targetBody = Titania
				experiment = RP0XRDScan
				situation = SrfLanded
				recoveryMethod = RecoverOrTransmit
				title = Run X-Ray Diffraction on the canyon walls of Messina Chasmata
			}
		}
	}
}
