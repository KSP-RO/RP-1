CONTRACT_TYPE
{
	name = COT_Resupply
	title = Commercial Resupply Mission
	group = ComOrbTrans
	agent = Federation Aeronautique Internationale
	
	description = <b>Program: Commercial Orbital Transport<br>Type: <color=red>CAPSTONE</color></b><br><br> Our demonstration was successful and we have been tasked with rendezvousing and docking.<br><br>This is a series of @maxCompletions contracts, of which @CRS_Count have been completed.

	synopsis = Resupply a station in LEO

	completedMessage = Success! Our resupply mission achieved all objectives!

	sortKey = 2601

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 4
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ************ REWARDS ************
	prestige = Exceptional
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 180
	failureReputation = 0

	DATA
	{
		type = int
		CRS_Count = $CRS_Count + 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression
		CONTRACT_COMPLETED_SUCCESS
		{
			CRS_Count = $CRS_Count + 1
		}
	}

	
	BEHAVIOUR
	{
		name = SpawnStation
		type = SpawnVessel

		VESSEL
		{
			name = ISS
			craftURL = RP-1/Craft Files/ISS.craft
			vesselType = Station
			owned = false

			ORBIT
			{
				SMA = 6778000
				ECC = 0.0005
				INC = 51.6
				LAN = Random(0, 360)
				LPE = 90
				MNA = 0
				EPH = 0
				REF = 1
			}
		}
	}

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ComOrbTrans
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = COT_Demo
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Commercial Resupply

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			PARAMETER
			{
				name = HasResearchPayload
				type = HasResource
				resource = ResearchPayload
				minQuantity = 4999.9
				title = Have a ResearchPayload of at least 5000 units on the craft
				hideChildren = true
			}
			PARAMETER
			{
				name = DockingPort
				type = PartValidation
				partModule = ModuleDockingNode
				minCount = 1
				title = Have at least 1 docking port
				hideChildren = true
			}
			PARAMETER
			{
				name = Rendezvous
				type = Rendezvous
				vessel = ISS
				distance = 100
				disableOnStateChange = true
				title = Rendezvous with the station.
			}
			PARAMETER
			{
				name = Docking
				type = Docking
				vessel = ISS
				disableOnStateChange = true
				title = Dock with the station.
			}
			PARAMETER
			{
				name = ReturnHome
				type = RP1ReturnHome
				title = Return home safely
				hideChildren = true
				completeInSequence = true
			}
		}
	}

	BEHAVIOUR
	{
		name = RemoveStation
		type = DestroyVessel
		onSuccess = true
		onFailed = true
		vessel = ISS
	}
}