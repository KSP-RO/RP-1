// Real world, as refurbishment cost against a new vehicle:
//   STS orbiter (1981-2011, tier 1): ~7% per flight, mostly fixed workforce (GAO FY93)
//   F9S1 (2017+, tier 2): first reuse "substantially less than half", but no published figures.

// Note: Cost scales refurbishment cost, a fraction of effective cost.
// All values here multiply with prior tiers.

SCMREFURBTECHS
{
    // 1951
    BASE
    {
        RateRefurbishment       = 1.0 
        CostRefurbishment       = 1.0
        SplashdownPenaltyMult   = 1.5
    }
    // Gemini?
    TECH
    {
        id                      = materialsScienceAdvCapsules
        upgrade                 = refurbishmentTL1
        RateRefurbishment       = 2.0
        CostRefurbishment       = 0.6
        SplashdownPenaltyMult   = 1.0
    }

    // Shuttle mature?
    TECH
    {
        id                      = materialsScienceCommercial
        upgrade                 = refurbishmentTL2
        RateRefurbishment       = 1.4
        CostRefurbishment       = 0.65
        SplashdownPenaltyMult   = 0.9
    }

    // Falcon 9 Block 5
    TECH
    {
        id                      = materialsScienceNF
        upgrade                 = refurbishmentTL3
        RateRefurbishment       = 1.5
        CostRefurbishment       = 0.7
        SplashdownPenaltyMult   = 0.8 // Drone ships, etc
    }
}
