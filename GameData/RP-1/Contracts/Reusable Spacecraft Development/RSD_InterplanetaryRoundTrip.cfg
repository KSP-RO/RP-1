CONTRACT_TYPE
{
	name = RSD_InterplanetaryRoundTrip
	title = Interplanetary Round Trip
	group = ReusableSpacecraftDev
	agent = Exploration

	description = <b>Program: Reusable Spacecraft Development<br>Type: <color=red>CAPSTONE</color></b><br><br>Reusable stages are meant to carry humanity beyond the Moon. Before crews ride one to another planet, a stage must prove it can make the trip and come back to be flown again. Send a vessel carrying at least 10,000 units of ResearchPayload into orbit around Mars or Venus, leave the payload in orbit there, then bring the same vessel back into Earth orbit.<br><br>Hydrogen will boil off over a flight lasting more than a year: heavy MLI (50+ layers) or storable propellants.
	genericDescription = Deliver 10,000 units of ResearchPayload into orbit around Mars or Venus and bring the delivery vessel back to Earth orbit.
	synopsis = Deliver 10,000 units of ResearchPayload into orbit around Mars or Venus and bring the delivery vessel back to Earth orbit.

	completedMessage = The stage is back from another planet and ready to fly again. The way to the planets is open.

	sortKey = 2102

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	// ************ REWARDS ************
	prestige = Exceptional
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 600
	failureReputation = 0

	// ************ REQUIREMENTS ************
	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ReusableSpacecraftDev
	}

	// ************ PARAMETERS ************
	PARAMETER
	{
		name = InterplanetaryReuseVessel
		type = VesselParameterGroup
		title = Interplanetary round-trip vessel
		define = RSDInterplanetaryShip
		disableOnStateChange = true



		PARAMETER
		{
			name = ReachPlanet
			type = All
			title = Enter orbit around Mars or Venus carrying at least 10,000 units of ResearchPayload
			disableOnStateChange = true

			// 10,000 units (10 t) stands in for a supply cache left in orbit ahead of a crewed expedition: 4 crew (as in FirstCrewedMarsOrbit) for a ~500 day conjunction-class stay at ~5 kg per person per day of food, water and oxygen with partial recycling
			PARAMETER
			{
				name = HasCargo
				type = HasResource
				resource = ResearchPayload
				minQuantity = 9999.9
				title = Carry at least 10,000 units of ResearchPayload
				hideChildren = true
			}
			PARAMETER
			{
				name = NoStaging
				type = NoStaging
				title = Do not stage
				failContract = false
			}
			PARAMETER
			{
				name = ReachAny
				type = Any
				title = Enter orbit around Mars or Venus

				PARAMETER
				{
					name = MarsOrbit
					type = ReachState
					targetBody = Mars
					situation = ORBITING
					title = Orbit Mars
					hideChildren = true
				}
				PARAMETER
				{
					name = VenusOrbit
					type = ReachState
					targetBody = Venus
					situation = ORBITING
					title = Orbit Venus
					hideChildren = true
				}
			}
		}
	}
	

	PARAMETER
	{
		name = ReturnVessel
		type = VesselParameterGroup
		title = Return the round-trip vessel
		vessel = RSDInterplanetaryShip
		completeInSequence = true

		PARAMETER
		{
			name = PayloadReleased
			type = All
			title = Leave the payload in orbit around Mars or Venus
			disableOnStateChange = true

			PARAMETER
			{
				name = CargoEmpty
				type = HasResource
				resource = ResearchPayload
				maxQuantity = 0.1
				title = No ResearchPayload left on the vessel
				hideChildren = true
			}

			PARAMETER
			{
				name = ReleaseOrbitAny
				type = Any
				title = Orbit Mars or Venus

				PARAMETER
				{
					name = ReleaseMarsOrbit
					type = ReachState
					targetBody = Mars
					situation = ORBITING
					title = Orbit Mars
					hideChildren = true
				}
				PARAMETER
				{
					name = ReleaseVenusOrbit
					type = ReachState
					targetBody = Venus
					situation = ORBITING
					title = Orbit Venus
					hideChildren = true
				}
			}
		}

		PARAMETER
		{
			name = EarthOrbitReturn
			type = ReachState
			targetBody = HomeWorld()
			situation = ORBITING
			title = Return to Earth orbit
			completeInSequence = true
			hideChildren = true
		}
	}
}
