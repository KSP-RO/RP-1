                }
 
                PARAMETER
                {
                    name = CrewAboard
                    type = HasCrew
                    minCrew = 4
                    title = At least 4 Crewmembers aboard
                }
            }
        }

        PARAMETER
        {
            name = StationExperiment1
            type = CollectScience
            targetBody = Venus
            experiment = RP0VenusSurfaceMapping
            recoveryMethod = RecoverOrTransmit
            title = Run experiment 1: Surface Mapping
            hideChildren = true
        }
 
        PARAMETER
        {
            name = StationExperiment2
            type = CollectScience
            targetBody = Venus
            experiment = RP0VenusVolcanicSurvey
            recoveryMethod = RecoverOrTransmit
