CONTRACT_TYPE
{
	name = CC_CrewRotation
	title = Additional Commercial Crew Rotation Flight
	group = ComCrew
	agent = Federation Aeronautique Internationale

	description = <b>Program: Commercial Crew<br>Type: <color=blue>Optional</color></b><br><br>Send four astronauts to the station, keep them there for six months and return them safely to Earth.<br><br>This is a series of @maxCompletions contracts, of which @ComCrewRotRep have been completed.


	synopsis = Perform an crewed test flight

	completedMessage = Mission success! We have successfully placed humans into space, rendezvoused & docked to a station and returned home!

	sortKey = 2703

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 3
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 100
	failureReputation = 0

	DATA
	{
		type = int
		ComCrewRotRep = $ComCrewRotRep + 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression
		CONTRACT_COMPLETED_SUCCESS
		{
			ComCrewRotRep = $ComCrewRotRep + 1
		}
	}


	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ComCrew
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = CC_CrewRotation
		minCount = 3
	}

	BEHAVIOUR
	{
		name = SpawnStation
		type = SpawnVessel

		VESSEL
		{
			name = ISS
			craftURL = RP-1/Craft Files/ISS.craft
			vesselType = Station
			owned = false

			ORBIT
			{
				SMA = 6778000
				ECC = 0.0005
				INC = 51.6
				LAN = Random(0, 360)
				LPE = 90
				MNA = 0
				EPH = 0
				REF = 1
			}
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = CommercialCrewFlight
		type = VesselParameterGroup
		title = Commercial Crew Rotation

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}

		PARAMETER
		{
			name = FourCrewCapacity
			type = HasCrewCapacity
			minCapacity = 4
			title = Have space for at least 4 crewmembers on board
			hideChildren = true
			disableOnStateChange = false
		}

		PARAMETER
		{
			name = NoCrew
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed vessel
			hideChildren = true
		}

		PARAMETER
		{
			name = HasPassengers
			type = HasPassengers
			count = 4
			title = Commercial astronauts on board (use generated tourists)
			hideChildren = true
		}

		PARAMETER
		{
			name = HasNonReentryRatedParts
			type = PartValidation
			hideChildren = true
			title = Vessel has no parts with the tag "not rated for reentry"

			NONE
			{
				partModule = ModuleNonReentryRated
			}
		}
		
		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			
			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 0.001
				title = Craft must have Electric Charge after one day
				hideChildren = true
			}
			PARAMETER
			{
				name = DockingPort
				type = PartValidation
				partModule = ModuleDockingNode
				minCount = 1
				title = Have at least 1 docking port
				hideChildren = true
			}
			PARAMETER
			{
				name = Rendezvous
				type = Rendezvous
				vessel = ISS
				distance = 100
				title = Rendezvous with the station.
			}
			PARAMETER
			{
				name = Docking
				type = Docking
				vessel = ISS
				completeInSequence = true
				title = Dock with the station.
			}
			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 180d
				preWaitText = Awaiting docking...
				waitingText = Crew operating...
				completionText = Crew Rotation: successful!
			}
			PARAMETER
			{
				name = ReturnHome
				type = RP1ReturnHome
				title = Return home safely
				hideChildren = true
				completeInSequence = true
			}
		}
	}

	// ************ BEHAVIOURS ************

	BEHAVIOUR
	{
		name = RemoveStation
		type = DestroyVessel
		onSuccess = true
		onFailed = true
		vessel = ISS
	}

	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		title = Spawn Commercial Astronauts
		kerbal = Commercial Astronaut 1
		kerbal = Commercial Astronaut 2
		kerbal = Commercial Astronaut 3
		kerbal = Commercial Astronaut 4
	}
}