CONTRACT_TYPE
{
	name = Titan_MajorSurfaceOperations
	title = Titan Major Surface Operations
	group = CrewedSaturnExp
	agent = Federation Aeronautique Internationale

	description = <b>Program: Crewed Saturn Exploration<br>Type: <color=blue>Optional</color></b><br><br>Land a crewed expeditionary vehicle at three major landmarks on Titan: the historic Huygens landing site, the dune fields beside Selk crater, and the cryovolcanic feature Sotra Patera. Remain on site for 24 hours at each and collect a surface sample. A fourth, more demanding landmark offers a bonus reward for a 48 hour stay: the vast Menrva impact basin.

	synopsis = Land a crewed expeditionary rover or a hop-capable lander within 1 km of each of the 3 primary landmarks on Titan, remain on site for 24 hours and collect a surface sample at each. A fourth, harder bonus landmark (500 m tolerance, 48 hour stay) earns an additional reputation reward.

	completedMessage = Congratulations! The surface survey of Titan has given our scientists a vastly better understanding of its dunes, its organic chemistry and its cryovolcanic activity.

	sortKey = 25221

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Titan

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardReputation = 2000
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = CrewedSaturnExp
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstCrewedSaturnOrbit
	}

	// ************ WAYPOINTS ************
	// Coordinates are converted from the IAU gazetteer (planetographic, +West)
	// to KSP convention (+East, -180 to 180).

	BEHAVIOUR
	{
		name = LandmarkWaypoints
		type = WaypointGenerator
		targetBody = Titan

		WAYPOINT
		{
			name = Huygens Landing Site
			icon = marker
			latitude = -10.57
			longitude = 167.68
			altitude = 0
			parameter = Site1
		}

		WAYPOINT
		{
			name = Selk Crater
			icon = marker
			latitude = 7.0
			longitude = 161.0
			altitude = 0
			parameter = Site2
		}

		WAYPOINT
		{
			name = Sotra Patera
			icon = marker
			latitude = -14.54
			longitude = -40.0
			altitude = 0
			parameter = Site3
		}

		WAYPOINT
		{
			name = Menrva Crater
			icon = marker
			latitude = 20.1
			longitude = -87.2
			altitude = 0
			parameter = Site4
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = SurfaceExpedition
		type = VesselParameterGroup
		title = Control a vessel with the required parameters
		notes = Use an expeditionary rover or a lander capable of hopping between sites. The same vessel must visit all three primary landmarks. The bonus landmark is optional.
		define = TitanSurfaceExpeditionVessel
		disableOnStateChange = false

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 2
			crewOnly = true
			title = Have at least 2 crew members on board
			hideChildren = true
		}

		PARAMETER
		{
			name = Site1
			type = Sequence
			title = Landmark 1: Huygens Landing Site

			PARAMETER
			{
				name = LandedNear1
				type = VisitWaypoint
				index = 0
				horizontalDistance = 1000
				title = Be within 1 km of Huygens Landing Site
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed1
				type = ReachState
				targetBody = Titan
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay1
				type = Duration
				duration = 24h
				preWaitText = Remain at Huygens Landing Site for 24 hours
				waitingText = Surveying Huygens Landing Site
				completionText = Survey of Huygens Landing Site complete
			}
			PARAMETER
			{
				name = Sample1
				type = RP1HasExperiment
				experiment = surfaceSample
				title = Collect a surface sample at Huygens Landing Site
			}
		}

		PARAMETER
		{
			name = Site2
			type = Sequence
			title = Landmark 2: Selk Crater

			PARAMETER
			{
				name = LandedNear2
				type = VisitWaypoint
				index = 1
				horizontalDistance = 1000
				title = Be within 1 km of Selk Crater
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed2
				type = ReachState
				targetBody = Titan
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay2
				type = Duration
				duration = 24h
				preWaitText = Remain at Selk Crater for 24 hours
				waitingText = Surveying Selk Crater
				completionText = Survey of Selk Crater complete
			}
			PARAMETER
			{
				name = Sample2
				type = RP1HasExperiment
				experiment = surfaceSample
				title = Collect a surface sample at Selk Crater
			}
		}

		PARAMETER
		{
			name = Site3
			type = Sequence
			title = Landmark 3: Sotra Patera

			PARAMETER
			{
				name = LandedNear3
				type = VisitWaypoint
				index = 2
				horizontalDistance = 1000
				title = Be within 1 km of Sotra Patera
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed3
				type = ReachState
				targetBody = Titan
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay3
				type = Duration
				duration = 24h
				preWaitText = Remain at Sotra Patera for 24 hours
				waitingText = Surveying Sotra Patera
				completionText = Survey of Sotra Patera complete
			}
			PARAMETER
			{
				name = Sample3
				type = RP1HasExperiment
				experiment = surfaceSample
				title = Collect a surface sample at Sotra Patera
			}
		}

		PARAMETER
		{
			name = Site4
			type = Sequence
			optional = true
			rewardReputation = 1500
			title = Bonus Landmark 4: Menrva Crater (optional)

			PARAMETER
			{
				name = LandedNear4
				type = VisitWaypoint
				index = 3
				horizontalDistance = 500
				title = Land within 500 m of Menrva Crater
				hideChildren = true
			}
			PARAMETER
			{
				name = Landed4
				type = ReachState
				targetBody = Titan
				situation = LANDED
				title = Remain landed
				hideChildren = true
			}
			PARAMETER
			{
				name = Stay4
				type = Duration
				duration = 48h
				preWaitText = Remain at Menrva Crater for 48 hours
				waitingText = Surveying Menrva Crater
				completionText = Survey of Menrva Crater complete
			}
			PARAMETER
			{
				name = Sample4
				type = RP1HasExperiment
				experiment = surfaceSample
				title = Collect a surface sample at Menrva Crater
			}
		}
	}
}