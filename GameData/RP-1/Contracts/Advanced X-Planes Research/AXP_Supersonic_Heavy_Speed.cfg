CONTRACT_TYPE
{
	name = AXP_Supersonic_Heavy_Speed
	group = AdvXPlanes
	title = Supersonic Heavy Transport - Speed
	tag = exclude_Supersonic
	description = <b>Program: Advanced X-Plane Research<br>Type: <color=blue>Optional</color></b><br><br>Design, build, and fly a jet aircraft carrying a @/missionPayload.Print()-unit research payload, sustaining level flight at @VesselGroup/HoldSituation/minSpeed m/s, then return home safely. Each completion raises the speed the payload must be carried at. Optionally, landing back at the runway will award extra reputation. If playing from the Cape, the Space Shuttle runway provided by the RSS-CanaveralHD mod is also a valid landing target.
	genericDescription = Design, build, and fly a jet aircraft carrying a research payload at a specific sustained speed in level flight, then return home safely.
	synopsis = Fly a jet aircraft carrying @/missionPayload.Print() units of research payload, sustaining @VesselGroup/HoldSituation/minSpeed m/s in level flight, then return safely.
	completedMessage = Congratulations on a successful flight!
	sortKey = 4510
	deadline = 0
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 1
	targetBody = HomeWorld()
	maxCompletions = 4
	maxSimultaneous = 1
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = (150 + @completions * 5) * @rewardFactor
	failureReputation = 0
	DATA
	{
		title = Payload
		type = int
		missionPayload = 25000
	}
	DATA
	{
		type = double
		antiGrindCompletion = $AXP_HeavySpeed_Completion == 0 ? (UniversalTime() - @RP0:expectedDays_XPlanesSupersonicOptional * 86400) : $AXP_HeavySpeed_Completion
	}
	DATA
	{
		type = int
		index = $RP0_AXP_HeavySpeed_Difficulty
		completions = $RP0_AXP_HeavySpeed_Difficulty
	}
	DATA
	{
		type = float
		elapsedDays = Round((UniversalTime() - @antiGrindCompletion) / 86400.0)
		rewardFactor = Log(Max(@elapsedDays / @RP0:expectedDays_XPlanesSupersonicOptional * 20 - 9, 1), 2) / 3.46
		rewardFactorPercent = Round(@rewardFactor * 100, 1)
	}
	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = AdvXPlanes
		targetBody = @/targetBody
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = AXP_Supersonic_Heavy
		targetBody = @/targetBody
	}
	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression
		CONTRACT_OFFERED
		{
			AXP_HeavySpeed_Completion = ($AXP_HeavySpeed_Completion + 0) == 0 ? (UniversalTime() - @RP0:expectedDays_XPlanesSupersonicOptional * 86400) : ($AXP_HeavySpeed_Completion + 0)
		}
		CONTRACT_COMPLETED_SUCCESS
		{
			AXP_HeavySpeed_Completion = UniversalTime()
		}
	}
	BEHAVIOUR
	{
		name = SetSSDifficulty
		type = Expression
		CONTRACT_COMPLETED_SUCCESS
		{
			RP0_AXP_HeavySpeed_Difficulty = $RP0_AXP_HeavySpeed_Difficulty + 1
		}
	}
	DATA
	{
		type = List<float>
		minSpeedMPS = [ 850, 975, 1100, 1225]
	}
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Carry the research payload between @HoldSituation/minSpeed m/s and @HoldSituation/maxSpeed m/s in sustained level flight.
		define = supersonicCraft
		dissassociateVesselsOnContractCompletion = true
		resetChildrenWhenVesselDestroyed = true
		PARAMETER
		{
			name = BuiltAtSPH
			type = VesselBuiltAt
			builtAt = SPH
			targetBody = @/targetBody
		}
		PARAMETER
		{
			name = HasResearchPayload
			type = HasResource
			resource = ResearchPayload
			minQuantity = @/missionPayload - 0.1
			title = Have a ResearchPayload of at least @/missionPayload.Print() units on the craft
			hideChildren = true
			targetBody = @/targetBody
		}
		PARAMETER
		{
			name = NoRocket
			type = PartValidation
			title = Vessel is a jet (no rocket engines allowed)
			hideChildren = true
			NONE
			{
				partModule = ModuleEnginesRF
				partModule = ModuleEnginesAJEPropeller
			}
			targetBody = @/targetBody
		}
		PARAMETER
		{
			name = HoldSituation
			type = ReachState
			minSpeed = @/minSpeedMPS.ElementAt(@/index)
			maxSpeed = @/minSpeedMPS.ElementAt(@/index) + 25
			minRateOfClimb = -50
			maxRateOfClimb = 50
			situation = FLYING
			title = Hold between @minSpeed m/s to @maxSpeed m/s in level flight.
			disableOnStateChange = true
			targetBody = @/targetBody
		}
		PARAMETER
		{
			name = SustainedCruise
			type = SustainedCruise
			requiredRange = 3510000
			minSpeed = @/minSpeedMPS.ElementAt(@/index)
			maxSpeed = @/minSpeedMPS.ElementAt(@/index) + 25
			minVerticalSpeed = -50
			maxVerticalSpeed = 50
			targetBody = @/targetBody
			disableOnStateChange = false // toggle state so the Duration sibling resets when cruise breaks
		}

		PARAMETER
		{
			name = Hold
			type = Duration
			duration = 5m
			preWaitText = Reach cruise conditions
			waitingText = Maintaining cruise
			completionText = Sustained cruise achieved
		}
		targetBody = @/targetBody
	}
	PARAMETER
	{
		name = ReturnVesselGroup
		type = VesselParameterGroup
		title = Land/splashdown anywhere
		vessel = supersonicCraft
		hideChildren = true
		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return home safely
			maxSpeed = 5
			hideChildren = true
			completeInSequence = true
			targetBody = @/targetBody
		}
		targetBody = @/targetBody
	}
	PARAMETER
	{
		name = OptVesselGroup
		type = VesselParameterGroup
		title = OPTIONAL: Land on the runway with a descent angle lower than 10 degrees
		rewardReputation = Round(@/rewardReputation * 0.3 + 0.4999, 1)
		optional = true
		vessel = supersonicCraft
		hideChildren = true
		PARAMETER
		{
			name = HorizontalLanding
			type = HorizontalLanding
			descentAngle = 10
			hideChildren = true
			completeInSequence = true
			targetBody = @/targetBody
		}
		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			landAtFacility = Runway
			maxSpeed = 5
			hideChildren = true
			completeInSequence = true
			targetBody = @/targetBody
		}
		targetBody = @/targetBody
	}
}
